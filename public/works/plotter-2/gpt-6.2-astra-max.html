<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<script>try { if (window !== parent) parent.Home?.prepareWork(window); } catch {}</script>
    <meta name="theme-color" content="#D9D9D9" />
    <meta name="description" content="一台用蓝色圆珠笔现场画山水的绘图仪。" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23111111'/%3E%3Cpath d='M7 29l9-15 5 8 4-7 8 14z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"
    />
    <title>2号绘图仪</title>
    <style>
      :root {
        color-scheme: light;
        --mat: #d9d9d9;
        --paper: #fff;
        --ink: #1f3fbf;
        --black: #111;
        --red: #d93025;
        --print: #353733;
        --secondary: #555853;
        --mono:
          "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, "PingFang SC",
          "Microsoft YaHei", monospace;
        --work-width: min(1320px, calc(100% - clamp(42px, 8vw, 150px)));
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font: 12px/1.4 var(--mono);
        letter-spacing: 0.055em;
        color: var(--black);
        background-color: var(--mat);
        background-image:
          var(--grain, none), linear-gradient(#6e726d12 1px, transparent 1px),
          linear-gradient(90deg, #6e726d12 1px, transparent 1px),
          linear-gradient(#6e726d19 1px, transparent 1px),
          linear-gradient(90deg, #6e726d19 1px, transparent 1px);
        background-size:
          112px 112px,
          20px 20px,
          20px 20px,
          100px 100px,
          100px 100px;
        background-position: center top;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        letter-spacing: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:disabled {
        cursor: default;
      }
      button:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 4px;
      }
      [hidden] {
        display: none !important;
      }
      h1,
      h2,
      p,
      figure,
      ul {
        margin: 0;
      }
      svg.icon {
        width: 18px;
        height: 18px;
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .top {
        border-bottom: 1px solid #8e918a;
        background: var(--grain, none), #e6e7e4;
        box-shadow: 0 1px 0 #ffffffb5;
      }
      .top-inner {
        width: var(--work-width);
        margin: auto;
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand,
      .top-meta,
      .machine-state,
      .pen-spec {
        display: flex;
        align-items: center;
      }
      .brand {
        gap: 12px;
      }
      .brand-mark {
        width: 31px;
        height: 31px;
        display: block;
      }
      h1 {
        font-size: 17px;
        line-height: 1;
        font-weight: 650;
        letter-spacing: 0.15em;
        white-space: nowrap;
      }
      .top-meta {
        height: 20px;
        gap: 20px;
        font-size: 11px;
        white-space: nowrap;
      }
      .machine-state {
        gap: 8px;
      }
      .led {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ink);
        box-shadow: 0 0 0 2px #1f3fbf16;
      }
      .led.rest {
        background: #5b5e58;
        box-shadow: 0 0 0 2px #42454017;
      }
      .pen-spec {
        gap: 9px;
        border-left: 1px solid #90938c;
        padding-left: 19px;
        color: #42443f;
      }
      .ink-line {
        width: 23px;
        height: 6px;
        background: repeating-linear-gradient(116deg, transparent 0 2px, var(--ink) 2px 3px);
        transform: skewX(-14deg);
      }
      .workbench {
        width: var(--work-width);
        margin: 0 auto;
        padding: clamp(17px, 3vh, 36px) 0 17px;
      }
      .desk {
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(192px, 18.1vw, 247px);
        gap: clamp(22px, 3.4vw, 54px);
        align-items: center;
      }
      .machine {
        position: relative;
        width: 100%;
        aspect-ratio: 312 / 191;
        isolation: isolate;
        user-select: none;
        touch-action: manipulation;
      }
      .frame,
      .mechanism,
      .gate {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .frame,
      .mechanism {
        overflow: visible;
        pointer-events: none;
      }
      .frame {
        z-index: 0;
      }
      .gate {
        z-index: 1;
        clip-path: inset(1% 1.3% 1.3% 1.3%);
        pointer-events: none;
      }
      .sheet {
        position: absolute;
        background: var(--paper);
        box-shadow:
          0 0 0 0.55px #4445,
          1px 2px 2px #25252531,
          3px 5px 7px #32323224;
        cursor: crosshair;
        touch-action: manipulation;
        pointer-events: auto;
      }
      .sheet:focus-visible {
        outline: 1px dashed var(--ink);
        outline-offset: 3px;
      }
      .sheet canvas {
        display: block;
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .mechanism {
        z-index: 2;
      }
      .machine.feeding .sheet {
        pointer-events: none;
      }
      .ledger {
        position: relative;
        color: var(--print);
        padding: 0 2px;
        font-size: 11px;
        align-self: center;
      }
      .ledger-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 2px solid #40423d;
        border-bottom: 1px solid #73766f;
        padding: 9px 0 8px;
      }
      .ledger h2 {
        font-size: 16px;
        letter-spacing: 0.14em;
        font-weight: 650;
      }
      .ledger-header .number {
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      .proof {
        margin: 11px 0 8px;
      }
      .proof canvas {
        display: block;
        width: 100%;
        aspect-ratio: 2.72;
      }
      .proof figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 5px 0 11px;
        font-size: 10px;
        color: var(--secondary);
      }
      .ledger-head,
      .layer-row {
        display: grid;
        grid-template-columns: 14px 1fr auto;
        column-gap: 8px;
        align-items: center;
      }
      .ledger-head {
        border-block: 1px solid #868982;
        font-size: 10px;
        padding: 5px 0;
        color: var(--secondary);
      }
      .ledger-head span:first-child {
        grid-column: 2;
      }
      .layers {
        list-style: none;
        padding: 0;
      }
      .layer-row {
        position: relative;
        border-bottom: 1px dotted #777a747c;
        min-height: 26px;
        line-height: 1.2;
        color: #4c4f4a;
      }
      .layer-row.active {
        color: var(--ink);
        font-weight: 650;
      }
      .layer-name {
        letter-spacing: 0.1em;
      }
      .layer-count {
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.045em;
      }
      .check {
        display: block;
        position: relative;
        justify-self: center;
        width: 8px;
        height: 8px;
        border: 1px solid #7e8279;
      }
      .active .check {
        border-color: var(--ink);
        background: var(--ink);
        box-shadow: inset 0 0 0 1px var(--mat);
      }
      .done .check {
        border: 0;
      }
      .done .check::after {
        content: "";
        position: absolute;
        left: 1px;
        top: 0;
        width: 4px;
        height: 7px;
        border-right: 1.4px solid var(--ink);
        border-bottom: 1.4px solid var(--ink);
        transform: rotate(41deg);
      }
      .total-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0 7px;
        border-bottom: 1px solid #656860;
        font-weight: 650;
      }
      .mileage {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
        margin-top: 13px;
      }
      .meter + .meter {
        border-left: 1px solid #93978d;
        padding-left: 13px;
      }
      .meter-label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--secondary);
        font-size: 10px;
      }
      .trace-key {
        width: 17px;
        height: 0;
        border-top: 2px solid var(--ink);
      }
      .trace-key.air {
        border-top: 1px dashed #484b46;
      }
      .meter-value {
        display: inline-block;
        font-size: 20px;
        line-height: 1.5;
        letter-spacing: -0.055em;
        font-variant-numeric: tabular-nums;
      }
      .unit {
        font-size: 11px;
        margin-left: 4px;
      }
      .console {
        position: relative;
        margin: clamp(14px, 2.4vh, 24px) 0 0;
        padding: 16px clamp(20px, 2.8vw, 47px) 14px;
        border: 1px solid #6f716c;
        border-radius: 6px;
        background: var(--grain, none), linear-gradient(178deg, #e1e2df 0%, #d5d6d3 46%, #cdcfcb 100%);
        box-shadow:
          inset 0 2px 0 #ffffffe3,
          inset 2px 0 0 #f6f6f275,
          inset -2px 0 0 #a9aca7,
          inset 0 -3px 0 #a6a8a3,
          0 2px 0 #686a65,
          0 4px 0 #a4a6a0,
          1px 6px 7px #24272135;
        display: grid;
        grid-template-columns:
          minmax(216px, 1.47fr) minmax(132px, 0.9fr) minmax(93px, 0.64fr) minmax(154px, 1fr)
          minmax(88px, 0.65fr);
        align-items: stretch;
      }
      .screw {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1px solid #777973;
        background:
          linear-gradient(136deg, transparent 39%, #555750 43% 53%, #f2f3ef 56% 61%, transparent 65%),
          radial-gradient(circle at 34% 22%, #fafaf8 0%, #bfc0bb 48%, #969992 83%);
        box-shadow: 0 1px 0 #fff9;
      }
      .screw.tl {
        top: 7px;
        left: 8px;
      }
      .screw.tr {
        top: 7px;
        right: 8px;
      }
      .screw.bl {
        bottom: 7px;
        left: 8px;
      }
      .screw.br {
        bottom: 7px;
        right: 8px;
      }
      .module {
        position: relative;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 7px;
      }
      .module + .module {
        border-left: 1px solid #9d9f99;
        box-shadow: inset 1px 0 0 #f7f8f480;
      }
      .module-label {
        font-size: 10px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: 0.13em;
        white-space: nowrap;
        color: #383b35;
      }
      .readout-module {
        align-items: stretch;
        justify-content: center;
        padding-right: clamp(14px, 2.3vw, 42px);
        gap: 6px;
      }
      .display-bezel {
        padding: 4px;
        border: 1px solid #63655f;
        background: linear-gradient(#555952, #a2a69c);
        border-radius: 4px;
        box-shadow:
          0 1px 0 #fff9,
          inset 0 1px 2px #4446;
      }
      .display {
        position: relative;
        overflow: hidden;
        background-color: #c6cbc4;
        border: 1px solid #60655e;
        border-radius: 1px;
        color: #242b24;
        background-image: radial-gradient(#303a2b19 0.65px, transparent 0.8px);
        background-size: 3px 3px;
        box-shadow: inset 1px 2px 4px #30362e40;
        padding: 5px 9px 6px;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .display-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 7px;
      }
      .tool-state {
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
        letter-spacing: 0.09em;
      }
      .time-left {
        font-size: 10px;
        white-space: nowrap;
      }
      .coords {
        font-size: 12px;
        letter-spacing: 0.06em;
        margin-top: 5px;
        white-space: pre;
      }
      .progress-line {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 4px;
      }
      .progress-groove {
        position: relative;
        height: 5px;
        flex: 1;
        background: repeating-linear-gradient(90deg, #37413528 0 5px, transparent 5px 7px);
      }
      .progress-fill {
        display: block;
        height: 100%;
        width: 0;
        background: repeating-linear-gradient(90deg, #333c31 0 5px, transparent 5px 7px);
      }
      .percent {
        min-width: 32px;
        text-align: right;
        font-size: 11px;
        line-height: 1;
      }
      .dial-module {
        flex-direction: row;
        gap: clamp(3px, 0.7vw, 12px);
      }
      .dial-caption {
        display: flex;
        flex-direction: column;
        gap: 3px;
        align-items: flex-start;
      }
      .dial-caption output {
        color: var(--ink);
        font-size: 17px;
        letter-spacing: -0.065em;
        font-weight: 650;
        line-height: 1.2;
      }
      .dial-box {
        position: relative;
        width: 92px;
        height: 75px;
        flex: 0 0 auto;
        user-select: none;
      }
      .dial-scale {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .detent {
        position: absolute;
        z-index: 2;
        width: 21px;
        height: 18px;
        padding: 0;
        border: 0;
        transform: translate(-50%, -50%);
        background: transparent;
        color: #454840;
        font-size: 9px;
        line-height: 1;
        letter-spacing: 0;
      }
      .detent[aria-pressed="true"] {
        color: var(--ink);
        font-weight: 800;
      }
      .dial {
        --angle: -40deg;
        position: absolute;
        left: 24px;
        top: 20px;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        border: 1px solid #32332f;
        background: repeating-conic-gradient(
          from -2deg,
          #161714 0deg 4deg,
          #4e5049 5deg 7.8deg,
          #252623 8.8deg 11deg
        );
        box-shadow:
          0 0 0 2px #898c83,
          0 0 0 3px #bfc1ba,
          2px 4px 3px #34362e5c;
        cursor: grab;
        touch-action: none;
      }
      .dial:active {
        cursor: grabbing;
      }
      .dial-face {
        position: absolute;
        inset: 4px;
        border: 1px solid #121310;
        border-radius: 50%;
        background: linear-gradient(136deg, #5a5c55, #363833 54%, #272925);
        box-shadow:
          inset 1px 1px 1px #8d8f85,
          inset -1px -1px 2px #20211d;
      }
      .dial-hand {
        position: absolute;
        inset: 4px;
        transform: rotate(var(--angle));
        pointer-events: none;
      }
      .dial-hand::before {
        content: "";
        position: absolute;
        left: calc(50% - 1.5px);
        top: 1px;
        width: 3px;
        height: 9px;
        border-radius: 1px;
        background: #f0f1eb;
        box-shadow: 1px 0 1px #20211d;
      }
      .audio-switch {
        width: 48px;
        height: 42px;
        position: relative;
        border: 0;
        background: transparent;
      }
      .switch-base {
        position: absolute;
        left: 8px;
        top: 14px;
        width: 32px;
        height: 19px;
        border: 1px solid #64665f;
        transform: rotate(-2deg);
        border-radius: 45%;
        background: linear-gradient(#676b63, #f2f3ef 28%, #979b92 70%, #d6d8d2);
        box-shadow: 0 1px 1px #41443e88;
      }
      .switch-base::before {
        content: "";
        position: absolute;
        inset: 3px 4px;
        border-radius: 45%;
        background: #2c2f29;
        box-shadow: inset 1px 2px 3px #10110e;
      }
      .lever {
        position: absolute;
        left: 21px;
        top: 6px;
        width: 8px;
        height: 21px;
        border: 1px solid #6f736a;
        border-radius: 5px 5px 3px 3px;
        transform-origin: 50% 95%;
        transform: rotate(-53deg);
        background: linear-gradient(90deg, #74796e, #ecede8 36%, #a6aaa0 72%, #696d63);
        box-shadow: 2px 1px 2px #171b1540;
      }
      .lever::after {
        content: "";
        position: absolute;
        top: -2px;
        left: -2px;
        width: 10px;
        height: 9px;
        border-radius: 50%;
        border: 1px solid #81857b;
        background: radial-gradient(at 30% 25%, #fff, #bbbfb4 58%, #858a7f);
      }
      .audio-switch[aria-checked="true"] .lever {
        transform: rotate(53deg);
      }
      .sound-label {
        display: flex;
        gap: 5px;
      }
      .sound-label b {
        color: var(--secondary);
        font-weight: 500;
      }
      .key-module {
        flex-direction: row;
        gap: clamp(8px, 1vw, 17px);
      }
      .key-unit,
      .stop-module {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .key {
        position: relative;
        width: clamp(52px, 4.4vw, 67px);
        height: 44px;
        border-radius: 5px;
        border: 1px solid #383a35;
        background: linear-gradient(135deg, #60625c, #2a2b28 60%, #464842);
        box-shadow:
          0 0 0 2px #92958d,
          0 0 0 3px #e3e5df,
          1px 3px 3px #32362d5e;
        padding: 2px 3px 5px;
        color: #f1f2ed;
      }
      .key-face {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        border-radius: 3px;
        border: 1px solid #272925;
        background: linear-gradient(148deg, #484a44, #30322e);
        box-shadow: inset 0.7px 0.9px 0.7px #74766e;
      }
      .key-face svg.icon {
        width: 20px;
        height: 20px;
        stroke-width: 1.55;
      }
      .key:active {
        padding: 3px 3px 2px;
        transform: translateY(1px);
      }
      .key:hover .key-face {
        filter: brightness(1.13);
      }
      .stop {
        position: relative;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 1px solid #60625b;
        padding: 3px 4px 6px;
        background: linear-gradient(135deg, #787b72, #33352f 67%, #74776f);
        box-shadow:
          0 0 0 2px #a9aca4,
          0 0 0 3px #e0e2da,
          1px 3px 3px #30332d63;
      }
      .stop-cap {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 1px solid #9c261d;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 34% 21%, #ed5347 0%, var(--red) 56%, #b5271d 95%);
        box-shadow:
          inset 1px 1px 1px #ff9e91a1,
          0 3px 0 #8f231b,
          0 4px 2px #282a22b3;
      }
      .stop:hover .stop-cap {
        filter: brightness(1.05);
      }
      .stop:active,
      .stop[aria-pressed="true"] {
        padding: 5px 4px 4px;
      }
      .stop[aria-pressed="true"] .stop-cap {
        box-shadow:
          inset 1px 1px 3px #a1251e,
          0 1px 1px #5e2019;
      }
      .stop-symbol {
        width: 10px;
        height: 12px;
        border-left: 3px solid #fff4e9;
        border-right: 3px solid #fff4e9;
      }
      .stop[aria-pressed="true"] .stop-symbol {
        width: 0;
        height: 0;
        border: 0;
        border-left: 9px solid #fff4e9;
        border-block: 6px solid transparent;
        margin-left: 2px;
      }
      .stop-module {
        gap: 6px;
      }
      .layer-controls {
        margin-top: 13px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }
      .layer-controls button {
        padding: 5px 10px;
        border: 1px solid #777a70;
        border-radius: 2px;
        background: #e1e3dc;
        box-shadow: 0 1px 0 #fff9;
        font-size: 11px;
      }
      .layer-controls button:disabled {
        opacity: 0.46;
      }
      .footer {
        margin-top: 17px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #50534d;
        font-size: 10px;
      }
      .shortcuts,
      .paper-hint {
        display: flex;
        align-items: center;
      }
      .shortcuts {
        gap: 14px;
        flex-wrap: wrap;
      }
      .shortcut,
      .paper-hint {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      kbd {
        min-width: 16px;
        padding: 1px 3px;
        border: 1px solid #9a9d94;
        border-radius: 2px;
        box-shadow: 0 1px 0 #eceee7;
        background: #dfe1db;
        font: 10px/12px var(--mono);
        text-align: center;
      }
      .paper-hint {
        gap: 7px;
      }

      });
      onMedia(mediaSmall, reformat);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          halt();
          if (changing) settleFeed();
        } else {
          render(true);
          startClock();
        }
      });
      grain();
      buildDial();
      loadPaper(serial, freshSeed(), dimensions(mediaSmall.matches));
      if (quiet) finishDrawing();
      else startClock();
      const refit = () => {
        if (!art) return;
        reformat();
        fitCanvases();
        render(true);
      };
      if ("ResizeObserver" in window) new ResizeObserver(refit).observe($("sheet"));
      window.addEventListener("resize", refit, { passive: true });
    </script>
  </body>
</html>
