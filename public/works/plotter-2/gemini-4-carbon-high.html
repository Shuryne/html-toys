          layerName,
          pts,
          segLen,
          segDur,
          ux,
          uy,
          v,
          vMax,
          totalLen,
          duration,
          inkSeed: (strokeSalt * 0.6180339887) % 1
        };
      }

      function computeTravelDuration(distMm) {
        if (distMm < 0.05) return 0.005;
        const vMax = KINEMATICS.vTravelMax;
        const a = KINEMATICS.aTravel;
        const dCrit = (vMax * vMax) / a;
        if (distMm <= dCrit) {
          return 2 * Math.sqrt(distMm / a);
        }
        return (distMm / vMax) + (vMax / a);
      }

      // ============================================================
      // 7. WEB AUDIO DUAL-AXIS STEPPER & PEN SOLENOID SYNTHESIZER
      // ============================================================
      class PlotterAudio {
        constructor() {
          this.enabled = false;
          this.ctx = null;
          this.master = null;
          this.oscX = null;
          this.oscY = null;
          this.gainX = null;
          this.gainY = null;
          this.filterX = null;
          this.filterY = null;
          this.noiseBuf = null;
          this.lastClickTime = 0;
        }

        init() {
          if (this.ctx) return;
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          this.ctx = ctx;
          window.ToyEmbed?.trackAudio(ctx);

          const master = ctx.createGain();
          master.gain.value = 0.0;
          master.connect(ctx.destination);
          this.master = master;

          // X-axis stepper motor oscillator
          const oscX = ctx.createOscillator();
          oscX.type = 'sawtooth';
          oscX.frequency.value = 80;
          const filterX = ctx.createBiquadFilter();
          filterX.type = 'bandpass';
          filterX.frequency.value = 420;
          filterX.Q.value = 2.4;
          const gainX = ctx.createGain();
          gainX.gain.value = 0;
          oscX.connect(filterX);
          filterX.connect(gainX);
          gainX.connect(master);
          oscX.start();

          // Y-axis stepper motor oscillator
          const oscY = ctx.createOscillator();
          oscY.type = 'triangle';
          oscY.frequency.value = 65;
          const filterY = ctx.createBiquadFilter();
          filterY.type = 'lowpass';
          filterY.frequency.value = 680;
          filterY.Q.value = 3.2;
          const gainY = ctx.createGain();
          gainY.gain.value = 0;
          oscY.connect(filterY);
          filterY.connect(gainY);
          gainY.connect(master);
          oscY.start();

          // Short white-noise buffer for pen lift/drop solenoid clicks
          const len = Math.floor(ctx.sampleRate * 0.04);
          const buf = ctx.createBuffer(1, len, ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < len; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.22));
          }

          this.oscX = oscX;
          this.oscY = oscY;
          this.filterX = filterX;
          this.filterY = filterY;
          this.gainX = gainX;
          this.gainY = gainY;
          this.noiseBuf = buf;
        }

        setEnabled(on) {
          this.enabled = on;
          if (on) {
            this.init();
            if (this.ctx && this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
            if (this.master && this.ctx) {
              this.master.gain.setTargetAtTime(0.24, this.ctx.currentTime, 0.025);
            }
          } else if (this.master && this.ctx) {
            this.master.gain.setTargetAtTime(0.0, this.ctx.currentTime, 0.02);
          }
        }

        updateMotors(vxEffective, vyEffective, active) {
          if (!this.ctx || !this.enabled) return;
          const now = this.ctx.currentTime;
          if (!active) {
            this.gainX.gain.setTargetAtTime(0, now, 0.015);
            this.gainY.gain.setTargetAtTime(0, now, 0.015);
            return;
          }

          const ax = Math.abs(vxEffective);
          const ay = Math.abs(vyEffective);

          // Soft-knee pitch mapping so high multipliers stay musical and pleasant
          const mappedVx = ax < 180 ? ax : 180 + Math.log1p(ax - 180) * 38;
          const mappedVy = ay < 180 ? ay : 180 + Math.log1p(ay - 180) * 38;

          const fx = 52 + mappedVx * 2.55;
          const fy = 44 + mappedVy * 2.25;

          this.oscX.frequency.setTargetAtTime(fx, now, 0.012);
          this.filterX.frequency.setTargetAtTime(Math.min(1800, 260 + fx * 1.45), now, 0.015);
          this.gainX.gain.setTargetAtTime(ax > 1.2 ? Math.min(0.16, 0.03 + (ax / 240) * 0.12) : 0, now, 0.012);

          this.oscY.frequency.setTargetAtTime(fy, now, 0.012);
          this.filterY.frequency.setTargetAtTime(Math.min(1600, 220 + fy * 1.65), now, 0.015);
          this.gainY.gain.setTargetAtTime(ay > 1.2 ? Math.min(0.2, 0.035 + (ay / 240) * 0.14) : 0, now, 0.012);
        }

        triggerPenClick(isPenDown) {
          if (!this.ctx || !this.enabled || !this.noiseBuf) return;
          const now = this.ctx.currentTime;
          if (now - this.lastClickTime < 0.036) return;
          this.lastClickTime = now;

          // Filtered click burst
          const src = this.ctx.createBufferSource();
          src.buffer = this.noiseBuf;
          const filt = this.ctx.createBiquadFilter();
          filt.type = 'bandpass';
          filt.frequency.value = isPenDown ? 950 : 1750;
          filt.Q.value = 1.8;

          const g = this.ctx.createGain();
          g.gain.setValueAtTime(isPenDown ? 0.22 : 0.15, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.026);

          src.connect(filt);
          filt.connect(g);
          g.connect(this.master);
          src.start(now);

          // Subtle pitched solenoid/nib transient
          const ping = this.ctx.createOscillator();
          ping.type = 'sine';
          ping.frequency.setValueAtTime(isPenDown ? 320 : 540, now);
          ping.frequency.exponentialRampToValueAtTime(isPenDown ? 135 : 760, now + 0.018);
          const pg = this.ctx.createGain();
          pg.gain.setValueAtTime(isPenDown ? 0.12 : 0.08, now);
          pg.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
          ping.connect(pg);
          pg.connect(this.master);
          ping.start(now);
          ping.stop(now + 0.022);
        }
      }

      // ============================================================
      // 8. PLOTTER APPLICATION & RENDERING ENGINE
      // ============================================================
      const stageCanvas = document.getElementById('stageCanvas');
      const stageCtx = stageCanvas.getContext('2d');

      // High-DPI offscreen paper canvases (current sheet & outgoing sheet during paper change)
      const paperCanvas = document.createElement('canvas');
      const paperCtx = paperCanvas.getContext('2d');
      const outgoingPaperCanvas = document.createElement('canvas');
      const outgoingPaperCtx = outgoingPaperCanvas.getContext('2d');

      // DOM elements
      const speedKnob = document.getElementById('speedKnob');
      const knobRotor = document.getElementById('knobRotor');
      const speedTicksWrap = document.getElementById('speedTicks');
      const soundSwitch = document.getElementById('soundSwitch');
      const lcdPrimary = document.getElementById('lcdPrimary');
      const lcdSecondary = document.getElementById('lcdSecondary');
      const finishBtn = document.getElementById('finishBtn');
      const newPaperBtn = document.getElementById('newPaperBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const layerStepGroup = document.getElementById('layerStepGroup');
      const prevLayerBtn = document.getElementById('prevLayerBtn');
      const nextLayerBtn = document.getElementById('nextLayerBtn');
      const manifestSerial = document.getElementById('manifestSerial');
      const manifestList = document.getElementById('manifestList');
      const penDownMetersEl = document.getElementById('penDownMeters');
      const penUpMetersEl = document.getElementById('penUpMeters');

      const audio = new PlotterAudio();
      const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

      const state = {
        serialNumber: 417,
        speedIndex: DEFAULT_SPEED_INDEX,
        paused: false,
        reducedMotion: reducedMotionQuery.matches,
        visibleLayerCount: 7,

        comp: null,
        strokes: [],            // Compiled stroke objects in execution order
        layerStats: [],         // [{ name, total, done }]
        currentStrokeIdx: 0,

        // Sub-stroke execution machine
        // phases: 'homing' | 'travel' | 'dropping' | 'drawing' | 'lifting' | 'parking' | 'finished' | 'changing_paper'
        phase: 'homing',
        phaseTime: 0,
        phaseDuration: 0.45,
        homingPath: [],

        // Current physical carriage state (in paper mm; (0,0) = top-left paper corner)
        penX: 46,
        penY: 34,
        penZ: 1,                // 0 = touching paper, 1 = lifted
        vx: 0,                  // physical velocity mm/s (1x)
        vy: 0,

        travelFrom: [0, 0],
        travelTo: [0, 0],
        travelDist: 0,
        travelCounted: 0,

        // Drawing cursor inside strokes[currentStrokeIdx]
        segIdx: 0,
        segTime: 0,
        lastDrawnPt: [0, 0],

        // Cumulative metrics (in millimeters)
        cumDrawMm: 0,
        cumTravelMm: 0,
        strokeRemainPhysSec: new Float32Array(0),
        totalStrokesInitial: 0,

        // Interactive click-to-bird visual markers
        queuedMarkers: [],      // [{ x, y, strokeRef, alpha }]
        userBirdLayerIdx: -1,

        // Paper swap transition
        paperSwapT: 0,
        hasOutgoingPaper: false,

        // Layout metrics (stage mm -> canvas px)
        stageMetrics: {
          dpr: 1,
          cssW: 900,
          cssH: 600,
          pxPerMm: 3,
          paperLeftMm: 22,
          paperTopMm: 14,
          stageWMm: 324,
          stageHMm: 220,
          simplifiedGantry: false
        }
      };

      // Build Speed Tick Radio Buttons around the Knurled Knob
      function initSpeedTicks() {
        speedTicksWrap.innerHTML = '';
        SPEEDS.forEach((mult, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'speed-tick-btn';
          btn.setAttribute('role', 'radio');
          btn.setAttribute('aria-checked', String(idx === state.speedIndex));
          btn.textContent = `${mult}×`;
          btn.addEventListener('click', () => setSpeedIndex(idx));
          speedTicksWrap.appendChild(btn);
        });
        syncSpeedUI();
      }

      function setSpeedIndex(newIdx) {
        const clamped = Math.max(0, Math.min(SPEEDS.length - 1, newIdx));
        if (clamped === state.speedIndex) return;
        state.speedIndex = clamped;
        syncSpeedUI();
      }

      function syncSpeedUI() {
        const angle = -114 + state.speedIndex * 38; // -114deg to +114deg across 7 detents
        knobRotor.style.transform = `rotate(${angle}deg)`;
        const children = speedTicksWrap.children;
        for (let i = 0; i < children.length; i++) {
          children[i].setAttribute('aria-checked', String(i === state.speedIndex));
        }
      }

      // Compute suffix remaining physical time for accurate ETA on LCD
      function recomputeRemainingTimes() {
        const n = state.strokes.length;
        const rem = new Float32Array(n + 1);
        rem[n] = 0;
        for (let i = n - 1; i >= 0; i--) {
          const st = state.strokes[i];
          const prevEnd = i > 0
            ? state.strokes[i - 1].pts[state.strokes[i - 1].pts.length - 1]
            : [0, 0];
          const startPt = st.pts[0];
          const tDist = Math.hypot(startPt[0] - prevEnd[0], startPt[1] - prevEnd[1]);
          const tTime = computeTravelDuration(tDist);
          const stepCost = tTime + KINEMATICS.penDropDur + st.duration + KINEMATICS.penLiftDur;
          rem[i] = rem[i + 1] + stepCost;
        }
        state.strokeRemainPhysSec = rem;
      }

      // Resize & setup high-DPI canvases matching viewport form factor
      function updateStageLayout(redrawPaper = true) {
        const isMobileViewport = window.innerWidth < 680;
        const comp = state.comp;
        if (!comp) return;

        const simplified = isMobileViewport || comp.isPortrait;
        const padXMm = simplified ? 14 : 24;
        const padTopMm = simplified ? 16 : 21;
        const padBotMm = simplified ? 11 : 14;

        const stageWMm = comp.paperW + padXMm * 2;
        const stageHMm = comp.paperH + padTopMm + padBotMm;

        const wrapRect = stageCanvas.parentElement.getBoundingClientRect();
        const availCssW = Math.max(280, Math.min(940, wrapRect.width || (window.innerWidth - 24)));
        // Fit comfortably inside viewport height leaving room for header & control panel
        const maxStageCssH = Math.max(300, window.innerHeight - (isMobileViewport ? 210 : 152));
        const pxPerMmByW = availCssW / stageWMm;
        const pxPerMmByH = maxStageCssH / stageHMm;
        const cssPxPerMm = Math.min(pxPerMmByW, pxPerMmByH);

        const cssW = Math.round(stageWMm * cssPxPerMm);
        const cssH = Math.round(stageHMm * cssPxPerMm);
        const dpr = Math.min(window.ToyEmbed?.pixelRatio ?? (window.devicePixelRatio || 1), 2.5);

        stageCanvas.style.width = `${cssW}px`;
        stageCanvas.style.height = `${cssH}px`;
        stageCanvas.width = Math.round(cssW * dpr);
        stageCanvas.height = Math.round(cssH * dpr);

        // Paper offscreen canvas at crisp high resolution
        const paperPxPerMm = Math.max(4.2, cssPxPerMm * dpr);
        const targetPaperW = Math.round(comp.paperW * paperPxPerMm);
        const targetPaperH = Math.round(comp.paperH * paperPxPerMm);

        const sizeChanged = paperCanvas.width !== targetPaperW || paperCanvas.height !== targetPaperH;
        state.stageMetrics = {
          dpr,
          cssW,
          cssH,
          cssPxPerMm,
          paperPxPerMm,
          paperLeftMm: padXMm,
          paperTopMm: padTopMm,
          stageWMm,
          stageHMm,
          simplifiedGantry: simplified
        };

        if (sizeChanged && redrawPaper) {
          paperCanvas.width = targetPaperW;
          paperCanvas.height = targetPaperH;
          replayDrawnInkToPaper();
        }
      }

      function clearPaperToWhite(ctx, w, h) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = COLORS.paper;
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
      }

      // Ballpoint pen ink rendering primitives (strictly #1F3FBF)
      function drawPenDownBead(ctx, pxPerMm, xMm, yMm, inkSeed, isFine = false) {
        const r = ((isFine ? 0.135 : 0.185) + inkSeed * 0.035) * pxPerMm;
        ctx.fillStyle = `rgba(${COLORS.inkRgb}, 0.86)`;
        ctx.beginPath();
        ctx.arc(xMm * pxPerMm, yMm * pxPerMm, r, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawBallpointSegment(ctx, pxPerMm, x0, y0, x1, y1, speedRatio, inkSeed, isFine = false) {
        // Faster feed -> slightly lighter & finer ballpoint trace ("快速走笔时线色略浅")
        const s = Math.max(0, Math.min(1, speedRatio));
        const grain = 0.96 + 0.04 * Math.sin(x0 * 1.9 + y0 * 1.7 + inkSeed * 12);
        const alpha = ((isFine ? 0.94 : 0.91) - s * 0.21) * grain;
        const widthMm = (isFine ? 0.215 : 0.295) - s * 0.048;

        ctx.strokeStyle = `rgba(${COLORS.inkRgb}, ${alpha.toFixed(3)})`;
        ctx.lineWidth = Math.max(0.7, widthMm * pxPerMm);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(x0 * pxPerMm, y0 * pxPerMm);
        ctx.lineTo(x1 * pxPerMm, y1 * pxPerMm);
        ctx.stroke();
      }

      function drawWholeCompiledStroke(ctx, pxPerMm, st) {
        const pts = st.pts;
        if (!pts.length) return;
        const isFine = st.layerName === '画纸图签';
        drawPenDownBead(ctx, pxPerMm, pts[0][0], pts[0][1], st.inkSeed, isFine);
        for (let i = 0; i < pts.length - 1; i++) {
          const vAvg = 0.5 * (st.v[i] + st.v[i + 1]);
          const ratio = vAvg / st.vMax;
          drawBallpointSegment(ctx, pxPerMm, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], ratio, st.inkSeed, isFine);
        }
      }

      // Replay already-completed ink after resize or reduced-motion layer stepping
      function replayDrawnInkToPaper() {
        if (!state.comp) return;
        const pxPerMm = state.stageMetrics.paperPxPerMm;
        clearPaperToWhite(paperCtx, paperCanvas.width, paperCanvas.height);

        if (state.reducedMotion) {
          for (const st of state.strokes) {
            if (st.layerIndex < state.visibleLayerCount || st.isUserBird) {
              drawWholeCompiledStroke(paperCtx, pxPerMm, st);
            }
          }
          return;
        }

        const completedCount = Math.min(state.currentStrokeIdx, state.strokes.length);
        for (let i = 0; i < completedCount; i++) {
          drawWholeCompiledStroke(paperCtx, pxPerMm, state.strokes[i]);
        }

        if (state.phase === 'drawing' && state.currentStrokeIdx < state.strokes.length) {
          const st = state.strokes[state.currentStrokeIdx];
          const isFine = st.layerName === '画纸图签';
          drawPenDownBead(paperCtx, pxPerMm, st.pts[0][0], st.pts[0][1], st.inkSeed, isFine);
          for (let s = 0; s < state.segIdx; s++) {
            const ratio = (0.5 * (st.v[s] + st.v[s + 1])) / st.vMax;
            drawBallpointSegment(paperCtx, pxPerMm, st.pts[s][0], st.pts[s][1], st.pts[s + 1][0], st.pts[s + 1][1], ratio, st.inkSeed, isFine);
          }
          if (state.segIdx < st.pts.length - 1) {
            const s = state.segIdx;
            const ratio = (0.5 * (st.v[s] + st.v[s + 1])) / st.vMax;
            drawBallpointSegment(paperCtx, pxPerMm, st.pts[s][0], st.pts[s][1], state.lastDrawnPt[0], state.lastDrawnPt[1], ratio, st.inkSeed, isFine);
          }
        }
      }

      // ============================================================
      // 9. BUILD & START A NEW SHEET OF PAPER
      // ============================================================
      function startNewSheet(withSlideTransition = false) {
        const isMobile = window.innerWidth < 680;
        if (withSlideTransition && !state.reducedMotion && paperCanvas.width > 0) {
          outgoingPaperCanvas.width = paperCanvas.width;
          outgoingPaperCanvas.height = paperCanvas.height;
          outgoingPaperCtx.drawImage(paperCanvas, 0, 0);
          state.hasOutgoingPaper = true;
          state.paperSwapT = 0;
        } else {
          state.hasOutgoingPaper = false;
        }

        const randomSeed = Math.floor(Math.random() * 0xFFFFFFFF) >>> 0;
        const comp = generateShanshui(randomSeed, state.serialNumber, isMobile);
        state.comp = comp;

        // Compile all strokes across layers
        const compiled = [];
        const layerStats = [];
        let salt = 1;

        comp.layers.forEach((layer, lIdx) => {
          const isFrame = layer.id === 'frame';
          for (const raw of layer.rawStrokes) {
            compiled.push(
              compileStrokeKinematics(raw, lIdx, layer.name, layer.wobbleAmp, comp.noise, salt++, isFrame)
            );
          }
          layerStats.push({
            id: layer.id,
            name: layer.name,
            total: layer.rawStrokes.length,
            done: 0
          });
        });

        state.strokes = compiled;
        state.totalStrokesInitial = compiled.length;
        state.layerStats = layerStats;
        state.userBirdLayerIdx = -1;
        state.queuedMarkers = [];
        state.currentStrokeIdx = 0;
        state.cumDrawMm = 0;
        state.cumTravelMm = 0;

        recomputeRemainingTimes();
        updateStageLayout(false);
        paperCanvas.width = Math.round(comp.paperW * state.stageMetrics.paperPxPerMm);
        paperCanvas.height = Math.round(comp.paperH * state.stageMetrics.paperPxPerMm);
        clearPaperToWhite(paperCtx, paperCanvas.width, paperCanvas.height);

        manifestSerial.textContent = `第 ${comp.serialStr} 号`;

        if (state.reducedMotion) {
          state.visibleLayerCount = state.layerStats.length;
          applyReducedMotionCompleteState();
        } else if (withSlideTransition) {
          // Lift pen, park near top-left margin while swapping sheets
          state.penZ = 1;
          state.phase = 'changing_paper';
          state.phaseTime = 0;
          state.phaseDuration = 1.15;
          state.travelFrom = [state.penX, state.penY];
          state.travelTo = [18, 16];
        } else {
          beginHomingSequence(44, 30);
        }

        renderManifestDOM();
        updateModeButtonsUI();
      }

      // Opening mechanical homing to (0, 0) with subtle limit-switch bounce ("带一下轻微的机械顿挫")
      function beginHomingSequence(fromX, fromY) {
        state.penX = fromX;
        state.penY = fromY;
        state.penZ = 1;
        state.phase = 'homing';
        state.phaseTime = 0;
        state.phaseDuration = 1.45; // physical 1x seconds (~0.36s wall-clock at default 4x!)
        state.homingStart = [fromX, fromY];
      }

      function startNextStrokeOrPark() {
        if (state.currentStrokeIdx >= state.strokes.length) {
          // Park smoothly back to origin (0, 0)
          const dist = Math.hypot(state.penX, state.penY);
          if (dist > 0.25) {
            state.phase = 'parking';
            state.phaseTime = 0;
            state.travelFrom = [state.penX, state.penY];
            state.travelTo = [0, 0];
            state.travelDist = dist;
            state.travelCounted = 0;
            state.phaseDuration = computeTravelDuration(dist);
          } else {
            state.penX = 0;
            state.penY = 0;
            state.vx = 0;
            state.vy = 0;
            state.phase = 'finished';
          }
          return;
        }

        const st = state.strokes[state.currentStrokeIdx];
        const target = st.pts[0];
        const dist = Math.hypot(target[0] - state.penX, target[1] - state.penY);

        if (dist < 0.08 && state.penZ === 0) {
          // Already right at start point with pen down
          beginDrawingCurrentStroke();
        } else {
          if (state.penZ < 1) {
            state.penZ = 1;
            audio.triggerPenClick(false);
          }
          state.phase = 'travel';
          state.phaseTime = 0;
          state.travelFrom = [state.penX, state.penY];
          state.travelTo = [target[0], target[1]];
          state.travelDist = dist;
          state.travelCounted = 0;
          state.phaseDuration = computeTravelDuration(dist);
        }
      }

      function beginDrawingCurrentStroke() {
        const st = state.strokes[state.currentStrokeIdx];
        state.penX = st.pts[0][0];
        state.penY = st.pts[0][1];
        state.penZ = 0;
        state.phase = 'drawing';
        state.segIdx = 0;
        state.segTime = 0;
        state.lastDrawnPt = [st.pts[0][0], st.pts[0][1]];

        // Clear any queued click marker attached to this bird stroke
        for (const mk of state.queuedMarkers) {
          if (mk.strokeRef === st) mk.done = true;
        }

        drawPenDownBead(
          paperCtx,
          state.stageMetrics.paperPxPerMm,
          state.penX,
          state.penY,
          st.inkSeed,
          st.layerName === '画纸图签'
        );
      }

      // Advance simulation by dtPhys (physical seconds = wallDt * speedMultiplier)
      function stepPlotterPhysics(wallDt) {
        if (state.reducedMotion || state.paused || !state.comp) {
          state.vx = 0;
          state.vy = 0;
          audio.updateMotors(0, 0, false);
          return;
        }

        // Paper slide animation runs in real wall-clock time regardless of feed knob
        if (state.phase === 'changing_paper') {
          state.phaseTime += wallDt;
          const u = Math.min(1, state.phaseTime / state.phaseDuration);
          state.paperSwapT = u;
          // Ease carriage out of the way to [38, 28] ready for homing
          const ease = u * u * (3 - 2 * u);
          state.penX = state.travelFrom[0] + (38 - state.travelFrom[0]) * ease;
          state.penY = state.travelFrom[1] + (28 - state.travelFrom[1]) * ease;
          state.vx = 0;
          state.vy = 0;
          audio.updateMotors(0, 0, false);

          if (u >= 1) {
            state.hasOutgoingPaper = false;
            beginHomingSequence(state.penX, state.penY);
          }
          return;
        }

        if (state.phase === 'finished') {
          state.vx = 0;
          state.vy = 0;
          audio.updateMotors(0, 0, false);
          return;
        }

        const speedMult = SPEEDS[state.speedIndex];
        // Homing uses slightly damped multiplier so high speeds still show the crisp mechanical home tap
        const effectiveMult = state.phase === 'homing' ? Math.min(speedMult, 8) : speedMult;
        let remainPhys = Math.min(wallDt, 0.055) * effectiveMult;

        let guard = 0;
        const pxPerMm = state.stageMetrics.paperPxPerMm;

        while (remainPhys > 1e-6 && guard++ < 600 && state.phase !== 'finished') {
          if (state.phase === 'homing') {
            const step = Math.min(remainPhys, state.phaseDuration - state.phaseTime);
            const prevX = state.penX;
            const prevY = state.penY;
            state.phaseTime += step;
            remainPhys -= step;

            const u = Math.min(1, state.phaseTime / state.phaseDuration);
            // 0..0.66: rapid seek to (0, 0)
            // 0.66..0.78: mechanical limit-switch pause & step-off (2.4mm, 2.0mm)
            // 0.78..0.94: crisp precision latch back to (0, 0)
            // 0.94..1.00: brief settle at origin
            if (u < 0.66) {
              const k = u / 0.66;
              const ease = 1 - Math.pow(1 - k, 2.4);
              state.penX = state.homingStart[0] * (1 - ease);
              state.penY = state.homingStart[1] * (1 - ease);
            } else if (u < 0.78) {
              const k = (u - 0.66) / 0.12;
              const bump = Math.sin(k * Math.PI * 0.5);
              state.penX = 2.4 * bump;
              state.penY = 1.9 * bump;
            } else if (u < 0.94) {
              const k = (u - 0.78) / 0.16;
              const ease = k * k * (3 - 2 * k);
              state.penX = 2.4 * (1 - ease);
              state.penY = 1.9 * (1 - ease);
            } else {
              state.penX = 0;
              state.penY = 0;
            }

            if (step > 1e-5) {
              state.vx = (state.penX - prevX) / step;
              state.vy = (state.penY - prevY) / step;
            }

            if (state.phaseTime >= state.phaseDuration - 1e-6) {
              state.penX = 0;
              state.penY = 0;
              audio.triggerPenClick(false);
              startNextStrokeOrPark();
            }
          } else if (state.phase === 'travel' || state.phase === 'parking') {
            const step = Math.min(remainPhys, state.phaseDuration - state.phaseTime);
            const prevX = state.penX;
            const prevY = state.penY;
            state.phaseTime += step;
            remainPhys -= step;

            const u = state.phaseDuration > 1e-5 ? Math.min(1, state.phaseTime / state.phaseDuration) : 1;
            // Smooth S-curve rapid travel profile
            const sCurve = u * u * (3 - 2 * u);
            state.penX = state.travelFrom[0] + (state.travelTo[0] - state.travelFrom[0]) * sCurve;
            state.penY = state.travelFrom[1] + (state.travelTo[1] - state.travelFrom[1]) * sCurve;
            state.penZ = 1;

            const newDist = state.travelDist * sCurve;
            state.cumTravelMm += Math.max(0, newDist - state.travelCounted);
            state.travelCounted = newDist;

            if (step > 1e-5) {
              state.vx = (state.penX - prevX) / step;
              state.vy = (state.penY - prevY) / step;
            }

            if (state.phaseTime >= state.phaseDuration - 1e-6) {
              state.penX = state.travelTo[0];
              state.penY = state.travelTo[1];
              if (state.phase === 'parking') {
                state.vx = 0;
                state.vy = 0;
                state.phase = 'finished';
              } else {
                state.phase = 'dropping';
                state.phaseTime = 0;
                state.phaseDuration = KINEMATICS.penDropDur;
              }
            }
          } else if (state.phase === 'dropping') {
            const step = Math.min(remainPhys, state.phaseDuration - state.phaseTime);
            state.phaseTime += step;
            remainPhys -= step;
            state.penZ = Math.max(0, 1 - state.phaseTime / state.phaseDuration);
            state.vx = 0;
            state.vy = 0;

            if (state.phaseTime >= state.phaseDuration - 1e-6) {
              audio.triggerPenClick(true);
              beginDrawingCurrentStroke();
            }
          } else if (state.phase === 'drawing') {
            const st = state.strokes[state.currentStrokeIdx];
            if (!st || state.segIdx >= st.pts.length - 1) {
              // Finished stroke!
              if (st) {
                state.layerStats[st.layerIndex].done++;
              }
              state.currentStrokeIdx++;

              // Keep pen down only if next stroke starts essentially at the exact same point
              const nextSt = state.strokes[state.currentStrokeIdx];
              if (nextSt && Math.hypot(nextSt.pts[0][0] - state.penX, nextSt.pts[0][1] - state.penY) < 0.08) {
                beginDrawingCurrentStroke();
              } else {
                state.phase = 'lifting';
                state.phaseTime = 0;
                state.phaseDuration = KINEMATICS.penLiftDur;
              }
              continue;
            }

            const sIdx = state.segIdx;
            const segDur = st.segDur[sIdx];
            if (segDur < 1e-6) {
              state.segIdx++;
              state.segTime = 0;
              continue;
            }

            const step = Math.min(remainPhys, segDur - state.segTime);
            state.segTime += step;
            remainPhys -= step;

            const frac = Math.min(1, state.segTime / segDur);
            const p0 = st.pts[sIdx];
            const p1 = st.pts[sIdx + 1];
            const nx = p0[0] + (p1[0] - p0[0]) * frac;
            const ny = p0[1] + (p1[1] - p0[1]) * frac;

            const instSpeed = st.v[sIdx] + (st.v[sIdx + 1] - st.v[sIdx]) * frac;
            const ratio = instSpeed / st.vMax;

            drawBallpointSegment(
              paperCtx,
              pxPerMm,
              state.lastDrawnPt[0],
              state.lastDrawnPt[1],
              nx,
              ny,
              ratio,
              st.inkSeed,
              st.layerName === '画纸图签'
            );

            state.cumDrawMm += Math.hypot(nx - state.lastDrawnPt[0], ny - state.lastDrawnPt[1]);
            state.lastDrawnPt = [nx, ny];
            state.penX = nx;
            state.penY = ny;
            state.penZ = 0;
            state.vx = st.ux[sIdx] * instSpeed;
            state.vy = st.uy[sIdx] * instSpeed;

            if (state.segTime >= segDur - 1e-6) {
              state.segIdx++;
              state.segTime = 0;
            }
          } else if (state.phase === 'lifting') {
            const step = Math.min(remainPhys, state.phaseDuration - state.phaseTime);
            state.phaseTime += step;
            remainPhys -= step;
            state.penZ = Math.min(1, state.phaseTime / state.phaseDuration);
            state.vx = 0;
            state.vy = 0;

            if (state.phaseTime >= state.phaseDuration - 1e-6) {
              state.penZ = 1;
              audio.triggerPenClick(false);
              startNextStrokeOrPark();
            }
          }
        }

        const motorActive = state.phase === 'homing' || state.phase === 'travel' || state.phase === 'drawing' || state.phase === 'parking';
        audio.updateMotors(state.vx * effectiveMult, state.vy * effectiveMult, motorActive);
      }

      // Instant Finish ("「完成」键立即显示整幅成稿")
      function finishDrawingImmediately() {
        if (!state.comp) return;
        const pxPerMm = state.stageMetrics.paperPxPerMm;

        if (state.reducedMotion) {
          state.visibleLayerCount = state.layerStats.length;
          applyReducedMotionCompleteState();
          renderManifestDOM();
          return;
        }

        // Complete current partially-drawn stroke & all remaining strokes
        for (let i = state.currentStrokeIdx; i < state.strokes.length; i++) {
          const st = state.strokes[i];
          const prevPt = i === state.currentStrokeIdx
            ? [state.penX, state.penY]
            : state.strokes[i - 1].pts[state.strokes[i - 1].pts.length - 1];

          if (!(i === state.currentStrokeIdx && state.phase === 'drawing')) {
            state.cumTravelMm += Math.hypot(st.pts[0][0] - prevPt[0], st.pts[0][1] - prevPt[1]);
          }
          drawWholeCompiledStroke(paperCtx, pxPerMm, st);

          if (i === state.currentStrokeIdx && state.phase === 'drawing') {
            // Add remaining length of current stroke
            let remLen = 0;
            for (let s = state.segIdx; s < st.segLen.length; s++) remLen += st.segLen[s];
            state.cumDrawMm += remLen;
          } else {
            state.cumDrawMm += st.totalLen;
          }
          state.layerStats[st.layerIndex].done = state.layerStats[st.layerIndex].total;
        }

        for (const ls of state.layerStats) ls.done = ls.total;
        for (const mk of state.queuedMarkers) mk.done = true;

        if (state.strokes.length > 0) {
          const lastEnd = state.strokes[state.strokes.length - 1].pts.slice(-1)[0];
          state.cumTravelMm += Math.hypot(lastEnd[0], lastEnd[1]);
        }

        state.currentStrokeIdx = state.strokes.length;
        state.hasOutgoingPaper = false;
        state.penX = 0;
        state.penY = 0;
        state.penZ = 1;
        state.vx = 0;
        state.vy = 0;
        state.phase = 'finished';
        if (state.paused) setPaused(false);
        audio.updateMotors(0, 0, false);
        renderManifestDOM();
      }

      function applyReducedMotionCompleteState() {
        state.hasOutgoingPaper = false;
        state.paused = false;
        pauseBtn.setAttribute('aria-pressed', 'false');
        state.currentStrokeIdx = state.strokes.length;
        state.penX = 0;
        state.penY = 0;
        state.penZ = 1;
        state.vx = 0;
        state.vy = 0;
        state.phase = 'finished';

        // Recompute distances & checkmarks up to visibleLayerCount
        let drawMm = 0;
        let travelMm = 0;
        let prev = [0, 0];
        for (const ls of state.layerStats) ls.done = 0;

        for (const st of state.strokes) {
          if (st.layerIndex < state.visibleLayerCount || st.isUserBird) {
            travelMm += Math.hypot(st.pts[0][0] - prev[0], st.pts[0][1] - prev[1]);
            drawMm += st.totalLen;
            prev = st.pts[st.pts.length - 1];
            state.layerStats[st.layerIndex].done++;
          }
        }
        state.cumDrawMm = drawMm;
        state.cumTravelMm = travelMm;

        replayDrawnInkToPaper();
        updateLayerStepperButtons();
      }

      function updateLayerStepperButtons() {
        if (!state.reducedMotion || !state.layerStats.length) return;
        prevLayerBtn.disabled = state.visibleLayerCount <= 1;
        nextLayerBtn.disabled = state.visibleLayerCount >= state.layerStats.length;
      }

      function updateModeButtonsUI() {
        if (state.reducedMotion) {
          layerStepGroup.classList.add('is-visible');
          pauseBtn.parentElement.style.display = 'none';
          finishBtn.style.display = 'none';
          updateLayerStepperButtons();
        } else {
          layerStepGroup.classList.remove('is-visible');
          pauseBtn.parentElement.style.display = 'inline-flex';
          finishBtn.style.display = '';
        }
      }

      function setPaused(nextPaused) {
        if (state.reducedMotion) return;
        state.paused = nextPaused;
        pauseBtn.setAttribute('aria-pressed', String(state.paused));
        if (state.paused) {
          audio.updateMotors(0, 0, false);
        }
      }

      // Click on Paper -> Queue V-shaped Flying Bird ("点击纸面，把该位置加入待绘队列…画完后再点击也可以唤醒机器")
      function handleCanvasClick(evt) {
        if (!state.comp || state.phase === 'changing_paper') return;
        const rect = stageCanvas.getBoundingClientRect();
        const m = state.stageMetrics;
        const clickStageXMm = (evt.clientX - rect.left) / m.cssPxPerMm;
        const clickStageYMm = (evt.clientY - rect.top) / m.cssPxPerMm;

        const paperX = clickStageXMm - m.paperLeftMm;
        const paperY = clickStageYMm - m.paperTopMm;

        const { fx0, fy0, fx1, fy1 } = state.comp.frame;
        if (paperX < fx0 + 2 || paperX > fx1 - 2 || paperY < fy0 + 2 || paperY > fy1 - 2) {
          return; // Outside inner drawing area
        }

        // Ensure dynamic "补绘飞鸟" layer exists in manifest
        if (state.userBirdLayerIdx < 0) {
          state.userBirdLayerIdx = state.layerStats.length;
          state.layerStats.push({
            id: 'user_birds',
            name: '补绘飞鸟',
            total: 0,
            done: 0
          });
          if (state.reducedMotion) {
            state.visibleLayerCount = state.layerStats.length;
          }
        }

        const span = 2.6 + Math.random() * 1.1;
        const tilt = (Math.random() - 0.5) * 0.22;
        const rawBird = state.comp.makeBirdStrokes(paperX, paperY, span, tilt)[0];
        const compiledBird = compileStrokeKinematics(
          rawBird,
          state.userBirdLayerIdx,
          '补绘飞鸟',
          0.025,
          state.comp.noise,
          9000 + state.strokes.length,
          false
        );
        compiledBird.isUserBird = true;
        state.layerStats[state.userBirdLayerIdx].total++;

        if (state.reducedMotion) {
          state.strokes.push(compiledBird);
          applyReducedMotionCompleteState();
          renderManifestDOM();
          return;
        }

        // Insert ~8 strokes ahead if actively plotting ("稍后，笔尖会走过去补画"), or append & wake up if finished!
        const wasFinishedOrParking = state.phase === 'finished' || state.phase === 'parking';
        const insertAt = wasFinishedOrParking
          ? state.strokes.length
          : Math.min(state.strokes.length, state.currentStrokeIdx + 8);

        state.strokes.splice(insertAt, 0, compiledBird);
        recomputeRemainingTimes();

        state.queuedMarkers.push({
          x: paperX,
          y: paperY,
          strokeRef: compiledBird,
          done: false
        });

        if (wasFinishedOrParking) {
          // Wake up the machine!
          if (state.paused) setPaused(false);
          startNextStrokeOrPark();
        }
        renderManifestDOM();
      }

      // ============================================================
      // 10. STAGE CANVAS RENDERER (Paper, Rails, Gantry, Cable Loop, Pen & Shadow)
      // ============================================================
      function drawPaperSheet(ctx, xPx, yPx, wPx, hPx, sourceCanvas) {
        ctx.save();
        // Clean drafting paper subtle elevation shadow on cutting mat
        ctx.shadowColor = 'rgba(17, 17, 17, 0.13)';
        ctx.shadowBlur = Math.max(4, wPx * 0.012);
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = Math.max(2, wPx * 0.004);
        ctx.fillStyle = COLORS.paper;
        ctx.fillRect(xPx, yPx, wPx, hPx);
        ctx.restore();

        ctx.drawImage(sourceCanvas, xPx, yPx, wPx, hPx);

        // Crisp 1px paper edge definition against light mat
        ctx.strokeStyle = 'rgba(17, 17, 17, 0.14)';
        ctx.lineWidth = 1;
        ctx.strokeRect(xPx + 0.5, yPx + 0.5, wPx - 1, hPx - 1);
      }

      function renderStage() {
        const comp = state.comp;
        if (!comp) return;

        const m = state.stageMetrics;
        const s = m.cssPxPerMm * m.dpr; // 1 mm -> stage canvas device pixels
        const W = stageCanvas.width;
        const H = stageCanvas.height;

        stageCtx.save();
        stageCtx.clearRect(0, 0, W, H);

        const paperX = m.paperLeftMm * s;
        const paperY = m.paperTopMm * s;
        const paperW = comp.paperW * s;
        const paperH = comp.paperH * s;

        // 1) Subtle paper tray guide ticks printed on cutting mat
        stageCtx.strokeStyle = 'rgba(17, 17, 17, 0.25)';
        stageCtx.lineWidth = Math.max(1, 0.32 * s);
        const guideLen = 3.5 * s;
        // Top & bottom tray alignment stops
        stageCtx.beginPath();
        stageCtx.moveTo(paperX - 1.5 * s, paperY - 1.5 * s);
        stageCtx.lineTo(paperX + guideLen, paperY - 1.5 * s);
        stageCtx.moveTo(paperX + paperW - guideLen, paperY - 1.5 * s);
        stageCtx.lineTo(paperX + paperW + 1.5 * s, paperY - 1.5 * s);
        stageCtx.moveTo(paperX - 1.5 * s, paperY + paperH + 1.5 * s);
        stageCtx.lineTo(paperX + guideLen, paperY + paperH + 1.5 * s);
        stageCtx.moveTo(paperX + paperW - guideLen, paperY + paperH + 1.5 * s);
        stageCtx.lineTo(paperX + paperW + 1.5 * s, paperY + paperH + 1.5 * s);
        stageCtx.stroke();

        // 2) Paper sheet(s) — sliding right into output tray & feeding in from left during 'changing_paper'
        if (state.phase === 'changing_paper' && state.hasOutgoingPaper) {
          const u = state.paperSwapT;
          const outProgress = Math.min(1, u / 0.62);
          const outEase = outProgress * outProgress * (3 - 2 * outProgress);
          const outOffsetPx = outEase * (W - paperX + 24 * m.dpr);
          if (outProgress < 1) {
            drawPaperSheet(stageCtx, paperX + outOffsetPx, paperY, paperW, paperH, outgoingPaperCanvas);
          }

          const inProgress = Math.max(0, Math.min(1, (u - 0.28) / 0.72));
          const inEase = 1 - Math.pow(1 - inProgress, 3);
          const startLeftPx = -paperW - 24 * m.dpr;
          const curInXPx = startLeftPx + (paperX - startLeftPx) * inEase;
          if (inProgress > 0) {
            drawPaperSheet(stageCtx, curInXPx, paperY, paperW, paperH, paperCanvas);
          }
        } else {
          drawPaperSheet(stageCtx, paperX, paperY, paperW, paperH, paperCanvas);
        }

        // Subtle target markers on paper for pending user-clicked flying birds
        for (const mk of state.queuedMarkers) {
          if (mk.done) continue;
          const mx = paperX + mk.x * s;
          const my = paperY + mk.y * s;
          const r = 1.6 * s;
          stageCtx.strokeStyle = 'rgba(31, 63, 191, 0.36)';
          stageCtx.lineWidth = Math.max(1, 0.25 * s);
          stageCtx.beginPath();
          stageCtx.moveTo(mx - r, my);
          stageCtx.lineTo(mx + r, my);
          stageCtx.moveTo(mx, my - r);
          stageCtx.lineTo(mx, my + r);
          stageCtx.stroke();
        }

        // 3) Side Linear Guide Rails ("纸张两侧各有一条导轨")
        const railOffsetMm = m.simplifiedGantry ? 6.5 : 11.5;
        const railWMm = m.simplifiedGantry ? 3.2 : 5.2;
        const leftRailX = (m.paperLeftMm - railOffsetMm) * s;
        const rightRailX = (m.paperLeftMm + comp.paperW + railOffsetMm - railWMm) * s;
        const railTopY = (m.paperTopMm - (m.simplifiedGantry ? 11.5 : 15.5)) * s;
        const railBotY = (m.paperTopMm + comp.paperH + 6.5) * s;
        const railW = railWMm * s;
        const railH = railBotY - railTopY;

        function drawSideRail(rx) {
          // Rail shadow
          stageCtx.fillStyle = 'rgba(17, 17, 17, 0.14)';
          stageCtx.fillRect(rx + 1.2 * s, railTopY + 1.2 * s, railW, railH);

          // Anodized aluminum linear rail shaft
          const grad = stageCtx.createLinearGradient(rx, 0, rx + railW, 0);
          grad.addColorStop(0, '#8A9098');
          grad.addColorStop(0.35, '#D2D6DC');
          grad.addColorStop(0.7, '#B2B7BF');
          grad.addColorStop(1, '#7D828A');
          stageCtx.fillStyle = grad;
          stageCtx.fillRect(rx, railTopY, railW, railH);
          stageCtx.strokeStyle = COLORS.noir;
          stageCtx.lineWidth = Math.max(1, 0.28 * s);
          stageCtx.strokeRect(rx, railTopY, railW, railH);

          // Center guide groove
          stageCtx.strokeStyle = 'rgba(17, 17, 17, 0.35)';
          stageCtx.beginPath();
          stageCtx.moveTo(rx + railW * 0.5, railTopY);
          stageCtx.lineTo(rx + railW * 0.5, railBotY);
          stageCtx.stroke();

          // Near-black #111111 stepper/bearing end-mounts at top & bottom of rail
          const blockW = railW + 2.4 * s;
          const blockH = (m.simplifiedGantry ? 4.5 : 6.5) * s;
          stageCtx.fillStyle = COLORS.noir;
          stageCtx.fillRect(rx - 1.2 * s, railTopY - blockH * 0.45, blockW, blockH);
          stageCtx.fillRect(rx - 1.2 * s, railBotY - blockH * 0.55, blockW, blockH);
        }

        drawSideRail(leftRailX);
        drawSideRail(rightRailX);

        // 4) Y-Axis Moving Gantry ("横梁沿 Y 轴移动")
        // Pen nib sits slightly below gantry centerline so audience clearly sees ink emerging from pen tip!
        const nibToGantryCenterMm = m.simplifiedGantry ? 5.2 : 7.8;
        const penTipPxX = paperX + state.penX * s;
        const penTipPxY = paperY + state.penY * s;
        const gantryCenterY = penTipPxY - nibToGantryCenterMm * s;
        const gantryThick = (m.simplifiedGantry ? 4.2 : 7.2) * s;
        const gantryX0 = leftRailX - 1.4 * s;
        const gantryX1 = rightRailX + railW + 1.4 * s;
        const gantrySpanW = gantryX1 - gantryX0;

        // Soft cast shadow of gantry onto white paper & cutting mat
        stageCtx.fillStyle = 'rgba(17, 17, 17, 0.095)';
        stageCtx.fillRect(
          gantryX0 + 1.5 * s,
          gantryCenterY - gantryThick * 0.5 + 3.2 * s,
          gantrySpanW,
          gantryThick + 0.8 * s
        );

        // Gantry brushed aluminum beam
        const beamGrad = stageCtx.createLinearGradient(0, gantryCenterY - gantryThick * 0.5, 0, gantryCenterY + gantryThick * 0.5);
        beamGrad.addColorStop(0, '#D4D8DE');
        beamGrad.addColorStop(0.28, '#BDC2C9');
        beamGrad.addColorStop(0.68, '#9DA3AC');
        beamGrad.addColorStop(1, '#7D838C');
        stageCtx.fillStyle = beamGrad;
        stageCtx.fillRect(gantryX0, gantryCenterY - gantryThick * 0.5, gantrySpanW, gantryThick);
        stageCtx.strokeStyle = COLORS.noir;
        stageCtx.lineWidth = Math.max(1, 0.3 * s);
        stageCtx.strokeRect(gantryX0, gantryCenterY - gantryThick * 0.5, gantrySpanW, gantryThick);

        // Timing belt slot along gantry (#111111)
        if (!m.simplifiedGantry) {
          stageCtx.fillStyle = COLORS.noir;
          stageCtx.fillRect(gantryX0 + 4 * s, gantryCenterY - 0.85 * s, gantrySpanW - 8 * s, 1.7 * s);
        }

        // Left & right Y-slider bearing carriages (#111111) riding on the two side rails
        const ySlideW = railW + 3.0 * s;
        const ySlideH = gantryThick + (m.simplifiedGantry ? 3.5 : 5.8) * s;
        stageCtx.fillStyle = COLORS.noir;
        stageCtx.fillRect(leftRailX - 1.5 * s, gantryCenterY - ySlideH * 0.5, ySlideW, ySlideH);
        stageCtx.fillRect(rightRailX - 1.5 * s, gantryCenterY - ySlideH * 0.5, ySlideW, ySlideH);

        // 5) Flexible Ribbon / Drag-Chain Cable Loop ("带着线缆弯环的笔架沿横梁在 X 轴上滑动")
        const anchorX = leftRailX + ySlideW * 0.7;
        const anchorY = gantryCenterY - gantryThick * 0.42;
        const carAttachX = penTipPxX - (m.simplifiedGantry ? 2.5 : 4.2) * s;
        const carAttachY = gantryCenterY - gantryThick * 0.42;
        const loopMidX = (anchorX + carAttachX) * 0.5 - 3.5 * s;
        const spanFrac = Math.max(0, Math.min(1, state.penX / comp.paperW));
        const loopArchH = (m.simplifiedGantry ? 6.5 : 11.5) * s * (0.65 + 0.45 * (1 - spanFrac));

        // Cable loop soft shadow
        stageCtx.strokeStyle = 'rgba(17, 17, 17, 0.12)';
        stageCtx.lineWidth = (m.simplifiedGantry ? 1.5 : 2.5) * s;
        stageCtx.lineCap = 'round';
        stageCtx.beginPath();
        stageCtx.moveTo(anchorX, anchorY + 2.2 * s);
        stageCtx.bezierCurveTo(
          anchorX + 6 * s, anchorY - loopArchH + 2.2 * s,
          loopMidX, carAttachY - loopArchH + 2.2 * s,
          carAttachX, carAttachY + 2.2 * s
        );
        stageCtx.stroke();

        // Near-black #111111 flat flex cable loop
        stageCtx.strokeStyle = COLORS.noir;
        stageCtx.lineWidth = (m.simplifiedGantry ? 1.45 : 2.35) * s;
        stageCtx.beginPath();
        stageCtx.moveTo(anchorX, anchorY);
        stageCtx.bezierCurveTo(
          anchorX + 6 * s, anchorY - loopArchH,
          loopMidX, carAttachY - loopArchH,
          carAttachX, carAttachY
        );
        stageCtx.stroke();

        // Thin metallic highlight along cable rib
        stageCtx.strokeStyle = 'rgba(210, 214, 220, 0.28)';
        stageCtx.lineWidth = Math.max(0.7, 0.35 * s);
        stageCtx.stroke();

        // 6) Pen Shadow & Pen Carriage + Blue Ballpoint Pen with Red Clip (#D93025)
        // CRITICAL REQUIREMENT:
        // "抬笔时，笔尖离开纸面，阴影和笔尖明显分开。落笔后，墨线严格跟随笔尖，画到哪里才显现到哪里。"
        const liftZ = state.penZ; // 0 = touching paper, 1 = lifted

        // X-Carriage block (#111111) mounted on gantry
        const carW = (m.simplifiedGantry ? 8.5 : 12.6) * s;
        const carH = gantryThick + (m.simplifiedGantry ? 3.2 : 5.2) * s;
        stageCtx.fillStyle = COLORS.noir;
        stageCtx.fillRect(penTipPxX - carW * 0.5, gantryCenterY - carH * 0.5, carW, carH);

        // Machined aluminum Z-slide plate on carriage front
        const zLiftPx = liftZ * (m.simplifiedGantry ? 2.6 : 3.6) * s;
        const zPlateW = carW * 0.58;
        const zPlateH = (m.simplifiedGantry ? 5.2 : 7.0) * s;
        stageCtx.fillStyle = '#B8BDC5';
        stageCtx.fillRect(
          penTipPxX - zPlateW * 0.5,
          gantryCenterY - 1.2 * s - zLiftPx * 0.45,
          zPlateW,
          zPlateH
        );

        // Cast shadow of Pen Nib & Cone on paper!
        // When liftZ === 0: shadow converges right onto (penTipPxX, penTipPxY).
        // When liftZ > 0: shadow separates clearly down-right on the paper while nib lifts up-left!
        const nibVisualX = penTipPxX - liftZ * 1.65 * s;
        const nibVisualY = penTipPxY - liftZ * 3.15 * s;
        const shadowTipX = penTipPxX + liftZ * 2.55 * s;
        const shadowTipY = penTipPxY + liftZ * 2.35 * s;

        stageCtx.save();
        const shadowAlpha = 0.28 - liftZ * 0.1;
        stageCtx.fillStyle = `rgba(17, 17, 17, ${shadowAlpha.toFixed(3)})`;
        stageCtx.beginPath();
        stageCtx.moveTo(shadowTipX, shadowTipY);
        stageCtx.lineTo(shadowTipX - 1.5 * s - liftZ * 0.5 * s, shadowTipY - 4.8 * s);
        stageCtx.lineTo(shadowTipX + 2.1 * s + liftZ * 0.5 * s, shadowTipY - 4.4 * s);
        stageCtx.closePath();
        stageCtx.fill();

        // Tiny crisp shadow dot of the ballpoint tip on the paper when lifted
        if (liftZ > 0.08) {
          stageCtx.fillStyle = `rgba(17, 17, 17, ${(0.22 * liftZ).toFixed(3)})`;
          stageCtx.beginPath();
          stageCtx.arc(shadowTipX, shadowTipY, (0.42 + liftZ * 0.35) * s, 0, Math.PI * 2);
          stageCtx.fill();
        }
        stageCtx.restore();

        // Draw Ballpoint Pen Assembly (seen from clean oblique top-front drafting angle)
        // Pen axis angled slightly (-10 deg) from carriage clamp down to exact nibVisualX, nibVisualY
        const penAng = -0.16;
        stageCtx.save();
        stageCtx.translate(nibVisualX, nibVisualY);
        stageCtx.rotate(penAng);

        const coneLen = (m.simplifiedGantry ? 3.2 : 4.2) * s;
        const barrelW = (m.simplifiedGantry ? 2.4 : 3.2) * s;
        const barrelLen = (m.simplifiedGantry ? 11.5 : 15.8) * s;

        // Blue ballpoint ink nib micro-tip (#1F3FBF) right at (0, 0)
        stageCtx.fillStyle = COLORS.inkHex;
        stageCtx.beginPath();
        stageCtx.arc(0, 0, Math.max(1.1, 0.36 * s), 0, Math.PI * 2);
        stageCtx.fill();

        // Machined silver/aluminum nose cone tapering down to nib
        stageCtx.fillStyle = '#C9CDD3';
        stageCtx.strokeStyle = COLORS.noir;
        stageCtx.lineWidth = Math.max(0.9, 0.24 * s);
        stageCtx.beginPath();
        stageCtx.moveTo(0, -0.25 * s);
        stageCtx.lineTo(-barrelW * 0.5, -coneLen);
        stageCtx.lineTo(barrelW * 0.5, -coneLen);
        stageCtx.closePath();
        stageCtx.fill();
        stageCtx.stroke();

        // Near-black #111111 pen barrel with blue indicator collar
        stageCtx.fillStyle = COLORS.noir;
        stageCtx.fillRect(-barrelW * 0.5, -coneLen - barrelLen, barrelW, barrelLen);

        // Thin #1F3FBF ballpoint color ring near grip
        stageCtx.fillStyle = COLORS.inkHex;
        stageCtx.fillRect(-barrelW * 0.5, -coneLen - 2.1 * s, barrelW, 1.15 * s);

        // RED PEN CLIP & CLAMP (#D93025 — strictly one of the ONLY two red elements!)
        const clipW = barrelW + 1.5 * s;
        const clipH = (m.simplifiedGantry ? 5.2 : 7.0) * s;
        const clipTop = -coneLen - barrelLen * 0.78;
        stageCtx.fillStyle = COLORS.red;
        stageCtx.fillRect(-clipW * 0.5, clipTop, clipW, clipH * 0.42);
        // Pocket clip tongue extending down the barrel side
        stageCtx.fillRect(barrelW * 0.28, clipTop, 1.05 * s, clipH);
        stageCtx.strokeStyle = COLORS.noir;
        stageCtx.lineWidth = Math.max(0.8, 0.22 * s);
        stageCtx.strokeRect(-clipW * 0.5, clipTop, clipW, clipH * 0.42);

        stageCtx.restore();
        stageCtx.restore();
      }

      // ============================================================
      // 11. LCD READOUT & SILKSCREEN MANIFEST UPDATES
      // ============================================================
      function renderManifestDOM() {
        manifestList.innerHTML = '';
        const activeLayer = (!state.reducedMotion && state.currentStrokeIdx < state.strokes.length)
          ? state.strokes[state.currentStrokeIdx].layerIndex
          : -1;

        state.layerStats.forEach((ls, idx) => {
          const isDone = ls.done >= ls.total && ls.total > 0;
          const isActive = !isDone && (idx === activeLayer || (ls.done > 0 && ls.done < ls.total));
          const li = document.createElement('li');
          li.className = 'manifest-row' + (isDone ? ' is-done' : '') + (isActive ? ' is-active' : '');

          const checkSpan = document.createElement('span');
          checkSpan.className = 'manifest-check';
          checkSpan.textContent = isDone ? '✓' : (isActive ? '›' : '·');

          const nameSpan = document.createElement('span');
          nameSpan.textContent = ls.name;

          const countSpan = document.createElement('span');
          countSpan.className = 'manifest-count';
          countSpan.textContent = `${ls.total.toLocaleString('en-US')} 笔`;

          li.appendChild(checkSpan);
          li.appendChild(nameSpan);
          li.appendChild(countSpan);
          manifestList.appendChild(li);
        });

        updateDistanceDOM();
      }

      function updateManifestLiveStatus() {
        const rows = manifestList.children;
        if (rows.length !== state.layerStats.length) {
          renderManifestDOM();
          return;
        }
        const activeLayer = (!state.reducedMotion && state.currentStrokeIdx < state.strokes.length)
          ? state.strokes[state.currentStrokeIdx].layerIndex
          : -1;

        for (let i = 0; i < state.layerStats.length; i++) {
          const ls = state.layerStats[i];
          const isDone = ls.done >= ls.total && ls.total > 0;
          const isActive = !isDone && (i === activeLayer || (ls.done > 0 && ls.done < ls.total));
          const row = rows[i];
          row.className = 'manifest-row' + (isDone ? ' is-done' : '') + (isActive ? ' is-active' : '');
          const checkEl = row.firstElementChild;
          const mark = isDone ? '✓' : (isActive ? '›' : '·');
          if (checkEl.textContent !== mark) checkEl.textContent = mark;
        }
        updateDistanceDOM();
      }

      function updateDistanceDOM() {
        penDownMetersEl.textContent = `${(state.cumDrawMm / 1000).toFixed(2)} m`;
        penUpMetersEl.textContent = `${(state.cumTravelMm / 1000).toFixed(2)} m`;
      }

      function formatMMSS(sec) {
        const clamped = Math.max(0, Math.ceil(sec));
        const mins = Math.floor(clamped / 60);
        const secs = clamped % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function updateLCD() {
        if (!state.comp) return;

        if (state.reducedMotion) {
          const curLayerName = state.layerStats[Math.max(0, state.visibleLayerCount - 1)]?.name || '全部';
          lcdPrimary.textContent = `静态呈现  图层 ${state.visibleLayerCount}/${state.layerStats.length}`;
          lcdSecondary.textContent = `${curLayerName}  100%  剩余 00:00`;
          return;
        }

        let statusWord = '抬笔';
        if (state.paused) {
          statusWord = '暂停';
        } else if (state.phase === 'changing_paper') {
          statusWord = '换纸';
        } else if (state.phase === 'homing') {
          statusWord = '回零';
        } else if (state.phase === 'finished') {
          statusWord = '完成';
        } else if (state.penZ < 0.25) {
          statusWord = '落笔';
        }

        const xStr = state.penX.toFixed(1).padStart(5, ' ');
        const yStr = state.penY.toFixed(1).padStart(5, ' ');

        const totalStrokes = Math.max(1, state.strokes.length);
        const pct = state.phase === 'finished'
          ? 100
          : Math.min(99, Math.floor((state.currentStrokeIdx / totalStrokes) * 100));

        const speedMult = SPEEDS[state.speedIndex];
        let remPhys = 0;
        if (state.phase !== 'finished' && state.currentStrokeIdx < state.strokeRemainPhysSec.length) {
          remPhys = state.strokeRemainPhysSec[state.currentStrokeIdx];
          if (state.phase === 'homing') {
            remPhys += Math.max(0, state.phaseDuration - state.phaseTime);
          }
        }
        const remWallSec = state.phase === 'finished' ? 0 : (remPhys / speedMult);

        lcdPrimary.textContent = `${statusWord}  X ${xStr}  Y ${yStr}`;
        lcdSecondary.textContent = `${String(pct).padStart(2, ' ')}%  剩余 ${formatMMSS(remWallSec)}`;
      }

      // ============================================================
      // 12. CONTROLS, DRAGGABLE KNOB & KEYBOARD EVENTS
      // ============================================================
      // Knurled Speed Knob: click cycles, vertical/horizontal drag or wheel steps cleanly
      let knobDrag = { active: false, startY: 0, startX: 0, startIdx: 0, moved: false };

      speedKnob.addEventListener('pointerdown', (e) => {
        knobDrag = {
          active: true,
          startY: e.clientY,
          startX: e.clientX,
          startIdx: state.speedIndex,
          moved: false
        };
        speedKnob.setPointerCapture(e.pointerId);
      });

      speedKnob.addEventListener('pointermove', (e) => {
        if (!knobDrag.active) return;
        const delta = (knobDrag.startY - e.clientY) + (e.clientX - knobDrag.startX) * 0.65;
        if (Math.abs(delta) > 7) knobDrag.moved = true;
        const steps = Math.round(delta / 18);
        setSpeedIndex(knobDrag.startIdx + steps);
      });

      speedKnob.addEventListener('pointerup', (e) => {
        if (!knobDrag.active) return;
        knobDrag.active = false;
        if (!knobDrag.moved) {
          // Simple click steps forward (wrapping around after 64x)
          setSpeedIndex((state.speedIndex + 1) % SPEEDS.length);
        }
        if (speedKnob.hasPointerCapture(e.pointerId)) {
          speedKnob.releasePointerCapture(e.pointerId);
        }
      });

      speedKnob.addEventListener('wheel', (e) => {
        e.preventDefault();
        setSpeedIndex(state.speedIndex + (e.deltaY < 0 ? 1 : -1));
      }, { passive: false });

      // Sound Toggle Lever
      soundSwitch.addEventListener('click', () => {
        const nextOn = soundSwitch.getAttribute('aria-checked') !== 'true';
        soundSwitch.setAttribute('aria-checked', String(nextOn));
        audio.setEnabled(nextOn);
        if (nextOn) {
          audio.triggerPenClick(false);
        }
      });

      // Pause Mushroom Button
      pauseBtn.addEventListener('click', () => {
        setPaused(!state.paused);
      });

      // Finish Keycap
      finishBtn.addEventListener('click', () => {
        finishDrawingImmediately();
      });

      // Change Paper Keycap
      newPaperBtn.addEventListener('click', () => {
        state.serialNumber++;
        if (state.paused) setPaused(false);
        startNewSheet(true);
      });

      // Reduced-motion Layer Stepper Keycaps
      prevLayerBtn.addEventListener('click', () => {
        if (!state.reducedMotion) return;
        if (state.visibleLayerCount > 1) {
          state.visibleLayerCount--;
          applyReducedMotionCompleteState();
          renderManifestDOM();
        }
      });

      nextLayerBtn.addEventListener('click', () => {
        if (!state.reducedMotion) return;
        if (state.visibleLayerCount < state.layerStats.length) {
          state.visibleLayerCount++;
          applyReducedMotionCompleteState();
          renderManifestDOM();
        }
      });

      // Click on Paper to add V-shaped flying bird
      stageCanvas.addEventListener('click', handleCanvasClick);

      // Keyboard Shortcuts: Space (Pause/Resume), F (Finish), N (New Paper), + / - (Speed)
      window.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

        if (e.code === 'Space') {
          // Avoid double-firing if user pressed Space while a button has focus
          if (tag === 'button') return;
          e.preventDefault();
          setPaused(!state.paused);
        } else if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          finishDrawingImmediately();
        } else if (e.key === 'n' || e.key === 'N') {
          e.preventDefault();
          state.serialNumber++;
          if (state.paused) setPaused(false);
          startNewSheet(true);
        } else if (e.key === '+' || e.key === '=' || e.code === 'NumpadAdd') {
          e.preventDefault();
          setSpeedIndex(state.speedIndex + 1);
        } else if (e.key === '-' || e.key === '_' || e.code === 'NumpadSubtract') {
          e.preventDefault();
          setSpeedIndex(state.speedIndex - 1);
        }
      });

      // Listen for live system prefers-reduced-motion changes
      reducedMotionQuery.addEventListener('change', (e) => {
        state.reducedMotion = e.matches;
        updateModeButtonsUI();
        if (state.reducedMotion) {
          audio.updateMotors(0, 0, false);
          state.visibleLayerCount = state.layerStats.length;
          applyReducedMotionCompleteState();
          renderManifestDOM();
        } else if (state.phase === 'finished') {
          replayDrawnInkToPaper();
        }
      });

      // Responsive Resize
      let resizeRaf = 0;
      window.addEventListener('resize', () => {
        cancelAnimationFrame(resizeRaf);
        resizeRaf = requestAnimationFrame(() => {
          updateStageLayout(true);
          renderStage();
        });
      });

      // ============================================================
      // 13. MAIN ANIMATION LOOP
      // ============================================================
      let lastFrameTs = performance.now();
      let uiTickAccum = 0;

      function frameLoop(now) {
        const dt = Math.max(0, Math.min(0.1, (now - lastFrameTs) / 1000));
        lastFrameTs = now;

        stepPlotterPhysics(dt);
        renderStage();

        uiTickAccum += dt;
        if (uiTickAccum >= 0.05 || state.phase === 'finished') {
          uiTickAccum = 0;
          updateLCD();
          updateManifestLiveStatus();
        }

        requestAnimationFrame(frameLoop);
      }

      // Initialize & Start Drawing Immediately on Open ("页面一打开就开始绘制")
      initSpeedTicks();
      startNewSheet(false);
      updateLCD();
      renderStage();
      window.ToyEmbed?.ready();
      requestAnimationFrame(frameLoop);
    })();
  </script>
</body>
</html>
