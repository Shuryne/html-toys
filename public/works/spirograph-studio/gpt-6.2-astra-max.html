<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e7">
  <link id="favicon" rel="icon" href="data:,">
  <title>万花尺工作室 · Orbis 第 7 号绘图盘</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f1e7;
      --card: #fbf7ed;
      --ink: #1d2433;
      --muted: #7a7262;
      --rule: #d8ccb4;
      --red: #e2462b;
      --blue: #1f3f78;
      --green: #1c7d64;
      --yellow: #e8a21b;
      --plum: #7a2e6b;
      --sans: "Avenir Next", Avenir, Futura, "Century Gothic", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "Courier New", "PingFang SC", "Microsoft YaHei", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--sans);
      background-color: var(--paper);
      background-image: var(--grain, none),
        linear-gradient(to right, #a28d6e1a 1px, transparent 1px),
        linear-gradient(to bottom, #a28d6e1a 1px, transparent 1px);
      background-size: 128px 128px, 24px 24px, 24px 24px;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button, input, label { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
    .workshop {
      width: min(1256px, calc(100% - clamp(48px, 9vw, 152px)));
      margin: 0 auto;
      padding: clamp(24px, 3.3vh, 42px) 0 38px;
    }
    .masthead {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      row-gap: 10px;
      padding-bottom: 17px;
      border-bottom: 3px solid var(--ink);
    }
    .masthead::after {
      content: "";
      position: absolute;
      inset: calc(100% + 3px) 0 auto;
      height: 4px;
      opacity: .42;
      background: repeating-linear-gradient(90deg, var(--muted) 0 1px, transparent 1px 8px);
    }
    .brand { display: flex; align-items: center; gap: 9px; width: fit-content; }
    .brand canvas { width: 27px; height: 27px; }
    .wordmark { font-size: 17px; line-height: 1; font-weight: 800; letter-spacing: .15em; }
    .maker {
      padding-left: 11px;
      border-left: 1px solid #aaa08c;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .12em;
    }
    h1, h2, p, figure { margin: 0; }
    h1 {
      grid-column: 1;
      font-size: clamp(44px, 4.55vw, 67px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -.045em;
    }
    h1 span { color: var(--red); }
    .nameplate {
      grid-column: 2;
      grid-row: 1 / 3;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      margin-bottom: 1px;
      background: var(--grain, none), #eee7d7;
      border: 1px solid #aaa08a;
      border-radius: 3px;
      box-shadow: inset 0 1px 0 #fffcf3, 1px 2px 0 #cbbfa8;
    }
    .screw {
      display: inline-block;
      width: 7px;
      height: 7px;
      border: 1px solid #9c937f;
      border-radius: 100%;
      background: linear-gradient(137deg, transparent 43%, #938974 45% 55%, transparent 57%), #e7dfcd;
      box-shadow: inset .5px .5px 1px #fffaf0, 0 1px 0 #fffcf3;
    }
    .model-number { font: 700 29px/1 var(--mono); letter-spacing: -.08em; white-space: nowrap; }
    .model-number small { font-size: 14px; vertical-align: .5em; margin-right: 4px; }
    .model-name { display: grid; gap: 3px; border-left: 1px solid #bcb199; padding-left: 11px; }
    .model-name strong { font-size: 13px; line-height: 1.3; letter-spacing: .07em; }
    .model-name small { color: #675f50; font: 10px/1 var(--mono); letter-spacing: .08em; }

    .bench {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(318px, 30.2vw, 394px);
      gap: clamp(28px, 4.6vw, 73px);
      align-items: start;
      margin-top: 30px;
    }
    .plot { min-width: 0; }
    .plot-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 23px;
      margin: 0 4px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .06em;
    }
    .status, .layers { display: inline-flex; align-items: center; gap: 9px; }
    .status-mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px #1c7d6417;
    }
    [data-state="paused"] .status-mark { background: var(--yellow); box-shadow: 0 0 0 3px #e8a21b1f; }
    [data-state="closed"] .status-mark { background: var(--blue); box-shadow: 0 0 0 3px #1f3f7817; }
    [data-state="ready"] .status-mark { background: #9c9382; box-shadow: 0 0 0 3px #8d847417; }
    .layers { color: #665e50; }
    .layers b { font: 700 14px/1 var(--mono); color: var(--ink); letter-spacing: .04em; }
    .bed {
      position: relative;
      display: grid;
      place-items: center;
      padding: 16px 18px 22px;
      margin: 5px 0 0;
    }
    .register {
      --registration: #978a70;
      position: absolute;
      width: 14px;
      height: 14px;
      opacity: .62;
      background:
        linear-gradient(var(--registration), var(--registration)) center / 100% 1px no-repeat,
        linear-gradient(var(--registration), var(--registration)) center / 1px 100% no-repeat;
    }
    .register:nth-of-type(1) { top: 10px; left: 1px; }
    .register:nth-of-type(2) { top: 10px; right: 1px; }
    .register:nth-of-type(3) { bottom: 12px; left: 1px; }
    .register:nth-of-type(4) { bottom: 12px; right: 1px; }
    .disc {
      position: relative;
      isolation: isolate;
      width: min(100%, clamp(510px, 65vh, 646px));
      aspect-ratio: 1;
      border-radius: 50%;
      background-color: #faf4e5;
      background-image: var(--grain, none),
        radial-gradient(ellipse at 39% 30%, #fffdf4 4%, #fbf6e9 56%, #f3e9d4 81%, #d7c9aa 100%);
      background-size: 128px 128px, cover;
      box-shadow: inset 0 0 0 1px #afa185, inset 0 1px 5px #fffdf5,
        0 0 0 3px #f7f1e1c9, 0 0 0 4px #bfb09287, 0 0 0 8px #eee6d666,
        0 0 0 9px #cbbda044, 2px 7px 8px #6e5b3629, 5px 16px 23px #68553726;
    }
    .disc canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border-radius: 50%; }
    #ink { mix-blend-mode: multiply; }
    figcaption {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 5px;
      color: #665f52;
      font: 13px/1.5 var(--mono);
    }
    figcaption b { color: var(--ink); font-weight: 700; }
    .caption-name { display: inline-flex; align-items: center; gap: 7px; }
    .caption-name::before {
      content: "";
      width: 12px;
      height: 12px;
      border: 1px solid currentColor;
      border-radius: 50%;
      background:
        linear-gradient(currentColor, currentColor) center / 6px 1px no-repeat,
        linear-gradient(currentColor, currentColor) center / 1px 6px no-repeat;
    }
    .caption-divider { height: 13px; width: 1px; background: #c9bda6; }
    .setting { white-space: nowrap; }

    .panel {
      position: relative;
      padding: 20px 24px 19px;
      border: 1px solid #6a6558;
      border-radius: 3px;
      background: var(--grain, none), var(--card);
      box-shadow: 6px 6px 0 #cdbfa5;
    }
    .panel-header { display: flex; align-items: center; gap: 10px; }
    .panel-header h2 { font-size: 24px; line-height: 1.4; font-weight: 750; letter-spacing: -.035em; }
    .panel-header .screw { margin-left: auto; align-self: start; }
    .sliders-icon { width: 19px; display: grid; gap: 4px; }
    .sliders-icon i { position: relative; width: 100%; height: 1.5px; background: var(--ink); }
    .sliders-icon i::before {
      content: ""; position: absolute; top: -2px; left: 3px; width: 5px; height: 5px;
      border: 1px solid var(--ink); background: var(--card); border-radius: 50%;
    }
    .sliders-icon i:nth-child(2)::before { left: 11px; }
    .intro { margin-top: 5px; color: #696253; font-size: 14px; line-height: 1.65; text-wrap: pretty; }
    .controls {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      padding: 14px 0 15px;
      border-block: 1px dashed #c8bca4;
    }
    .control { position: relative; }
    .control + .control::before {
      content: ""; position: absolute; inset: -5px 0 auto; border-top: 1px dashed #d8ccb47d;
    }
    .control-head, .inks-head, .progress-head, .scale-ends { display: flex; align-items: center; justify-content: space-between; }
    .control-head label, .inks-head strong, .progress-head > span:first-child { font-size: 15px; font-weight: 650; }
    .symbol { margin-left: 6px; color: var(--muted); font: italic 13px/1 var(--mono); }
    .readout {
      display: inline-flex; align-items: baseline; justify-content: center; gap: 2px;
      min-width: 52px; padding: 2px 6px; border: 1px solid var(--rule); border-radius: 3px;
      background: #f3edde; font: 700 15px/1.1 var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .rail { --position: 50%; position: relative; height: 21px; margin-inline: 1px; }
    .rail::before, .rail::after {
      content: ""; position: absolute; pointer-events: none; left: 8px; right: 8px;
    }
    .rail::before {
      top: 10px; height: 6px;
      background:
        repeating-linear-gradient(90deg, #a2957a 0 1px, transparent 1px 10%) left top / 100% 6px no-repeat,
        repeating-linear-gradient(90deg, #c8bba2 0 1px, transparent 1px 2%) left top / 100% 3px no-repeat;
    }
    .rail::after {
      top: 9px; height: 2px;
      background: linear-gradient(to right, #5c5c54 0 var(--position), #cfc2a8 var(--position) 100%);
    }
    input[type="range"] {
      position: relative; z-index: 1; display: block; width: 100%; height: 21px;
      margin: 0; padding: 0; appearance: none; -webkit-appearance: none;
      border: 0; background: transparent; cursor: pointer; touch-action: pan-y;
    }
    input[type="range"]::-webkit-slider-runnable-track { height: 2px; border: 0; background: transparent; }
    input[type="range"]::-moz-range-track { height: 2px; border: 0; background: transparent; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 17px; height: 17px; margin-top: -7.5px;
      border: 1.5px solid var(--ink); border-radius: 50%;
      background: radial-gradient(circle, var(--red) 0 2.5px, #fcf7e9 3px 4.6px, #777467 5px 5.6px, #f9f4e7 6px);
      box-shadow: 0 1px 1px #4c412c36; transition: transform .22s cubic-bezier(.2,1.8,.45,1);
    }
    input[type="range"]::-moz-range-thumb {
      width: 15px; height: 15px; border: 1.5px solid var(--ink); border-radius: 50%;
      background: radial-gradient(circle, var(--red) 0 2.5px, #fcf7e9 3px 4.6px, #777467 5px 5.6px, #f9f4e7 6px);
      box-shadow: 0 1px 1px #4c412c36; transition: transform .22s cubic-bezier(.2,1.8,.45,1);
    }
    input[type="range"]:focus-visible { outline-offset: 1px; border-radius: 3px; }
    .scale-ends { margin: -1px 3px 0; color: var(--muted); font: 12px/1 var(--mono); }
    .inks { margin: 13px 0 14px; }
    .ink-name { display: inline-flex; align-items: center; gap: 6px; color: #675f50; font-size: 12px; }
    .ink-name::before { content: ""; width: 14px; height: 2px; background: var(--current-ink, var(--red)); }
    .swatches { display: flex; gap: clamp(9px, 1.15vw, 17px); margin: 6px 0 0; }
    .swatch { position: relative; display: grid; place-items: center; width: 36px; height: 36px; cursor: pointer; }
    .swatch input { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .daub {
      display: grid; place-items: center; width: 27px; height: 27px; border-radius: 50%;
      border: 1px solid #1d243322; background-color: var(--sample);
      box-shadow: inset 0 1px 1px #ffffff2e;
      transition: transform .22s cubic-bezier(.2,1.8,.45,1);
    }
    .swatch input:checked + .daub { outline: 1.5px solid var(--ink); outline-offset: 3px; }
    .swatch input:checked + .daub::after {
      content: ""; width: 4px; height: 4px; border-radius: 50%; background: #fffaf0;
    }
    .swatch input:focus-visible + .daub { outline: 2px dashed var(--blue); outline-offset: 4px; }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .action {
      display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px;
      padding: 5px 8px; border: 1px solid #b5aa93; border-radius: 99px;
      background: #fcf8ee; color: var(--ink); font-size: 14px; font-weight: 650; cursor: pointer;
      transition: background-color .15s, border-color .15s, transform .15s;
    }
    .action.primary { background: var(--ink); border-color: var(--ink); color: var(--card); }
    .action:active { transform: translateY(1px); }
    .icon { display: inline-block; position: relative; width: 15px; height: 15px; flex: 0 0 auto; }
    .icon.pause::before {
      content: ""; position: absolute; inset: 2px 2px 2px 3px; border-inline: 3px solid currentColor;
    }
    .icon.play::before {
      content: ""; position: absolute; top: 2px; left: 4px; border-left: 9px solid currentColor;
      border-top: 5.5px solid transparent; border-bottom: 5.5px solid transparent;
    }
    .icon.stack::before, .icon.stack::after {
      content: ""; position: absolute; width: 8px; height: 8px;
      border: 1.25px solid currentColor; border-radius: 1px;
    }
    .icon.stack::before { left: 1px; top: 4px; }
    .icon.stack::after { left: 4px; top: 1px; background: var(--card); }
    .layers .icon.stack::after { background: var(--paper); }
    .icon.dice {
      width: 13px; height: 13px; border: 1.25px solid currentColor; border-radius: 3px; transform: rotate(-10deg);
      background: radial-gradient(circle at 29% 29%, currentColor 1px, transparent 1.4px),
        radial-gradient(circle at 50% 50%, currentColor 1px, transparent 1.4px),
        radial-gradient(circle at 71% 71%, currentColor 1px, transparent 1.4px);
    }
    .icon.sheet {
      width: 12px; height: 14px; border: 1.25px solid currentColor; border-radius: 1px;
      clip-path: polygon(0 0, 6px 0, 100% 6px, 100% 100%, 0 100%);
    }
    .icon.sheet::before {
      content: ""; position: absolute; right: -1px; top: -1px; width: 5px; height: 5px;
      border: 1px solid currentColor; background: linear-gradient(45deg, transparent 42%, currentColor 47% 57%, transparent 62%);
    }
    .progress-box { margin-top: 15px; padding-top: 12px; border-top: 1px dashed #c8bca4; }
    .progress-head { gap: 8px; }
    .progress-head > span:first-child { font-size: 13px; }
    #turns { margin-right: auto; padding-left: 3px; color: #6b6457; font: 12px/1.4 var(--mono); }
    #percent { font: 700 14px/1 var(--mono); }
    progress {
      appearance: none; -webkit-appearance: none; display: block; width: 100%; height: 5px;
      margin-top: 8px; overflow: hidden; border: 0; border-radius: 1px; background: #e3d9c5; color: var(--red);
    }
    progress::-webkit-progress-bar { background: #e3d9c5; }
    progress::-webkit-progress-value { background: var(--red); }
    progress::-moz-progress-bar { background: var(--red); }
    @media (hover: hover) {
      input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.16); }
      input[type="range"]:hover::-moz-range-thumb { transform: scale(1.16); }
      .swatch:hover .daub { transform: translateY(-1px) scale(1.1); }
      .action:hover { background: #f0e8d7; border-color: #746d5c; }
      .action.primary:hover { background: #323c4d; border-color: #323c4d; }
    }
    @media (min-width: 820px) and (max-width: 1050px) {
      .workshop { width: calc(100% - 50px); }
      .bench { gap: 26px; grid-template-columns: minmax(0,1fr) 310px; }
      .panel { padding-inline: 19px; }
      .bed { padding-inline: 10px; }
    }
    @media (max-width: 819.98px) {
      .workshop { width: min(652px, calc(100% - 44px)); padding-top: 23px; }
      .bench { grid-template-columns: minmax(0,1fr); gap: 24px; margin-top: 22px; }
      .disc { width: min(100%, 555px); }
      .bed { padding: 14px 12px 18px; }
      .panel { padding: 20px 23px; }
      .controls { gap: 13px; }
      .control + .control::before { top: -7px; }
      .rail, input[type="range"] { height: 28px; }
      .rail::before { top: 14px; }
      .rail::after { top: 13px; }
      .swatches { gap: 15px; }
      .swatch { width: 40px; height: 40px; }
      .action { min-height: 44px; }
    }
    @media (max-width: 590px) {
      .workshop { width: calc(100% - 36px); padding-top: 18px; }
      .masthead { row-gap: 13px; padding-bottom: 14px; }
      .brand { gap: 6px; }
      .brand canvas { width: 23px; height: 23px; }
      .wordmark { font-size: 14px; }
      .maker { padding-left: 7px; font-size: 12px; letter-spacing: .04em; }
      h1 { grid-column: 1 / -1; font-size: clamp(35px, 8.7vw, 49px); }
      .nameplate { grid-row: 1; align-self: center; gap: 6px; padding: 4px 6px; margin: 0; }
      .model-number, .model-name small, .nameplate .screw:last-child { display: none; }
      .model-name { border: 0; padding: 0; }
      .model-name strong { font-size: 11px; }
      .plot-meta { font-size: 12px; }
      figcaption { column-gap: 9px; font-size: 12px; }
      .register { width: 10px; height: 10px; }
      .panel { padding-inline: 18px; }
      .progress-head { gap: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
      input[type="range"]:hover::-webkit-slider-thumb { transform: none; }
      input[type="range"]:hover::-moz-range-thumb { transform: none; }
      .swatch:hover .daub, .action:active { transform: none; }
    }
  </style>
</head>
<body>
  <main class="workshop" data-state="running">
    <header class="masthead">
      <div class="brand" aria-label="Orbis 制图公司">
        <canvas id="maker-mark" width="96" height="96" aria-hidden="true"></canvas>
        <span class="wordmark">ORBIS</span><span class="maker">制图公司</span>
      </div>
      <h1>万花尺<span>工作室</span></h1>
      <div class="nameplate">
        <i class="screw" aria-hidden="true"></i>
        <span class="model-number" aria-hidden="true"><small>Nº</small>07</span>
        <span class="model-name"><strong>第 7 号绘图盘</strong><small lang="en">DRAWING PLATE</small></span>
        <i class="screw" aria-hidden="true"></i>
      </div>
    </header>

    <div class="bench">
      <figure class="plot" aria-label="齿轮绘图盘">
        <div class="plot-meta">
          <span class="status" role="status"><i class="status-mark" aria-hidden="true"></i><span id="status">绘制中</span></span>
          <span class="layers"><i class="icon stack" aria-hidden="true"></i>图层 <b id="layer-count">02</b></span>
        </div>
        <div class="bed">
          <i class="register" aria-hidden="true"></i><i class="register" aria-hidden="true"></i>
          <i class="register" aria-hidden="true"></i><i class="register" aria-hidden="true"></i>
          <div class="disc" id="disc">
            <canvas id="ink" role="img" aria-label="绘图纸上的多色内旋轮线">此处显示绘图纸上的墨迹。</canvas>
            <canvas id="mechanism" role="img" aria-label="内齿圈、滚动齿轮与笔尖">此处显示绘图机构。</canvas>
          </div>
        </div>
        <figcaption>
          <span class="caption-name">内旋轮线</span><span class="caption-divider" aria-hidden="true"></span>
          <span class="setting">R = <b id="caption-R">96</b></span>
          <span class="setting">r = <b id="caption-r">42</b></span>
          <span class="setting">d = <b id="caption-d">30.24</b></span>
        </figcaption>
      </figure>

      <section class="panel" aria-labelledby="panel-title">
        <header class="panel-header">
          <span class="sliders-icon" aria-hidden="true"><i></i><i></i><i></i></span>
          <h2 id="panel-title">绘图参数</h2>
          <i class="screw" aria-hidden="true"></i>
        </header>
        <p class="intro">调整齿数或笔孔会重绘本层，新建图层可叠色。</p>
        <div class="controls">
          <div class="control">
            <div class="control-head">
              <label for="outer">外齿圈齿数 <span class="symbol" aria-hidden="true">R</span></label>
              <output class="readout" id="outer-value" for="outer">96</output>
            </div>
            <div class="rail"><input id="outer" type="range" min="40" max="144" step="1" value="96"></div>
            <div class="scale-ends" aria-hidden="true"><span>40</span><span>144</span></div>
          </div>
          <div class="control">
            <div class="control-head">
              <label for="inner">内齿轮齿数 <span class="symbol" aria-hidden="true">r</span></label>
              <output class="readout" id="inner-value" for="inner">42</output>
            </div>
            <div class="rail"><input id="inner" type="range" min="12" max="100" step="1" value="42"></div>
            <div class="scale-ends" aria-hidden="true"><span>12</span><span>100</span></div>
          </div>
          <div class="control">
            <div class="control-head">
              <label for="hole">笔孔位置 <span class="symbol" aria-hidden="true">d/r</span></label>
              <output class="readout" id="hole-value" for="hole">0.72</output>
            </div>
            <div class="rail"><input id="hole" type="range" min="0.10" max="1.00" step="0.01" value="0.72"></div>
            <div class="scale-ends" aria-hidden="true"><span>0.10</span><span>1.00</span></div>
          </div>
          <div class="control">
            <div class="control-head">
              <label for="speed">绘制速度</label>
              <output class="readout" id="speed-value" for="speed">4×</output>
            </div>
            <div class="rail"><input id="speed" type="range" min="1" max="10" step="1" value="4"></div>
            <div class="scale-ends" aria-hidden="true"><span>1×</span><span>10×</span></div>
          </div>
        </div>

        <div class="inks" role="group" aria-labelledby="inks-title">
          <div class="inks-head"><strong id="inks-title">墨色</strong><span class="ink-name" id="ink-name">朱红</span></div>
          <div class="swatches">
            <label class="swatch" style="--sample:var(--red)" title="朱红"><input type="radio" name="ink" aria-label="朱红" value="#e2462b" checked><span class="daub"></span></label>
            <label class="swatch" style="--sample:var(--blue)" title="普鲁士蓝"><input type="radio" name="ink" aria-label="普鲁士蓝" value="#1f3f78"><span class="daub"></span></label>
            <label class="swatch" style="--sample:var(--green)" title="翠绿"><input type="radio" name="ink" aria-label="翠绿" value="#1c7d64"><span class="daub"></span></label>
            <label class="swatch" style="--sample:var(--yellow)" title="藏红花黄"><input type="radio" name="ink" aria-label="藏红花黄" value="#e8a21b"><span class="daub"></span></label>
            <label class="swatch" style="--sample:var(--plum)" title="梅紫"><input type="radio" name="ink" aria-label="梅紫" value="#7a2e6b"><span class="daub"></span></label>
          </div>
        </div>
        <div class="actions">
          <button class="action primary" id="play" type="button"><i class="icon pause" aria-hidden="true"></i><span>暂停</span></button>
          <button class="action" id="new-layer" type="button"><i class="icon stack" aria-hidden="true"></i>新建图层</button>
          <button class="action" id="randomize" type="button"><i class="icon dice" aria-hidden="true"></i>随机一组</button>
          <button class="action" id="new-paper" type="button"><i class="icon sheet" aria-hidden="true"></i>换张新纸</button>
        </div>
        <div class="progress-box">
          <div class="progress-head">
            <span id="progress-title">闭合进度</span>
            <span id="turns">0.00 / 7 圈</span><span id="percent">0%</span>
          </div>
          <progress id="progress" max="100" value="0" aria-labelledby="progress-title"></progress>
        </div>
      </section>
    </div>
  </main>

  <script>
    "use strict";
    (() => {
      const $ = id => document.getElementById(id);
      const TAU = 2 * Math.PI;
      const STEP = 0.015;
      const WORLD = 1000;
      const PITCH = 403;
      const STEPS_PER_SECOND = 54;
      const inkCanvas = $("ink");
      const topCanvas = $("mechanism");
      const inkCtx = inkCanvas.getContext("2d");
      const topCtx = topCanvas.getContext("2d");
      const face = document.createElement("canvas");
      const underprint = document.createElement("canvas");
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
      const inputs = ["outer", "inner", "hole", "speed"].map($);
      const swatches = [...document.querySelectorAll('input[name="ink"]')];
      const layers = [];
      let rig = readGeometry();
      let ink = swatches.find(swatch => swatch.checked).value;
      let wheel;
      let cssSize = 0;
      let pixelSize = 0;
      let pixelRatio = 0;
      let state = "ready";
      let frame = 0;
      let lastTime = null;
      let remainder = 0;

      function gcd(a, b) {
        while (b) [a, b] = [b, a % b];
        return a;
      }

      function geometry(outer, inner, hole) {
        const radius = PITCH * inner / outer;
        const turns = inner / gcd(outer, inner);
        const end = turns * TAU;
        return {
          outer, inner, hole, radius, turns, end,
          orbit: PITCH - radius, arm: radius * hole,
          ratio: (outer - inner) / inner, lastStep: Math.ceil(end / STEP)
        };
      }

      function readGeometry() {
        return geometry($("outer").valueAsNumber, $("inner").valueAsNumber, $("hole").valueAsNumber);
      }

      function layerFor(shape) { return { shape, step: 0, strokes: [] }; }
      function currentLayer() { return layers[layers.length - 1]; }
      function angleAt(shape, step) { return Math.min(shape.end, step * STEP); }

      function penAt(shape, t) {
        const spin = -shape.ratio * t;
        return {
          x: shape.orbit * Math.cos(t) + shape.arm * Math.cos(spin),
          y: shape.orbit * Math.sin(t) + shape.arm * Math.sin(spin)
        };
      }

      function worldTransform(ctx) {
        const scale = pixelSize / WORLD;
        ctx.setTransform(scale, 0, 0, scale, pixelSize / 2, pixelSize / 2);
      }

      function replaceBitmap(ctx, source) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 1;
        ctx.clearRect(0, 0, pixelSize, pixelSize);
        if (source) ctx.drawImage(source, 0, 0);
        ctx.restore();
      }

      function drawStroke(shape, start, end, color) {
        let point = penAt(shape, angleAt(shape, start));
        inkCtx.strokeStyle = color;
        inkCtx.beginPath();
        inkCtx.moveTo(point.x, point.y);
        for (let step = start + 1; step <= end; step++) {
          point = penAt(shape, angleAt(shape, step));
          inkCtx.lineTo(point.x, point.y);
        }
        inkCtx.stroke();
      }

      function advance(layer, target, color) {
        // Short strokes let crossings overprint, even when an entire layer is drawn in one frame.
        while (layer.step < target) {
          const end = Math.min(layer.step + 24, target);
          drawStroke(layer.shape, layer.step, end, color);
          layer.strokes.push({ end, color });
          layer.step = end;
        }
      }

      function replay(layer) {
        let start = 0;
        for (const stroke of layer.strokes) {
          drawStroke(layer.shape, start, stroke.end, stroke.color);
          start = stroke.end;
        }
      }

      function circle(ctx, x, y, radius, stroke, width, fill) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, TAU);
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(); }
      }

      function gearTeeth(count, radius, depth) {
        const path = new Path2D();
        const pitchAngle = TAU / count;
        const flank = [[-.5, -1], [-.32, -1], [-.14, 1], [.14, 1], [.32, -1]];
        for (let tooth = 0; tooth < count; tooth++) {
          for (const [phase, height] of flank) {
            const angle = (tooth + phase) * pitchAngle;
            const edge = radius + height * depth;
            const x = Math.cos(angle) * edge;
            const y = Math.sin(angle) * edge;
            if (tooth === 0 && phase === -.5) path.moveTo(x, y);
            else path.lineTo(x, y);
          }
        }
        path.closePath();
        return path;
      }

      function drawFastener(ctx, x, y, size) {
        circle(ctx, x, y, size, "#92866b", 1, "#e6dcc4");
        ctx.beginPath();
        ctx.moveTo(x - size * .56, y + size * .40);
        ctx.lineTo(x + size * .56, y - size * .40);
        ctx.strokeStyle = "#867b64";
        ctx.lineWidth = 1.25;
        ctx.stroke();
      }

      function engraveFace() {
        const ctx = face.getContext("2d");
        replaceBitmap(ctx);
        worldTransform(ctx);
        const socket = gearTeeth(rig.outer, PITCH + .7, 1.18 * PITCH / rig.outer);
        const rim = new Path2D();
        rim.arc(0, 0, 493, 0, TAU);
        rim.addPath(socket);
        const metal = ctx.createLinearGradient(-380, -420, 350, 460);
        metal.addColorStop(0, "#f8f2e2");
        metal.addColorStop(.44, "#ede4ce");
        metal.addColorStop(.72, "#e9dfc8");
        metal.addColorStop(1, "#e0d3b8");
        ctx.fillStyle = metal;
        ctx.fill(rim, "evenodd");
        ctx.strokeStyle = "#9e9176";
        ctx.lineWidth = 1.65;
        ctx.lineJoin = "round";
        ctx.stroke(socket);
        circle(ctx, 0, 0, 493, "#a79a7d", 1.2);
        circle(ctx, 0, 0, 487, "#fffbed", 2.5);
        circle(ctx, 0, 0, 477, "#a99d83", 1);
        circle(ctx, 0, 0, 428, "#b6a98f", 1.1);
        circle(ctx, 0, 0, 422, "#fff9e9", 1.4);

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = 'bold ' + (cssSize < 400 ? 19 : 16) + 'px "Courier New", monospace';
        for (let degree = 0; degree < 360; degree += 2) {
          const a = degree * Math.PI / 180;
          const major = degree % 30 === 0;
          const middle = degree % 10 === 0;
          const length = major ? 16 : middle ? 11 : 6;
          ctx.save();
          ctx.rotate(a);
          ctx.beginPath();
          ctx.moveTo(0, -476);
          ctx.lineTo(0, -476 + length);
          ctx.strokeStyle = degree === 0 ? "#c94a2c" : middle ? "#81755f" : "#b1a58b";
          ctx.lineWidth = major ? 1.9 : 1.2;
          ctx.stroke();
          if (major) {
            ctx.translate(0, -445);
            if (degree > 90 && degree < 270) ctx.rotate(Math.PI);
            ctx.fillStyle = degree === 0 ? "#bd422c" : "#736a57";
            ctx.fillText(degree + "°", 0, 0);
          }
          ctx.restore();
        }
        ctx.fillStyle = "#cf4b33";
        ctx.beginPath();
        ctx.moveTo(-5.5, -490); ctx.lineTo(5.5, -490); ctx.lineTo(0, -480);
        ctx.closePath(); ctx.fill();
        for (let i = 0; i < 4; i++) {
          const a = (i + .5) * Math.PI / 2;
          drawFastener(ctx, Math.cos(a) * 440, Math.sin(a) * 440, 4.4);
        }

        ctx.save();
        ctx.setLineDash([5, 8]);
        ctx.strokeStyle = "rgba(132,117,88,.23)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-PITCH + 8, 0); ctx.lineTo(PITCH - 8, 0);
        ctx.moveTo(0, -PITCH + 8); ctx.lineTo(0, PITCH - 8);
        ctx.stroke();
        ctx.restore();
        circle(ctx, 0, 0, 5, "#ad9c7b", 1.2);
        ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.moveTo(0, -12); ctx.lineTo(0, 12);
        ctx.strokeStyle = "#a49374"; ctx.lineWidth = 1.2; ctx.stroke();
      }

      function buildWheel() {
        const radius = rig.radius;
        const teeth = gearTeeth(rig.inner, radius, 1.18 * PITCH / rig.outer);
        const openings = new Path2D();
        for (let spoke = 0; spoke < 3; spoke++) {
          const a = spoke * TAU / 3 + .13;
          const b = (spoke + 1) * TAU / 3 - .13;
          openings.moveTo(Math.cos(a) * radius * .72, Math.sin(a) * radius * .72);
          openings.arc(0, 0, radius * .72, a, b);
          openings.arc(0, 0, radius * .25, b - .16, a + .16, true);
          openings.closePath();
        }
        const body = new Path2D(teeth);
        body.addPath(openings);
        return { teeth, openings, body };
      }

      function drawMechanism() {
        replaceBitmap(topCtx, face);
        const t = angleAt(rig, currentLayer()?.step ?? 0);
        const ctx = topCtx;
        ctx.save();
        worldTransform(ctx);
        ctx.translate(rig.orbit * Math.cos(t), rig.orbit * Math.sin(t));
        ctx.rotate(-rig.ratio * t);
        ctx.fillStyle = "rgba(193,165,105,.18)";
        ctx.fill(wheel.body, "evenodd");
        ctx.lineJoin = "round";
        ctx.strokeStyle = "rgba(112,99,71,.68)";
        ctx.lineWidth = 1.8;
        ctx.stroke(wheel.teeth);
        ctx.strokeStyle = "rgba(141,124,89,.64)";
        ctx.lineWidth = 1.25;
        ctx.stroke(wheel.openings);
        circle(ctx, 0, 0, rig.radius - 1.18 * PITCH / rig.outer - 4, "rgba(143,126,90,.57)", 1.3);
        circle(ctx, 0, 0, rig.radius * .80, "rgba(156,136,99,.53)", 1.2);
        const hub = Math.min(12, rig.radius * .16);
        ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(rig.arm, 0);
        ctx.strokeStyle = "rgba(100,90,69,.78)"; ctx.lineWidth = 7; ctx.stroke();
        ctx.strokeStyle = "#d6c8a8"; ctx.lineWidth = 3.3; ctx.stroke();
        circle(ctx, 0, 0, hub, "#84785e", 1.4, "#eee5cf");
        drawFastener(ctx, 0, 0, hub * .56);
        circle(ctx, rig.arm, 0, 9, "#675e4b", 1.5, "#fcf7e9");
        circle(ctx, rig.arm, 0, 5.7, null, 0, ink);
        circle(ctx, rig.arm - 1.4, -1.6, 1.35, null, 0, "#fff7de");
        ctx.restore();
      }

      function resizeSurface() {
        const width = $("disc").getBoundingClientRect().width;
        pixelRatio = window.devicePixelRatio || 1;
        const pixels = Math.max(1, Math.round(width * pixelRatio));
        if (pixels === pixelSize && width === cssSize) return;
        cssSize = width;
        pixelSize = pixels;
        for (const canvas of [inkCanvas, topCanvas, face, underprint]) {
          canvas.width = pixels; canvas.height = pixels;
        }
        worldTransform(inkCtx);
        inkCtx.globalCompositeOperation = "multiply";
        inkCtx.globalAlpha = .84;
        inkCtx.lineWidth = Math.max(2.05, WORLD / width * .9);
        inkCtx.lineCap = "butt";
        inkCtx.lineJoin = "round";
        for (const layer of layers.slice(0, -1)) replay(layer);
        replaceBitmap(underprint.getContext("2d"), inkCanvas);
        if (currentLayer()) replay(currentLayer());
        engraveFace();
        drawMechanism();
      }

      function updateSettings() {
        for (const input of inputs) {
          const n = input.valueAsNumber;
          const value = input.id === "hole" ? n.toFixed(2) : input.id === "speed" ? n + "×" : String(n);
          $(input.id + "-value").textContent = value;
          const fraction = (n - Number(input.min)) / (Number(input.max) - Number(input.min));
          input.parentElement.style.setProperty("--position", (fraction * 100) + "%");
        }
        $("caption-R").textContent = rig.outer;
        $("caption-r").textContent = rig.inner;
        $("caption-d").textContent = (rig.inner * rig.hole).toFixed(2);
      }

      function updateProgress() {
        const t = angleAt(rig, currentLayer()?.step ?? 0);
        const percent = Math.floor(100 * (t / rig.end));
        $("percent").textContent = percent + "%";
        $("progress").value = 100 * (t / rig.end);
        $("turns").textContent = (t / TAU).toFixed(2) + " / " + rig.turns + " 圈";
      }

      function resetClock() {
        cancelAnimationFrame(frame);
        lastTime = null;
        remainder = 0;
        if (state === "running" && !document.hidden) frame = requestAnimationFrame(tick);
      }

      function setState(next) {
        state = next;
        const labels = {
          running: ["绘制中", "暂停"], paused: ["已暂停", "继续"],
          closed: ["已闭合", "重绘本层"], ready: ["新纸就绪", "开始绘制"]
        };
        document.querySelector(".workshop").dataset.state = next;
        $("status").textContent = labels[next][0];
        $("play").lastElementChild.textContent = labels[next][1];
        $("play").firstElementChild.className = next === "running" ? "icon pause" : "icon play";
        $("layer-count").textContent = String(layers.length).padStart(2, "0");
        updateProgress();
        resetClock();
      }

      function tick(now) {
        const elapsed = lastTime === null ? 0 : Math.min((now - lastTime) / 1000, .10);
        lastTime = now;
        const layer = currentLayer();
        remainder += elapsed * STEPS_PER_SECOND * $("speed").valueAsNumber;
        const steps = Math.floor(remainder);
        remainder -= steps;
        const target = reducedMotion.matches ? rig.lastStep : Math.min(layer.step + steps, rig.lastStep);
        if (target > layer.step) {
          advance(layer, target, ink);
          drawMechanism();
          updateProgress();
        }
        if (layer.step === rig.lastStep) setState("closed");
        else frame = requestAnimationFrame(tick);
      }

      function restartLayer(keepPaused = false) {
        const previousOuter = rig.outer;
        rig = readGeometry();
        if (currentLayer()) layers.pop();
        layers.push(layerFor(rig));
        replaceBitmap(inkCtx, underprint);
        if (previousOuter !== rig.outer) engraveFace();
        wheel = buildWheel();
        updateSettings();
        drawMechanism();
        setState(keepPaused ? "paused" : "running");
      }

      function newLayer() {
        replaceBitmap(underprint.getContext("2d"), inkCanvas);
        layers.push(layerFor(rig));
        drawMechanism();
        setState("running");
      }

      function selectInk(swatch) {
        swatch.checked = true;
        ink = swatch.value;
        $("ink-name").textContent = swatch.getAttribute("aria-label");
        $("ink-name").style.setProperty("--current-ink", ink);
        drawMechanism();
      }

      function randomInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

      function randomize() {
        const outer = randomInt(40, 144);
        const candidates = [];
        for (let inner = Math.max(12, Math.ceil(outer * .27)); inner <= Math.min(100, outer * .68); inner++) {
          const petals = outer / gcd(outer, inner);
          if (petals >= 7 && petals <= 56) candidates.push(inner);
        }
        const inner = candidates.length ? candidates[randomInt(0, candidates.length - 1)] : randomInt(12, Math.floor(outer * .64));
        $("outer").value = outer; $("inner").value = inner;
        $("hole").value = randomInt(28, 100) / 100; $("speed").value = randomInt(1, 10);
        const otherInks = swatches.filter(swatch => swatch.value !== ink);
        selectInk(otherInks[randomInt(0, otherInks.length - 1)]);
        restartLayer();
      }

      function newPaper() {
        layers.length = 0;
        replaceBitmap(inkCtx);
        replaceBitmap(underprint.getContext("2d"));
        drawMechanism();
        setState("ready");
      }

      function printMakerMark() {
        const ctx = $("maker-mark").getContext("2d");
        ctx.translate(48, 48);
        ctx.strokeStyle = "#1d2433";
        ctx.lineWidth = 4.2;
        for (let i = 0; i < 6; i++) {
          ctx.rotate(TAU / 6);
          ctx.beginPath(); ctx.ellipse(0, -16, 13, 26, 0, 0, TAU); ctx.stroke();
        }
        circle(ctx, 0, 0, 7, null, 0, "#e2462b");
        $("favicon").href = $("maker-mark").toDataURL();
      }

      function makeGrain() {
        const tile = document.createElement("canvas");
        tile.width = tile.height = 128;
        const ctx = tile.getContext("2d");
        const image = ctx.createImageData(128, 128);
        let seed = 7;
        for (let i = 0; i < image.data.length; i += 4) {
          seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
          image.data[i] = 79; image.data[i + 1] = 61; image.data[i + 2] = 35;
          image.data[i + 3] = (seed >>> 28) * .65;
        }
        ctx.putImageData(image, 0, 0);
        document.documentElement.style.setProperty("--grain", 'url("' + tile.toDataURL() + '")');
      }

      for (const input of inputs) {
        input.addEventListener("input", () => {
          if (input.id === "speed") { updateSettings(); return; }
          // Let either dial use its full travel while keeping the rolling wheel inside the ring.
          if ($("inner").valueAsNumber >= $("outer").valueAsNumber) {
            if (input.id === "inner") $("outer").value = $("inner").valueAsNumber + 1;
            else $("inner").value = $("outer").valueAsNumber - 1;
          }
          restartLayer(state === "paused");
        });
      }
      for (const swatch of swatches) swatch.addEventListener("change", () => selectInk(swatch));
      $("play").addEventListener("click", () => {
        if (state === "ready") newLayer();
        else if (state === "closed") restartLayer();
        else setState(state === "running" ? "paused" : "running");
      });
      $("new-layer").addEventListener("click", newLayer);
      $("randomize").addEventListener("click", randomize);
      $("new-paper").addEventListener("click", newPaper);
      document.addEventListener("visibilitychange", resetClock);
      reducedMotion.addEventListener("change", resetClock);

      makeGrain();
      printMakerMark();
      wheel = buildWheel();
      resizeSurface();
      updateSettings();
      const sample = layerFor(geometry(96, 34, .82));
      layers.push(sample);
      advance(sample, sample.shape.lastStep, "#1f3f78");
      newLayer();
      new ResizeObserver(resizeSurface).observe($("disc"));
      window.addEventListener("resize", resizeSurface);
      // A display change can leave the CSS box unchanged and send no resize event.
      window.setInterval(() => {
        if (!document.hidden && (window.devicePixelRatio || 1) !== pixelRatio) resizeSurface();
      }, 1000);
    })();
  </script>
</body>
</html>
