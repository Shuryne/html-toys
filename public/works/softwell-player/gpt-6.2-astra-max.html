<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { if (window !== parent) parent.Home?.prepareWork(window); } catch {}</script>
  <meta name="theme-color" content="#e4e9e5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23232926'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ef7b5c'/%3E%3Ccircle cx='16' cy='16' r='1.4' fill='%23232926'/%3E%3C/svg%3E">
  <title>索芙维尔播放器 · Softwell Player</title>
  <style>
    @property --accent {
      syntax: "<color>";
      inherits: true;
      initial-value: #ef7b5c;
    }

    :root {
      color-scheme: light;
      --surface: #e4e9e5;
      --light: #ffffff;
      --shadow: #b5bfb8;
      --ink: #46524b;
      --muted: #8a978f;
      --accent: #ef7b5c;
      --raised: -3px -3px 6px rgb(255 255 255 / 91%), 3px 4px 7px rgb(181 191 184 / 88%),
        inset 1px 1px 1px rgb(255 255 255 / 72%);
      --inset: inset 2px 3px 5px rgb(181 191 184 / 82%), inset -2px -2px 4px rgb(255 255 255 / 92%);
      font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic", system-ui, "Helvetica Neue", Arial, sans-serif;
      font-variant-numeric: tabular-nums;
      transition: --accent 480ms ease-in-out;
      background: var(--surface);
      color: var(--ink);
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; align-items: center; }
    button, input { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
    button { border: 0; cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }
    button { -webkit-user-select: none; user-select: none; }
    button, h1, h2, p, ol { margin: 0; }
    [hidden] { display: none !important; }
    .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { display: block; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .micro { text-transform: uppercase; letter-spacing: .14em; font-weight: 700; }
    .workbench { width: min(764px, calc(100% - 16px)); margin: 0 auto; padding: clamp(23px, 4vh, 44px) 0; }
    .masthead, .brand, .silent-mode, .card-top, .queue-head, .transport, .motion, .scope-head, .times {
      display: flex; align-items: center;
    }
    .masthead { justify-content: space-between; margin: 0 5px 25px; }
    .brand { gap: 11px; }
    .brand-mark { width: 41px; height: 41px; color: var(--ink); }
    h1 { font-size: 26px; font-weight: 730; letter-spacing: -.038em; line-height: 1.08; }
    .brand-name { margin-top: 4px; font-size: 10px; letter-spacing: .18em; color: var(--muted); font-weight: 650; }
    .silent-mode { gap: 7px; font-size: 11px; letter-spacing: .07em; font-weight: 600; }
    .silent-mode .icon { width: 16px; height: 16px; }
    .console { display: grid; grid-template-columns: 400px 340px; gap: 24px; align-items: start; }
    .card {
      min-width: 0;
      border-radius: 38px;
      background: var(--surface);
      box-shadow: -8px -8px 20px rgb(255 255 255 / 86%), 9px 12px 24px rgb(181 191 184 / 87%),
        inset 1px 1px 2px rgb(255 255 255 / 88%), inset -1px -1px 1.5px rgb(181 191 184 / 60%);
    }
    .player { padding: 23px 26px 18px; }
    .card-top, .queue-head, .scope-head, .times { justify-content: space-between; }
    .card-top { text-align: center; }
    .now-title { font-weight: 700; font-size: 12px; letter-spacing: .075em; }
    .side-position { margin-top: 3px; color: var(--muted); font-size: 10.5px; font-weight: 550; letter-spacing: .07em; }
    .round {
      display: grid; place-items: center; flex: none; position: relative;
      padding: 0; width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface); box-shadow: var(--raised);
      transition: box-shadow 140ms ease, color 180ms ease, transform 140ms ease;
    }
    .round::before { content: ""; position: absolute; inset: -4px; border-radius: inherit; }
    .round .icon { width: 17px; height: 17px; }
    .round:is(:active, [aria-pressed="true"]) { box-shadow: var(--inset); }
    .round:active { transform: translateY(1px); }
    .round[aria-pressed="true"] { color: var(--accent); }
    #like[aria-pressed="true"] .icon { fill: var(--accent); }
    @media (hover: hover) {
      .round:hover { color: color-mix(in srgb, var(--accent) 72%, var(--ink)); }
      .track:hover { background-color: rgb(255 255 255 / 23%); }
    }

    /* The casting, pressing and fixed reflection are separate physical layers. */
    .turntable { position: relative; width: min(100%, 334px); aspect-ratio: 334 / 238; margin: 12px auto 7px; }
    .platter {
      position: absolute; width: 70%; aspect-ratio: 1; left: 46%; top: 50%;
      transform: translate(-50%, -50%); border-radius: 50%;
      background: linear-gradient(135deg, var(--light), var(--surface) 34%, var(--shadow) 78%, var(--surface));
      box-shadow: -4px -4px 9px rgb(255 255 255 / 96%), 4px 6px 10px var(--shadow),
        inset 1px 1px 1px var(--light), inset -1px -1px 1px var(--shadow);
    }
    .platter::before {
      content: ""; position: absolute; inset: 1.7%; border-radius: 50%;
      background: var(--surface); box-shadow: inset 1px 2px 3px var(--shadow), inset -1px -1px 2px var(--light);
    }
    .record {
      position: absolute; inset: 3.3%; isolation: isolate; overflow: hidden; border-radius: 50%;
      background: #1c211f; border: 1px solid #232926;
    }
    .pressing {
      position: absolute; inset: 0; border-radius: inherit;
      background:
        repeating-radial-gradient(circle closest-side at 50.12% 49.94%, transparent 0 .4px, rgb(255 255 255 / 12%) 1.05px, transparent 1.85px 2.45px),
        radial-gradient(circle closest-side, #242a27 0 38%, #171c19 38.8% 41%, #2b312e 41.3% 53%, #151a17 53.8% 54.7%, #292e2b 55.1% 66%, #171b19 66.5% 67.6%, #292e2b 68% 80%, #1b201d 80.4% 81.8%, #282d2a 82.2% 94%, #1b211e 95% 97%, #303532 98.5%, #1b201e);
      animation: spin 7s linear infinite; animation-play-state: paused;
    }
    [data-playing="true"] .pressing { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(1turn); } }
    .record::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: conic-gradient(from -99deg, transparent 0deg 22deg, rgb(255 255 255 / 4%) 36deg, rgb(255 255 255 / 28%) 57deg,
        rgb(255 255 255 / 7%) 78deg, transparent 100deg 177deg, rgb(255 255 255 / 5%) 202deg, rgb(255 255 255 / 20%) 231deg,
        rgb(255 255 255 / 3%) 258deg, transparent 279deg 360deg);
      mask-image: radial-gradient(circle closest-side, transparent 0 34%, #000 37%);
    }
    .record-label {
      position: absolute; width: 35%; aspect-ratio: 1; top: 50%; left: 50%; transform: translate(-50%, -50%);
      border-radius: 50%; overflow: hidden; color: var(--ink);
      background: radial-gradient(circle at 32% 18%, rgb(255 255 255 / 32%), transparent 64%), var(--accent);
      box-shadow: inset 1px 1px 1px rgb(255 255 255 / 52%), inset -1px -1px 2px rgb(181 191 184 / 75%);
    }
    .label-print { width: 100%; height: 100%; display: block; fill: currentColor; }
    .spindle {
      position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; transform: translate(-50%, -50%);
      border-radius: 50%; background: #28302b; outline: 1.5px solid rgb(255 255 255 / 44%);
    }
    .pivot-seat, .pivot-cap {
      position: absolute; left: 89.5%; top: 13%; transform: translate(-50%, -50%); aspect-ratio: 1; border-radius: 50%;
    }
    .pivot-seat { width: 11.4%; background: var(--surface); box-shadow: var(--raised); }
    .pivot-seat::after { content: ""; position: absolute; inset: 10%; border-radius: 50%; box-shadow: var(--inset); }
    .pivot-cap {
      width: 6.5%; background: linear-gradient(130deg, var(--light), var(--surface) 46%, var(--shadow));
      box-shadow: 1px 2px 3px var(--shadow), inset 1px 1px 1px var(--light);
      display: grid; place-items: center;
    }
    .pivot-cap::after {
      content: ""; width: 38%; height: 2px; border-radius: 3px; transform: rotate(-39deg);
      background: var(--shadow); box-shadow: 0 1px 0 var(--light);
    }
    .arm {
      --angle: -3deg;
      position: absolute; left: 89.5%; top: 13%; width: 2%; height: 54%; margin-left: -1%;
      transform-origin: 50% 0; transform: rotate(var(--angle)); transition: transform 620ms cubic-bezier(.2,.72,.28,1);
      pointer-events: none;
    }
    .shaft, .elbow {
      position: absolute; width: 100%; border-radius: 6px;
      background: linear-gradient(90deg, var(--shadow), var(--light) 32%, var(--surface) 52%, var(--shadow) 90%);
      box-shadow: 2px 2px 3px rgb(181 191 184 / 86%);
    }
    .shaft { top: 0; height: 72%; }
    .elbow { top: 69.5%; height: 34%; transform-origin: 50% 3%; transform: rotate(31deg); }
    .cartridge {
      position: absolute; width: 192%; height: 46%; top: 78%; left: 50%; transform: translateX(-50%);
      border-radius: 3px 3px 5px 5px; border-top: 2px solid var(--muted);
      background: linear-gradient(90deg, var(--ink), #616e65 44%, var(--ink));
    }
    .cartridge::after { content: ""; position: absolute; bottom: 14%; left: 21%; width: 58%; height: 2px; border-radius: 2px; background: var(--accent); }

    .metadata { text-align: center; }
    .metadata h2 { font-size: 27px; line-height: 1.3; letter-spacing: .035em; font-weight: 750; }
    .artist { font-size: 12px; font-weight: 550; color: var(--muted); margin-top: 2px; letter-spacing: .07em; }
    .scope {
      height: 77px; margin-top: 15px; padding: 9px 14px 7px; border-radius: 16px;
      background: var(--surface); box-shadow: var(--inset);
      display: flex; flex-direction: column; gap: 2px; overflow: hidden;
    }
    .scope-head { font-size: 8.5px; line-height: 12px; color: var(--muted); }
    .scope-name { display: flex; align-items: center; gap: 5px; }
    .scope-name::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .scope-head .bpm { letter-spacing: .07em; }
    .plot { position: relative; flex: 1; min-height: 0; }
    .plot canvas, .jacket canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .hint { text-align: center; font-size: 11px; color: var(--ink); line-height: 15px; }

    .timeline { margin-top: 9px; }
    .range {
      --fill: 0%;
      --rail: 6px;
      --knob: 16px;
      --thumb-face: radial-gradient(circle, var(--accent) 0 22%, transparent 26%), var(--surface);
      --rail-face: linear-gradient(90deg, color-mix(in srgb, var(--accent) 62%, var(--surface)), var(--accent)) left center / var(--fill) 100% no-repeat, var(--surface);
      display: block; width: 100%; min-width: 0; height: 23px; margin: 0; padding: 0;
      appearance: none; -webkit-appearance: none; cursor: pointer; background: transparent; border-radius: 8px;
    }
    .range::-webkit-slider-runnable-track {
      height: var(--rail); border-radius: 10px; background: var(--rail-face);
      box-shadow: inset 1px 2px 3px var(--shadow), inset -1px -1px 2px var(--light);
    }
    .range::-moz-range-track {
      height: var(--rail); border-radius: 10px; background: var(--rail-face);
      box-shadow: inset 1px 2px 3px var(--shadow), inset -1px -1px 2px var(--light);
    }
    .range::-webkit-slider-thumb {
      appearance: none; -webkit-appearance: none; width: var(--knob); height: var(--knob); margin-top: calc((var(--rail) - var(--knob)) / 2);
      border-radius: 50%; border: 0; background: var(--thumb-face);
      box-shadow: -1.5px -1.5px 3px var(--light), 2px 2px 4px var(--shadow), inset 1px 1px 1px var(--light);
    }
    .range::-moz-range-thumb {
      width: var(--knob); height: var(--knob); border-radius: 50%; border: 0; background: var(--thumb-face);
      box-shadow: -1.5px -1.5px 3px var(--light), 2px 2px 4px var(--shadow), inset 1px 1px 1px var(--light);
    }
    .times { color: var(--muted); font-size: 10px; font-weight: 650; line-height: 12px; letter-spacing: .07em; }
    .times span:first-child { color: var(--ink); }
    .transport { justify-content: space-between; margin: 9px 9px 0; }
    .transport .skip { width: 43px; height: 43px; }
    .transport .skip .icon { width: 19px; height: 19px; }
    .transport .play {
      width: 62px; height: 62px; color: var(--accent);
      box-shadow: -4px -4px 9px var(--light), 4px 5px 9px var(--shadow), inset 1px 1px 1px var(--light);
    }
    .transport .play:is(:active, [aria-pressed="true"]) { box-shadow: inset 3px 4px 7px var(--shadow), inset -3px -3px 5px var(--light); }
    .transport .play .icon { width: 25px; height: 25px; }
    #play-glyph { transform: translateX(1.5px); }
    .motion {
      margin-top: 16px; padding-top: 11px; gap: 15px; font-size: 11px;
      border-top: 1px solid rgb(181 191 184 / 53%); box-shadow: inset 0 1px rgb(255 255 255 / 60%);
    }
    .motion label { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 600; }
    .motion .icon { width: 15px; height: 15px; }
    .motion .range { --knob: 13px; --rail: 5px; flex: 1; }
    .motion output { min-width: 33px; text-align: right; color: var(--muted); font-size: 10.5px; font-weight: 650; }

    .queue { padding: 26px 21px 20px; }
    .queue-head { padding: 0 5px; }
    .queue-head h2 { font-size: 23px; font-weight: 750; letter-spacing: .025em; line-height: 1.35; }
    .queue-summary { margin-top: 4px; font-size: 11px; letter-spacing: .045em; color: var(--muted); font-weight: 550; }
    .grille {
      width: 37px; height: 22px;
      background: radial-gradient(circle at 2.5px 2.5px, var(--muted) 0 .85px, var(--shadow) 1.15px, transparent 1.65px) 0 0 / 6px 6px,
        radial-gradient(circle at 3.1px 3.3px, var(--light) 0 1.4px, transparent 1.9px) 0 0 / 6px 6px;
    }
    .jacket-frame { margin: 17px 2px 14px; padding: 4px; border-radius: 13px; box-shadow: var(--inset); }
    .jacket {
      position: relative; isolation: isolate; overflow: hidden; aspect-ratio: 294 / 116; border-radius: 9px;
      background: var(--surface); box-shadow: 1px 1px 2px var(--shadow);
    }
    .jacket::after { content: ""; position: absolute; inset: 0; border: 1px solid rgb(70 82 75 / 12%); border-radius: inherit; pointer-events: none; }
    .jacket-type { position: absolute; inset: 13px 14px 11px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; }
    .imprint { font-size: 8px; line-height: 1; font-weight: 800; letter-spacing: .12em; }
    .jacket-side { display: flex; align-items: flex-end; gap: 4px; }
    .jacket-side span { writing-mode: vertical-rl; transform: rotate(180deg); margin-bottom: 3px; font-size: 8px; line-height: 1; letter-spacing: .15em; font-weight: 750; }
    .jacket-side b { font-size: 45px; line-height: .85; font-weight: 800; letter-spacing: -.07em; }
    .tracks { padding: 0; list-style: none; display: grid; gap: 4px; }
    .track {
      display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 12px;
      width: 100%; min-height: 57px; padding: 8px 13px; border-radius: 14px;
      background: transparent; text-align: left; transition: box-shadow 160ms ease, background-color 160ms ease;
    }
    .track:is(:active, [aria-current="true"]) { background: var(--surface); box-shadow: var(--inset); }
    .track-order { display: grid; place-items: center; font-size: 11px; color: var(--muted); font-weight: 650; letter-spacing: .06em; }
    .mini-meter { display: none; height: 16px; align-items: center; justify-content: center; gap: 2px; }
    .track[aria-current="true"] .track-number { display: none; }
    .track[aria-current="true"] .mini-meter { display: flex; }
    .mini-meter i { width: 3px; height: 7px; border-radius: 2px; background: var(--accent); }
    .mini-meter i:nth-child(2) { height: 14px; }
    .mini-meter i:nth-child(3) { height: 10px; }
    [data-playing="true"] .mini-meter i { animation: meter .66s ease-in-out infinite alternate; }
    [data-playing="true"] .mini-meter i:nth-child(2) { animation-delay: -.42s; animation-duration: .54s; }
    [data-playing="true"] .mini-meter i:nth-child(3) { animation-delay: -.19s; animation-duration: .76s; }
    @keyframes meter { from { transform: scaleY(.38); } to { transform: scaleY(1.12); } }
    .track-name, .track-artist { display: block; }
    .track-name { font-size: 15px; line-height: 1.45; font-weight: 680; letter-spacing: .035em; }
    .track-artist { margin-top: 2px; font-size: 12px; line-height: 1.4; font-weight: 500; color: var(--muted); }
    .track-end { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .035em; }
    .track-end::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--swatch); }
    .queue-note {
      display: flex; align-items: center; gap: 8px; margin: 14px 5px 0; padding-top: 16px;
      border-top: 1px solid rgb(181 191 184 / 55%); box-shadow: inset 0 1px rgb(255 255 255 / 60%);
      font-size: 11px; line-height: 1.65; color: var(--muted);
    }
    .queue-note .icon { width: 16px; height: 16px; flex: none; }
    @media (max-width: 779.98px) {
      .workbench { width: min(400px, calc(100% - 32px)); padding: 27px 0 32px; }
      .masthead { margin: 0 4px 23px; }
      .console { grid-template-columns: minmax(0, 1fr); gap: 26px; }
      .queue { padding-inline: 24px; }
      .jacket { max-height: 135px; }
    }
    @media (max-width: 374px) {
      .workbench { width: calc(100% - 24px); }
      .player, .queue { padding-inline: 18px; }
      .transport { margin-inline: 2px; }
      .motion { gap: 9px; }
      .brand { gap: 7px; }
      h1 { font-size: 23px; }
      .brand-mark { width: 34px; height: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <clipPath id="mark-cut"><circle cx="20" cy="20" r="18"/></clipPath>
      <symbol id="mark" viewBox="0 0 40 40">
        <g clip-path="url(#mark-cut)" fill="none" stroke="currentColor" stroke-width="3.4">
          <path id="mark-wave" d="M-8 5C3-4 10 14 22 6S39 0 48 9"/>
          <use href="#mark-wave" y="5.6"/><use href="#mark-wave" y="11.2"/><use href="#mark-wave" y="16.8"/>
          <use href="#mark-wave" y="22.4"/><use href="#mark-wave" y="28"/><use href="#mark-wave" y="33.6"/>
        </g>
      </symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11.6 5.2 6.8 9H3v6h3.8l4.8 3.8zM16.5 9.4l4.7 5.2m0-5.2-4.7 5.2"/></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1-.3 5M4 4v5h5"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.5 5.9a4.9 4.9 0 0 0-7 0L12 7.5l-1.5-1.6a4.9 4.9 0 1 0-7 7L12 21l8.5-8.1a4.9 4.9 0 0 0 0-7z"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h2.1c4.8 0 6.1 12 11.3 12H21m-3-3 3 3-3 3M3 18h2.1c2.1 0 3.8-2.4 5.2-5.2M13.4 8.2C14.3 6.9 15.3 6 16.5 6H21m-3-3 3 3-3 3"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M5 5.5h2.5v13H5zM18.2 5.9c.8-.6 1.8 0 1.8.9v10.4c0 .9-1 1.5-1.8.9l-7.6-5.2a1.1 1.1 0 0 1 0-1.8z"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><use href="#i-prev" transform="rotate(180 12 12)"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M6.5 4.3c0-1.2 1.3-2 2.4-1.3l11 7.7a1.6 1.6 0 0 1 0 2.6L8.9 21c-1.1.7-2.4-.1-2.4-1.3z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><rect x="5.5" y="4" width="4.5" height="16" rx="1.4"/><rect x="14" y="4" width="4.5" height="16" rx="1.4"/></g></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m16.5 2.8 3.1 3.1L16.5 9M4.4 10.4V9a3.1 3.1 0 0 1 3.1-3.1h11.8m-11.8 9-3.1 3.2 3.1 3.1m12.1-7.7V15a3.1 3.1 0 0 1-3.1 3.1H4.7"/><path d="m10.5 11 1.7-1V15" stroke-width="1.55"/></symbol>
      <symbol id="i-motion" viewBox="0 0 24 24"><path d="M2 12h3l2.5-5.5 4.2 11 4-13 2.7 7.5H22"/></symbol>
      <symbol id="i-record" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M6 12a6 6 0 0 1 6-6"/></symbol>
    </defs>
  </svg>
  <main class="workbench" data-playing="false" aria-labelledby="app-title">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" aria-hidden="true"><use href="#mark"/></svg>
        <div>
          <h1 id="app-title" lang="en">Softwell Player</h1>
          <p class="brand-name">索芙维尔播放器</p>
        </div>
      </div>
      <span class="silent-mode"><svg class="icon" aria-hidden="true"><use href="#i-mute"/></svg>无声播放</span>
    </header>

    <div class="console">
      <section class="card player" aria-label="唱片播放器">
        <header class="card-top">

          <button class="round" id="like" type="button" aria-label="喜欢" title="喜欢" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-heart"/></svg></button>
        </header>
        <div class="turntable" aria-hidden="true">
          <div class="platter">
            <div class="record">
              <div class="pressing">
                <div class="record-label">
                  <svg class="label-print" viewBox="0 0 100 100">
                    <defs><path id="label-arc" d="M13 51a37 37 0 0 1 74 0"/></defs>
                    <circle cx="50" cy="50" r="46.3" fill="none" stroke="currentColor" stroke-width=".75" opacity=".48"/>
                    <text font-size="8.8" font-weight="750" letter-spacing="1.05"><textPath href="#label-arc" startOffset="50%" text-anchor="middle" textLength="104" lengthAdjust="spacing">SOFTWELL RECORDS</textPath></text>
                    <path d="M13 51h18m38 0h18" fill="none" stroke="currentColor" opacity=".64" stroke-width="1.2"/>
                    <text x="50" y="78" text-anchor="middle" font-size="19" font-weight="780" letter-spacing="-.7" id="label-number">01</text>
                  </svg>
                </div>

            </div>
          </div>

          <div class="pivot-cap"></div>
        </div>
        <div class="metadata" aria-live="polite" aria-atomic="true"><h2 id="track-title">潮汐时分</h2><p class="artist" id="track-artist">微光港</p></div>

        <div class="scope" role="group" aria-label="合成频谱">
          <div class="scope-head micro"><span class="scope-name" lang="en">Spectrum</span><span class="bpm" id="tempo" lang="en">86 BPM</span></div>
          <div class="plot"><canvas id="spectrum" role="img" aria-label="随当前曲目节奏变化的三十段镜像频谱"></canvas></div>
          <p class="hint" id="hint">按下播放。没有声音，画面会随节奏动起来。</p>
        </div>

          <input type="range" class="range" id="seek" min="0" max="222" step="1" value="0" aria-label="播放进度">
          <div class="times" aria-hidden="true"><span id="elapsed">0:00</span><span id="duration">3:42</span></div>
        </div>

          <button class="round" id="shuffle" type="button" aria-label="随机播放" title="随机播放" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-shuffle"/></svg></button>
          <button class="round skip" id="previous" type="button" aria-label="上一首" title="上一首"><svg class="icon" aria-hidden="true"><use href="#i-prev"/></svg></button>

            <svg class="icon" id="play-glyph" aria-hidden="true"><use href="#i-play"/></svg>
            <svg class="icon" id="pause-glyph" aria-hidden="true" hidden><use href="#i-pause"/></svg>
          </button>
          <button class="round skip" id="next" type="button" aria-label="下一首" title="下一首"><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
          <button class="round" id="repeat" type="button" aria-label="单曲循环" title="单曲循环" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="motion">
          <label for="intensity"><svg class="icon" aria-hidden="true"><use href="#i-motion"/></svg>动效强度</label>
          <input type="range" class="range" id="intensity" min="0" max="100" value="70">
          <output id="intensity-value" for="intensity">70%</output>

      <section class="card queue" aria-labelledby="queue-title">
        <header class="queue-head">
          <div><h2 id="queue-title">播放队列</h2><p class="queue-summary" id="queue-summary"></p></div>
          <span class="grille" aria-hidden="true"></span>
        </header>
        <div class="jacket-frame" aria-hidden="true">
          <div class="jacket">
            <canvas id="sleeve"></canvas>
            <div class="jacket-type" lang="en"><span class="imprint">SOFTWELL RECORDS</span><div class="jacket-side"><span>SIDE</span><b>A</b></div></div>
          </div>
        </div>
        <ol class="tracks" id="tracks"></ol>
        <p class="queue-note"><svg class="icon" aria-hidden="true"><use href="#i-record"/></svg>索芙维尔厂牌与这五首曲目均为虚构。</p>
      </section>
    </div>
  </main>
  <template id="track-row">
    <li>
      <button type="button" class="track">
        <span class="track-order" aria-hidden="true"><span class="track-number"></span><span class="mini-meter"><i></i><i></i><i></i></span></span>
        <span><span class="track-name"></span><span class="track-artist"></span></span>
        <span class="track-end"></span>
      </button>
    </li>
  </template>
  <script>
    (() => {
      "use strict";

      const tracks = [
        { title: "潮汐时分", artist: "微光港", duration: 222, bpm: 86, color: "#ef7b5c", seed: 1.4, bass: 1.05, treble: .68, kick: [0, 2, 3.5], snare: [1, 3], hatStep: .5 },
        { title: "纸灯悠悠", artist: "奥达·芬威克", duration: 178, bpm: 104, color: "#3fa5a0", seed: 3.7, bass: .80, treble: 1.12, kick: [0, 1.75, 2.5], snare: [1, 2.75], hatStep: .25 },
        { title: "温室天气", artist: "静谧果园", duration: 256, bpm: 72, color: "#d99a2b", seed: 5.1, bass: 1.18, treble: .48, kick: [0, 2.5], snare: [1.5, 3.5], hatStep: 1 },
        { title: "北行杂讯", artist: "米蕾拉·万斯", duration: 215, bpm: 122, color: "#9a6fc4", seed: 7.3, bass: .88, treble: 1.30, kick: [0, 1, 2, 3], snare: [1, 2.75, 3], hatStep: .25 },
        { title: "凌晨绽放", artist: "霍利斯与雷恩", duration: 248, bpm: 94, color: "#5b8fd9", seed: 9.6, bass: .98, treble: .90, kick: [0, 1.5, 2.75], snare: [1, 3.25], hatStep: .5 }
      ];
      const byId = id => document.getElementById(id);
      const root = document.documentElement;
      const desk = document.querySelector(".workbench");
      const metadata = document.querySelector(".metadata");
      const arm = document.querySelector(".arm");
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");
      const play = byId("play");
      const like = byId("like");
      const seek = byId("seek");
      const intensity = byId("intensity");
      const spectrum = byId("spectrum");
      const scopeContext = spectrum.getContext("2d");
      const sleeve = byId("sleeve");
      const print = sleeve.getContext("2d");
      const trackButtons = [];
      const levels = new Float32Array(30);
      const totalDuration = tracks.reduce((sum, track) => sum + track.duration, 0);
      const pad = value => String(value).padStart(2, "0");
      const timeText = seconds => Math.floor(seconds / 60) + ":" + pad(Math.floor(seconds % 60));
      const spokenTime = seconds => Math.floor(seconds / 60) + " 分 " + Math.floor(seconds % 60) + " 秒";

      let current = 0;
      let position = 0;
      let clockAt = performance.now();
      let playing = false;
      let started = false;
      let scrubbing = false;
      let shuffle = false;
      let repeatOne = false;
      let strength = intensity.valueAsNumber / 100;
      let upcoming = [];
      let history = [];
      let metadataVersion = 0;
      let frameId = 0;
      let needsPaint = true;
      let paletteUntil = 0;
      let lastPlotAt = -Infinity;
      let lastProgressAt = -Infinity;
      let shownSecond = -1;
      let sleeveColor = "";
      const desiredRatio = () => window.ToyEmbed?.pixelRatio ?? (devicePixelRatio || 1);
      let pixelRatio = desiredRatio();
      const likes = new Set();
      try {
        const saved = JSON.parse(localStorage.getItem("softwell.likes.v1") || "[]");
        if (Array.isArray(saved)) saved.forEach(title => likes.add(title));
      } catch { /* Likes still work for this visit when storage is unavailable. */ }

      function requestFrame() {
        if (!frameId && !document.hidden) frameId = requestAnimationFrame(frame);
      }

      function invalidate() {
        needsPaint = true;
        requestFrame();
      }

      function buildQueue() {
        const template = byId("track-row");
        const list = byId("tracks");
        tracks.forEach((track, index) => {
          const row = template.content.firstElementChild.cloneNode(true);
          const button = row.querySelector("button");
          button.querySelector(".track-number").textContent = pad(index + 1);
          button.querySelector(".track-name").textContent = track.title;
          button.querySelector(".track-artist").textContent = track.artist;
          button.querySelector(".track-end").textContent = timeText(track.duration);
          button.style.setProperty("--swatch", track.color);
          button.setAttribute("aria-label", "选择第 " + (index + 1) + " 首，" + track.title + "，" + track.artist + "，" + spokenTime(track.duration));
          button.addEventListener("click", () => {
            advanceClock(performance.now());
            if (index === current) return;
            upcoming = [];
            history = [];
            selectTrack(index);
          });
          trackButtons.push(button);
          list.append(row);
        });
        byId("queue-summary").textContent = tracks.length + " 首曲目 · 共 " + spokenTime(totalDuration);
      }

      function nextIndex() {
        if (!shuffle) return (current + 1) % tracks.length;
        if (!upcoming.length) {
          upcoming = tracks.map((_, index) => index).filter(index => index !== current);
          for (let i = upcoming.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [upcoming[i], upcoming[j]] = [upcoming[j], upcoming[i]];
          }
        }
        history.push(current);
        if (history.length > 100) history.shift();
        return upcoming.pop();
      }

      function previousIndex() {
        const previous = (current + tracks.length - 1) % tracks.length;
        if (!shuffle) return previous;
        upcoming.push(current);
        return history.pop() ?? previous;
      }

      // Transport follows the monotonic clock, including time spent in a background tab.
      function advanceClock(now) {
        const delta = Math.max(0, now - clockAt) / 1000;
        clockAt = Math.max(now, clockAt);
        if (!playing || scrubbing) return;
        position += delta;
        if (position < tracks[current].duration) return;
        if (repeatOne) {
          position %= tracks[current].duration;
        } else {
          const before = current;
          if (!shuffle && position >= totalDuration) position %= totalDuration;
          while (position >= tracks[current].duration) {
            position -= tracks[current].duration;
            current = nextIndex();
          }
          if (current !== before) reflectTrack(true);
        }
        updateProgress();
      }

      function updateProgress() {
        const duration = tracks[current].duration;
        const second = Math.floor(position);
        const fraction = Math.min(1, position / duration);
        seek.style.setProperty("--fill", (fraction * 100).toFixed(3) + "%");
        if (second !== shownSecond) {
          shownSecond = second;
          if (!scrubbing) seek.value = String(second);
          byId("elapsed").textContent = timeText(second);
          seek.setAttribute("aria-valuetext", spokenTime(second) + "，共 " + spokenTime(duration));
        }
        const angle = playing || position > 0 ? 13 + 20 * fraction : -3;
        arm.style.setProperty("--angle", angle.toFixed(2) + "deg");
      }

      function updateMetadata(animate) {
        const version = ++metadataVersion;
        const track = tracks[current];
        const write = () => {
          byId("track-title").textContent = track.title;
          byId("track-artist").textContent = track.artist;
        };
        metadata.getAnimations().forEach(animation => animation.cancel());
        if (!animate || reduced.matches) {
          write();
          return;
        }
        const fade = metadata.animate(
          [{ opacity: 1, transform: "translateY(0)" }, { opacity: 0, transform: "translateY(-3px)" }],
          { duration: 95, easing: "ease-in", fill: "forwards" }
        );
        fade.onfinish = () => {
          if (version !== metadataVersion) return;
          write();
          fade.cancel();
          metadata.animate(
            [{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "translateY(0)" }],
            { duration: 190, easing: "ease-out" }
          );
        };
      }

      function reflectTrack(animate) {
        const track = tracks[current];
        root.style.setProperty("--accent", track.color);
        paletteUntil = performance.now() + (reduced.matches ? 0 : 540);
        sleeveColor = "";
        byId("side-position").textContent = "A 面 · 第 " + (current + 1) + " / " + tracks.length + " 首";
        byId("label-number").textContent = pad(current + 1);
        byId("tempo").textContent = track.bpm + " BPM";
        byId("duration").textContent = timeText(track.duration);
        seek.max = String(track.duration);
        shownSecond = -1;
        trackButtons.forEach((button, index) => button.setAttribute("aria-current", String(index === current)));
        like.setAttribute("aria-pressed", String(likes.has(track.title)));
        updateMetadata(animate);
        updateProgress();
        invalidate();
      }

      function selectTrack(index) {
        const changed = index !== current;
        current = index;
        position = 0;
        clockAt = performance.now();
        reflectTrack(changed);
      }

      function setPlaying(value) {
        const now = performance.now();
        advanceClock(now);
        if (value && position >= tracks[current].duration) position = 0;
        playing = value;
        clockAt = now;
        if (playing && !started) {
          started = true;
          byId("hint").hidden = true;
        }
        desk.dataset.playing = String(playing);
        play.setAttribute("aria-pressed", String(playing));
        play.setAttribute("aria-label", playing ? "暂停" : "播放");
        play.title = playing ? "暂停" : "播放";
        byId("play-glyph").toggleAttribute("hidden", playing);
        byId("pause-glyph").toggleAttribute("hidden", !playing);
        updateProgress();
        invalidate();
      }

      play.addEventListener("click", () => setPlaying(!playing));
      byId("restart").addEventListener("click", () => {
        position = 0;
        clockAt = performance.now();
        setPlaying(true);
      });
      byId("previous").addEventListener("click", () => {
        advanceClock(performance.now());
        selectTrack(previousIndex());
      });
      byId("next").addEventListener("click", () => {
        advanceClock(performance.now());
        selectTrack(nextIndex());
      });
      byId("shuffle").addEventListener("click", event => {
        advanceClock(performance.now());
        shuffle = !shuffle;
        upcoming = [];
        history = [];
        event.currentTarget.setAttribute("aria-pressed", String(shuffle));
      });
      byId("repeat").addEventListener("click", event => {
        advanceClock(performance.now());
        repeatOne = !repeatOne;
        event.currentTarget.setAttribute("aria-pressed", String(repeatOne));
      });
      like.addEventListener("click", () => {
        const title = tracks[current].title;
        if (likes.has(title)) likes.delete(title);
        else likes.add(title);
        like.setAttribute("aria-pressed", String(likes.has(title)));
        try { localStorage.setItem("softwell.likes.v1", JSON.stringify([...likes])); } catch { /* Optional storage. */ }
        if (!reduced.matches) {
          const heart = like.querySelector("svg");
          heart.getAnimations().forEach(animation => animation.cancel());
          heart.animate(
            [{ transform: "scale(1)" }, { transform: "scale(.8)", offset: .18 }, { transform: "scale(1.25)", offset: .49 },
              { transform: "scale(.95)", offset: .75 }, { transform: "scale(1)" }],
            { duration: 410, easing: "ease-out" }
          );
        }
      });

      seek.addEventListener("pointerdown", () => {
        advanceClock(performance.now());
        scrubbing = true;
      });
      function finishScrub() {
        if (!scrubbing) return;
        scrubbing = false;
        clockAt = performance.now();
        advanceClock(clockAt);
        updateProgress();
        invalidate();
      }
      window.addEventListener("pointerup", finishScrub);
      window.addEventListener("pointercancel", finishScrub);
      window.addEventListener("blur", finishScrub);
      seek.addEventListener("input", () => {
        position = seek.valueAsNumber;
        clockAt = performance.now();
        advanceClock(clockAt);
        updateProgress();
        invalidate();
      });
      function updateIntensity() {
        strength = intensity.valueAsNumber / 100;
        const percent = intensity.value + "%";
        intensity.style.setProperty("--fill", percent);
        intensity.setAttribute("aria-valuetext", percent);
        byId("intensity-value").value = percent;
        invalidate();
      }
      intensity.addEventListener("input", updateIntensity);
      document.addEventListener("keydown", event => {
        if (event.code !== "Space" || event.repeat || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        if (event.target.closest("button, input, textarea, select, a, [contenteditable]")) return;
        event.preventDefault();
        setPlaying(!playing);
      });

      /* Each four-beat pattern has independent drum envelopes and a different spectral balance. */
      function envelope(beat, hits, decay) {
        let age = 4;
        for (const hit of hits) age = Math.min(age, (beat % 4 - hit + 4) % 4);
        return Math.exp(-age * decay);
      }

      function paintSpectrum(now, delta, accent) {
        const ctx = scopeContext;
        const width = spectrum.width / pixelRatio;
        const height = spectrum.height / pixelRatio;
        if (!width || !height) return;
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        ctx.clearRect(0, 0, width, height);
        const middle = height / 2;
        const pitch = width / levels.length;
        const stroke = Math.min(5.5, pitch * .56);
        const room = Math.max(0, middle - stroke / 2 - 1);
        ctx.lineWidth = 1 / pixelRatio;
        ctx.strokeStyle = "#b5bfb8";
        ctx.globalAlpha = .62;
        ctx.beginPath();
        for (let i = 0; i <= 10; i++) {
          const x = (width - 1) * i / 10 + .5;
          ctx.moveTo(x, 2); ctx.lineTo(x, height - 2);
        }
        ctx.moveTo(0, middle); ctx.lineTo(width, middle);
        ctx.stroke();
        ctx.globalAlpha = 1;

        const track = tracks[current];
        const speed = reduced.matches ? .25 : 1;
        const t = (started ? position : .27 + track.seed * .12) * speed;
        const beat = t * track.bpm / 60;
        const kick = envelope(beat, track.kick, 6.4);
        const snare = envelope(beat, track.snare, 9);
        const hatAccent = Math.floor(beat / track.hatStep) % 2 ? .7 : 1;
        const hat = hatAccent * Math.exp(-(beat % track.hatStep) * 19);
        const idleTime = now / 1000 * speed;
        const gain = strength * (reduced.matches ? .46 : 1);
        const attack = reduced.matches ? .20 : .035;
        const release = reduced.matches ? .65 : .24;
        ctx.strokeStyle = accent;
        ctx.lineWidth = stroke;
        ctx.lineCap = "round";
        ctx.beginPath();
        for (let i = 0; i < levels.length; i++) {
          const x = i / (levels.length - 1);
          let target;
          if (playing || !started) {
            const low = Math.exp(-x * 3.1) * track.bass;
            const high = x * x * track.treble;
            const sway = .54 + .26 * Math.sin(t * .87 + x * 13 + track.seed) + .18 * Math.cos(t * 1.21 - x * 27 + track.seed * .4);
            const overtone = Math.pow(Math.sin(x * 11 + track.seed + t * .55), 2);
            const mids = Math.exp(-Math.pow((x - .48) / .22, 2));
            const resonance = Math.exp(-Math.pow((x - .41 - .04 * Math.sin(t * .48 + track.seed)) / .11, 2));
            const bed = (.9 * low + .26 + .34 * high) * sway + .27 * overtone * (1 - .5 * x) + .38 * resonance;
            const drums = kick * low * .87 + snare * mids * (.44 + .32 * overtone) + hat * high * .83;
            target = gain * Math.min(1.36, bed + drums);
          } else {
            target = gain * (.026 + .025 * Math.sin(idleTime * 1.1 + i * .48));
          }
          const timeConstant = target > levels[i] ? attack : release;
          levels[i] = started ? levels[i] + (target - levels[i]) * (1 - Math.exp(-delta / timeConstant)) : target;
          const half = Math.max(.12, Math.min(1, levels[i]) * room);
          const center = (i + .5) * pitch;
          ctx.moveTo(center, middle - half); ctx.lineTo(center, middle + half);
        }
        ctx.stroke();
      }

      /* Two-ink sleeve illustrations, printed in the five colors of Side A. */
      const ink = "#46524b";
      const paper = "#e4e9e5";
      const tau = Math.PI * 2;
      function circle(x, y, radius, color) {
        print.beginPath();
        print.arc(x, y, radius, 0, tau);
        print.fillStyle = color;
        print.fill();
      }

      function tidePrint(accent) {
        circle(216, 42, 28, accent);
        const ridge = (x, row) => 112 - .265 * x + 10 * Math.sin(x * .032 - .75 + row * .074)
          + 8 * Math.cos(x * .028 + row * .048) + row * 3.7;
        for (let row = 0; row < 27; row++) {
          print.beginPath();
          print.moveTo(-2, ridge(-2, row));
          for (let x = 1; x <= 299; x += 3) print.lineTo(x, ridge(x, row));
          if (!row) {
            print.lineTo(299, 119); print.lineTo(-2, 119); print.closePath();
            print.fillStyle = paper; print.fill();
          }
          print.stroke();
        }
      }

      function lanternPrint(accent) {
        function lantern(cx, top, scale) {
          print.save(); print.translate(cx, top); print.scale(scale, scale);
          print.beginPath(); print.moveTo(0, -45); print.lineTo(0, 2);
          print.moveTo(0, 71); print.lineTo(0, 85); print.stroke();
          print.beginPath(); print.moveTo(-9, 4);
          print.bezierCurveTo(-42, 17, -41, 55, -9, 68); print.lineTo(9, 68);
          print.bezierCurveTo(41, 55, 42, 17, 9, 4); print.closePath();
          print.fillStyle = accent; print.fill(); print.stroke();
          print.save(); print.clip();
          for (let y = 5; y <= 70; y += 5) {
            print.beginPath(); print.moveTo(-38, y - 3); print.quadraticCurveTo(0, y + 5, 38, y - 3); print.stroke();
          }
          print.restore();
          print.fillStyle = ink; print.fillRect(-10, 1, 20, 3); print.fillRect(-10, 68, 20, 3);
          print.restore();
        }
        lantern(266, -8, .74); lantern(192, 17, .98);
      }

      function greenhousePrint(accent) {
        circle(239, 34, 22, accent);
        for (let i = 0; i < 8; i++) {
          const left = 111 + i * 11;
          const rise = i * 2.4;
          print.beginPath(); print.moveTo(left, 117); print.lineTo(left, 85 - rise);
          print.bezierCurveTo(left, 35 - rise, left + 78, 35 - rise, left + 78, 85 - rise);
          print.lineTo(left + 78, 117); print.stroke();
        }
        for (const [x, y] of [[111, 85], [122, 62], [150, 47.5], [178, 62], [189, 85], [189, 106]]) {
          print.beginPath(); print.moveTo(x, y); print.lineTo(x + 77, y - 16.8); print.stroke();
        }
      }

      function staticPrint(accent) {
        circle(220, 55, 34, accent);
        for (let line = 0; line < 25; line++) {
          print.beginPath();
          for (let x = 92; x < 298; x += 2) {
            const u = x - 216 - line * .8;
            const signal = Math.exp(-u * u / 1800) * (13 * Math.sin(u * .16) + 6 * Math.cos(u * .29 + line * .18));
            const y = 52 + line * 3.2 - (x - 92) * .17 - signal;
            if (x === 92) print.moveTo(x, y); else print.lineTo(x, y);
          }
          print.stroke();
        }
      }

      function bloomPrint(accent) {
        print.save(); print.translate(213, 62);
        for (let i = 0; i < 12; i++) {
          print.save(); print.rotate(i * tau / 12);
          print.beginPath(); print.moveTo(0, -5);
          print.bezierCurveTo(-18, -15, -16, -39, 0, -52);
          print.bezierCurveTo(17, -37, 15, -16, 0, -5); print.closePath();
          print.fillStyle = accent; print.fill(); print.stroke();
          print.beginPath(); print.moveTo(0, -8); print.quadraticCurveTo(-6, -28, 0, -48); print.stroke();
          print.restore();
        }
        circle(0, 0, 7, ink); circle(0, 0, 3, paper);
        print.restore();
      }
      const sleevePrints = [tidePrint, lanternPrint, greenhousePrint, staticPrint, bloomPrint];
      const grainTile = document.createElement("canvas");
      grainTile.width = grainTile.height = 96;
      const grainContext = grainTile.getContext("2d");
      const grain = grainContext.createImageData(96, 96);
      let grainSeed = 19;
      for (let i = 0; i < grain.data.length; i += 4) {
        grainSeed = (Math.imul(grainSeed, 1664525) + 1013904223) >>> 0;
        const light = grainSeed & 256;
        grain.data[i] = light ? 255 : 70;
        grain.data[i + 1] = light ? 255 : 82;
        grain.data[i + 2] = light ? 255 : 75;
        grain.data[i + 3] = (grainSeed >>> 24) * .13;
      }
      grainContext.putImageData(grain, 0, 0);
      const paperGrain = print.createPattern(grainTile, "repeat");

      function paintSleeve(accent) {
        if (!sleeve.width || !sleeve.height) return;
        print.setTransform(sleeve.width / 294, 0, 0, sleeve.height / 116, 0, 0);
        print.fillStyle = paper; print.fillRect(0, 0, 294, 116);
        print.strokeStyle = ink; print.lineWidth = 1.05; print.lineCap = "round"; print.lineJoin = "round";
        sleevePrints[current](accent);
        print.fillStyle = paperGrain; print.fillRect(0, 0, 294, 116);
        sleeveColor = accent;
      }

      function fitCanvases() {
        pixelRatio = desiredRatio();
        for (const canvas of [spectrum, sleeve]) {
          const rect = canvas.getBoundingClientRect();
          const width = Math.round(rect.width * pixelRatio);
          const height = Math.round(rect.height * pixelRatio);
          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width; canvas.height = height;
            if (canvas === sleeve) sleeveColor = "";
          }
        }
        invalidate();
      }

      function frame(now) {
        frameId = 0;
        advanceClock(now);
        if (playing && now - lastProgressAt >= 80) {
          lastProgressAt = now;
          updateProgress();
        }
        const interval = 1000 / (reduced.matches ? 15 : playing ? 60 : 24);
        const delta = now - lastPlotAt;
        if (needsPaint || delta >= interval - 1) {
          const accent = now < paletteUntil ? getComputedStyle(root).getPropertyValue("--accent").trim() : tracks[current].color;
          paintSpectrum(now, Math.min(.3, Math.max(.001, delta / 1000)), accent);
          if (sleeveColor !== accent) paintSleeve(accent);
          lastPlotAt = now;
          needsPaint = false;
        }
        if (started || now <= paletteUntil + 80) requestFrame();
      }

      const resizeObserver = new ResizeObserver(fitCanvases);
      resizeObserver.observe(spectrum);
      resizeObserver.observe(sleeve);
      if (window.ToyEmbed) window.addEventListener("resize", fitCanvases);
      function watchPixelRatio() {
        matchMedia("(resolution: " + devicePixelRatio + "dppx)").addEventListener("change", () => {
          fitCanvases();
          watchPixelRatio();
        }, { once: true });
      }
      watchPixelRatio();
      reduced.addEventListener("change", () => {
        if (reduced.matches) {
          paletteUntil = 0;
          updateMetadata(false);
          like.querySelector("svg").getAnimations().forEach(animation => animation.cancel());
        }
        invalidate();
      });
      document.addEventListener("visibilitychange", () => {
        advanceClock(performance.now());
        if (document.hidden) {
          cancelAnimationFrame(frameId);
          frameId = 0;
        } else {
          updateProgress();
          invalidate();
        }
      });

      buildQueue();
      updateIntensity();
      reflectTrack(false);
      fitCanvases();
      if (window.ToyEmbed?.autoplay) setPlaying(true);
      window.ToyEmbed?.ready?.();
    })();
  </script>
</body>
</html>
