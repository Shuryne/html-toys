<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#99d0d8">
<link rel="icon" href="data:,">
<title>云海邮班 · Cloudpost Railway</title>
<style>
:root{color-scheme:light;--ink:#224d50;--paper:#fff3d4;--route:#9b9e81}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{color:var(--ink);background:linear-gradient(174deg,#74b8cc 0%,#a8d4d9 38%,#d6e5d8 69%,#f2e3c6 100%);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 8% 1%,#fff4c648 0,transparent 55%)}
#stage{position:fixed;inset:0;isolation:isolate}
#world,#postcard{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:0}
#world:active,#postcard:active{cursor:grabbing}
[hidden]{display:none!important}
button{appearance:none;border:0;padding:0;background:none;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid #aa592c;outline-offset:3px}
.masthead{position:fixed;top:max(28px,env(safe-area-inset-top));left:max(34px,env(safe-area-inset-left));display:flex;align-items:center;gap:14px;pointer-events:none;user-select:none}
.stamp{width:56px;height:65px;transform:rotate(-6deg);filter:drop-shadow(0 2px 1px #345f6426)}
.masthead h1{font:800 clamp(28px,2.7vw,42px)/1.17 "Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;letter-spacing:.11em;margin:0}
.masthead p{margin:3px 0 0 2px;font:italic 16px/1.2 "Baskerville","Iowan Old Style",Georgia,serif;letter-spacing:.035em;color:#315d5e}
.masthead>div{transition:opacity .4s}body[data-framing=near] .masthead>div{opacity:0}
.switches{position:fixed;top:max(32px,env(safe-area-inset-top));right:max(34px,env(safe-area-inset-right));display:flex;gap:8px}
.round{width:39px;height:39px;display:grid;place-items:center;border-radius:50%;background:#fcf4dba8;border:1px solid #637d7440;box-shadow:0 2px 5px #3759570c;transition:background .16s,transform .16s}
.round canvas{width:18px;height:18px}
.round:hover{background:#fff5da;transform:translateY(-1px)}
.round[aria-pressed=true]{background:#ffe7ac}
.dock-wrap{position:fixed;bottom:max(23px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;max-width:100%;pointer-events:none}
.ticket{position:relative;height:69px;display:flex;align-items:stretch;padding:0 11px;pointer-events:auto;isolation:isolate;filter:drop-shadow(0 4px 5px #405f5527);width:max-content;max-width:calc(100vw - 24px)}
.ticket::before{content:"";position:absolute;inset:0;z-index:-2;border-radius:6px;background:var(--paper);border:1px solid #bba87c8c;mask:radial-gradient(circle 6px at 0 50%,transparent 92%,#000 102%) left/51% 100% no-repeat,radial-gradient(circle 6px at 100% 50%,transparent 92%,#000 102%) right/51% 100% no-repeat}
.ticket::after{content:"";position:absolute;inset:5px 6px;border-block:1px solid #c0ad8166;border-radius:2px;pointer-events:none;z-index:-1;background:repeating-linear-gradient(-44deg,#bd5a46 0 4px,transparent 4px 8px,#397272 8px 12px,transparent 12px 16px) left center/3px 62% no-repeat,repeating-linear-gradient(-44deg,#bd5a46 0 4px,transparent 4px 8px,#397272 8px 12px,transparent 12px 16px) right center/3px 62% no-repeat}
.ticket button{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;min-width:0;padding:5px 0 3px;border-radius:4px;font-weight:600;font-size:12px;line-height:1.2;letter-spacing:.075em;white-space:nowrap}
.ticket button:focus-visible{outline-offset:-5px}
.ticket button:hover{color:#a44f30}
.ticket button[aria-pressed=true]{color:#873d28}
.ticket canvas{display:block;width:24px;height:24px}
.ticket .end{width:77px}
.end+.route,.route+.end{border-left:1px dashed #bba77c99}
.route{display:flex;align-items:stretch;padding:0 18px;position:relative}
.route::before{content:"";position:absolute;top:25px;height:2px;left:60px;right:60px;background:repeating-linear-gradient(to right,#899b88 0 4px,transparent 4px 7px)}
.route button{width:87px}
.route .node{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--paper)}
.route .node canvas{width:22px;height:22px}
.ticket button[aria-pressed=true] .node{background:#ebd39b;box-shadow:0 0 0 2px var(--paper)}
.ticket .end[aria-pressed=true] canvas{background:#ecd6a5;border-radius:7px}
#caption{margin:0 0 9px;padding:6px 14px 7px;border-radius:30px;background:#fff5dcf1;box-shadow:0 2px 7px #45635e12;font-size:13px;letter-spacing:.035em;line-height:1.45;white-space:nowrap;transition:opacity .4s,transform .4s}
#caption:empty{visibility:hidden;opacity:0;transform:translateY(4px)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:650px){
  .masthead{top:max(18px,env(safe-area-inset-top));left:17px;gap:9px}.stamp{width:41px;height:49px}
  .masthead h1{font-size:27px}.masthead p{font-size:13px;margin-top:2px}
  .switches{top:max(22px,env(safe-area-inset-top));right:15px;gap:5px}.round{width:35px;height:35px}
  .dock-wrap{bottom:max(15px,env(safe-area-inset-bottom))}.ticket{height:64px;padding:0 8px}
  .ticket .end{width:56px}.route{padding:0 5px}.route button{width:clamp(45px,15.2vw,78px)}
  .route::before{top:23px;left:31px;right:31px}.ticket button{font-size:11px;letter-spacing:.02em;gap:3px}
  #caption{font-size:12px}
}
@media(max-height:500px) and (min-aspect-ratio:1/1){
  .masthead{top:12px;left:17px;gap:8px}.stamp{width:34px;height:40px}.masthead h1{font-size:23px}.masthead p{font-size:11px}
  .switches{top:11px;right:16px}.round{width:32px;height:32px}.dock-wrap{bottom:8px}
  .ticket{height:48px}.ticket button{flex-direction:row;font-size:11px;gap:4px}
  .ticket canvas,.route .node canvas{width:19px;height:19px}.ticket .end{width:66px}.route{padding:0 8px}.route button{width:76px}.route::before{display:none}
  #caption{margin-bottom:4px;font-size:11px;padding:3px 10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="stage" aria-label="云海邮班积木世界">
  <canvas id="world" aria-label="小火车在麦风岛、云邮总站和灯塔湾之间往返。拖动观察，滚轮或双指缩放。"></canvas>
  <canvas id="postcard" hidden aria-label="云海邮班动画"></canvas>
</main>
<header class="masthead">
  <canvas class="stamp" id="stamp" width="168" height="195" aria-hidden="true"></canvas>
  <div><h1>云海邮班</h1><p lang="en">Cloudpost Railway</p></div>
</header>
<div class="switches" role="group" aria-label="播放控制">
  <button class="round" id="sound" aria-label="开启声音" title="开启声音" aria-pressed="false"><canvas aria-hidden="true"></canvas></button>
  <button class="round" id="pause" aria-label="暂停播放" title="暂停播放（空格）" aria-pressed="false"><canvas aria-hidden="true"></canvas></button>
</div>
<div class="dock-wrap">
  <p id="caption"></p>
  <nav class="ticket" aria-label="选择观景位置">
    <button class="end" data-view="tour" aria-pressed="true" title="回到全景，自动巡游"><canvas data-icon="tour" aria-hidden="true"></canvas><span>全景巡游</span></button>
    <div class="route">
      <button data-view="mill" aria-pressed="false" title="看麦风岛的磨坊"><span class="node"><canvas data-icon="mill" aria-hidden="true"></canvas></span><span>麦风岛</span></button>
      <button data-view="post" aria-pressed="false" title="看云邮总站"><span class="node"><canvas data-icon="post" aria-hidden="true"></canvas></span><span>云邮总站</span></button>
      <button data-view="harbour" aria-pressed="false" title="看灯塔湾"><span class="node"><canvas data-icon="harbour" aria-hidden="true"></canvas></span><span>灯塔湾</span></button>
    </div>
    <button class="end" data-view="train" aria-pressed="false" title="跟随小火车"><canvas data-icon="train" aria-hidden="true"></canvas><span>跟车</span></button>
  </nav>
</div>
<p id="announcement" class="visually-hidden" role="status" aria-live="polite"></p>
<noscript>请启用 JavaScript 播放云海邮班。</noscript>

function packPieces(root) {

  visit(root,root);

  for(const [carrier,batch] of batches)for(const [geo,entries] of batch.sets){

// A small screen-space contact shadow pass gives each fitted piece a soft dark seam.
let renderBuffer=null,printScene,printCamera,printMaterial;
function prepareOptics() {
  const studio=new T.RoomEnvironment();
  const pmrem=new T.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(studio,.028).texture;scene.environmentIntensity=.23;
  studio.dispose();pmrem.dispose();
  if(!renderer.extensions.has('EXT_color_buffer_float'))return;
  const gl=renderer.getContext();
  const sampleCounts=gl.getInternalformatParameter(gl.RENDERBUFFER,gl.RGBA16F,gl.SAMPLES);
  const samples=Array.from(sampleCounts).filter(v=>v<=4);
  renderBuffer=new T.WebGLRenderTarget(1,1,{
    type:T.HalfFloatType,depthBuffer:true,stencilBuffer:false,samples:samples.length?Math.max(...samples):0
  });
  renderBuffer.depthTexture=new T.DepthTexture(1,1,T.UnsignedIntType);
  printScene=new T.Scene();printCamera=new T.OrthographicCamera(-1,1,1,-1,0,1);
  printMaterial=new T.ShaderMaterial({
    depthWrite:false,depthTest:false,blending:T.NoBlending,
    uniforms:{
      colour:{value:renderBuffer.texture},depthMap:{value:renderBuffer.depthTexture},
      viewSize:{value:new T.Vector2(40,25)},zRange:{value:camera.far-camera.near}
    },
    vertexShader:`varying vec2 sampleUV;
      void main(){sampleUV=uv;gl_Position=vec4(position.xy,0.,1.);}`,
    fragmentShader:`uniform sampler2D colour,depthMap;
      uniform vec2 viewSize;uniform float zRange;varying vec2 sampleUV;
      void main(){
        vec4 paint=texture2D(colour,sampleUV);
        float z=texture2D(depthMap,sampleUV).x;
        vec3 pos=vec3((sampleUV-.5)*viewSize,-z*zRange);
        vec3 normal=normalize(cross(dFdx(pos),dFdy(pos)));
        float shadow=0.;
        if(z<.993 && paint.a>.97){
          float twist=fract(dot(floor(gl_FragCoord.xy),vec2(.06711056,.00583715))*52.9829189)*.82;
          for(int i=0;i<20;i++){
            float index=float(i)+.5;
            float angle=index*2.39996323+twist;
            float radius=.047+.68*pow(index/20.,1.37);
            vec2 offset=vec2(cos(angle),sin(angle))*radius;
            float nz=texture2D(depthMap,sampleUV+offset/viewSize).x;
            vec3 ray=vec3(offset,(z-nz)*zRange);
            float d=length(ray);
            shadow+=max(0.,dot(normal,ray)/max(.0001,d)-.08)*(1.-smoothstep(.04,.96,d));
          }
        }
        float contact=1.-min(.45,shadow*.123);
        vec3 linearColor=paint.rgb/max(paint.a,.001)*mix(vec3(.73,.84,.90),vec3(1.),contact)*contact;
        gl_FragColor=vec4(linearColor,paint.a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        gl_FragColor.rgb*=paint.a;
      }`
  });
  const sheet=new T.Mesh(new T.PlaneGeometry(2,2),printMaterial);sheet.frustumCulled=false;printScene.add(sheet);
}
function renderDiorama() {
  if(!renderBuffer){renderer.render(scene,camera);return;}
  const w=mainCanvas.width,h=mainCanvas.height;
  if(w!==renderBuffer.width||h!==renderBuffer.height)renderBuffer.setSize(w,h);
  printMaterial.uniforms.viewSize.value.set(camera.right-camera.left,camera.top-camera.bottom);
  renderer.setRenderTarget(renderBuffer);renderer.render(scene,camera);
  renderer.setRenderTarget(null);renderer.render(printScene,printCamera);
}

    if(fallback)drawPostcard();
    else{
      putTrain(sim);for(const animate of animators)animate(sim);steamAt(sim);
      if(sim-shadowTime>.16){renderer.shadowMap.needsUpdate=true;shadowTime=sim;}
      renderDiorama();
    }
    lastDraw={t:sim,w:screenW,h:screenH,...current,target:current.target.clone()};
  }
  soundscape(sim);frameId=requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{
  previousFrame=0;audioState();if(fallback)playbackFilm();
  if(document.hidden){cancelAnimationFrame(frameId);frameId=0;}
  else if(ready&&!frameId)frameId=requestAnimationFrame(loop);
});
async function buildDiorama(context){
    renderer=new T.WebGLRenderer({canvas:mainCanvas,context,alpha:true,antialias:true,powerPreference:'high-performance'});
    renderer.setClearColor(0,0);renderer.outputColorSpace=T.SRGBColorSpace;
    renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.975;
    renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;
    resize();lighting();prepareOptics();
    const land=islands.map(makeLand);
    makeMill(land[0]);makePost(land[1]);makeHarbour(land[2]);finishIslands(land);makeTrack();makeTrain();
    await makeSky();packPieces(world);
    mainCanvas.addEventListener('webglcontextlost',async e=>{
      e.preventDefault();cancelAnimationFrame(frameId);ready=false;await startPostcard();ready=true;previousFrame=0;frameId=requestAnimationFrame(loop);
    },{once:true});
}
async function start(){
  try{
    const context=mainCanvas.getContext('webgl2',{alpha:true,antialias:true,powerPreference:'high-performance'});
    if(context)await buildDiorama(context);
    else await startPostcard();
  }catch(error){
    console.warn('3D 场景切换到动画明信片。',error);
    await startPostcard();
  }
  ready=true;resize();updateCamera(0,true);
  document.body.dataset.ready=fallback?'postcard':'3d';
  frameId=requestAnimationFrame(loop);
}
start();

})();
</script>
