<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云端积木群岛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@600;800&display=swap">
<style>
/* VOICE: warm, playful, unhurried, like a toy shop window at closing time.
   IDEA: a brick-built diorama on a shelf; the page is the shelf, the UI is spare bricks.
   PICTURE: the whole screen is the live sky world; nothing sits in front of it but small tiles.
   COLOUR and TYPE: toy-brick red, sunflower yellow, deep sky blue on soft white tiles; ZCOOL KuaiLe + Baloo 2, system fallbacks.
   LAYOUT: title top-left, story tile bottom-left, brick buttons bottom-right; on phones they stack along the bottom. */
:root{
  color-scheme:light dark;
  --tile:rgba(255,253,248,.86);
  --tile-ink:#2b2420;
  --tile-soft:#6d625a;
  --red:#d6402f;--yellow:#f2b52c;--blue:#2f6fc0;--green:#3f9a4d;--sky:#7cb8e8;
  --shadow:0 2px 0 rgba(60,40,20,.18),0 10px 24px rgba(30,40,70,.16);
}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#bcdcf3;color:var(--tile-ink);
  font:16px/1.5 "Baloo 2","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;outline:none}
#c.drag{cursor:grabbing}
.ui{position:fixed;pointer-events:none;z-index:2}
.ui *{pointer-events:auto}
.tile{background:var(--tile);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2)}

#title{left:max(18px,env(safe-area-inset-left));top:16px;padding:14px 20px 12px;transition:opacity .8s,transform .8s}
#title h1{margin:0;font:400 clamp(26px,3.4vw,40px)/1.05 "ZCOOL KuaiLe","Baloo 2","PingFang SC",sans-serif;letter-spacing:.04em;color:#2b2420;text-wrap:balance}
#title p{margin:6px 0 0;font-size:14px;color:var(--tile-soft)}
#title .studs{display:flex;gap:6px;margin-bottom:8px}
#title .studs i{width:14px;height:8px;border-radius:7px 7px 2px 2px;background:var(--red);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
#title .studs i:nth-child(2){background:var(--yellow)}#title .studs i:nth-child(3){background:var(--blue)}#title .studs i:nth-child(4){background:var(--green)}
#title.small{opacity:.0;transform:translateY(-8px);pointer-events:none}
#title.small *{pointer-events:none}

.dock{position:fixed;z-index:2;left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap-reverse;justify-content:space-between;align-items:flex-end;gap:12px 16px;pointer-events:none}
#story{pointer-events:auto;width:min(430px,100%);padding:12px 16px 13px;transition:opacity .5s}
#story .row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
#story .place{font:600 13px/1 "Baloo 2","PingFang SC",sans-serif;color:#fff;background:var(--red);padding:6px 10px 5px;border-radius:7px;position:relative;white-space:nowrap}
#story .place::before{content:"";position:absolute;left:8px;top:-4px;width:9px;height:5px;border-radius:5px 5px 1px 1px;background:inherit;box-shadow:13px 0 0 0 currentColor;color:inherit}
#story .clock{font:600 13px/1 "Baloo 2",sans-serif;color:var(--tile-soft);white-space:nowrap;margin-left:auto}
#story .text{font-size:16px;line-height:1.5;min-height:1.5em;transition:opacity .45s}
#story .text.fade{opacity:0}

#ctrl{pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:740px}
#ctrl>*{pointer-events:auto}
#ctrl .bar{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.brick{position:relative;border:0;cursor:pointer;font:600 14px/1 "Baloo 2","PingFang SC",sans-serif;color:#fff;background:var(--c,var(--blue));
  padding:11px 14px 10px;min-height:40px;border-radius:7px;margin-top:6px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 3px 8px rgba(20,30,60,.18);transition:transform .08s,filter .2s}
.brick::before{content:"";position:absolute;top:-5px;left:10px;right:10px;height:6px;
  background:radial-gradient(circle at 6px 5px,var(--c,var(--blue)) 4.5px,transparent 5px) 0 0/16px 6px repeat-x;filter:brightness(1.06)}
.brick:hover{filter:brightness(1.07)}
.brick:active{transform:translateY(2px)}
.brick:focus-visible{outline:3px solid #fff;outline-offset:2px}
.brick[aria-pressed=true]{box-shadow:inset 0 3px 0 rgba(0,0,0,.22),0 1px 3px rgba(20,30,60,.2);transform:translateY(1px)}
.brick.ghost{--c:rgba(255,253,248,.9);color:var(--tile-ink)}
#hint{font-size:13px;color:#2b2420;background:rgba(255,253,248,.72);padding:5px 10px;border-radius:9px;transition:opacity .8s}

#tag{position:fixed;z-index:3;pointer-events:none;transform:translate(-50%,-100%);padding:8px 12px 7px;border-radius:12px;background:var(--tile);box-shadow:var(--shadow);font-size:14px;line-height:1.35;max-width:240px;text-align:center;opacity:0;transition:opacity .25s}
#tag b{display:block;font:600 13px/1.2 "Baloo 2","PingFang SC",sans-serif;color:var(--red);margin-bottom:2px}
#tag::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--tile)}

#bubbles{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.bub{position:absolute;left:0;top:0;width:34px;height:30px;margin:-34px 0 0 -17px;border-radius:11px;background:#fffdf8;box-shadow:0 2px 0 rgba(60,40,20,.15),0 4px 10px rgba(30,40,70,.18);display:flex;align-items:center;justify-content:center;transform-origin:50% 120%;will-change:transform,opacity}
.bub::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fffdf8}
.bub svg{width:20px;height:20px;display:block}

#veil{position:fixed;inset:0;z-index:5;background:#f6f3ec;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity 1.4s ease}
#veil.gone{opacity:0;pointer-events:none}
#veil .stack{position:relative;width:84px;height:64px}
#veil .stack i{position:absolute;left:10px;width:64px;height:18px;border-radius:4px;background:var(--red);animation:drop 1.8s infinite cubic-bezier(.3,.7,.4,1)}
#veil .stack i::before{content:"";position:absolute;top:-5px;left:6px;right:6px;height:6px;background:radial-gradient(circle at 6px 5px,currentColor 4.5px,transparent 5px) 0 0/13px 6px repeat-x;color:inherit}
#veil .stack i:nth-child(1){bottom:0;background:var(--blue);color:var(--blue)}
#veil .stack i:nth-child(2){bottom:20px;left:0;background:var(--yellow);color:var(--yellow);animation-delay:.25s}
#veil .stack i:nth-child(3){bottom:40px;left:20px;width:44px;background:var(--red);color:var(--red);animation-delay:.5s}
@keyframes drop{0%{transform:translateY(-30px);opacity:0}25%,80%{transform:none;opacity:1}100%{opacity:0}}
#veil p{margin:0;font:400 20px/1.2 "ZCOOL KuaiLe","PingFang SC",sans-serif;color:#2b2420;letter-spacing:.06em}
#veil .err{font:15px/1.6 "PingFang SC",sans-serif;max-width:420px;text-align:center;color:#6d625a;display:none}

@media (max-width:1080px){#ctrl{align-items:flex-start}#ctrl .bar{justify-content:flex-start}}
@media (max-width:600px){
  #title{left:12px;top:10px;padding:10px 14px 9px}
  #title p{font-size:13px}
  .dock{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));gap:8px}
  #story{width:100%}
  #ctrl{width:100%;max-width:none;align-items:stretch}
  #ctrl .bar{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-top:6px;scrollbar-width:none}
  #ctrl .bar::-webkit-scrollbar{display:none}
  .brick{flex:none}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){#veil .stack i{animation:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="积木风格的空中世界：小火车在浮岛之间往返"></canvas>

<div id="bubbles" aria-hidden="true"></div>
<div id="tag" aria-live="polite"><b></b><span></span></div>

<header id="title" class="ui tile">
  <div class="studs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <h1>云端积木群岛</h1>
  <p>一列小火车，四座浮岛，一整天的小事。</p>
</header>

<div class="dock">
<section id="story" class="tile" aria-live="polite">
  <div class="row"><span class="place" id="place">云端</span><span class="clock" id="clock">07:30</span></div>
  <div class="text" id="storyText">小火车「云朵号」正在出发。</div>
</section>

<nav id="ctrl" aria-label="视角">
  <div id="hint">拖动转视角，滚轮缩放，双击小人看看他在忙什么</div>
  <div class="bar">
    <button class="brick" id="bTour" style="--c:#d6402f" aria-pressed="true">自动导览</button>
    <button class="brick" id="bTrain" style="--c:#f2b52c;color:#3a2a10" aria-pressed="false">跟着火车</button>
    <button class="brick" data-isle="0" style="--c:#2f6fc0">钟楼镇</button>
    <button class="brick" data-isle="1" style="--c:#3f9a4d">风车农场</button>
    <button class="brick" data-isle="2" style="--c:#c2553a">灯塔岬</button>
    <button class="brick" data-isle="3" style="--c:#c76a98">大树岛</button>
    <button class="brick ghost" id="bWide">看全景</button>
    <button class="brick ghost" id="bSound" aria-pressed="false">声音</button>
  </div>
</nav>
</div>

<div id="veil"><div class="stack" aria-hidden="true"><i></i><i></i><i></i></div><p>正在搭积木…</p><div class="err" id="err"></div></div>

<script>
{
'use strict';
// ============================================================ core
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = mulberry32(20261125);
const seed = s => { rand = mulberry32(s); };
const rnd = (a = 0, b = 1) => a + (b - a) * rand();
const rint = (a, b) => Math.floor(a + (b - a + 1) * rand());
const pick = arr => arr[Math.floor(rand() * arr.length)];
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}
function fbm(x, y, oct = 4) { let s = 0, a = .5, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * vnoise(x * f + i * 17.3, y * f - i * 9.1); n += a; a *= .5; f *= 2; } return s / n; }
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

// colours (sRGB 0..255)
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
const C = {
  red: hex('#c8382c'), dred: hex('#8e2a22'), orange: hex('#ec8a2b'), yellow: hex('#f3c43b'), cream: hex('#f1e3bf'),
  tan: hex('#dcc596'), dtan: hex('#a08c66'), brown: hex('#7a4a30'), dbrown: hex('#55331f'), nougat: hex('#c98d5e'),
  green: hex('#4a9e46'), dgreen: hex('#2d6e3a'), lime: hex('#a6c83a'), olive: hex('#7d8f3c'), sand: hex('#e8d6a6'),
  blue: hex('#2a62b5'), dblue: hex('#1f3f78'), azure: hex('#4aa8d8'), lblue: hex('#9fcbe8'), teal: hex('#2f8f8a'),
  white: hex('#f4f2ec'), lgray: hex('#a7abaf'), mgray: hex('#8a8f93'), dgray: hex('#5f6467'), black: hex('#2a2d33'),
  pink: hex('#f2a3bd'), dpink: hex('#d06a96'), lpink: hex('#f8cfdc'), purple: hex('#7e5aa8'), lav: hex('#b9a6dc'),
  skin: hex('#f5c93a'), gold: hex('#d6a640'), glass: hex('#8fc3e0'), water: hex('#3f9fd6'), mint: hex('#9fd8c0'),
  rock1: hex('#8d8478'), rock2: hex('#6e675f'), rock3: hex('#a59a88'), soil: hex('#8a5a3a'), clay: hex('#b0704a'),
};

// ============================================================ mat4 (column-major)
const M4 = {
  create() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  ident(o) { o.fill(0); o[0] = o[5] = o[10] = o[15] = 1; return o; },
  mul(o, a, b) {
    const r = M4._t;
    for (let c = 0; c < 4; c++) {
      const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
      r[c * 4] = a[0] * b0 + a[4] * b1 + a[8] * b2 + a[12] * b3;
      r[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9] * b2 + a[13] * b3;
      r[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
      r[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
    }
    o.set(r); return o;
  },
  _t: new Float32Array(16),
  persp(o, fovy, asp, n, f) {
    const t = 1 / Math.tan(fovy / 2); o.fill(0);
    o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f); return o;
  },
  ortho(o, l, r, b, t, n, f) {
    o.fill(0); o[0] = 2 / (r - l); o[5] = 2 / (t - b); o[10] = -2 / (f - n);
    o[12] = -(r + l) / (r - l); o[13] = -(t + b) / (t - b); o[14] = -(f + n) / (f - n); o[15] = 1; return o;
  },
  lookAt(o, e, c, up) {
    let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2]; let l = Math.hypot(zx, zy, zz) || 1; zx /= l; zy /= l; zz /= l;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx; l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    o[0] = xx; o[1] = yx; o[2] = zx; o[3] = 0; o[4] = xy; o[5] = yy; o[6] = zy; o[7] = 0; o[8] = xz; o[9] = yz; o[10] = zz; o[11] = 0;
    o[12] = -(xx * e[0] + xy * e[1] + xz * e[2]); o[13] = -(yx * e[0] + yy * e[1] + yz * e[2]); o[14] = -(zx * e[0] + zy * e[1] + zz * e[2]); o[15] = 1;
    return o;
  },
  invert(o, a) {
    const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3], a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7],
      a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11], a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
    const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10, b02 = a00 * a13 - a03 * a10, b03 = a01 * a12 - a02 * a11,
      b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12, b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30,
      b08 = a20 * a33 - a23 * a30, b09 = a21 * a32 - a22 * a31, b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;
    let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06; if (!det) return o; det = 1 / det;
    o[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det; o[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
    o[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det; o[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
    o[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det; o[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
    o[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det; o[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
    o[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det; o[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
    o[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det; o[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
    o[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det; o[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
    o[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det; o[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
    return o;
  },
  // o = m * T / R / S   (o may equal m)
  tr(o, m, x, y, z) {
    if (o !== m) o.set(m);
    o[12] = m[0] * x + m[4] * y + m[8] * z + m[12]; o[13] = m[1] * x + m[5] * y + m[9] * z + m[13];
    o[14] = m[2] * x + m[6] * y + m[10] * z + m[14]; o[15] = m[3] * x + m[7] * y + m[11] * z + m[15]; return o;
  },
  ry(o, m, a) { if (o !== m) o.set(m); const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const a0 = m[i], a2 = m[8 + i]; o[i] = a0 * c - a2 * s; o[8 + i] = a0 * s + a2 * c; } return o; },
  rx(o, m, a) { if (o !== m) o.set(m); const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const a1 = m[4 + i], a2 = m[8 + i]; o[4 + i] = a1 * c + a2 * s; o[8 + i] = a2 * c - a1 * s; } return o; },
  rz(o, m, a) { if (o !== m) o.set(m); const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const a0 = m[i], a1 = m[4 + i]; o[i] = a0 * c + a1 * s; o[4 + i] = a1 * c - a0 * s; } return o; },
  sc(o, m, x, y, z) { if (o !== m) o.set(m); for (let i = 0; i < 4; i++) { o[i] = m[i] * x; o[4 + i] = m[4 + i] * y; o[8 + i] = m[8 + i] * z; } return o; },
  xform(m, x, y, z) { return [m[0] * x + m[4] * y + m[8] * z + m[12], m[1] * x + m[5] * y + m[9] * z + m[13], m[2] * x + m[6] * y + m[10] * z + m[14]]; },
};

// ============================================================ GL
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: true, stencil: false, powerPreference: 'high-performance', premultipliedAlpha: false });
function fail(msg) {
  const e = document.getElementById('err'); e.style.display = 'block'; e.textContent = msg;
  document.querySelector('#veil p').textContent = '积木没能搭起来';
  document.querySelector('#veil .stack').style.display = 'none';
  throw new Error(msg);
}
if (!gl) fail('这个浏览器没有开启 WebGL 2。请换用最新版的 Chrome、Edge、Safari 或 Firefox 打开这个文件。');

const GLSL_HEAD = '#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\nprecision highp sampler2DShadow;\n';
function mkShader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    console.error(log + '\n' + src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
    fail('着色器编译失败：' + log);
  }
  return s;
}
function mkProgram(vs, fs, defs = '') {
  const p = gl.createProgram();
  gl.attachShader(p, mkShader(gl.VERTEX_SHADER, GLSL_HEAD + defs + vs));
  gl.attachShader(p, mkShader(gl.FRAGMENT_SHADER, GLSL_HEAD + defs + fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('着色器链接失败：' + gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const inf = gl.getActiveUniform(p, i); const nm = inf.name.replace(/\[0\]$/, ''); u[nm] = gl.getUniformLocation(p, inf.name); }
  return { p, u };
}
function mkTex(w, h, ifmt, fmt, type, filter, levels = 1) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, levels, ifmt, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, levels > 1 ? gl.LINEAR_MIPMAP_LINEAR : filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

  if (CLOCKS.bell.swing > .98 && !SND.bl) { SND.bl = 1; tone(392, t, 3.2, .06); tone(587, t, 2.6, .03); } if (CLOCKS.bell.swing < .9) SND.bl = 0;

$('bSound').onclick = () => {

  } catch (e) { $('bSound').textContent = '无法播放声音'; }
};

// ============================================================ boot
const POST = { fade: 1, inCloud: 0, ap: 8 };
async function boot() {
  const vp = document.querySelector('#veil p');
  initPrograms(); initTri(); initShadow(); initPrims(); initPuffs();
  vp.textContent = '正在搭钟楼镇…'; await nextFrame();
  TOWN = makeTown(); vp.textContent = '正在搭风车农场…'; await nextFrame();
  FARM = makeFarm(); vp.textContent = '正在搭灯塔岬…'; await nextFrame();
  CAPE = makeCape(); vp.textContent = '正在种大樱花树…'; await nextFrame();
  TREE = makeTree(); vp.textContent = '正在铺空中铁路…'; await nextFrame();
  buildTrack([TOWN, FARM, CAPE, TREE], [
    [[-108, 2.5, -40], [-96, 5.5, -78], [-70, 8, -101]],
    [[38, 4, -110], [70, -12, -104], [100, -4, -80]],
    [[112, 6, 32], [100, 7, 80], [72, 2, 106]],
    [[-38, 3, 110], [-82, 5, 98], [-106, 2, 66]],
  ]);

  for (const I of ISLES) { I.g.brickify(); I.g.mesh(I.mb, I.wb); STATIC.push({ gpu: upload(I.mb), studs: studVAO(I.mb.studs) }); const w = upload(I.wb); if (w) WATER.push(w); I.mb = null; I.wb = null; await nextFrame(); }
  const tm = buildTrackMesh(); STATIC.push({ gpu: upload(tm), studs: studVAO(tm.studs) });
  FALLMESH = upload(buildFallsMesh()); SEA = upload(buildSeaMesh());
  vp.textContent = '小人们正在起床…'; await nextFrame();
  initRigid(); makeResidents(); initAmbient();
  ISLES.forEach((I, i) => ISLE_YAW[i] = Math.atan2(-I.x, -I.z) + Math.PI + .5);
  TRAIN.s = (TRACK.stops[0].s - 70 + TRACK.L) % TRACK.L; TRAIN.next = 0; TRAIN.v = TRAIN.vmax * .8;
  resize();
  DIR.shot = mkShot('wide', { yaw: .6, caption: '四座浮岛悬在云海上，小火车「云朵号」在它们之间来回奔跑。', dur: 16, dist: 350, pitch: .2 });
  applyView(Object.assign(shotState(DIR.shot, NOW), { dist: 540, pitch: .3 })); DIR.prev = Object.assign({}, VIEW); DIR.blend = 0; DIR.blendDur = 7;
  setCaption('云端', DIR.shot.caption, true);

let LASTT = 0, FT = [], LOWQ = 0;
function loop(ts) {
  const now = ts / 1000; const dt = LASTT ? Math.min(.05, now - LASTT) : .016; LASTT = now;
  NOW += dt; DT_LAST = dt;
  DAY.hour = (DAY.hour + dt * HOUR_SPEED(DAY.hour)) % 24;
  evalDay(DAY.hour); const night = SKY.night;
  WINDK = .8 + .4 * Math.sin(NOW * .13);
  updateTrain(dt);
  for (const f of FIGS) { f.t += dt; if (f.task) { const r = f.task.next(dt); if (r.done) f.task = null; } if (!f.fixedY && !f.fixed && f.isle) { const gy = groundY(f.x, f.z, f.y); f.y += (gy - f.y) * Math.min(1, dt * 14); } }
  for (const p of PETS) if (p.task) { p.t += dt; const r = p.task.next(dt); if (r.done) p.task = null; if (!p.fixedY) p.y = groundY(p.x, p.z, p.y); }
  updateAmbient(dt, NOW);
  updateCamera(dt);
  // fog when the camera sits inside a cloud bank
  let inC = 0; for (const b of TRACK.banks) { const d = Math.hypot(CAM.eye[0] - b.p[0], (CAM.eye[1] - b.p[1]) * 1.6, CAM.eye[2] - b.p[2]); inC = Math.max(inC, clamp(1 - d / b.r, 0, 1)); }
  POST.inCloud = lerp(POST.inCloud, sstep(.2, .8, inC) * .75, Math.min(1, dt * 3));
  POST.fade = Math.max(0, POST.fade - dt / 2.2); POST.ap = VIEW.ap;
  drawDynamic(NOW, night);
  renderFrame(NOW, night, POST);
  updateBubbles(); updateTag(); updateSound(dt);
  if ((NOW * 2 | 0) !== (loop.c || 0)) { loop.c = NOW * 2 | 0; const h = DAY.hour, hh = Math.floor(h), mm = Math.floor((h - hh) * 60); UI.clock.textContent = `${period(h)} ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`; }
  // adaptive resolution
  FT.push(dt); if (FT.length > 90) { FT.sort((a, b) => a - b); const med = FT[45]; FT = []; if (med > 1 / 40 && R.scale > .55) { R.scale = Math.max(.55, R.scale - .12); resize(); } else if (med < 1 / 58 && R.scale < 1) { R.scale = Math.min(1, R.scale + .06); resize(); } }
  requestAnimationFrame(loop);
}
boot().catch(e => { console.error(e); try { fail('出了点问题：' + (e && e.message || e)); } catch (_) { } });
}
