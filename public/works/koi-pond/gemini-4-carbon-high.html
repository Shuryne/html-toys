    // =========================================================================

    // Shared procedural fish-scale normal/bump map so sunlight shimmers on dorsal scales
    function createScaleBumpTexture() {
      const size = 256;
      const cnv = document.createElement('canvas');
      cnv.width = size;
      cnv.height = size;
      const ctx = cnv.getContext('2d');
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, size, size);

      const rows = 28;
      const cols = 22;
      const cw = (size * 0.75) / cols;
      const ch = size / rows;

      for (let c = cols; c >= 0; c--) {
        for (let r = 0; r <= rows; r++) {
          const cx = c * cw;
          const cy = r * ch + (c % 2) * (ch * 0.5);
          const grad = ctx.createRadialGradient(cx - cw * 0.15, cy, 1, cx, cy, cw * 0.72);
          grad.addColorStop(0, '#dedede');
          grad.addColorStop(0.72, '#888888');
          grad.addColorStop(1, '#424242');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(cx, cy, cw * 0.66, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Fin rays in UV [0.75..1.0]
      ctx.fillStyle = '#808080';
      ctx.fillRect(size * 0.75, 0, size * 0.25, size);
      ctx.strokeStyle = '#c8c8c8';
      ctx.lineWidth = 1.5;
      for (let y = 0; y < size; y += 5) {
        ctx.beginPath();
        ctx.moveTo(size * 0.75, y);
        ctx.lineTo(size, y);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(cnv);
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    const koiScaleBumpTex = createScaleBumpTexture();

    // Generate authentic Nishikigoi skin & fin textures (512x512)
    // UV layout:
    //   Body: u in [0.00 .. 0.74] (snout -> tail base), v in [0..1] (0.5 = dorsal center, 0/1 = belly)
    //   Fins: u in [0.76 .. 1.00] (0.76 = fin root -> 1.0 = fin outer scalloped tip)
    function createKoiVarietyTexture(variety, seed) {
      const localRng = mulberry32(seed);
      const cnv = document.createElement('canvas');
      cnv.width = 512;
      cnv.height = 512;
      const ctx = cnv.getContext('2d');
      const W = 512;
      const H = 512;
      const bodyW = Math.floor(W * 0.75);

      // Helper for organic crisp-edged Nishikigoi blotch (*Kiwa*)
      function drawOrganicPatch(ux, vy, rx, ry, color) {
        ctx.fillStyle = color;
        for (const offsetV of [0, -1, 1]) {
          const cx = ux * bodyW;
          const cy = (vy + offsetV) * H;
          ctx.beginPath();
          const pts = 26;
          for (let i = 0; i <= pts; i++) {
            const a = (i / pts) * Math.PI * 2;
            const wobble =
              1.0 +
              0.18 * Math.sin(a * 3 + seed * 0.7) +
              0.11 * Math.cos(a * 5 - ux * 9.0);
            const px = cx + Math.cos(a) * rx * bodyW * wobble;
            const py = cy + Math.sin(a) * ry * H * wobble;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
        }
      }

      // Base skin color
      let baseCol = '#f7f5f0';
      let bellyCol = '#fcfaf6';
      let finTint = 'rgba(252, 249, 244, 0.88)';
      let finEdge = 'rgba(255, 255, 255, 0.25)';

      if (variety === 'yamabuki') {
        baseCol = '#f2be35';
        bellyCol = '#fae089';
        finTint = 'rgba(248, 212, 98, 0.90)';
      } else if (variety === 'platinum') {
        baseCol = '#eef3f7';
        bellyCol = '#ffffff';
        finTint = 'rgba(242, 248, 255, 0.90)';
      } else if (variety === 'showa') {
        baseCol = '#1c1d21';
        bellyCol = '#2a2b30';
        finTint = 'rgba(248, 245, 240, 0.84)';
      } else if (variety === 'hi_utsuri') {
        baseCol = '#191a1e';
        bellyCol = '#26262b';
        finTint = 'rgba(235, 92, 36, 0.85)';
      } else if (variety === 'shusui') {
        baseCol = '#b8d3e3';
        bellyCol = '#f4ede6';
        finTint = 'rgba(242, 246, 250, 0.86)';
      } else if (variety === 'chagoi') {
        baseCol = '#9e6c3b';
        bellyCol = '#c49a6c';
        finTint = 'rgba(176, 128, 76, 0.88)';
      } else if (variety === 'goshiki') {
        baseCol = '#5c6b7d';
        bellyCol = '#dce2e8';
        finTint = 'rgba(238, 242, 248, 0.85)';
      }

      ctx.fillStyle = baseCol;
      ctx.fillRect(0, 0, bodyW + 4, H);

      // Variety-specific bold dorsal patterns centered cleanly around dorsal spine v = 0.5
      if (variety === 'kohaku') {
        const hi = localRng() > 0.45 ? '#e6361f' : '#f04e23';
        const steps = 3 + Math.floor(localRng() * 2);
        for (let i = 0; i < steps; i++) {
          const u = 0.09 + (i / steps) * 0.72 + (localRng() - 0.5) * 0.04;
          const v = 0.5 + (localRng() - 0.5) * 0.07;
          drawOrganicPatch(u, v, 0.14 + localRng() * 0.06, 0.22 + localRng() * 0.07, hi);
        }
      } else if (variety === 'benigoi') {
        // Brilliant scarlet-persimmon Aka Matsuba / Benigoi
        ctx.fillStyle = '#e8431f';
        ctx.fillRect(0, 0, bodyW + 4, H);
        ctx.strokeStyle = 'rgba(48, 18, 12, 0.26)';
        ctx.lineWidth = 1.6;
        for (let x = 42; x < bodyW; x += 14) {
          for (let y = 85; y < H - 85; y += 16) {
            ctx.beginPath();
            ctx.arc(x, y + ((x / 14) % 2) * 8, 6.5, -1.1, 1.1);
            ctx.stroke();
          }
        }
      } else if (variety === 'sanke') {
        const hi = '#e43820';
        for (let i = 0; i < 3; i++) {
          drawOrganicPatch(
            0.10 + i * 0.26 + (localRng() - 0.5) * 0.04,
            0.5 + (localRng() - 0.5) * 0.07,
            0.14 + localRng() * 0.05,
            0.22 + localRng() * 0.05,
            hi
          );
        }
        // Crisp Sumi black stepping stones along upper back
        for (let i = 0; i < 7; i++) {
          drawOrganicPatch(
            0.14 + localRng() * 0.70,
            0.38 + localRng() * 0.24,
            0.055 + localRng() * 0.035,
            0.08 + localRng() * 0.04,
            '#151619'
          );
        }
      } else if (variety === 'showa') {
        // Bold Stark White & Fiery Scarlet lightning bands over deep Sumi black
        for (let i = 0; i < 3; i++) {
          drawOrganicPatch(
            0.12 + i * 0.28 + (localRng() - 0.5) * 0.05,
            0.5 + (localRng() - 0.5) * 0.10,
            0.14 + localRng() * 0.05,
            0.25,
            '#f8f6f0'
          );
        }
        for (let i = 0; i < 3; i++) {
          drawOrganicPatch(
            0.07 + i * 0.28 + (localRng() - 0.5) * 0.04,
            0.5 + (localRng() - 0.5) * 0.08,
            0.13 + localRng() * 0.05,
            0.21,
            '#ea3f22'
          );
        }
      } else if (variety === 'tancho') {
        // Pure snow-white body with bold auspicious crimson crown circle on head (u ~ 0.115, v = 0.5)
        ctx.fillStyle = '#e42c1c';
        ctx.beginPath();
        ctx.ellipse(0.118 * bodyW, 0.5 * H, 0.078 * bodyW, 0.125 * H, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (variety === 'hi_utsuri') {
        for (let i = 0; i < 4; i++) {
          drawOrganicPatch(
            0.09 + i * 0.22 + (localRng() - 0.5) * 0.04,
            0.5 + (localRng() - 0.5) * 0.09,
            0.12 + localRng() * 0.04,
            0.26,
            '#f56a1c'
          );
        }
      } else if (variety === 'shusui') {
        // Sky-blue back + vivid persimmon-red flanks wrapping high enough to show from above + indigo dorsal scales
        ctx.fillStyle = '#eb4e26';
        ctx.fillRect(0.06 * bodyW, 0.16 * H, 0.80 * bodyW, 0.22 * H);
        ctx.fillRect(0.06 * bodyW, 0.62 * H, 0.80 * bodyW, 0.22 * H);
        ctx.fillStyle = '#1d324f';
        for (let s = 0; s < 14; s++) {
          const sx = (0.17 + s * 0.054) * bodyW;
          ctx.beginPath();
          ctx.ellipse(sx, 0.468 * H, 7.5, 10.5, 0.2, 0, Math.PI * 2);
          ctx.ellipse(sx, 0.532 * H, 7.5, 10.5, -0.2, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (variety === 'goshiki') {
        // Reticulated steel-blue net pattern + bright coral-vermilion dorsal medallions
        ctx.strokeStyle = 'rgba(28, 36, 48, 0.36)';
        ctx.lineWidth = 1.6;
        for (let x = 35; x < bodyW; x += 14) {
          for (let y = 60; y < H - 60; y += 16) {
            ctx.beginPath();
            ctx.arc(x, y + ((x / 14) % 2) * 8, 7, -1.1, 1.1);
            ctx.stroke();
          }
        }
        for (let i = 0; i < 3; i++) {
          drawOrganicPatch(0.12 + i * 0.27, 0.5 + (localRng() - 0.5) * 0.06, 0.14, 0.20, '#eb3d26');
        }
      } else if (variety === 'yamabuki' || variety === 'chagoi') {
        // Luminous golden-yellow / warm copper Fukurin net luster along dorsal scales
        if (variety === 'yamabuki') {
          const goldGrad = ctx.createLinearGradient(0, H * 0.25, 0, H * 0.75);
          goldGrad.addColorStop(0, '#f5be2e');
          goldGrad.addColorStop(0.5, '#ffd54f');
          goldGrad.addColorStop(1, '#f5be2e');
          ctx.fillStyle = goldGrad;
          ctx.fillRect(0, H * 0.2, bodyW + 4, H * 0.6);
        }
        ctx.strokeStyle =
          variety === 'yamabuki' ? 'rgba(255, 250, 205, 0.45)' : 'rgba(235, 192, 136, 0.34)';
        ctx.lineWidth = 1.6;
        for (let x = 42; x < bodyW; x += 14) {
          for (let y = 70; y < H - 70; y += 16) {
            ctx.beginPath();
            ctx.arc(x, y + ((x / 14) % 2) * 8, 7, -1.2, 1.2);
            ctx.stroke();
          }
        }
      }

      // Soft ventral belly shading near v = 0 & v = 1 + warm rosy snout tip
      const bellyGradTop = ctx.createLinearGradient(0, 0, 0, H * 0.22);
      bellyGradTop.addColorStop(0, bellyCol);
      bellyGradTop.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = bellyGradTop;
      ctx.fillRect(0, 0, bodyW, H * 0.22);

      const bellyGradBot = ctx.createLinearGradient(0, H, 0, H * 0.78);
      bellyGradBot.addColorStop(0, bellyCol);
      bellyGradBot.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = bellyGradBot;
      ctx.fillRect(0, H * 0.78, bodyW, H * 0.22);

      // Gill plate arc (*Era*) & subtle dorsal sheen
      ctx.strokeStyle = 'rgba(40, 30, 28, 0.20)';
      ctx.lineWidth = 3.0;
      [0.32, 0.68].forEach((gv) => {
        ctx.beginPath();
        ctx.arc(0.17 * bodyW, gv * H, 26, -0.7, 0.7);
        ctx.stroke();
      });

      // Eyes at u = 0.085, v = 0.34 & v = 0.66
      [0.345, 0.655].forEach((ev) => {
        const ex = 0.088 * bodyW;
        const ey = ev * H;
        ctx.fillStyle = '#e8c77b';
        ctx.beginPath();
        ctx.arc(ex, ey, 8.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111317';
        ctx.beginPath();
        ctx.arc(ex, ey, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ex - 1.8, ey - 1.5, 1.8, 0, Math.PI * 2);
        ctx.fill();
      });

      // Fin UV strip [0.75 .. 1.00]: translucent silky fin membrane + fin rays + Motoguro/Tejima accents
      ctx.clearRect(bodyW, 0, W - bodyW, H);
      const finGrad = ctx.createLinearGradient(bodyW, 0, W, 0);
      finGrad.addColorStop(0.0, finTint);
      finGrad.addColorStop(0.72, finTint);
      finGrad.addColorStop(1.0, finEdge);
      ctx.fillStyle = finGrad;
      ctx.fillRect(bodyW, 0, W - bodyW, H);

      if (variety === 'showa' || variety === 'hi_utsuri') {
        // *Motoguro* black root on fins
        const motoGrad = ctx.createLinearGradient(bodyW, 0, bodyW + (W - bodyW) * 0.52, 0);
        motoGrad.addColorStop(0, 'rgba(20, 21, 25, 0.94)');
        motoGrad.addColorStop(1, 'rgba(20, 21, 25, 0)');
        ctx.fillStyle = motoGrad;
        ctx.fillRect(bodyW, 0, (W - bodyW) * 0.55, H);
      } else if (variety === 'sanke') {
        // *Tejima* delicate sumi fin stripes
        ctx.strokeStyle = 'rgba(24, 25, 30, 0.72)';
        ctx.lineWidth = 3;
        for (let s = 50; s < H; s += 85) {
          ctx.beginPath();
          ctx.moveTo(bodyW + 4, s);
          ctx.lineTo(W - 18, s + 6);
          ctx.stroke();
        }
      }

      // Delicate radiating fin rays
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.38)';
      ctx.lineWidth = 1.2;
      for (let y = 4; y < H; y += 7) {
        ctx.beginPath();
        ctx.moveTo(bodyW, y);
        ctx.lineTo(W - 2, y);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(cnv);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    // Unified Parametric Koi Geometry:
    // Snout at z = +0.52, Tail tip at z = -0.88 (total length ~1.40 in unit space)
    // Attributes:
    //   aPart: 0=body, 1=left pectoral, 2=right pectoral, 3=dorsal, 4=caudal/pelvic, 5=lower jaw/barbels
    //   aFinSpan: 0 at root attached to body -> 1 at outer fin tip
    function createKoiGeometry() {
      const positions = [];
      const normals = [];
      const uvs = [];
      const partIds = [];
      const finSpans = [];
      const indices = [];

      function pushSubMesh(subPos, subNorm, subUv, partId, spanFn, subIdx) {
        const base = positions.length / 3;
        const vCount = subPos.length / 3;
        for (let i = 0; i < vCount; i++) {
          positions.push(subPos[i * 3], subPos[i * 3 + 1], subPos[i * 3 + 2]);
          normals.push(subNorm[i * 3], subNorm[i * 3 + 1], subNorm[i * 3 + 2]);
          uvs.push(subUv[i * 2], subUv[i * 2 + 1]);
          partIds.push(partId);
          finSpans.push(spanFn(i, subUv[i * 2], subUv[i * 2 + 1]));
        }
        for (let i = 0; i < subIdx.length; i++) {
          indices.push(base + subIdx[i]);
        }
      }

      // Helper for profile dimensions at normalized spine parameter s in [0..1]
      function bodyHalfWidth(s) {
        if (s <= 0.001) return 0.004;
        // Plump Nishikigoi head & shoulder peaking around s = 0.25, tapering smoothly to peduncle
        const headShoulder = Math.pow(Math.sin(Math.min(1, s / 0.28) * Math.PI * 0.5), 0.72);
        const taper = s < 0.28 ? 1.0 : Math.pow(1.0 - (s - 0.28) / 0.72, 1.18);
        return Math.max(0.021, 0.148 * headShoulder * taper + 0.020 * (1.0 - Math.abs(s - 0.95)));
      }

      function bodyHeightTop(s) {
        const arch = Math.sin(Math.pow(s, 0.72) * Math.PI);
        return Math.max(0.026, 0.158 * arch + 0.014);
      }

      function bodyHeightBot(s) {
        const belly = Math.sin(Math.pow(s, 0.78) * Math.PI);
        return Math.max(0.022, 0.118 * belly + 0.012);
      }

      // 1) Fusiform Body (38 spine rings x 24 radial segments)
      {
        const rings = 38;
        const radSegs = 24;
        const bPos = [];
        const bUv = [];
        const bIdx = [];

        for (let i = 0; i <= rings; i++) {
          const s = i / rings; // 0 snout -> 1 tail root
          const z = 0.52 - s * 1.02; // +0.52 to -0.50
          const hw = i === 0 ? 0.012 : bodyHalfWidth(s);
          const hTop = i === 0 ? 0.010 : bodyHeightTop(s);
          const hBot = i === 0 ? 0.010 : bodyHeightBot(s);
          // Slight snout droop for authentic koi head profile
          const centerOffsetY = s < 0.22 ? -0.018 * (1.0 - s / 0.22) : 0.0;

          for (let j = 0; j <= radSegs; j++) {
            const v = j / radSegs;
            // v = 0 & 1 at ventral belly, v = 0.5 at dorsal spine!
            const phi = (v - 0.5) * Math.PI * 2; // -PI (belly) -> 0 (dorsal top) -> +PI (belly)
            const nx = Math.sin(phi);
            const ny = Math.cos(phi);
            const hy = ny >= 0 ? hTop : hBot;
            bPos.push(nx * hw, ny * hy + centerOffsetY, z);
            bUv.push(s * 0.74, v);
          }
        }

        const stride = radSegs + 1;
        for (let i = 0; i < rings; i++) {
          for (let j = 0; j < radSegs; j++) {
            const a = i * stride + j;
            const b = a + 1;
            const c = a + stride;
            const d = c + 1;
            bIdx.push(a, b, c, b, d, c);
          }
        }

        const tmpGeo = new THREE.BufferGeometry();
        tmpGeo.setAttribute('position', new THREE.Float32BufferAttribute(bPos, 3));
        tmpGeo.setIndex(bIdx);
        tmpGeo.computeVertexNormals();

        // Mark lower snout vertices as jaw (`partId = 5`) so mouth gulps open during feeding
        const baseIdx = positions.length / 3;
        const nArr = tmpGeo.attributes.normal.array;
        for (let k = 0; k < bPos.length / 3; k++) {
          const pz = bPos[k * 3 + 2];
          const py = bPos[k * 3 + 1];
          positions.push(bPos[k * 3], py, pz);
          normals.push(nArr[k * 3], nArr[k * 3 + 1], nArr[k * 3 + 2]);
          uvs.push(bUv[k * 2], bUv[k * 2 + 1]);
          const isLowerLip = pz > 0.43 && py < -0.002;
          partIds.push(isLowerLip ? 5 : 0);
          finSpans.push(isLowerLip ? smoothstep(0.43, 0.52, pz) : 0);
        }
        for (let k = 0; k < bIdx.length; k++) {
          indices.push(baseIdx + bIdx[k]);
        }
      }

      // Helper to build double-sided thin sculpted fin surface
      function addDoubleSidedFin(gridCols, gridRows, evalPointFn, partId) {
        for (const sideFace of [1, -1]) {
          const fPos = [];
          const fUv = [];
          const fIdx = [];
          for (let r = 0; r <= gridRows; r++) {
            const rv = r / gridRows;
            for (let c = 0; c <= gridCols; c++) {
              const cu = c / gridCols; // 0 = fin root, 1 = fin tip
              const pt = evalPointFn(cu, rv);
              fPos.push(pt.x + sideFace * 0.0012 * pt.nx, pt.y + sideFace * 0.0012 * pt.ny, pt.z);
              fUv.push(0.76 + cu * 0.235, pt.texV);
            }
          }
          const stride = gridCols + 1;
          for (let r = 0; r < gridRows; r++) {
            for (let c = 0; c < gridCols; c++) {
              const i0 = r * stride + c;
              const i1 = i0 + 1;
              const i2 = i0 + stride;
              const i3 = i2 + 1;
              if (sideFace > 0) {
                fIdx.push(i0, i1, i2, i1, i3, i2);
              } else {
                fIdx.push(i0, i2, i1, i1, i2, i3);
              }
            }
          }
          const fg = new THREE.BufferGeometry();
          fg.setAttribute('position', new THREE.Float32BufferAttribute(fPos, 3));
          fg.setIndex(fIdx);
          fg.computeVertexNormals();
          pushSubMesh(
            fPos,
            fg.attributes.normal.array,
            fUv,
            partId,
            (_i, u) => clamp((u - 0.76) / 0.235, 0, 1),
            fIdx
          );
        }
      }

      // 2) Flowing Forked Caudal Veil Tail Fin (partId = 4)
      addDoubleSidedFin(
        8,
        14,
        (cu, rv) => {
          const lobe = (rv - 0.5) * 2.0; // -1 bottom lobe .. +1 top lobe
          const forkNotch = 1.0 - 0.28 * Math.exp(-lobe * lobe * 5.5);
          const len = 0.39 * cu * forkNotch;
          const spreadY = lobe * (0.024 + cu * 0.235 * (0.85 + 0.2 * Math.sin(cu * Math.PI)));
          const veilSwayX = Math.sin(cu * 2.2) * 0.008;
          return {
            x: veilSwayX,
            y: spreadY,
            z: -0.49 - len,
            nx: 1,
            ny: 0,
            texV: 0.05 + rv * 0.38
          };
        },
        4
      );

      // 3) Large Expressive Fan Pectoral Fins (partId = 1 Left, 2 Right)
      [-1, 1].forEach((sign) => {
        addDoubleSidedFin(
          7,
          10,
          (cu, rv) => {
            // Root behind gill plate at z ~ +0.24..+0.14, y ~ -0.055
            const rootZ = THREE.MathUtils.lerp(0.25, 0.13, rv);
            const rootX = sign * 0.118;
            const rootY = -0.058;
            // Fan outward & sweep gracefully backward in a rounded teardrop paddle
            const fanShape = Math.sin(rv * Math.PI * 0.92 + 0.12);
            const reachOut = cu * (0.195 * fanShape + 0.045);
            const sweepBack = cu * (0.04 + rv * 0.155) + cu * cu * 0.04;
            const droopY = -cu * 0.032 + Math.sin(cu * Math.PI) * 0.012;
            return {
              x: rootX + sign * reachOut,
              y: rootY + droopY,
              z: rootZ - sweepBack,
              nx: 0,
              ny: 1,
              texV: 0.48 + rv * 0.28
            };
          },
          sign < 0 ? 1 : 2
        );
      });

      // 4) Smaller Paired Ventral / Pelvic Fins (partId = 1 & 2 with subtle flutter)
      [-1, 1].forEach((sign) => {
        addDoubleSidedFin(
          5,
          6,
          (cu, rv) => {
            const rootZ = THREE.MathUtils.lerp(-0.04, -0.12, rv);
            const fan = Math.sin(rv * Math.PI * 0.9 + 0.15);
            return {
              x: sign * (0.058 + cu * 0.095 * fan),
              y: -0.095 - cu * 0.038,
              z: rootZ - cu * (0.05 + rv * 0.08),
              nx: 0,
              ny: 1,
              texV: 0.52 + rv * 0.20
            };
          },
          sign < 0 ? 1 : 2
        );
      });

      // 5) Tall Flowing Dorsal Ridge Fin (partId = 3)
      addDoubleSidedFin(
        6,
        14,
        (cu, rv) => {
          const s = THREE.MathUtils.lerp(0.32, 0.76, rv);
          const z = 0.52 - s * 1.02;
          const baseTop = bodyHeightTop(s) - 0.012;
          const profileH = (1.0 - rv * 0.42) * Math.sin(Math.min(1, rv * 3.5) * Math.PI * 0.5);
          return {
            x: 0,
            y: baseTop + cu * 0.135 * profileH,
            z: z - cu * 0.065,
            nx: 1,
            ny: 0,
            texV: 0.82 + rv * 0.16
          };
        },
        3
      );

      // 6) Paired Sensory Barbels (`鲤须`) at corners of upper lip (partId = 5)
      [-1, 1].forEach((sign) => {
        const bCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(sign * 0.034, -0.018, 0.495),
          new THREE.Vector3(sign * 0.068, -0.034, 0.515),
          new THREE.Vector3(sign * 0.092, -0.052, 0.492)
        ]);
        const bg = new THREE.TubeGeometry(bCurve, 5, 0.0065, 5, false);
        pushSubMesh(
          bg.attributes.position.array,
          bg.attributes.normal.array,
          bg.attributes.uv.array,
          5,
          () => 0.35,
          Array.from(bg.index.array)
        );
      });

      const finalGeo = new THREE.BufferGeometry();
      finalGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      finalGeo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      finalGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      finalGeo.setAttribute('aPart', new THREE.Float32BufferAttribute(partIds, 1));
      finalGeo.setAttribute('aFinSpan', new THREE.Float32BufferAttribute(finSpans, 1));
      finalGeo.setIndex(indices);
      finalGeo.computeBoundingSphere();
      finalGeo.boundingSphere.radius = 1.25;
      return finalGeo;
    }

    const sharedKoiGeo = createKoiGeometry();

    // Shared GLSL vertex deformation snippet for Koi (used in BOTH surface material & shadow depth material!)
    const KOI_DEFORM_PARS = /* glsl */ `
      attribute float aPart;
      attribute float aFinSpan;
      uniform float uSwimPhase;
      uniform float uSwimAmp;
      uniform float uTurnBend;
      uniform float uPecPhase;
      uniform float uPecTuck;
      uniform float uMouthOpen;

      vec3 deformKoiVertex(vec3 p) {
        // 1. Mouth gulp & barbel motion
        if (aPart > 4.5) {
          p.y -= uMouthOpen * aFinSpan * 0.045;
          p.z -= uMouthOpen * aFinSpan * 0.015;
        }

        // 2. Pectoral & Ventral fin rowing + sprint tuck + turn flare
        if (aPart > 0.5 && aPart < 2.5) {
          float isLeft = aPart < 1.5 ? -1.0 : 1.0;
          float rowAngle = sin(uPecPhase + isLeft * 0.35) * 0.24 * (1.0 - uPecTuck * 0.65);
          // Tuck fins closer to flanks when sprinting toward food
          p.x *= mix(1.0, 0.62, uPecTuck * aFinSpan);
          p.z -= uPecTuck * aFinSpan * 0.06;
          p.y += rowAngle * aFinSpan * 0.14;
          p.z += cos(uPecPhase) * aFinSpan * 0.025 * (1.0 - uPecTuck);
        }

        // 3. Dorsal fin secondary silk wave
        if (aPart > 2.5 && aPart < 3.5) {
          p.x += sin(uSwimPhase * 1.15 - p.z * 7.5) * aFinSpan * 0.032;
        }

        // 4. Caudal tail veil extra whip
        if (aPart > 3.5 && aPart < 4.5) {
          p.x += sin(uSwimPhase - 4.2 - aFinSpan * 1.45) * aFinSpan * uSwimAmp * 0.52;
        }

        // 5. Biomechanical travelling S-wave + smooth C-curve steering bend along spine
        //    Snout is z = +0.52 (tSpine = 0), tail tip is z = -0.88 (tSpine ~ 1.37)
        float tSpine = clamp((0.52 - p.z) / 1.02, 0.0, 1.42);
        float propulsiveEnv = pow(tSpine, 1.72) * 0.85 + 0.03 * sin(tSpine * 3.14159);
        float sWave = sin(uSwimPhase - tSpine * 4.45) * uSwimAmp * propulsiveEnv;

        // C-bend centered around shoulder (z = +0.18) so head leads into turns and tail arcs smoothly
        float zRel = p.z - 0.18;
        float cBend = -uTurnBend * zRel * abs(zRel) * 0.85;

        float lateralDisp = sWave + cBend;
        float slopeApprox =
          -cos(uSwimPhase - tSpine * 4.45) * (4.45 / 1.02) * uSwimAmp * propulsiveEnv * 0.55 -
          uTurnBend * zRel * 1.1;

        p.x += lateralDisp;
        p.z -= p.x * slopeApprox * 0.18;
        return p;
      }
    `;

    function createKoiMaterials(skinTex, variety, koiUniforms) {
      const isMetallic = variety === 'yamabuki' || variety === 'platinum' || variety === 'shusui';
      const mat = new THREE.MeshStandardMaterial({
        map: skinTex,
        bumpMap: koiScaleBumpTex,
        bumpScale: 0.012,
        roughness: isMetallic ? 0.22 : 0.28,
        metalness: isMetallic ? 0.22 : 0.04,
        transparent: true,
        alphaTest: 0.08
      });

      mat.onBeforeCompile = (shader) => {
        Object.assign(shader.uniforms, koiUniforms, {
          uTime: globalUniforms.uTime,
          uSunDir: globalUniforms.uSunDir,
          uWaterDeep: globalUniforms.uWaterDeep,
          uCausticIntensity: globalUniforms.uCausticIntensity
        });

        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', `#include <common>\n${KOI_DEFORM_PARS}\nvarying vec3 vPondWorldPos;`)
          .replace(
            '#include <beginnormal_vertex>',
            `#include <beginnormal_vertex>
             float tSpN = clamp((0.52 - position.z) / 1.02, 0.0, 1.42);
             float yawNorm = cos(uSwimPhase - tSpN * 4.45) * uSwimAmp * pow(tSpN, 1.5) * 2.2 + uTurnBend * (position.z - 0.18) * 1.2;
             float cN = cos(yawNorm * 0.45);
             float sN = sin(yawNorm * 0.45);
             objectNormal.xz = mat2(cN, -sN, sN, cN) * objectNormal.xz;`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
             transformed = deformKoiVertex(transformed);`
          )
          .replace(
            '#include <worldpos_vertex>',
            `#include <worldpos_vertex>
             vPondWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', `#include <common>\n${CAUSTIC_GLSL_PARS}`)
          .replace(
            '#include <dithering_fragment>',
            `if (vPondWorldPos.y < 0.04) {
               float caust = computePondCaustics(vPondWorldPos);
               gl_FragColor.rgb += vec3(1.0, 0.98, 0.86) * caust * 0.36;
               float depthMeters = max(0.0, -vPondWorldPos.y);
               float absorb = 1.0 - exp(-depthMeters * 0.32);
               gl_FragColor.rgb = mix(gl_FragColor.rgb, uWaterDeep * 1.85, clamp(absorb * 0.34, 0.0, 0.42));
             }
             #include <dithering_fragment>`
          );
      };

      // Custom depth material so shadows cast on pond floor undulate in sync with the koi!
      const depthMat = new THREE.MeshDepthMaterial({
        depthPacking: THREE.RGBADepthPacking
      });
      depthMat.onBeforeCompile = (shader) => {
        Object.assign(shader.uniforms, koiUniforms);
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', `#include <common>\n${KOI_DEFORM_PARS}`)
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
             transformed = deformKoiVertex(transformed);`
          );
      };

      return { mat, depthMat };
    }

    // Spawn 16 diverse Nishikigoi with authentic varieties & sizes
    const KOI_ROSTER = [
      { variety: 'kohaku', scale: 0.98, depthPref: -0.54 },
      { variety: 'sanke', scale: 1.04, depthPref: -0.68 },
      { variety: 'showa', scale: 0.95, depthPref: -0.84 },
      { variety: 'tancho', scale: 0.90, depthPref: -0.50 },
      { variety: 'yamabuki', scale: 1.08, depthPref: -0.88 }, // Majestic Golden Jumbo
      { variety: 'benigoi', scale: 0.86, depthPref: -0.60 },  // Brilliant Scarlet Aka Matsuba
      { variety: 'shusui', scale: 0.88, depthPref: -0.74 },
      { variety: 'hi_utsuri', scale: 0.92, depthPref: -0.98 },
      { variety: 'chagoi', scale: 1.12, depthPref: -0.62 },   // Friendly Bronze Matriarch
      { variety: 'goshiki', scale: 0.80, depthPref: -0.80 },
      { variety: 'kohaku', scale: 0.78, depthPref: -0.46 },
      { variety: 'sanke', scale: 0.74, depthPref: -0.64 },
      { variety: 'showa', scale: 0.76, depthPref: -1.06 },
      { variety: 'yamabuki', scale: 0.72, depthPref: -0.52 },
      { variety: 'platinum', scale: 0.70, depthPref: -0.88 },
      { variety: 'hi_utsuri', scale: 0.72, depthPref: -0.70 }
    ];

    const koiSchool = [];
    const koiGroup = new THREE.Group();
    worldGroup.add(koiGroup);

    KOI_ROSTER.forEach((spec, idx) => {
      const koiUniforms = {
        uSwimPhase: { value: randRange(0, Math.PI * 2) },

      };

      const skinTex = createKoiVarietyTexture(spec.variety, 5000 + idx * 137);
      const { mat, depthMat } = createKoiMaterials(skinTex, spec.variety, koiUniforms);
      const mesh = new THREE.Mesh(sharedKoiGeo, mat);
      mesh.customDepthMaterial = depthMat;
      mesh.castShadow = true;
      mesh.receiveShadow = false;

      // Find valid initial position inside pond

      koiSchool.push({
        id: idx,

        pitch: 0,
        bank: 0,
        speed: randRange(0.68, 0.95),
        cruiseSpeed: randRange(0.68, 0.98) * (1.06 - spec.scale * 0.14),
        sprintSpeed: randRange(1.72, 2.22),
        depthPref: spec.depthPref,
        wanderAngle: randRange(0, Math.PI * 2),

        // Feeding AI state

        targetPellet: null,
        reactionDelay: 0,
        modeTimer: 0,
        gulpTimer: 0,
        turnSmooth: 0,
        surfaceRippleCooldown: 0
      });
    });

    // =========================================================================
    // 11. FLOATING KOI FOOD PELLETS, SPLASH DROPLETS & FEEDING SYSTEM
    // =========================================================================
    const pellets = [];
    const splashDroplets = [];
    const pelletGroup = new THREE.Group();
    worldGroup.add(pelletGroup);

    const pelletGeo = new THREE.SphereGeometry(0.056, 10, 8);
    pelletGeo.scale(1.12, 0.78, 1.0);
    const pelletMatWarm = new THREE.MeshStandardMaterial({

    });

    const dropletMat = new THREE.MeshPhysicalMaterial({

    });

    function spawnWaterSplashBurst(x, z, count = 9, power = 1.0) {
      for (let i = 0; i < count; i++) {
        if (splashDroplets.length > 90) break;
        const m = new THREE.Mesh(dropletGeo, dropletMat);

          vy: randRange(1.25, 2.55) * power,

        });

    }

    let feedScatterCycle = 0;
    const FEED_ZONES = [
      { x: 0.15, z: 0.65 },   // Prime sunlit center-front well clear of pier
      { x: 1.25, z: 0.10 },   // Central deep emerald basin
      { x: -1.05, z: 0.15 },  // Mid-west sunlit water
      { x: 0.35, z: -0.95 }   // Under maple reflection
    ];

    function tossFoodPellets(centerX, centerZ, count = 20, announce = true) {
      // Cap total active pellets cleanly so rapid clicking stays silky-smooth
      const maxAllowed = 56;
      const toSpawn = Math.min(count, Math.max(6, maxAllowed - pellets.length));

      // Arc origin from the front lip of the SW cedar viewing deck (-2.4, 1.15, 3.15)
      const originX = -2.42;
      const originY = 1.18;
      const originZ = 3.18;

      let spawnedNow = 0;
      for (let i = 0; i < toSpawn; i++) {
        let tx = centerX + randRange(-1.45, 1.45);
        let tz = centerZ + randRange(-1.15, 1.15);

        // Ensure pellet lands inside open water away from rocks/pads/deck
        if (pondSDF(tx, tz) > -0.95 || (tx < -1.8 && tz > 2.2)) {
          tx = centerX * 0.55 + randRange(-0.65, 0.65);
          tz = centerZ * 0.55 + randRange(-0.55, 0.55);
        }

        const flightDuration = randRange(0.28, 0.54);
        const mesh = new THREE.Mesh(
          pelletGeo,
          i % 3 === 0 ? pelletMatGreen : pelletMatWarm
        );
        mesh.castShadow = true;
        mesh.position.set(originX, originY, originZ);
        pelletGroup.add(mesh);

        pellets.push({
          mesh,
          state: 'airborne', // 'airborne' | 'floating'
          flightAge: 0,
          flightDuration,
          sx: originX + randRange(-0.18, 0.18),
          sy: originY + randRange(-0.08, 0.12),
          sz: originZ + randRange(-0.18, 0.18),
          tx,
          tz,
          x: originX,
          y: originY,
          z: originZ,
          bobPhase: randRange(0, Math.PI * 2),
          eaten: false
        });
        spawnedNow++;
      }

      // Alert koi school with realistic staggered sensory reaction times!
      koiSchool.forEach((koi) => {
        if (koi.mode !== 'seek_food') {
          const distToDrop = Math.hypot(koi.pos.x - centerX, koi.pos.z - centerZ);
          koi.reactionDelay = clamp(0.18 + distToDrop * 0.045 + randRange(0.0, 0.22), 0.15, 0.72);
        }
      });

      playFeedTossSound();
      updateFeedingHUD();
      if (announce && spawnedNow > 0) {
        announceSR(`已向池面抛洒 ${spawnedNow} 粒锦鲤鱼粮，群鱼正转身游向水面争食。`);
      }
    }

    function updateFeedingHUD() {
      const remaining = pellets.length;
      if (remaining > 0) {
        pelletBadge.hidden = false;
        pelletBadge.textContent = `${remaining}`;
        statusPill.dataset.feeding = 'true';
        statusText.textContent = `水面余粮 ${remaining} 粒 · 锦鲤聚拢争食中`;
      } else {
        pelletBadge.hidden = true;
        const anyLingering = koiSchool.some((k) => k.mode === 'linger' || k.mode === 'savor_dive');
        statusPill.dataset.feeding = 'false';
        statusText.textContent = anyLingering
          ? '鱼粮已尽数啄食 · 锦鲤徐徐潜回深水'
          : '16 尾锦鲤悠游巡池 · 叠石飞瀑长流';
      }
    }

    // =========================================================================
    // 12. KOI STEERING, BOIDS SCHOOLING & DISTINCT FEEDING FRENZY AI
    // =========================================================================
    const _quatYaw = new THREE.Quaternion();
    const _quatPitch = new THREE.Quaternion();
    const _quatRoll = new THREE.Quaternion();
    const _axisY = new THREE.Vector3(0, 1, 0);
    const _axisX = new THREE.Vector3(1, 0, 0);
    const _axisZ = new THREE.Vector3(0, 0, 1);

    function normalizeAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function pickBestPelletForKoi(koi) {
      let best = null;
      let bestScore = Infinity;
      for (let i = 0; i < pellets.length; i++) {
        const p = pellets[i];
        if (p.eaten) continue;
        const px = p.state === 'airborne' ? p.tx : p.x;
        const pz = p.state === 'airborne' ? p.tz : p.z;
        const dist = Math.hypot(px - koi.pos.x, pz - koi.pos.z);

        // Count how many other koi already target this exact pellet so the school spreads naturally across the cluster
        let crowd = 0;
        for (let j = 0; j < koiSchool.length; j++) {
          if (koiSchool[j] !== koi && koiSchool[j].targetPellet === p) crowd++;
        }
        const score = dist + crowd * 0.68 + (p.state === 'airborne' ? 0.35 : 0);
        if (score < bestScore) {
          bestScore = score;
          best = p;
        }
      }
      return best;
    }

    function stepKoiSimulation(dt, timeNow) {
      const floatingOrIncomingPellets = pellets.length > 0;

      for (let i = 0; i < koiSchool.length; i++) {
        const koi = koiSchool[i];

        // 1. Update Sensory Reaction & Behavioral State Transitions
        if (floatingOrIncomingPellets) {
          if (koi.reactionDelay > 0) {
            koi.reactionDelay -= dt;
            if (koi.reactionDelay <= 0 && koi.mode !== 'savor_dive') {
              koi.mode = 'seek_food';
              koi.targetPellet = pickBestPelletForKoi(koi);
            }
          } else if (koi.mode !== 'seek_food' && koi.mode !== 'savor_dive') {
            koi.mode = 'seek_food';
            koi.targetPellet = pickBestPelletForKoi(koi);
          }
        }

        if (koi.mode === 'savor_dive') {
          koi.modeTimer -= dt;
          if (koi.modeTimer <= 0) {
            if (pellets.length > 0) {
              koi.mode = 'seek_food';
              koi.targetPellet = pickBestPelletForKoi(koi);
            } else {
              koi.mode = 'linger';
              koi.modeTimer = randRange(1.4, 2.4);
            }
          }
        } else if (koi.mode === 'linger') {
          koi.modeTimer -= dt;
          if (pellets.length > 0) {
            koi.mode = 'seek_food';
            koi.targetPellet = pickBestPelletForKoi(koi);
          } else if (koi.modeTimer <= 0) {
            koi.mode = 'cruise';
            updateFeedingHUD();
          }
        }

        if (koi.mode === 'seek_food') {
          if (!koi.targetPellet || koi.targetPellet.eaten || !pellets.includes(koi.targetPellet)) {
            koi.targetPellet = pickBestPelletForKoi(koi);
            if (!koi.targetPellet) {
              koi.mode = 'linger';
              koi.modeTimer = randRange(1.2, 2.2);
              updateFeedingHUD();
            }
          }
        }

        // 2. Compute Desired Velocity Vector & Depth Target
        let desiredDirX = Math.sin(koi.heading);
        let desiredDirZ = Math.cos(koi.heading);
        let targetY = koi.depthPref + Math.sin(timeNow * 0.45 + koi.id * 1.3) * 0.14;
        let targetSpeed = koi.cruiseSpeed;
        let maxTurnRate = 1.55;
        let targetMouthOpen = 0.0;
        let targetPecTuck = 0.0;

        if (koi.mode === 'seek_food' && koi.targetPellet) {
          const p = koi.targetPellet;
          const tx = p.state === 'airborne' ? p.tx : p.x;
          const tz = p.state === 'airborne' ? p.tz : p.z;
          const dx = tx - koi.pos.x;
          const dz = tz - koi.pos.z;
          const horizDist = Math.hypot(dx, dz) || 0.001;

          desiredDirX = dx / horizDist;
          desiredDirZ = dz / horizDist;

          // Distinct feeding behavior: decisive sharp turns, high-speed sprint, ascending right to water surface!
          maxTurnRate = 4.65;
          targetSpeed = koi.sprintSpeed * clamp(0.68 + horizDist * 0.25, 0.72, 1.15);
          targetY = horizDist < 2.2 ? -0.055 * koi.scale : -0.18;
          targetPecTuck = horizDist > 0.45 ? 0.92 : 0.25;

          // Open mouth eagerly as snout approaches floating pellet
          if (p.state === 'floating' && horizDist < 0.75) {
            targetMouthOpen = smoothstep(0.75, 0.22, horizDist);
          }

          // Check snout arrival at floating pellet!
          const snoutX = koi.pos.x + Math.sin(koi.heading) * (0.48 * koi.scale);
          const snoutZ = koi.pos.z + Math.cos(koi.heading) * (0.48 * koi.scale);
          const biteDist = Math.hypot(p.x - snoutX, p.z - snoutZ);

          if (p.state === 'floating' && !p.eaten && biteDist < 0.28 * koi.scale + 0.10 && koi.pos.y > -0.28) {
            p.eaten = true;
            koi.gulpTimer = 0.28;
            spawnRipple(p.x, p.z, 1.35 * koi.scale, timeNow);
            spawnWaterSplashBurst(p.x, p.z, 7, 0.85 * koi.scale);
            playKoiBiteSound();

            // Remove eaten pellet immediately
            pelletGroup.remove(p.mesh);
            const idxP = pellets.indexOf(p);
            if (idxP !== -1) pellets.splice(idxP, 1);

            // Satisfied nibble/dive pause before seeking next pellet so the whole school shares the feast!
            koi.mode = 'savor_dive';
            koi.modeTimer = pellets.length > 0 ? randRange(0.62, 1.08) : randRange(0.85, 1.35);
            koi.targetPellet = null;
            updateFeedingHUD();
          }
        } else if (koi.mode === 'savor_dive') {
          targetSpeed = koi.cruiseSpeed * 1.65;
          targetY = -0.38 - 0.18 * koi.scale;
          maxTurnRate = 2.6;
          targetPecTuck = 0.35;
        } else if (koi.mode === 'linger') {
          // Excited circling swirls near surface searching for remaining crumbs
          koi.wanderAngle += (koi.id % 2 === 0 ? 1 : -1) * dt * 1.65;
          desiredDirX = Math.sin(koi.heading + Math.sin(koi.wanderAngle) * 0.75);
          desiredDirZ = Math.cos(koi.heading + Math.sin(koi.wanderAngle) * 0.75);
          targetSpeed = koi.cruiseSpeed * 1.32;
          targetY = -0.22 - 0.12 * (koi.id % 3);
          maxTurnRate = 2.4;
        } else {
          // Serene Cruising: smooth wandering + gentle Boids schooling cohesion/alignment/separation
          koi.wanderTimer -= dt;
          if (koi.wanderTimer <= 0) {
            koi.wanderTimer = randRange(2.4, 5.8);
            koi.wanderAngle += randRange(-1.15, 1.15);
          }
          desiredDirX = Math.sin(koi.heading) * 0.72 + Math.sin(koi.wanderAngle) * 0.38;
          desiredDirZ = Math.cos(koi.heading) * 0.72 + Math.cos(koi.wanderAngle) * 0.38;

          // Gentle Boids neighbor interaction
          let sepX = 0, sepZ = 0;
          let aliX = 0, aliZ = 0;
          let cohX = 0, cohZ = 0;
          let neighbors = 0;

          for (let j = 0; j < koiSchool.length; j++) {
            if (i === j) continue;
            const other = koiSchool[j];
            const dx = koi.pos.x - other.pos.x;
            const dz = koi.pos.z - other.pos.z;
            const dSq = dx * dx + dz * dz;
            if (dSq < 6.25 && dSq > 0.0001) {
              const d = Math.sqrt(dSq);
              if (d < 1.15) {
                const push = (1.15 - d) / 1.15;
                sepX += (dx / d) * push * 1.45;
                sepZ += (dz / d) * push * 1.45;
              }
              aliX += Math.sin(other.heading);
              aliZ += Math.cos(other.heading);
              cohX += other.pos.x;
              cohZ += other.pos.z;
              neighbors++;
            }
          }

          if (neighbors > 0) {
            desiredDirX += sepX * 0.85 + (aliX / neighbors) * 0.24 + ((cohX / neighbors - koi.pos.x) * 0.06);
            desiredDirZ += sepZ * 0.85 + (aliZ / neighbors) * 0.24 + ((cohZ / neighbors - koi.pos.z) * 0.06);
          }
        }

        // Keep comfortable personal space even during feeding jostle so meshes don't intersect
        if (koi.mode !== 'cruise') {
          for (let j = 0; j < koiSchool.length; j++) {
            if (i === j) continue;
            const other = koiSchool[j];
            const dx = koi.pos.x - other.pos.x;
            const dy = (koi.pos.y - other.pos.y) * 1.6;
            const dz = koi.pos.z - other.pos.z;
            const d = Math.hypot(dx, dy, dz);
            const minSep = (koi.scale + other.scale) * 0.34;
            if (d < minSep && d > 0.001) {
              desiredDirX += (dx / d) * 0.72;
              desiredDirZ += (dz / d) * 0.72;
            }
          }
        }

        // 3. Shoreline & Boulder Obstacle Avoidance (guaranteed containment inside water!)
        const lookAhead = koi.pos.x + Math.sin(koi.heading) * (0.95 * koi.scale + koi.speed * 0.38);
        const lookAheadZ = koi.pos.z + Math.cos(koi.heading) * (0.95 * koi.scale + koi.speed * 0.38);
        const sdfAhead = pondSDF(lookAhead, lookAheadZ);
        const sdfHere = pondSDF(koi.pos.x, koi.pos.z);

        if (sdfAhead > -0.95 || sdfHere > -0.85) {
          const grad = pondGradient(koi.pos.x, koi.pos.z);
          const urgency = clamp((Math.max(sdfAhead, sdfHere) + 0.95) * 2.4, 0, 4.2);
          desiredDirX -= grad.x * urgency;
          desiredDirZ -= grad.z * urgency;
          maxTurnRate = Math.max(maxTurnRate, 3.8);
          koi.wanderAngle = Math.atan2(-grad.x, -grad.z) + randRange(-0.4, 0.4);
        }

        // Steer around internal submerged boulders
        for (let o = 0; o < pondObstacles.length; o++) {
          const obs = pondObstacles[o];
          const ox = koi.pos.x - obs.x;
          const oz = koi.pos.z - obs.z;
          const od = Math.hypot(ox, oz);
          const safeR = obs.r + 0.68 * koi.scale;
          if (od < safeR && od > 0.001) {
            const push = ((safeR - od) / safeR) * 2.8;
            desiredDirX += (ox / od) * push;
            desiredDirZ += (oz / od) * push;
            maxTurnRate = Math.max(maxTurnRate, 3.4);
          }
        }

        // 4. Integrate Heading, Speed, Pitch, Banking & Position
        const desiredHeading = Math.atan2(desiredDirX, desiredDirZ);
        const deltaAngle = normalizeAngle(desiredHeading - koi.heading);
        const turnStep = clamp(deltaAngle * 3.6, -maxTurnRate, maxTurnRate);
        koi.heading = normalizeAngle(koi.heading + turnStep * dt);

        // Smooth C-bend curvature & subtle roll banking into turns
        koi.turnSmooth = THREE.MathUtils.lerp(koi.turnSmooth, clamp(turnStep * 0.34, -0.85, 0.85), dt * 7.5);
        koi.speed = THREE.MathUtils.lerp(koi.speed, targetSpeed, dt * (koi.mode === 'seek_food' ? 4.8 : 2.2));

        koi.pos.x += Math.sin(koi.heading) * koi.speed * dt;
        koi.pos.z += Math.cos(koi.heading) * koi.speed * dt;

        // Hard safety clamp inside pond shoreline
        const postSdf = pondSDF(koi.pos.x, koi.pos.z);
        if (postSdf > -0.58) {
          const g = pondGradient(koi.pos.x, koi.pos.z);
          koi.pos.x -= g.x * (postSdf + 0.60);
          koi.pos.z -= g.z * (postSdf + 0.60);
        }

        // Vertical depth tracking & floor clearance
        const floorY = getBasinHeight(koi.pos.x, koi.pos.z) + 0.24 * koi.scale;
        const clampedTargetY = clamp(targetY, Math.min(floorY, -0.06), -0.045 * koi.scale);
        const prevY = koi.pos.y;
        const vertLerp = koi.mode === 'seek_food' ? 3.8 : 1.65;
        koi.pos.y = THREE.MathUtils.lerp(koi.pos.y, Math.max(floorY, clampedTargetY), dt * vertLerp);
        const vy = (koi.pos.y - prevY) / Math.max(dt, 0.001);

        // Pitch nose up when ascending to surface food, down when diving
        const targetPitch = clamp(-Math.atan2(vy, Math.max(koi.speed, 0.35)) * 0.85, -0.48, 0.42);
        koi.pitch = THREE.MathUtils.lerp(koi.pitch, targetPitch, dt * 6.5);
        koi.bank = THREE.MathUtils.lerp(koi.bank, clamp(-turnStep * 0.14, -0.32, 0.32), dt * 5.5);

        // Compose clean Yaw -> Pitch -> Bank quaternion
        _quatYaw.setFromAxisAngle(_axisY, koi.heading);
        _quatPitch.setFromAxisAngle(_axisX, koi.pitch);
        _quatRoll.setFromAxisAngle(_axisZ, koi.bank);
        koi.mesh.quaternion.copy(_quatYaw).multiply(_quatPitch).multiply(_quatRoll);

        // Subtle surface wake ripple when swimming close to water surface
        koi.surfaceRippleCooldown -= dt;
        if (koi.pos.y > -0.14 && koi.speed > 1.3 && koi.surfaceRippleCooldown <= 0) {
          spawnRipple(koi.pos.x, koi.pos.z, 0.42 * koi.scale, timeNow);
          koi.surfaceRippleCooldown = 0.34;
        }

        // Gently nudge floating lily pads if koi brushes right underneath
        if (koi.pos.y > -0.38) {
          for (let l = 0; l < lilyPads.length; l++) {
            const pad = lilyPads[l];
            const pdx = pad.x - koi.pos.x;
            const pdz = pad.z - koi.pos.z;
            const pd = Math.hypot(pdx, pdz);
            if (pd < pad.r + 0.32 * koi.scale) {
              pad.tiltVelX += (pdz / (pd + 0.1)) * koi.speed * dt * 0.45;
              pad.tiltVelZ -= (pdx / (pd + 0.1)) * koi.speed * dt * 0.45;
            }
          }
        }

        // 5. Update GPU Locomotion Uniforms
        if (koi.gulpTimer > 0) {
          koi.gulpTimer -= dt;
          targetMouthOpen = Math.max(targetMouthOpen, Math.sin((koi.gulpTimer / 0.28) * Math.PI));
        }

        const speedRatio = koi.speed / Math.max(koi.cruiseSpeed, 0.5);
        const tailFreq = 3.4 + koi.speed * 2.55;
        koi.uniforms.uSwimPhase.value += dt * tailFreq;
        koi.uniforms.uSwimAmp.value = THREE.MathUtils.lerp(
          koi.uniforms.uSwimAmp.value,
          clamp(0.095 + (speedRatio - 1.0) * 0.048, 0.085, 0.185),
          dt * 6.0
        );
        koi.uniforms.uTurnBend.value = koi.turnSmooth;
        koi.uniforms.uPecPhase.value += dt * (2.6 + koi.speed * 1.4);
        koi.uniforms.uPecTuck.value = THREE.MathUtils.lerp(koi.uniforms.uPecTuck.value, targetPecTuck, dt * 6.0);
        koi.uniforms.uMouthOpen.value = THREE.MathUtils.lerp(koi.uniforms.uMouthOpen.value, targetMouthOpen, dt * 14.0);
      }
    }

    // =========================================================================
    // 14. OPTIONAL PROCEDURAL WEB AUDIO (庭院流水 + 竹惊鹿 + 撒粮与啄食水花声)
    //     Off by default per WCAG 1.4.2; toggleable via #btn-audio
    // =========================================================================
    let audioCtx = null;
    let audioEnabled = false;
    let streamGainNode = null;

    function initOrToggleAudio() {
      const btnAudio = document.getElementById('btn-audio');
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
        window.ToyEmbed?.trackAudio(audioCtx);

        // Gentle filtered pink-ish waterfall stream murmur
        const bufferSize = audioCtx.sampleRate * 3;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const out = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.997 * b0 + white * 0.029;
          b1 = 0.985 * b1 + white * 0.032;
          b2 = 0.950 * b2 + white * 0.048;
          out[i] = (b0 + b1 + b2 + white * 0.018) * 0.35;
        }

        const src = audioCtx.createBufferSource();
        src.buffer = noiseBuffer;
        src.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 620;
        filter.Q.value = 0.65;

        streamGainNode = audioCtx.createGain();
        streamGainNode.gain.value = 0.0;

        src.connect(filter);
        filter.connect(streamGainNode);
        streamGainNode.connect(audioCtx.destination);
        src.start();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      audioEnabled = !audioEnabled;
      btnAudio.setAttribute('aria-pressed', String(audioEnabled));
      if (streamGainNode) {
        streamGainNode.gain.setTargetAtTime(audioEnabled ? 0.16 : 0.0, audioCtx.currentTime, 0.25);
      }
      announceSR(audioEnabled ? '已开启庭院流水与锦鲤声效' : '已关闭庭院声效');
    }

    function playWaterPlopSound(freqBase = 480, gainAmt = 0.06) {
      if (!audioEnabled || !audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freqBase, now);
      osc.frequency.exponentialRampToValueAtTime(freqBase * 1.65, now + 0.075);
      g.gain.setValueAtTime(gainAmt, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.09);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.095);
    }

    function playFeedTossSound() {
      if (!audioEnabled || !audioCtx) return;
      for (let k = 0; k < 4; k++) {
        setTimeout(() => playWaterPlopSound(540 + k * 70, 0.035), 260 + k * 65);
      }
    }

    function playKoiBiteSound() {
      playWaterPlopSound(310 + Math.random() * 140, 0.075);
    }

    function playBambooClackSound() {
      if (!audioEnabled || !audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(760, now);
      osc.frequency.exponentialRampToValueAtTime(390, now + 0.055);
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.0005, now + 0.08);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.085);
    }

    // =========================================================================
    // 15. UI EVENTS, WATER SURFACE CLICK-TO-FEED & ACCESSIBILITY

    // Primary「投喂锦鲤」Button

    });

    // Click directly on the water surface (without dragging OrbitControls) to toss pellets right where clicked!
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const hitPoint = new THREE.Vector3();
    let downPointer = { x: 0, y: 0, time: 0 };

    canvas.addEventListener('pointerdown', (e) => {
      downPointer = { x: e.clientX, y: e.clientY, time: performance.now() };
    });

    canvas.addEventListener('pointerup', (e) => {
      const moveDist = Math.hypot(e.clientX - downPointer.x, e.clientY - downPointer.y);
      const elapsed = performance.now() - downPointer.time;
      if (moveDist < 5 && elapsed < 320 && e.button === 0) {
        const rect = canvas.getBoundingClientRect();
        pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointerNDC, camera);
        if (raycaster.ray.intersectPlane(waterPlane, hitPoint)) {
          if (pondSDF(hitPoint.x, hitPoint.z) < -0.55) {
            if (isPaused) setPausedState(false);
            tossFoodPellets(hitPoint.x, hitPoint.z, 8, false);

      }

    // Camera Presets
    const camButtons = Array.from(document.querySelectorAll('.cam-btn'));

    // Pause / Resume Motion Control (WCAG 2.2.2)
    let isPaused = false;

    const pauseLabel = document.getElementById('pause-label');
    const pauseIcon = document.getElementById('pause-icon');

      pauseIcon.innerHTML = isPaused

    // Resize handling
    function handleResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.ToyEmbed?.pixelRatio ?? window.devicePixelRatio, 2));
      renderer.setSize(w, h, false);
      mistMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();

    // =========================================================================
    // 16. MAIN ANIMATION LOOP (WATER, PELLETS, KOI, MIST, LEAVES, SHISHI-ODOSHI)
    // =========================================================================
    let prevTime = performance.now();
    let simTime = 0;
    let shishiCycle = 0;
    let shishiClacked = false;

    function updateWaterfallMist(dt) {
      for (let i = 0; i < MIST_COUNT; i++) {
        const m = mistData[i];
        m.age += dt / m.life;
        if (m.age >= 1.0) {
          m.age = 0;
        }
        const t = m.age;
        const px = m.ox + m.vx * t * 1.6;
        const py = m.oy + m.vy * t - 0.22 * t * t;
        const pz = m.oz + m.vz * t * 1.6;
        mistPositions[i * 3] = px;
        mistPositions[i * 3 + 1] = py;
        mistPositions[i * 3 + 2] = pz;
        mistScales[i] = m.baseSize * (0.65 + t * 1.35);
        mistAlphas[i] = Math.sin(t * Math.PI) * (m.isUpper ? 0.24 : 0.30);
      }
      mistGeo.attributes.position.needsUpdate = true;
      mistGeo.attributes.aScale.needsUpdate = true;
      mistGeo.attributes.aAlpha.needsUpdate = true;
    }

    function updatePelletsAndSplashes(dt, timeNow) {
      // Update pellets (parabolic toss -> landing plop ripple -> buoyant bobbing & gentle current drift)
      for (let i = pellets.length - 1; i >= 0; i--) {
        const p = pellets[i];
        if (p.state === 'airborne') {
          p.flightAge += dt;
          const u = clamp(p.flightAge / p.flightDuration, 0, 1);
          p.x = THREE.MathUtils.lerp(p.sx, p.tx, u);
          p.z = THREE.MathUtils.lerp(p.sz, p.tz, u);
          const arcLift = Math.sin(u * Math.PI) * 0.95;
          p.y = THREE.MathUtils.lerp(p.sy, 0.015, u) + arcLift;
          p.mesh.position.set(p.x, p.y, p.z);

          if (u >= 1.0) {
            p.state = 'floating';
            p.x = p.tx;
            p.z = p.tz;
            p.y = 0.012;
            spawnRipple(p.x, p.z, 0.72, timeNow);
            spawnWaterSplashBurst(p.x, p.z, 3, 0.52);
          }
        } else {
          // Gentle outward surface current pushed by waterfall (-3.25, -2.7)
          const curDx = p.x + 3.25;
          const curDz = p.z + 2.70;
          const curDist = Math.hypot(curDx, curDz) + 0.5;
          const driftSpeed = 0.065 / curDist;
          const nx = p.x + (curDx / curDist) * driftSpeed * dt;
          const nz = p.z + (curDz / curDist) * driftSpeed * dt;
          if (pondSDF(nx, nz) < -0.62) {
            p.x = nx;
            p.z = nz;
          }
          p.y = 0.008 + Math.sin(timeNow * 4.2 + p.bobPhase) * 0.009;
          p.mesh.position.set(p.x, p.y, p.z);
        }
      }

      // Update ballistic splash droplets
      for (let i = splashDroplets.length - 1; i >= 0; i--) {
        const d = splashDroplets[i];
        d.age += dt;
        d.vy -= 6.8 * dt;
        d.mesh.position.x += d.vx * dt;
        d.mesh.position.y += d.vy * dt;
        d.mesh.position.z += d.vz * dt;
        if (d.mesh.position.y <= 0.0 || d.age > 0.75) {
          worldGroup.remove(d.mesh);
          splashDroplets.splice(i, 1);
        }
      }
    }

    function updateAmbientNature(dt, timeNow) {
      // 1. Lily pads gently bobbing & recovering from koi nudges
      for (let i = 0; i < lilyPads.length; i++) {
        const pad = lilyPads[i];
        pad.tiltVelX *= Math.exp(-dt * 3.2);
        pad.tiltVelZ *= Math.exp(-dt * 3.2);
        pad.mesh.position.y = 0.015 + Math.sin(timeNow * 1.65 + pad.phase) * 0.007;
        pad.mesh.rotation.x = Math.sin(timeNow * 1.3 + pad.phase) * 0.025 + pad.tiltVelX;
        pad.mesh.rotation.z = Math.cos(timeNow * 1.15 + pad.phase) * 0.025 + pad.tiltVelZ;
      }

      // 2. Drifting red maple leaves
      for (let i = 0; i < driftingLeaves.length; i++) {
        const lf = driftingLeaves[i];
        lf.age += dt;
        if (lf.state === 'falling') {
          lf.y -= 0.42 * dt;
          lf.x += Math.sin(timeNow * 1.9 + lf.phase) * 0.34 * dt - 0.12 * dt;
          lf.z += Math.cos(timeNow * 1.6 + lf.phase) * 0.28 * dt + 0.14 * dt;
          lf.mesh.position.set(lf.x, lf.y, lf.z);
          lf.mesh.rotation.set(
            Math.sin(timeNow * 2.4 + lf.phase) * 0.45,
            timeNow * 0.9 + lf.phase,
            Math.cos(timeNow * 2.1 + lf.phase) * 0.45
          );
          if (lf.y <= 0.022) {
            if (pondSDF(lf.x, lf.z) < -0.2) {
              lf.y = 0.020;
              lf.state = 'floating';
              lf.age = 0;
              lf.mesh.rotation.set(0, lf.phase, 0);
              spawnRipple(lf.x, lf.z, 0.25, timeNow);
            } else {
              resetDriftingLeaf(lf, false);
            }
          }
        } else {
          // Lazy drift across water surface
          lf.x += 0.045 * dt + Math.sin(timeNow * 0.6 + lf.phase) * 0.015 * dt;
          lf.z += 0.038 * dt;
          if (pondSDF(lf.x, lf.z) > -0.18) {
            lf.age = Math.max(lf.age, 10.5);
          }
          lf.y = 0.020 + Math.sin(timeNow * 2.2 + lf.phase) * 0.005;
          lf.mesh.position.set(lf.x, lf.y, lf.z);
          lf.mesh.rotation.y += 0.18 * dt;
          if (lf.age > 10.0) {
            lf.mat.opacity = Math.max(0, 1.0 - (lf.age - 10.0) / 2.2);
          }
          if (lf.age > 12.2) {
            resetDriftingLeaf(lf, false);
          }
        }
      }

      // 3. Hovering & darting iridescent damselflies
      for (let i = 0; i < damselflies.length; i++) {
        const df = damselflies[i];
        df.timer -= dt;
        if (df.timer <= 0 && lilyPads.length > 0) {
          const pad = lilyPads[Math.floor(rng() * lilyPads.length)];
          df.target.set(pad.x + randRange(-0.3, 0.3), randRange(0.18, 0.55), pad.z + randRange(-0.3, 0.3));
          df.timer = randRange(2.2, 5.0);
        }
        const prevX = df.pos.x;
        const prevZ = df.pos.z;
        df.pos.lerp(df.target, clamp(dt * 2.4, 0, 1));
        df.group.position.set(
          df.pos.x + Math.sin(timeNow * 4.5 + i * 2) * 0.035,
          df.pos.y + Math.sin(timeNow * 6.2 + i) * 0.025,
          df.pos.z + Math.cos(timeNow * 4.1 + i * 2) * 0.035
        );
        const mvX = df.pos.x - prevX;
        const mvZ = df.pos.z - prevZ;
        if (Math.hypot(mvX, mvZ) > 0.0005) {
          df.group.rotation.y = Math.atan2(mvX, mvZ);
        }
        for (let w = 0; w < df.wings.length; w++) {
          const wg = df.wings[w];
          wg.mesh.rotation.z = wg.sign * (0.18 + Math.sin(timeNow * 38.0 + wg.offset) * 0.42);
        }
      }

      // 4. Bamboo Shishi-odoshi (`竹惊鹿`) periodic fill-and-tip cycle + stone lantern candle flicker
      if (shishiTubeGroup) {
        shishiCycle = (shishiCycle + dt * 0.14) % 1.0;
        let tilt = 0;
        if (shishiCycle < 0.78) {
          shishiClacked = false;
          tilt = (shishiCycle / 0.78) * 0.22;
        } else if (shishiCycle < 0.86) {
          const u = (shishiCycle - 0.78) / 0.08;
          tilt = 0.22 - u * 0.62;
          if (!shishiClacked && u > 0.75) {
            shishiClacked = true;
            spawnRipple(5.95, 1.35, 0.65, timeNow);
            playBambooClackSound();
          }
        } else {
          const u = (shishiCycle - 0.86) / 0.14;
          tilt = -0.40 * (1.0 - u);
        }
        shishiTubeGroup.rotation.z = tilt;
      }

      const baseLantern = LIGHTING_MOODS[currentMoodIdx].lanternInt;
      lanternLight.intensity =
        baseLantern * (0.94 + 0.06 * Math.sin(timeNow * 7.3) + 0.04 * Math.cos(timeNow * 13.1));
    }

    function animate(now) {
      requestAnimationFrame(animate);
      if (document.hidden) {
        prevTime = now;
        return;
      }

      const rawDt = Math.min((now - prevTime) * 0.001, 0.05);
      prevTime = now;

      // Smooth preset camera glide
      if (camTransition) {
        camTransition.progress = Math.min(1, camTransition.progress + rawDt * 1.45);
        const ease = 1 - Math.pow(1 - camTransition.progress, 3);
        camera.position.lerpVectors(camTransition.startPos, camTransition.endPos, ease);
        controls.target.lerpVectors(camTransition.startTarget, camTransition.endTarget, ease);
        if (camTransition.progress >= 1) camTransition = null;
      }
      controls.update();

      const motionScale = isPaused ? 0 : prefersReducedMotion.matches ? 0.35 : 1.0;
      const dt = rawDt * motionScale;

      if (dt > 0) {
        simTime += dt;
        globalUniforms.uTime.value = simTime;
        updateWaterfallMist(dt);
        updatePelletsAndSplashes(dt, simTime);
        stepKoiSimulation(dt, simTime);
        updateAmbientNature(dt, simTime);
      }

      renderer.render(scene, camera);
    }

    // Warm up initial mist & hide loading curtain once first frame renders
    updateWaterfallMist(0.016);
    renderer.render(scene, camera);
    requestAnimationFrame((t) => {
      prevTime = t;
      const veil = document.getElementById('loading-veil');
      if (window.ToyEmbed?.preview) veil.remove();
      else veil.dataset.hidden = 'true';
      window.ToyEmbed?.ready();
      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
