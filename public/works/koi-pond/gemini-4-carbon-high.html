<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>翠微锦池 · Three.js 庭院锦鲤生态池</title>
  <style>
    @layer reset, base, theme, components, utilities;

    @layer theme {
      :root {
        --target-size: 32px;
        --font-sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        --font-serif: "Songti SC", "STSong", "Noto Serif SC", "SimSun", Georgia, serif;
        --pond-fallback: #0d2628;
        --ink-panel: rgba(12, 26, 29, 0.72);
        --ink-panel-strong: rgba(9, 20, 23, 0.88);
        --panel-border: rgba(218, 235, 226, 0.20);
        --panel-highlight: rgba(255, 255, 255, 0.08);
        --text-primary: #f4f7f2;
        --text-secondary: rgba(226, 236, 228, 0.78);
        --text-muted: rgba(196, 214, 202, 0.62);
        --koi-vermilion: #e24c34;
        --koi-vermilion-hover: #f05c43;
        --koi-gold: #f0c265;
        --jade-accent: #68c7b2;
        --focus-ring: #ffd875;
        --radius-pill: 999px;
        --radius-card: 18px;
        --shadow-elevated: 0 14px 36px rgba(4, 12, 14, 0.42);
      }

      @media (pointer: coarse) {
        :root {
          --target-size: 44px;
        }
      }
    }

    @layer reset {
      :where(html, body, header, main, div, h1, p, button, span, kbd) {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
    }

    @layer base {
      html, body {
        inline-size: 100%;
        block-size: 100%;
        overflow: hidden;
        background-color: var(--pond-fallback);
        color: var(--text-primary);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      :where(button) {
        min-block-size: var(--target-size);
        min-inline-size: var(--target-size);
        font-family: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        cursor: pointer;
      }

      :where(button, a:any-link, [tabindex]):focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 3px;
      }
    }

    @layer components {
      #pond-stage {
        position: fixed;
        inset: 0;
        inline-size: 100dvw;
        block-size: 100dvh;
      }

      #pond-canvas {
        display: block;
        inline-size: 100%;
        block-size: 100%;
        touch-action: none;
        cursor: grab;
      }

      #pond-canvas:active {
        cursor: grabbing;
      }

      /* Top HUD */
      .hud-header {
        position: fixed;
        inset-block-start: max(0.9rem, env(safe-area-inset-top, 0px));
        inset-inline: max(1rem, env(safe-area-inset-left, 0px)) max(1rem, env(safe-area-inset-right, 0px));
        z-index: 10;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.85rem;
        pointer-events: none;
      }

      .title-placard {
        pointer-events: auto;
        padding-block: 0.72rem;
        padding-inline: 1rem 1.15rem;
        background: var(--ink-panel);
        backdrop-filter: blur(16px) saturate(140%);
        -webkit-backdrop-filter: blur(16px) saturate(140%);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-elevated);
        max-inline-size: min(92dvw, 27rem);
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .seal-mark {
        display: inline-grid;
        place-items: center;
        inline-size: 1.55rem;
        block-size: 1.55rem;
        border-radius: 6px;
        background: linear-gradient(145deg, #d9442c, #b52d1a);
        color: #fff7eb;
        font-family: var(--font-serif);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 3px 8px rgba(181, 45, 26, 0.45);
        flex: none;
      }

      .title-placard h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.02rem, 0.92rem + 0.45vw, 1.32rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--text-primary);
      }

      .title-sub {
        margin-block-start: 0.3rem;
        font-size: clamp(0.74rem, 0.7rem + 0.18vw, 0.82rem);
        line-height: 1.45;
        color: var(--text-secondary);
      }

      .status-row {
        margin-block-start: 0.48rem;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding-block: 0.2rem;
        padding-inline: 0.62rem;
        border-radius: var(--radius-pill);
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.11);
        font-size: 0.74rem;
        color: var(--koi-gold);
      }

      .status-dot {
        inline-size: 0.46rem;
        block-size: 0.46rem;
        border-radius: 50%;
        background: var(--jade-accent);
        box-shadow: 0 0 8px var(--jade-accent);
        transition: background-color 0.25s ease, box-shadow 0.25s ease;
      }

      .status-row[data-feeding="true"] .status-dot {
        background: #ff7847;
        box-shadow: 0 0 10px #ff7847;
        @media (prefers-reduced-motion: no-preference) {
          animation: pulse-dot 0.9s ease-in-out infinite alternate;
        }
      }

      .top-actions {
        pointer-events: auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.5rem;
      }

      .glass-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.42rem;
        padding-block: 0.46rem;
        padding-inline: 0.82rem;
        border-radius: var(--radius-pill);
        background: var(--ink-panel);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        border: 1px solid var(--panel-border);
        box-shadow: 0 8px 22px rgba(4, 12, 14, 0.32);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--text-primary);
        transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.16s ease;
      }

      .glass-pill:hover:not(:disabled) {
        background: rgba(22, 44, 48, 0.86);
        border-color: rgba(240, 194, 101, 0.45);
      }

      .glass-pill:active:not(:disabled) {
        transform: scale(0.97);
      }

      .glass-pill[aria-pressed="true"] {
        background: rgba(34, 72, 68, 0.88);
        border-color: rgba(104, 199, 178, 0.65);
        color: #dffbf3;
      }

      .icon-svg {
        inline-size: 0.96rem;
        block-size: 0.96rem;
        flex: none;
      }

      /* Bottom Controls Dock */
      .hud-bottom {
        position: fixed;
        inset-block-end: max(1.05rem, env(safe-area-inset-bottom, 0px));
        inset-inline: max(1rem, env(safe-area-inset-left, 0px)) max(1rem, env(safe-area-inset-right, 0px));
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        pointer-events: none;
      }

      .feed-cta {
        pointer-events: auto;
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.62rem;
        padding-block: 0.72rem;
        padding-inline: 1.35rem 1.45rem;
        border-radius: var(--radius-pill);
        background: linear-gradient(135deg, #e85338 0%, #c93822 100%);
        border: 1px solid rgba(255, 224, 180, 0.52);
        box-shadow:
          0 10px 28px rgba(201, 56, 34, 0.48),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        font-size: clamp(0.9rem, 0.85rem + 0.2vw, 1rem);
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #fffaf2;
        transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, filter 0.2s ease;
      }

      .feed-cta:hover:not(:disabled) {
        filter: brightness(1.07);
        box-shadow:
          0 14px 34px rgba(226, 76, 52, 0.60),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
        @media (prefers-reduced-motion: no-preference) {
          transform: translateY(-2px);
        }
      }

      .feed-cta:active:not(:disabled) {
        transform: scale(0.96);
      }

      .feed-icon {
        inline-size: 1.22rem;
        block-size: 1.22rem;
        flex: none;
      }

      .pellet-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-inline-size: 1.45rem;
        padding-inline: 0.42rem;
        padding-block: 0.1rem;
        border-radius: var(--radius-pill);
        background: rgba(15, 24, 24, 0.42);
        border: 1px solid rgba(255, 236, 198, 0.35);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        color: #ffe8b3;
      }

      .pellet-badge[hidden] {
        display: none;
      }

      .camera-bar {
        pointer-events: auto;
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.3rem;
        padding: 0.32rem;
        border-radius: var(--radius-pill);
        background: var(--ink-panel);
        backdrop-filter: blur(16px) saturate(140%);
        -webkit-backdrop-filter: blur(16px) saturate(140%);
        border: 1px solid var(--panel-border);
        box-shadow: var(--shadow-elevated);
      }

      .cam-btn {
        padding-block: 0.42rem;
        padding-inline: 0.82rem;
        border-radius: var(--radius-pill);
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-secondary);
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      .cam-btn:hover:not(:disabled) {
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.08);
      }

      .cam-btn[data-active="true"] {
        background: rgba(240, 194, 101, 0.20);
        border: 1px solid rgba(240, 194, 101, 0.48);
        color: #ffebb8;
      }

      /* Loading veil */
      #loading-veil {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 45%, #153538 0%, #09181a 100%);
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }

      #loading-veil[data-hidden="true"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.9rem;
        text-align: center;
        padding: 1.5rem;
      }

      .ripple-loader {
        position: relative;
        inline-size: 3.2rem;
        block-size: 3.2rem;
      }

      .ripple-loader span {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--koi-gold);
        opacity: 0.65;
        @media (prefers-reduced-motion: no-preference) {
          animation: loader-ring 1.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }
      }

      .ripple-loader span:nth-child(2) {
        animation-delay: 0.6s;
      }

      .loader-text {
        font-family: var(--font-serif);
        font-size: 0.98rem;
        letter-spacing: 0.1em;
        color: #e8f1ec;
      }

      @keyframes loader-ring {
        0% {
          transform: scale(0.25);
          opacity: 0.9;
        }
        100% {
          transform: scale(1.25);
          opacity: 0;
        }
      }

      @keyframes pulse-dot {
        from {
          transform: scale(0.9);
          opacity: 0.8;
        }
        to {
          transform: scale(1.25);
          opacity: 1;
        }
      }

      @media (max-width: 680px) {
        .hud-header {
          flex-direction: column;
          align-items: stretch;
        }
        .title-placard {
          max-inline-size: 100%;
        }
        .top-actions {
          justify-content: flex-start;
        }
        .title-sub {
          display: none;
        }
      }
    }

    @layer utilities {
      .visually-hidden:where(:not(:focus-within, :active)) {
        position: absolute !important;
        clip-path: inset(50%) !important;
        overflow: hidden !important;
        width: 1px !important;
        height: 1px !important;
        margin: -1px !important;
        padding: 0 !important;
        border: 0 !important;
        white-space: nowrap !important;
      }
    }
  </style>

<body>
  <div id="loading-veil" aria-hidden="true">
    <div class="loader-box">
      <div class="ripple-loader"><span></span><span></span></div>

  <header class="hud-header">
    <div class="title-placard">

      </div>
      <p class="title-sub">拖拽环绕 · 滚轮缩放深浅细节 · 点击「投喂锦鲤」或轻点水面抛洒鱼粮</p>

  <main id="pond-stage">

      id="pond-canvas"

    ></canvas>

    <div class="hud-bottom">
      <button type="button" class="feed-cta" id="btn-feed-koi">

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // =========================================================================
    // 1. DETERMINISTIC PRNG & VALUE NOISE UTILITIES
    // =========================================================================
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const rng = mulberry32(20261127);
    const randRange = (min, max) => min + (max - min) * rng();

    function hash2(x, y) {
      const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    function valueNoise2D(x, y) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const fx = x - ix;
      const fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      const a = hash2(ix, iy);
      const b = hash2(ix + 1, iy);
      const c = hash2(ix, iy + 1);
      const d = hash2(ix + 1, iy + 1);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }

    function fbm2D(x, y, octaves = 4) {
      let sum = 0;
      let amp = 0.5;
      let freq = 1.0;
      for (let i = 0; i < octaves; i++) {
        sum += amp * (valueNoise2D(x * freq, y * freq) * 2 - 1);
        freq *= 2.03;
        amp *= 0.5;
      }
      return sum;
    }

    function smin(a, b, k) {
      const h = Math.max(k - Math.abs(a - b), 0.0) / k;
      return Math.min(a, b) - h * h * k * 0.25;
    }

    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    function smoothstep(e0, e1, x) {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    // =========================================================================
    // 2. ANALYTICAL POND BASIN SDF & BATHYMETRY
    //    Water level is y = 0.0
    //    pondSDF(x, z) < 0 inside water, 0 at shoreline, > 0 on banks
    // =========================================================================
    function pondSDF(x, z) {
      // Main viewing basin (center-south)
      const dx1 = (x + 0.15) / 6.35;
      const dz1 = (z - 0.65) / 4.85;
      const d1 = (Math.hypot(dx1, dz1) - 1.0) * 5.4;

      // Waterfall plunge pool lobe (north-west)
      const dx2 = (x + 3.55) / 3.65;
      const dz2 = (z + 2.95) / 3.15;
      const d2 = (Math.hypot(dx2, dz2) - 1.0) * 3.35;

      // Lotus & bamboo shallow cove (east)
      const dx3 = (x - 4.75) / 3.45;
      const dz3 = (z + 0.55) / 3.25;
      const d3 = (Math.hypot(dx3, dz3) - 1.0) * 3.3;

      let d = smin(d1, d2, 2.35);
      d = smin(d, d3, 2.25);

      // Natural organic shoreline undulation
      const angle = Math.atan2(z, x);
      const undulation =
        0.26 * Math.sin(angle * 3.0 + 0.6) +
        0.16 * Math.cos(angle * 5.0 - 1.1) +
        0.22 * fbm2D(x * 0.28 + 4.1, z * 0.28 - 2.7, 3);
      return d + undulation;
    }

    function pondGradient(x, z) {
      const eps = 0.08;
      const gx = (pondSDF(x + eps, z) - pondSDF(x - eps, z)) / (2 * eps);
      const gz = (pondSDF(x, z + eps) - pondSDF(x, z - eps)) / (2 * eps);
      const len = Math.hypot(gx, gz) || 1;
      return { x: gx / len, z: gz / len };
    }

    // Exact ground/pond-bed height y(x, z)
    function getBasinHeight(x, z) {
      const sdf = pondSDF(x, z);
      const micro = fbm2D(x * 0.55 + 11.3, z * 0.55 - 7.9, 3) * 0.14;

      if (sdf < 0) {
        // Inside pond: steep rocky shelf near shore, grading to deep central bowl (-2.35m)
        const edgeFactor = smoothstep(0.0, -1.65, sdf);
        const deepFactor = smoothstep(-0.9, -4.4, sdf);
        // Shallow cove on east side is gentler for water lilies
        const eastShallow = smoothstep(2.2, 5.8, x) * 0.68;
        // Extra scour depth under waterfall plunge (-3.3, -2.9)
        const plungeDist = Math.hypot(x + 3.35, z + 2.95);
        const plungeScour = Math.exp(-plungeDist * plungeDist * 0.22) * 0.42;

        const baseDepth =
          -0.22 -
          edgeFactor * (1.08 - eastShallow * 0.35) -
          deepFactor * (1.02 - eastShallow * 0.52) -
          plungeScour;
        return baseDepth + micro * 0.65;
      } else {
        // Bank / surrounding mossy courtyard mound, rising toward NW waterfall rockery
        const bankRise = smoothstep(0.0, 2.4, sdf) * 0.62;
        const nwCliffDist = Math.hypot((x + 4.45) / 3.6, (z + 4.55) / 3.1);
        const cliffRise = Math.max(0, 1.0 - nwCliffDist) ** 1.65 * 2.55;
        const outerTaper = smoothstep(8.2, 12.6, Math.hypot(x * 0.88, z)) * 0.55;
        return 0.04 + bankRise + cliffRise - outerTaper + micro * 0.75;
      }
    }

    // Internal boulder obstacles inside pond so koi steer gracefully around them
    const pondObstacles = [
      { x: -1.65, z: -1.45, r: 0.92 }, // Mossy stepping boulder near falls
      { x: 2.65, z: 1.85, r: 0.78 },   // Submerged turtle-stone boulder

    // =========================================================================
    // 3. SCENE, RENDERER, CAMERA & LIGHTING MOODS

    // Global shared shader uniforms for underwater caustics, sun, and ripples
    const MAX_RIPPLES = 24;

      uWaterShallow: { value: new THREE.Color(0x33998d) },

    // Lights

    // Stone lantern warm point light

    // Sky Dome
    const skyGeo = new THREE.SphereGeometry(68, 40, 24);
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        uSkyTop: globalUniforms.uSkyTop,
        uSkyHorizon: globalUniforms.uSkyHorizon,
        uSunDir: globalUniforms.uSunDir,
        uSunColor: globalUniforms.uSunColor
      },
      vertexShader: /* glsl */ `
        varying vec3 vWorldDir;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldDir = normalize(wp.xyz);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform vec3 uSkyTop;
        uniform vec3 uSkyHorizon;
        uniform vec3 uSunDir;
        uniform vec3 uSunColor;
        varying vec3 vWorldDir;

        void main() {
          vec3 dir = normalize(vWorldDir);
          float h = clamp(dir.y * 0.9 + 0.08, 0.0, 1.0);
          vec3 col = mix(uSkyHorizon, uSkyTop, pow(h, 0.62));

          // Soft distant misty mountain band near horizon
          float mountainWave =
            0.035 * sin(dir.x * 5.2 + 1.1) +
            0.022 * sin(dir.z * 7.4 - 0.4) +
            0.014 * cos((dir.x - dir.z) * 11.0);
          float mountainMask = smoothstep(0.09 + mountainWave, 0.02 + mountainWave, dir.y);
          col = mix(col, uSkyHorizon * 0.84, mountainMask * 0.42);

          // Sun halo & disk
          float sunAmt = max(dot(dir, normalize(uSunDir)), 0.0);
          col += uSunColor * pow(sunAmt, 14.0) * 0.28;
          col += uSunColor * smoothstep(0.9965, 0.9994, sunAmt) * 0.95;

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    // =========================================================================
    // 4. SHARED UNDERWATER CAUSTICS & DEPTH ABSORPTION SHADER INJECTION
    // =========================================================================
    const CAUSTIC_GLSL_PARS = /* glsl */ `
      uniform float uTime;
      uniform vec3 uSunDir;
      uniform vec3 uWaterDeep;
      uniform float uCausticIntensity;
      varying vec3 vPondWorldPos;

      float causticLayer(vec2 uv, float t) {
        vec2 p = uv * 2.15;
        float v = 0.0;
        v += sin(p.x * 1.7 + t * 1.35 + sin(p.y * 1.9 - t * 0.95));
        v += sin(p.y * 2.1 - t * 1.15 + cos(p.x * 2.3 + t * 1.05));
        v += sin((p.x + p.y) * 1.55 + t * 0.85);
        v = abs(v / 3.0);
        return pow(clamp(1.0 - v, 0.0, 1.0), 4.2);
      }

      float computePondCaustics(vec3 worldPos) {
        vec2 refractedXZ = worldPos.xz - worldPos.y * uSunDir.xz / max(uSunDir.y, 0.35) * 0.55;
        float c1 = causticLayer(refractedXZ * 0.78, uTime * 0.95);
        float c2 = causticLayer(refractedXZ * 1.18 + vec2(3.7, -2.1), -uTime * 0.75 + 1.7);
        float c = (c1 * 0.62 + c2 * 0.58);
        float submergeMask = smoothstep(0.02, -0.22, worldPos.y);
        float deepFade = exp(worldPos.y * 0.26);
        return c * submergeMask * deepFade * uCausticIntensity;
      }
    `;

    function applyUnderwaterShader(material, { wetShoreline = true, depthTintStrength = 0.42 } = {}) {
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = globalUniforms.uTime;
        shader.uniforms.uSunDir = globalUniforms.uSunDir;
        shader.uniforms.uWaterDeep = globalUniforms.uWaterDeep;
        shader.uniforms.uCausticIntensity = globalUniforms.uCausticIntensity;

        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>\nvarying vec3 vPondWorldPos;`
          )
          .replace(
            '#include <worldpos_vertex>',
            `#include <worldpos_vertex>
             #ifdef USE_INSTANCING
               vPondWorldPos = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
             #else
               vPondWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
             #endif`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', `#include <common>\n${CAUSTIC_GLSL_PARS}`)
          .replace(
            '#include <roughnessmap_fragment>',
            `#include <roughnessmap_fragment>
             ${wetShoreline ? `
               float wetBand = smoothstep(0.32, -0.04, vPondWorldPos.y);
               roughnessFactor = mix(roughnessFactor, min(roughnessFactor, 0.18), wetBand * 0.85);
             ` : ''}`
          )
          .replace(
            '#include <dithering_fragment>',
            `
             if (vPondWorldPos.y < 0.30) {
               ${wetShoreline ? `
                 float wetDark = smoothstep(0.28, -0.02, vPondWorldPos.y);
                 gl_FragColor.rgb *= mix(1.0, 0.76, wetDark * 0.65);
               ` : ''}
               if (vPondWorldPos.y < 0.02) {
                 float caust = computePondCaustics(vPondWorldPos);
                 gl_FragColor.rgb += vec3(0.95, 1.0, 0.88) * caust * (0.35 + 0.65 * gl_FragColor.rgb);
                 float depthMeters = max(0.0, -vPondWorldPos.y);
                 float absorb = 1.0 - exp(-depthMeters * ${depthTintStrength.toFixed(3)});
                 gl_FragColor.rgb = mix(gl_FragColor.rgb, uWaterDeep * 1.35, clamp(absorb * 0.74, 0.0, 0.78));
               }
             }
             #include <dithering_fragment>
            `
          );
      };
      return material;
    }

    // =========================================================================
    // 5. POND BASIN, COURTYARD PLINTH, ROCKS, WATERFALL & PEBBLES
    // =========================================================================
    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // 5A. Sculpted Pond Bed & Mossy Courtyard Ground
    {
      const radiusMax = 12.2;
      const radialSegs = 112;
      const ringSegs = 78;
      const positions = [];
      const colors = [];
      const uvs = [];
      const indices = [];

      const cDeepSand = new THREE.Color(0x43544e);
      const cPebbleShelf = new THREE.Color(0x6d7061);
      const cWetStone = new THREE.Color(0x475046);
      const cLushMoss = new THREE.Color(0x3f6838);
      const cWarmMoss = new THREE.Color(0x557a40);
      const cEarthStone = new THREE.Color(0x5b584f);
      const tmpCol = new THREE.Color();

      for (let rIdx = 0; rIdx <= ringSegs; rIdx++) {
        const t = rIdx / ringSegs;
        // Concentrate resolution near shoreline & interior
        const rad = Math.pow(t, 1.12) * radiusMax;
        for (let aIdx = 0; aIdx <= radialSegs; aIdx++) {
          const ang = (aIdx / radialSegs) * Math.PI * 2;
          const x = Math.cos(ang) * rad * 1.06;
          const z = Math.sin(ang) * rad * 0.94;
          const y = getBasinHeight(x, z);
          positions.push(x, y, z);
          uvs.push(x * 0.12 + 0.5, z * 0.12 + 0.5);

          const sdf = pondSDF(x, z);
          const nVar = valueNoise2D(x * 0.9 + 3.2, z * 0.9 - 1.4);
          if (sdf < -0.25) {
            const deepT = smoothstep(-0.4, -2.1, y);
            tmpCol.copy(cPebbleShelf).lerp(cDeepSand, deepT);
            tmpCol.offsetHSL(0, 0, (nVar - 0.5) * 0.06);
          } else if (sdf < 0.35) {
            tmpCol.copy(cWetStone).lerp(cLushMoss, smoothstep(-0.1, 0.35, sdf) * 0.65);
          } else {
            const mossPatch = smoothstep(0.28, 0.72, nVar);
            tmpCol.copy(cLushMoss).lerp(cWarmMoss, mossPatch);
            const rockyCliff = smoothstep(0.95, 2.1, y);
            tmpCol.lerp(cEarthStone, rockyCliff * 0.72);
          }
          colors.push(tmpCol.r, tmpCol.g, tmpCol.b);
        }
      }

      const stride = radialSegs + 1;
      for (let rIdx = 0; rIdx < ringSegs; rIdx++) {
        for (let aIdx = 0; aIdx < radialSegs; aIdx++) {
          const i0 = rIdx * stride + aIdx;
          const i1 = i0 + 1;
          const i2 = i0 + stride;
          const i3 = i2 + 1;
          indices.push(i0, i1, i2, i1, i3, i2);
        }
      }

      const basinGeo = new THREE.BufferGeometry();
      basinGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      basinGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      basinGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      basinGeo.setIndex(indices);
      basinGeo.computeVertexNormals();

      const basinMat = applyUnderwaterShader(
        new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.88,
          metalness: 0.04
        })
      );

      const basinMesh = new THREE.Mesh(basinGeo, basinMat);
      basinMesh.receiveShadow = true;
      worldGroup.add(basinMesh);

      // Clean architectural slate & cedar garden plinth framing the outer perimeter
      const rimPts = [
        new THREE.Vector2(11.6, -2.85),
        new THREE.Vector2(12.55, -2.85),
        new THREE.Vector2(12.75, -0.35),
        new THREE.Vector2(12.48, 0.18),
        new THREE.Vector2(11.95, 0.22),
        new THREE.Vector2(11.75, -0.45)
      ];
      const plinthGeo = new THREE.LatheGeometry(rimPts, 96);
      plinthGeo.scale(1.06, 1.0, 0.94);
      const plinthMat = new THREE.MeshStandardMaterial({
        color: 0x2a302d,
        roughness: 0.78,
        metalness: 0.08
      });
      const plinthMesh = new THREE.Mesh(plinthGeo, plinthMat);
      plinthMesh.receiveShadow = true;
      plinthMesh.castShadow = true;
      worldGroup.add(plinthMesh);

      // Bottom cap under plinth
      const capGeo = new THREE.CircleGeometry(12.55, 72);
      capGeo.rotateX(Math.PI * 0.5);
      capGeo.scale(1.06, 1.0, 0.94);
      const capMesh = new THREE.Mesh(capGeo, plinthMat);
      capMesh.position.y = -2.85;
      worldGroup.add(capMesh);
    }

    // 5B. Helper to build sculpted,faceted natural garden boulders with moss caps
    const rockMat = applyUnderwaterShader(
      new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.82,
        metalness: 0.06
      })
    );

    function createNaturalBoulderGeometry(rx, ry, rz, seedOffset, mossAmount = 0.45) {
      const rawGeo = new THREE.IcosahedronGeometry(1.0, 3);
      const geo = mergeVertices(rawGeo, 1e-4);
      const pos = geo.attributes.position;
      const cols = new Float32Array(pos.count * 3);
      const baseRockA = new THREE.Color(0x5d635d);
      const baseRockB = new THREE.Color(0x404742);
      const mossCol = new THREE.Color(0x497339);
      const warmLichen = new THREE.Color(0x6e7858);
      const c = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        let vx = pos.getX(i);
        let vy = pos.getY(i);
        let vz = pos.getZ(i);

        // Stratified rock ledges & continuous smooth 3D FBM displacement
        const n1 = fbm2D(vx * 1.55 + seedOffset, vz * 1.55 - seedOffset * 0.7, 3);
        const n2 = fbm2D(vy * 2.2 - seedOffset * 0.4, (vx + vz) * 1.35, 2);
        const strata = Math.sin(vy * 5.2 + n1 * 2.0) * 0.048;
        const disp = 1.0 + n1 * 0.24 + n2 * 0.13 + strata;

        // Flatten bottom slightly so boulders sit anchored
        const flatBottom = vy < -0.35 ? 0.72 : 1.0;
        vx *= rx * disp;
        vy *= ry * disp * flatBottom;
        vz *= rz * disp;
        pos.setXYZ(i, vx, vy, vz);
      }

      geo.computeVertexNormals();
      const norm = geo.attributes.normal;
      for (let i = 0; i < pos.count; i++) {
        const ny = norm.getY(i);
        const vx = pos.getX(i);
        const vz = pos.getZ(i);
        const nTex = valueNoise2D(vx * 2.3 + seedOffset, vz * 2.3);
        c.copy(baseRockA).lerp(baseRockB, nTex);

        // Velvety moss crowning upward-facing faces
        const mossMask = smoothstep(0.42, 0.86, ny + (nTex - 0.5) * 0.35) * mossAmount;
        c.lerp(nTex > 0.62 ? warmLichen : mossCol, mossMask);
        cols[i * 3] = c.r;
        cols[i * 3 + 1] = c.g;
        cols[i * 3 + 2] = c.b;
      }

      geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
      return geo;
    }

    // Place Shoreline Boulders & Waterfall Rockery Cliff
    {
      const boulderGroup = new THREE.Group();
      worldGroup.add(boulderGroup);

      // 1) Multi-tiered NW Waterfall Rockery Cliff (around x=-4.2, z=-4.2)
      const cliffSpecs = [
        // Main rear monoliths
        { x: -5.05, y: 1.95, z: -5.25, rx: 2.05, ry: 2.45, rz: 1.75, rot: 0.3, moss: 0.65 },
        { x: -2.95, y: 1.75, z: -5.35, rx: 1.85, ry: 2.15, rz: 1.6, rot: -0.4, moss: 0.62 },
        { x: -6.05, y: 1.35, z: -3.95, rx: 1.75, ry: 1.75, rz: 1.65, rot: 0.8, moss: 0.58 },
        // Upper basin rim boulders (framing visible upper cascade chute!)
        { x: -5.05, y: 2.62, z: -4.22, rx: 1.05, ry: 0.78, rz: 0.95, rot: 0.2, moss: 0.72 },
        { x: -2.98, y: 2.52, z: -4.28, rx: 1.02, ry: 0.76, rz: 0.92, rot: -0.5, moss: 0.68 },
        // Upper spillway lip stone (flat dark slate)
        { x: -4.02, y: 2.34, z: -4.22, rx: 0.92, ry: 0.22, rz: 0.75, rot: 0.12, moss: 0.12 },
        // Middle cascade flanking wing stones (wide enough to reveal upper waterfall stream!)
        { x: -4.92, y: 1.26, z: -3.52, rx: 1.08, ry: 0.84, rz: 0.98, rot: 0.55, moss: 0.58 },
        { x: -2.68, y: 1.16, z: -3.62, rx: 1.05, ry: 0.82, rz: 0.95, rot: -0.35, moss: 0.58 },
        // Lower main waterfall spillway stone (water pours cleanly over this lip into pond)
        { x: -3.76, y: 1.02, z: -3.52, rx: 0.98, ry: 0.24, rz: 0.84, rot: 0.16, moss: 0.08 },
        // Submerged & half-submerged boulders around plunge pool
        { x: -5.15, y: 0.38, z: -2.65, rx: 1.15, ry: 0.72, rz: 0.95, rot: 1.1, moss: 0.52 },
        { x: -2.22, y: 0.32, z: -3.75, rx: 1.02, ry: 0.66, rz: 0.88, rot: -0.9, moss: 0.48 },
        // Stepping / island boulder near falls (matches pondObstacles[0])
        { x: -1.65, y: -0.05, z: -1.45, rx: 0.76, ry: 0.52, rz: 0.68, rot: 0.45, moss: 0.68 },
        // Submerged turtle stone in SE (matches pondObstacles[1])
        { x: 2.65, y: -0.18, z: 1.85, rx: 0.68, ry: 0.44, rz: 0.58, rot: 1.35, moss: 0.35 }
      ];

      cliffSpecs.forEach((s, idx) => {
        const geo = createNaturalBoulderGeometry(s.rx, s.ry, s.rz, idx * 7.3 + 1.9, s.moss);
        const m = new THREE.Mesh(geo, rockMat);
        m.position.set(s.x, s.y, s.z);
        m.rotation.y = s.rot;
        m.castShadow = true;
        m.receiveShadow = true;
        boulderGroup.add(m);
      });

      // 2) Organic Ring of Shoreline Boulders hugging pondSDF(x, z) ≈ 0
      const totalShoreAngles = 42;
      for (let i = 0; i < totalShoreAngles; i++) {
        const theta = (i / totalShoreAngles) * Math.PI * 2 + randRange(-0.04, 0.04);
        // Skip waterfall chute sector & SW wooden viewing deck sector
        const deg = ((theta * 180) / Math.PI + 360) % 360;
        if (deg > 212 && deg < 248) continue; // Waterfall mouth
        if (deg > 122 && deg < 152) continue; // SW wooden viewing deck

        // Binary search shoreline radius along ray (cos theta, sin theta)
        let rLo = 2.0;
        let rHi = 10.5;
        for (let iter = 0; iter < 14; iter++) {
          const rMid = (rLo + rHi) * 0.5;
          if (pondSDF(Math.cos(theta) * rMid, Math.sin(theta) * rMid) < 0.08) {
            rLo = rMid;
          } else {
            rHi = rMid;
          }
        }
        const rShore = (rLo + rHi) * 0.5 + randRange(-0.22, 0.35);
        const bx = Math.cos(theta) * rShore;
        const bz = Math.sin(theta) * rShore;
        const by = getBasinHeight(bx, bz);

        const rx = randRange(0.52, 1.18);
        const ry = randRange(0.36, 0.78);
        const rz = randRange(0.48, 1.05);
        const geo = createNaturalBoulderGeometry(rx, ry, rz, 100 + i * 5.1, randRange(0.38, 0.75));
        const rock = new THREE.Mesh(geo, rockMat);
        rock.position.set(bx, by + ry * 0.28, bz);
        rock.rotation.set(randRange(-0.12, 0.12), randRange(0, Math.PI * 2), randRange(-0.12, 0.12));
        rock.castShadow = true;
        rock.receiveShadow = true;
        boulderGroup.add(rock);

        // Occasional smaller companion stone tucked beside main boulder
        if (rng() > 0.38) {
          const angOff = theta + randRange(-0.09, 0.09);
          const rComp = rShore + randRange(-0.42, 0.32);
          const cx = Math.cos(angOff) * rComp;
          const cz = Math.sin(angOff) * rComp;
          const cy = getBasinHeight(cx, cz);
          const cr = randRange(0.26, 0.48);
          const cGeo = createNaturalBoulderGeometry(cr * 1.15, cr * 0.72, cr, 300 + i * 3.7, 0.3);
          const cRock = new THREE.Mesh(cGeo, rockMat);
          cRock.position.set(cx, cy + cr * 0.22, cz);
          cRock.rotation.y = randRange(0, Math.PI * 2);
          cRock.castShadow = true;
          cRock.receiveShadow = true;
          boulderGroup.add(cRock);
        }
      }
    }

    // 5C. Instanced River Pebbles & Gravel on the Pond Floor (for crisp depth cues!)
    {
      const pebbleCount = 520;
      const pebbleGeo = mergeVertices(new THREE.IcosahedronGeometry(1.0, 2), 1e-4);
      // Smoothly round river pebble vertices without seam tearing
      const pPos = pebbleGeo.attributes.position;
      for (let i = 0; i < pPos.count; i++) {
        const vx = pPos.getX(i);
        const vy = pPos.getY(i) * 0.50;
        const vz = pPos.getZ(i);
        const n = 0.90 + 0.18 * valueNoise2D(vx * 2.2 + 1.7, vz * 2.2 - 0.9);
        pPos.setXYZ(i, vx * n, vy * n, vz * n);
      }
      pebbleGeo.computeVertexNormals();

      const pebbleMat = applyUnderwaterShader(
        new THREE.MeshStandardMaterial({
          roughness: 0.58,
          metalness: 0.05
        }),
        { wetShoreline: false, depthTintStrength: 0.40 }
      );

      const pebbles = new THREE.InstancedMesh(pebbleGeo, pebbleMat, pebbleCount);
      pebbles.receiveShadow = true;

      const dummy = new THREE.Object3D();
      const palette = [
        new THREE.Color(0x6d7066),
        new THREE.Color(0x8c8370),
        new THREE.Color(0x4a524d),
        new THREE.Color(0x7c6b58),
        new THREE.Color(0x5c6b63),
        new THREE.Color(0x9a9383)
      ];
      const pCol = new THREE.Color();

      let placed = 0;
      let attempts = 0;
      while (placed < pebbleCount && attempts < 4000) {
        attempts++;
        const x = randRange(-7.6, 8.2);
        const z = randRange(-6.2, 6.2);
        const sdf = pondSDF(x, z);
        if (sdf > -0.15) continue;

        const y = getBasinHeight(x, z);
        const s = randRange(0.08, 0.27) * (sdf > -1.2 ? 1.18 : 0.92);
        dummy.position.set(x, y + s * 0.16, z);
        dummy.rotation.set(randRange(-0.25, 0.25), randRange(0, Math.PI * 2), randRange(-0.25, 0.25));
        dummy.scale.set(s * randRange(0.85, 1.35), s * randRange(0.65, 1.0), s * randRange(0.85, 1.3));
        dummy.updateMatrix();
        pebbles.setMatrixAt(placed, dummy.matrix);

        pCol.copy(palette[Math.floor(rng() * palette.length)]);
        pCol.offsetHSL(randRange(-0.02, 0.02), randRange(-0.04, 0.04), randRange(-0.06, 0.06));
        pebbles.setColorAt(placed, pCol);
        placed++;
      }
      pebbles.count = placed;
      pebbles.instanceMatrix.needsUpdate = true;
      if (pebbles.instanceColor) pebbles.instanceColor.needsUpdate = true;
      worldGroup.add(pebbles);
    }

    // =========================================================================
    // 6. MULTI-TIERED WATERFALL, UPPER POOL, MIST & SUNLIGHT SHAFTS
    // =========================================================================
    const waterfallGroup = new THREE.Group();
    worldGroup.add(waterfallGroup);

    // Helper: curved waterfall ribbon geometry from (x0,y0,z0) pouring to (x1,y1,z1)
    function createWaterfallRibbon(pStart, pEnd, widthTop, widthBot, archOut = 0.35) {
      const segU = 22;
      const segV = 28;
      const geo = new THREE.PlaneGeometry(1, 1, segU, segV);
      const pos = geo.attributes.position;
      const dirXZ = new THREE.Vector2(pEnd.x - pStart.x, pEnd.z - pStart.z).normalize();
      const sideXZ = new THREE.Vector2(-dirXZ.y, dirXZ.x);

      for (let i = 0; i < pos.count; i++) {
        const u = pos.getX(i); // -0.5 .. 0.5 across width
        const v = 0.5 - pos.getY(i); // 0 at top lip, 1 at bottom plunge

        // Parabolic gravity trajectory
        const forwardT = v * 0.85 + Math.sin(v * Math.PI) * archOut;
        const dropT = v * v * 0.82 + v * 0.18;

        const w = THREE.MathUtils.lerp(widthTop, widthBot, v);
        // Subtle organic flutes in water curtain
        const flute = Math.sin(u * 16.0) * 0.035 * Math.sin(v * Math.PI);

        const wx = THREE.MathUtils.lerp(pStart.x, pEnd.x, clamp(forwardT, 0, 1.08)) + sideXZ.x * u * w;
        const wz = THREE.MathUtils.lerp(pStart.z, pEnd.z, clamp(forwardT, 0, 1.08)) + sideXZ.y * u * w;
        const wy = THREE.MathUtils.lerp(pStart.y, pEnd.y, dropT) + flute;
        pos.setXYZ(i, wx, wy, wz);
      }
      geo.computeVertexNormals();
      return geo;
    }

    const waterfallShaderMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      uniforms: {
        uTime: globalUniforms.uTime,
        uSunColor: globalUniforms.uSunColor,
        uWaterTint: { value: new THREE.Color(0x9ce3da) }
      },
      vertexShader: /* glsl */ `
        uniform float uTime;
        varying vec2 vUv;
        varying vec3 vNormalW;
        varying vec3 vViewDir;

        void main() {
          vUv = uv;
          vec3 displaced = position;
          float v = 1.0 - uv.y;
          displaced.y += sin(uv.x * 18.0 + uTime * 9.0) * 0.014 * sin(v * 3.14159);
          vec4 wp = modelMatrix * vec4(displaced, 1.0);
          vNormalW = normalize(mat3(modelMatrix) * normal);
          vViewDir = normalize(cameraPosition - wp.xyz);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        uniform vec3 uSunColor;
        uniform vec3 uWaterTint;
        varying vec2 vUv;
        varying vec3 vNormalW;
        varying vec3 vViewDir;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
            f.y
          );
        }

        void main() {
          float flow = 1.0 - vUv.y; // 0 top -> 1 bottom
          float t = uTime * 2.65;

          // Multi-scale vertical falling streaks
          float s1 = noise(vec2(vUv.x * 14.0, flow * 5.5 - t));
          float s2 = noise(vec2(vUv.x * 28.0 + 3.1, flow * 9.0 - t * 1.45));
          float s3 = noise(vec2(vUv.x * 46.0 - 1.7, flow * 14.0 - t * 1.9));
          float streaks = s1 * 0.45 + s2 * 0.35 + s3 * 0.20;

          // Edge feathering + smooth dissolve at lip and bottom plunge (zero hard rectangular edge!)
          float sideFade = smoothstep(0.0, 0.22, vUv.x) * smoothstep(1.0, 0.78, vUv.x);
          float lipFoam = smoothstep(0.26, 0.03, flow) * 0.55;
          float plungeFoam = smoothstep(0.48, 0.86, flow) * 0.75;

          float foam = smoothstep(0.40, 0.78, streaks + lipFoam + plungeFoam * 0.65);
          float fresnel = pow(1.0 - max(dot(normalize(vNormalW), normalize(vViewDir)), 0.0), 2.5);

          vec3 baseCol = mix(uWaterTint, vec3(0.96, 0.99, 1.0), clamp(foam + fresnel * 0.35, 0.0, 1.0));
          baseCol *= mix(vec3(0.88, 0.95, 0.96), uSunColor, 0.45);

          float alpha = sideFade * clamp(0.38 + foam * 0.52 + plungeFoam * 0.18, 0.0, 0.90);
          alpha *= smoothstep(0.0, 0.06, flow) * smoothstep(1.0, 0.76, flow);

          gl_FragColor = vec4(baseCol, alpha);
        }
      `
    });

    // Upper catch-pool surface (y = 2.48) & middle pool (y = 1.24)
    {
      const poolMat = new THREE.MeshPhysicalMaterial({
        color: 0x1e6b66,
        roughness: 0.12,
        metalness: 0.05,
        transmission: 0.55,
        transparent: true,
        opacity: 0.86
      });
      const upperPool = new THREE.Mesh(new THREE.CircleGeometry(0.88, 28), poolMat);
      upperPool.rotation.x = -Math.PI * 0.5;
      upperPool.position.set(-4.02, 2.40, -4.68);
      waterfallGroup.add(upperPool);

      const midPool = new THREE.Mesh(new THREE.CircleGeometry(0.82, 28), poolMat);
      midPool.rotation.x = -Math.PI * 0.5;
      midPool.position.set(-3.78, 1.12, -3.96);
      waterfallGroup.add(midPool);
    }

    // Upper cascade ribbon -> Middle cascade -> Main wide plunge + Side trickle stream
    const upperFall = new THREE.Mesh(
      createWaterfallRibbon(
        new THREE.Vector3(-4.02, 2.39, -4.02),
        new THREE.Vector3(-3.78, 1.10, -3.56),
        0.88,
        1.08,
        0.26
      ),
      waterfallShaderMat
    );
    waterfallGroup.add(upperFall);

    const mainFall = new THREE.Mesh(
      createWaterfallRibbon(
        new THREE.Vector3(-3.74, 1.12, -3.38),
        new THREE.Vector3(-3.22, -0.08, -2.72),
        1.28,
        1.62,
        0.28
      ),
      waterfallShaderMat
    );
    waterfallGroup.add(mainFall);

    const sideTrickle = new THREE.Mesh(
      createWaterfallRibbon(
        new THREE.Vector3(-4.58, 1.16, -3.12),
        new THREE.Vector3(-4.18, -0.05, -2.55),
        0.34,
        0.48,
        0.20
      ),
      waterfallShaderMat
    );
    waterfallGroup.add(sideTrickle);

    // Churning whitewater foam disc at waterfall plunge base
    const plungeFoamMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: {
        uTime: globalUniforms.uTime,
        uSunColor: globalUniforms.uSunColor
      },
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        uniform vec3 uSunColor;
        varying vec2 vUv;

        void main() {
          vec2 p = (vUv - 0.5) * 2.0;
          float r = length(p);
          float ang = atan(p.y, p.x);
          float rings = sin(r * 16.0 - uTime * 5.2 + sin(ang * 5.0 + uTime * 2.0) * 0.65);
          float froth = smoothstep(0.88, 0.12, r) * (0.55 + 0.45 * rings);
          float core = smoothstep(0.48, 0.04, r) * 0.68;
          float alpha = clamp((froth * 0.52 + core) * smoothstep(0.94, 0.42, r), 0.0, 0.84);
          vec3 col = mix(vec3(0.78, 0.94, 0.92), vec3(0.98, 0.99, 1.0), clamp(core + rings * 0.3, 0.0, 1.0));
          col *= mix(vec3(0.9), uSunColor, 0.4);
          gl_FragColor = vec4(col, alpha);
        }
      `
    });
    const plungeFoamMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.85, 2.45), plungeFoamMat);
    plungeFoamMesh.rotation.x = -Math.PI * 0.5;
    plungeFoamMesh.position.set(-3.32, 0.018, -2.68);
    waterfallGroup.add(plungeFoamMesh);

    // Waterfall Mist & Rising Droplet Spray Particles + Active Splash Pool
    const MIST_COUNT = 220;
    const mistPositions = new Float32Array(MIST_COUNT * 3);
    const mistScales = new Float32Array(MIST_COUNT);
    const mistAlphas = new Float32Array(MIST_COUNT);
    const mistData = [];

    for (let i = 0; i < MIST_COUNT; i++) {
      const isUpper = i < 55;
      mistData.push({
        isUpper,
        age: rng(),
        life: randRange(1.2, 2.6),
        ox: isUpper ? randRange(-4.4, -3.4) : randRange(-4.35, -2.55),
        oy: isUpper ? randRange(1.2, 1.45) : randRange(0.02, 0.25),
        oz: isUpper ? randRange(-3.95, -3.45) : randRange(-3.05, -2.25),
        vx: randRange(-0.28, 0.42),
        vy: randRange(0.32, 0.95),
        vz: randRange(-0.18, 0.48),
        baseSize: isUpper ? randRange(10, 22) : randRange(14, 34)
      });
    }

    const mistGeo = new THREE.BufferGeometry();
    mistGeo.setAttribute('position', new THREE.BufferAttribute(mistPositions, 3));
    mistGeo.setAttribute('aScale', new THREE.BufferAttribute(mistScales, 1));
    mistGeo.setAttribute('aAlpha', new THREE.BufferAttribute(mistAlphas, 1));

    const mistMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.NormalBlending,
      uniforms: {
        uPixelRatio: { value: renderer.getPixelRatio() },
        uSunColor: globalUniforms.uSunColor
      },
      vertexShader: /* glsl */ `
        attribute float aScale;
        attribute float aAlpha;
        uniform float uPixelRatio;
        varying float vAlpha;
        void main() {
          vAlpha = aAlpha;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aScale * uPixelRatio * (10.0 / max(-mv.z, 1.5));
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform vec3 uSunColor;
        varying float vAlpha;
        void main() {
          vec2 p = gl_PointCoord - 0.5;
          float d = length(p) * 2.0;
          float soft = pow(clamp(1.0 - d, 0.0, 1.0), 2.2);
          gl_FragColor = vec4(mix(vec3(0.92, 0.97, 0.98), uSunColor, 0.35), soft * vAlpha);
        }
      `
    });
    const mistPoints = new THREE.Points(mistGeo, mistMat);
    waterfallGroup.add(mistPoints);

    // Subtle Underwater Sunbeams (Volumetric light shafts piercing deep jade water)
    const sunbeamGroup = new THREE.Group();
    worldGroup.add(sunbeamGroup);
    {
      const beamMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        uniforms: {
          uTime: globalUniforms.uTime,
          uSunColor: globalUniforms.uSunColor,
          uCausticIntensity: globalUniforms.uCausticIntensity
        },
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          varying vec3 vNormalV;
          varying vec3 vViewPos;
          void main() {
            vUv = uv;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vViewPos = -mv.xyz;
            vNormalV = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uTime;
          uniform vec3 uSunColor;
          uniform float uCausticIntensity;
          varying vec2 vUv;
          varying vec3 vNormalV;
          varying vec3 vViewPos;
          void main() {
            float edge = pow(abs(dot(normalize(vNormalV), normalize(vViewPos))), 1.8);
            float vFade = smoothstep(0.0, 0.25, vUv.y) * smoothstep(1.0, 0.15, vUv.y);
            float shimmer = 0.72 + 0.28 * sin(vUv.x * 18.8 + uTime * 1.4);
            float alpha = edge * vFade * shimmer * 0.065 * uCausticIntensity;
            gl_FragColor = vec4(uSunColor * vec3(0.75, 1.0, 0.92), alpha);
          }
        `
      });

      const beamSpots = [
        { x: -1.2, z: -0.8, rTop: 0.55, rBot: 1.35, h: 2.0 },
        { x: 0.9, z: 0.7, rTop: 0.65, rBot: 1.55, h: 2.15 },
        { x: -0.4, z: 1.9, rTop: 0.48, rBot: 1.15, h: 1.85 }
      ];
      beamSpots.forEach((b) => {
        const g = new THREE.CylinderGeometry(b.rTop, b.rBot, b.h, 20, 1, true);
        const m = new THREE.Mesh(g, beamMat);
        m.position.set(b.x, -b.h * 0.5 - 0.04, b.z);
        m.rotation.set(0.22, 0.1, -0.32);
        sunbeamGroup.add(m);
      });
    }

    // =========================================================================
    // 7. REALISTIC TRANSPARENT & REFLECTIVE WATER SURFACE (y = 0)
    // =========================================================================
    let waterMesh;
    {
      const resX = 150;
      const resZ = 130;
      const waterGeo = new THREE.PlaneGeometry(18.5, 15.5, resX, resZ);
      waterGeo.rotateX(-Math.PI * 0.5);

      const wPos = waterGeo.attributes.position;
      const shoreAttr = new Float32Array(wPos.count);
      const depthAttr = new Float32Array(wPos.count);

      for (let i = 0; i < wPos.count; i++) {
        const x = wPos.getX(i);
        const z = wPos.getZ(i);
        const sdf = pondSDF(x, z);
        shoreAttr[i] = sdf;
        depthAttr[i] = Math.max(0, -getBasinHeight(x, z));
      }
      waterGeo.setAttribute('aShoreSdf', new THREE.BufferAttribute(shoreAttr, 1));
      waterGeo.setAttribute('aWaterDepth', new THREE.BufferAttribute(depthAttr, 1));

      const waterMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
          uTime: globalUniforms.uTime,
          uSunDir: globalUniforms.uSunDir,
          uSunColor: globalUniforms.uSunColor,
          uSkyTop: globalUniforms.uSkyTop,
          uSkyHorizon: globalUniforms.uSkyHorizon,
          uWaterShallow: globalUniforms.uWaterShallow,
          uWaterDeep: globalUniforms.uWaterDeep,
          uRipples: globalUniforms.uRipples
        },
        vertexShader: /* glsl */ `
          attribute float aShoreSdf;
          attribute float aWaterDepth;
          uniform float uTime;
          uniform vec4 uRipples[${MAX_RIPPLES}];

          varying vec3 vWorldPos;
          varying float vShoreSdf;
          varying float vWaterDepth;

          float evalWaveHeight(vec2 xz, float t) {
            // Gentle pond breeze ripples + continuous rings radiating from waterfall plunge (-3.25, -2.7)
            float dFalls = length(xz - vec2(-3.25, -2.70));
            float fallsRipple = sin(dFalls * 7.5 - t * 4.8) * exp(-dFalls * 0.28) * 0.024;

            // Trickle from eastern bamboo spout (5.95, 1.35)
            float dSpout = length(xz - vec2(5.95, 1.35));
            float spoutRipple = sin(dSpout * 14.0 - t * 6.2) * exp(-dSpout * 0.65) * 0.008;

            float breeze =
              sin(xz.x * 1.85 + xz.y * 1.15 + t * 1.35) * 0.009 +
              cos(xz.x * 2.9 - xz.y * 2.35 - t * 1.75) * 0.006;

            float interactive = 0.0;
            for (int i = 0; i < ${MAX_RIPPLES}; i++) {
              vec4 rp = uRipples[i];
              float age = t - rp.z;
              if (age > 0.0 && age < 4.5) {
                float dist = length(xz - rp.xy);
                float waveRadius = age * 1.85;
                float band = exp(-pow((dist - waveRadius) * 2.6, 2.0));
                float decay = exp(-age * 0.95) * exp(-dist * 0.35);
                interactive += sin((dist - waveRadius) * 16.0) * band * decay * rp.w * 0.032;
              }
            }
            return fallsRipple + spoutRipple + breeze + interactive;
          }

          void main() {
            vShoreSdf = aShoreSdf;
            vWaterDepth = aWaterDepth;
            vec3 p = position;
            float dampEdge = smoothstep(0.05, -0.45, aShoreSdf);
            p.y += evalWaveHeight(p.xz, uTime) * dampEdge;
            vec4 wp = modelMatrix * vec4(p, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uTime;
          uniform vec3 uSunDir;
          uniform vec3 uSunColor;
          uniform vec3 uSkyTop;
          uniform vec3 uSkyHorizon;
          uniform vec3 uWaterShallow;
          uniform vec3 uWaterDeep;
          uniform vec4 uRipples[${MAX_RIPPLES}];

          varying vec3 vWorldPos;
          varying float vShoreSdf;
          varying float vWaterDepth;

          float surfaceHeight(vec2 xz) {
            float t = uTime;
            float dFalls = length(xz - vec2(-3.25, -2.70));
            float h = sin(dFalls * 7.5 - t * 4.8) * exp(-dFalls * 0.28) * 0.026;

            float dSpout = length(xz - vec2(5.95, 1.35));
            h += sin(dSpout * 14.0 - t * 6.2) * exp(-dSpout * 0.65) * 0.010;

            // Multi-layered capillary surface waves
            h += sin(xz.x * 2.1 + xz.y * 1.4 + t * 1.4) * 0.008;
            h += cos(xz.x * 3.6 - xz.y * 2.9 - t * 1.9) * 0.005;
            h += sin(xz.x * 6.4 + xz.y * 5.2 - t * 2.4) * 0.0026;

            for (int i = 0; i < ${MAX_RIPPLES}; i++) {
              vec4 rp = uRipples[i];
              float age = t - rp.z;
              if (age > 0.0 && age < 4.5) {
                float dist = length(xz - rp.xy);
                float waveRadius = age * 1.85;
                float band = exp(-pow((dist - waveRadius) * 2.8, 2.0));
                float decay = exp(-age * 0.92) * exp(-dist * 0.32);
                h += sin((dist - waveRadius) * 17.5) * band * decay * rp.w * 0.036;
              }
            }
            return h;
          }

          void main() {
            // Clip outside shoreline smoothly
            if (vShoreSdf > 0.08) discard;
            float shoreMask = smoothstep(0.08, -0.10, vShoreSdf);

            // Finite-difference wave normal + crisp ripple ring highlight
            float eps = 0.045;
            float hC = surfaceHeight(vWorldPos.xz);
            float hX = surfaceHeight(vWorldPos.xz + vec2(eps, 0.0));
            float hZ = surfaceHeight(vWorldPos.xz + vec2(0.0, eps));
            vec3 N = normalize(vec3(hC - hX, eps * 1.35, hC - hZ));

            vec3 V = normalize(cameraPosition - vWorldPos);
            vec3 L = normalize(uSunDir);

            // Schlick Fresnel: clear top-down view into koi, lush sky reflection at low grazing angles
            float NdotV = max(dot(N, V), 0.0);
            float fresnel = 0.04 + 0.96 * pow(1.0 - NdotV, 4.2);

            // Sky & overhanging maple/foliage reflection approximation
            vec3 R = reflect(-V, N);
            float skyGrad = clamp(R.y * 0.85 + 0.15, 0.0, 1.0);
            vec3 reflCol = mix(uSkyHorizon, uSkyTop, pow(skyGrad, 0.65));
            // Subtle crimson maple canopy tint on NE reflection & mossy rock tint on NW
            float mapleRefl = smoothstep(0.5, 4.8, vWorldPos.x) * smoothstep(-0.5, -4.5, vWorldPos.z);
            reflCol = mix(reflCol, vec3(0.58, 0.18, 0.14), mapleRefl * 0.28);
            float cliffRefl = smoothstep(-1.2, -5.0, vWorldPos.x) * smoothstep(-1.0, -4.5, vWorldPos.z);
            reflCol = mix(reflCol, vec3(0.22, 0.34, 0.26), cliffRefl * 0.32);

            // Crisp sun specular sparkle on wave crests
            vec3 H = normalize(L + V);
            float specBroad = pow(max(dot(N, H), 0.0), 90.0) * 0.48;
            float specSharp = pow(max(dot(N, H), 0.0), 420.0) * 1.65;
            vec3 specCol = uSunColor * (specBroad + specSharp);

            // Depth-graded water body tint
            float depthFactor = clamp(vWaterDepth / 2.2, 0.0, 1.0);
            vec3 waterTint = mix(uWaterShallow, uWaterDeep, pow(depthFactor, 0.78));

            // Delicate shoreline meniscus & ripple crest gleam
            float meniscus = smoothstep(-0.22, -0.01, vShoreSdf) * 0.18;
            float slopeGlow = clamp(length(N.xz) * 2.8, 0.0, 0.45);

            vec3 finalCol = mix(waterTint, reflCol, clamp(fresnel * 0.92, 0.0, 0.88)) + specCol;
            finalCol += vec3(0.82, 0.96, 0.94) * (meniscus + slopeGlow * 0.26);

            // Alpha stays transparent looking down so koi & caustics pop with crystal clarity,
            // and thickens naturally at grazing angles & deep areas
            float baseAlpha = mix(0.14, 0.30, depthFactor);
            float alpha = clamp(baseAlpha + fresnel * 0.62 + meniscus + specSharp * 0.35, 0.0, 0.92) * shoreMask;

            gl_FragColor = vec4(finalCol, alpha);
          }
        `
      });

      waterMesh = new THREE.Mesh(waterGeo, waterMat);
      waterMesh.position.y = 0.0;
      waterMesh.renderOrder = 4;
      worldGroup.add(waterMesh);
    }

    // =========================================================================
    // 8. PLANTS, FLOATING WATER LILIES, RED MAPLE, BAMBOO, DECK & LANTERN
    // =========================================================================
    const lilyPads = [];
    const windSwayUniform = { value: 0 };

    // 8A. Floating Water Lilies & Blossoms (睡莲与荷花)
    {
      const lilyGroup = new THREE.Group();
      worldGroup.add(lilyGroup);

      // Sculpted notched lily pad geometry
      function createLilyPadGeo(radius) {
        const segs = 36;
        const rings = 5;
        const pos = [];
        const cols = [];
        const idx = [];
        const notchAngle = 0.26; // Classic V-cleft

        pos.push(0, 0.004, 0);
        cols.push(0.24, 0.48, 0.22);

        for (let r = 1; r <= rings; r++) {
          const rt = r / rings;
          for (let s = 0; s <= segs; s++) {
            const u = s / segs;
            const ang = notchAngle + u * (Math.PI * 2 - notchAngle * 2);
            const rad = radius * rt * (1.0 + 0.04 * Math.sin(ang * 5.0));
            const rimLift = rt > 0.82 ? (rt - 0.82) * 0.16 * radius : 0.0;
            const vein = Math.cos(ang * 9.0) * 0.004 * rt;
            pos.push(Math.cos(ang) * rad, rimLift + vein, Math.sin(ang) * rad);

            // Rich botanical green with warm bronze-burgundy rim tint
            const rimT = smoothstep(0.65, 1.0, rt);
            const rC = THREE.MathUtils.lerp(0.18, 0.34, rimT);
            const gC = THREE.MathUtils.lerp(0.46, 0.38, rimT);
            const bC = THREE.MathUtils.lerp(0.20, 0.18, rimT);
            cols.push(rC, gC, bC);
          }
        }

        const stride = segs + 1;
        for (let s = 0; s < segs; s++) {
          idx.push(0, 1 + s + 1, 1 + s);
        }
        for (let r = 0; r < rings - 1; r++) {
          const rowA = 1 + r * stride;
          const rowB = rowA + stride;
          for (let s = 0; s < segs; s++) {
            idx.push(rowA + s, rowA + s + 1, rowB + s);
            idx.push(rowA + s + 1, rowB + s + 1, rowB + s);
          }
        }

        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
        g.setIndex(idx);
        g.computeVertexNormals();
        return g;
      }

      const padMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.46,
        metalness: 0.04,
        side: THREE.DoubleSide
      });

      function createLotusFlower(isPink = true) {
        const flower = new THREE.Group();
        const petalOuterMat = new THREE.MeshStandardMaterial({
          color: isPink ? 0xf6a6bc : 0xfaf5ea,
          roughness: 0.38,
          side: THREE.DoubleSide
        });
        const petalInnerMat = new THREE.MeshStandardMaterial({
          color: isPink ? 0xf9cddb : 0xfffdf6,
          roughness: 0.34,
          side: THREE.DoubleSide
        });

        // Curved cupped petal geometry
        const pGeo = new THREE.SphereGeometry(0.11, 8, 8, 0, Math.PI * 0.55, 0, Math.PI * 0.85);
        pGeo.scale(0.62, 1.35, 0.45);

        const layers = [
          { count: 8, tilt: 1.08, scale: 1.05, y: 0.01, mat: petalOuterMat },
          { count: 7, tilt: 0.72, scale: 0.88, y: 0.025, mat: petalInnerMat },
          { count: 5, tilt: 0.38, scale: 0.68, y: 0.04, mat: petalInnerMat }
        ];
        layers.forEach((layer, lIdx) => {
          for (let i = 0; i < layer.count; i++) {
            const ang = (i / layer.count) * Math.PI * 2 + lIdx * 0.42;
            const p = new THREE.Mesh(pGeo, layer.mat);
            p.position.set(Math.cos(ang) * 0.035, layer.y, Math.sin(ang) * 0.035);
            p.rotation.y = -ang + Math.PI * 0.5;
            p.rotation.x = layer.tilt;
            p.scale.setScalar(layer.scale);
            p.castShadow = true;
            flower.add(p);
          }
        });

        const stamen = new THREE.Mesh(
          new THREE.SphereGeometry(0.048, 10, 8),
          new THREE.MeshStandardMaterial({ color: 0xf5be38, roughness: 0.5 })
        );
        stamen.scale.y = 0.65;
        stamen.position.y = 0.048;
        flower.add(stamen);
        return flower;
      }

      // Three natural lily clusters in calm coves (away from waterfall plunge & main feeding center)
      const clusterCenters = [
        { cx: 4.55, cz: -0.55, count: 9, flowerChance: 0.45 }, // Eastern shallow lotus cove
        { cx: 3.35, cz: 2.65, count: 6, flowerChance: 0.38 },  // South-east bank
        { cx: -4.45, cz: 1.55, count: 5, flowerChance: 0.40 }  // Quiet west cove
      ];

      const stemMat = applyUnderwaterShader(
        new THREE.MeshStandardMaterial({ color: 0x284726, roughness: 0.75 })
      );

      clusterCenters.forEach((cl) => {
        for (let i = 0; i < cl.count; i++) {
          const ang = (i / cl.count) * Math.PI * 2 + randRange(-0.35, 0.35);
          const dist = i === 0 ? 0.15 : randRange(0.42, 1.55);
          const px = cl.cx + Math.cos(ang) * dist;
          const pz = cl.cz + Math.sin(ang) * dist;
          if (pondSDF(px, pz) > -0.45) continue;

          // Avoid overlap with existing pads
          const padR = randRange(0.26, 0.46);
          if (lilyPads.some((other) => Math.hypot(other.x - px, other.z - pz) < other.r + padR + 0.06)) {
            continue;
          }

          const holder = new THREE.Group();
          holder.position.set(px, 0.016, pz);
          const rotY = randRange(0, Math.PI * 2);
          holder.rotation.y = rotY;

          const padMesh = new THREE.Mesh(createLilyPadGeo(padR), padMat);
          padMesh.castShadow = true;
          padMesh.receiveShadow = true;
          holder.add(padMesh);

          // Underwater stem anchoring lily pad down to the pond floor (strong spatial depth cue!)
          const bedY = getBasinHeight(px, pz);
          const stemLen = Math.max(0.25, -bedY);
          const stemCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, -0.01, 0),
            new THREE.Vector3(randRange(-0.12, 0.12), -stemLen * 0.5, randRange(-0.12, 0.12)),
            new THREE.Vector3(randRange(-0.08, 0.08), -stemLen, randRange(-0.08, 0.08))
          ]);
          const stemGeo = new THREE.TubeGeometry(stemCurve, 8, 0.014, 5, false);
          const stem = new THREE.Mesh(stemGeo, stemMat);
          holder.add(stem);

          if (rng() < cl.flowerChance) {
            const fl = createLotusFlower(rng() > 0.32);
            fl.position.set(randRange(-0.05, 0.05), 0.012, randRange(-0.05, 0.05));
            fl.scale.setScalar(randRange(0.85, 1.18));
            holder.add(fl);
          }

          lilyGroup.add(holder);
          lilyPads.push({
            mesh: holder,
            x: px,
            z: pz,
            r: padR,
            phase: randRange(0, Math.PI * 2),
            baseRotY: rotY,
            tiltVelX: 0,
            tiltVelZ: 0
          });
        }
      });
    }

    // 8B. Swaying Submerged Waterweeds (水底苦草/金鱼藻) + Shoreline Reeds & Ferns
    {
      // Helper: tapered botanical blade geometry (rooted at y = 0, tip at y = 1)
      function createBladeGeo(curveBend = 0.18, width = 0.055) {
        const segs = 7;
        const geo = new THREE.PlaneGeometry(width, 1.0, 1, segs);
        geo.translate(0, 0.5, 0);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const y = pos.getY(i);
          const taper = 1.0 - Math.pow(y, 1.45) * 0.92;
          pos.setX(i, pos.getX(i) * taper);
          pos.setZ(i, Math.pow(y, 1.8) * curveBend);
        }
        geo.computeVertexNormals();
        return geo;
      }

      // Underwater swaying Vallisneria ribbons
      const weedGeo = createBladeGeo(0.14, 0.065);
      const weedMat = new THREE.MeshStandardMaterial({
        color: 0x276a49,
        roughness: 0.65,
        side: THREE.DoubleSide
      });
      weedMat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = globalUniforms.uTime;
        shader.uniforms.uSunDir = globalUniforms.uSunDir;
        shader.uniforms.uWaterDeep = globalUniforms.uWaterDeep;
        shader.uniforms.uCausticIntensity = globalUniforms.uCausticIntensity;

        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', `#include <common>\nuniform float uTime;\nvarying vec3 vPondWorldPos;`)
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
             float hFrac = clamp(position.y, 0.0, 1.0);
             vec3 instOrigin = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
             float sway1 = sin(uTime * 1.55 + instOrigin.x * 1.3 + instOrigin.z * 1.1 + hFrac * 2.2);
             float sway2 = cos(uTime * 1.15 - instOrigin.z * 1.7 + hFrac * 1.8);
             transformed.x += sway1 * 0.16 * hFrac * hFrac;
             transformed.z += sway2 * 0.12 * hFrac * hFrac;`
          )
          .replace(
            '#include <worldpos_vertex>',
            `#include <worldpos_vertex>
             vPondWorldPos = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', `#include <common>\n${CAUSTIC_GLSL_PARS}`)
          .replace(
            '#include <dithering_fragment>',
            `float caust = computePondCaustics(vPondWorldPos);
             gl_FragColor.rgb += vec3(0.75, 1.0, 0.85) * caust * 0.42;
             float depthMeters = max(0.0, -vPondWorldPos.y);
             float absorb = 1.0 - exp(-depthMeters * 0.42);
             gl_FragColor.rgb = mix(gl_FragColor.rgb, uWaterDeep * 1.3, clamp(absorb * 0.72, 0.0, 0.78));
             #include <dithering_fragment>`
          );
      };

      const weedCount = 190;
      const weedInst = new THREE.InstancedMesh(weedGeo, weedMat, weedCount);
      const dummy = new THREE.Object3D();
      const wCol = new THREE.Color();
      const weedClumps = [
        { x: -2.2, z: 1.8 },
        { x: 1.8, z: -2.2 },
        { x: 3.4, z: 0.8 },
        { x: -0.9, z: -2.6 },
        { x: 0.8, z: 2.9 },
        { x: -3.8, z: -0.5 }
      ];
      let wIdx = 0;
      for (let i = 0; i < weedCount; i++) {
        const c = weedClumps[i % weedClumps.length];
        const wx = c.x + randRange(-0.95, 0.95);
        const wz = c.z + randRange(-0.95, 0.95);
        if (pondSDF(wx, wz) > -0.75) continue;
        const wy = getBasinHeight(wx, wz);
        const maxH = Math.max(0.22, Math.min(1.05, (-wy - 0.32) * randRange(0.52, 0.86)));
        dummy.position.set(wx, wy - 0.03, wz);
        dummy.rotation.set(0, randRange(0, Math.PI * 2), 0);
        dummy.scale.set(randRange(0.9, 1.45), maxH, 1.0);
        dummy.updateMatrix();
        weedInst.setMatrixAt(wIdx, dummy.matrix);
        wCol.setHSL(randRange(0.35, 0.43), randRange(0.45, 0.65), randRange(0.22, 0.34));
        weedInst.setColorAt(wIdx, wCol);
        wIdx++;
      }
      weedInst.count = wIdx;
      weedInst.instanceMatrix.needsUpdate = true;
      if (weedInst.instanceColor) weedInst.instanceColor.needsUpdate = true;
      worldGroup.add(weedInst);

      // Shoreline Swaying Irises / Reeds (菖蒲与水葱) + Violet Iris Blooms
      const reedGeo = createBladeGeo(0.28, 0.062);
      const reedMat = new THREE.MeshStandardMaterial({
        color: 0x4b7f3b,
        roughness: 0.58,
        side: THREE.DoubleSide
      });
      reedMat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = globalUniforms.uTime;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', `#include <common>\nuniform float uTime;`)
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
             float hFrac = clamp(position.y, 0.0, 1.0);
             vec3 origin = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
             // Breeze wave + faster flutter near waterfall mist
             float nearFalls = exp(-length(origin.xz - vec2(-3.6, -3.2)) * 0.35);
             float wind = sin(uTime * (1.8 + nearFalls * 2.4) + origin.x * 0.65 + origin.z * 0.45);
             float gust = cos(uTime * 0.95 + origin.x * 0.35) * 0.5 + 0.5;
             transformed.x += wind * (0.09 + 0.08 * gust + nearFalls * 0.06) * hFrac * hFrac;
             transformed.z += cos(uTime * 1.45 + origin.z * 0.8) * 0.06 * hFrac * hFrac;`
          );
      };

      const reedCount = 320;
      const reedInst = new THREE.InstancedMesh(reedGeo, reedMat, reedCount);
      reedInst.castShadow = true;
      reedInst.receiveShadow = true;

      const shorePlantClusters = [
        { x: -5.5, z: -1.2, spread: 0.95, hMin: 0.75, hMax: 1.45 },
        { x: -1.4, z: -4.5, spread: 0.85, hMin: 0.7, hMax: 1.35 },
        { x: 5.8, z: -2.4, spread: 1.05, hMin: 0.85, hMax: 1.55 },
        { x: 6.4, z: 1.9, spread: 0.95, hMin: 0.75, hMax: 1.4 },
        { x: 1.6, z: 4.9, spread: 0.85, hMin: 0.65, hMax: 1.25 },
        { x: -5.1, z: 2.9, spread: 0.8, hMin: 0.7, hMax: 1.3 },
        // Waterfall cliff ferns (shorter, wider arching)
        { x: -5.2, z: -3.3, spread: 0.75, hMin: 0.45, hMax: 0.85, fern: true },
        { x: -2.4, z: -4.1, spread: 0.7, hMin: 0.45, hMax: 0.85, fern: true }
      ];

      const irisBloomGroup = new THREE.Group();
      worldGroup.add(irisBloomGroup);
      const irisPetalMat = new THREE.MeshStandardMaterial({
        color: 0x6f5be2,
        roughness: 0.42,
        side: THREE.DoubleSide
      });

      let rCount = 0;
      for (let i = 0; i < reedCount; i++) {
        const cl = shorePlantClusters[i % shorePlantClusters.length];
        const rx = cl.x + randRange(-cl.spread, cl.spread);
        const rz = cl.z + randRange(-cl.spread, cl.spread);
        const ry = getBasinHeight(rx, rz);
        if (ry < -0.25) continue;

        const h = randRange(cl.hMin, cl.hMax);
        dummy.position.set(rx, ry - 0.04, rz);
        dummy.rotation.set(
          cl.fern ? randRange(0.25, 0.55) : randRange(-0.12, 0.18),
          randRange(0, Math.PI * 2),
          randRange(-0.12, 0.12)
        );
        dummy.scale.set(cl.fern ? 1.85 : randRange(0.85, 1.3), h, 1.0);
        dummy.updateMatrix();
        reedInst.setMatrixAt(rCount, dummy.matrix);
        wCol.setHSL(randRange(0.24, 0.31), randRange(0.44, 0.62), randRange(0.26, 0.40));
        reedInst.setColorAt(rCount, wCol);
        rCount++;

        // Add occasional violet Japanese Iris blossom (`花菖蒲`)
        if (!cl.fern && i % 26 === 0) {
          const bloom = new THREE.Group();
          bloom.position.set(rx, ry + h * 0.84, rz);
          for (let p = 0; p < 3; p++) {
            const pa = (p / 3) * Math.PI * 2;
            const petal = new THREE.Mesh(new THREE.SphereGeometry(0.075, 6, 6), irisPetalMat);
            petal.scale.set(0.65, 0.28, 1.35);
            petal.position.set(Math.cos(pa) * 0.055, 0, Math.sin(pa) * 0.055);
            petal.rotation.y = -pa + Math.PI * 0.5;
            petal.rotation.x = 0.45;
            bloom.add(petal);
          }
          irisBloomGroup.add(bloom);
        }
      }
      reedInst.count = rCount;
      reedInst.instanceMatrix.needsUpdate = true;
      if (reedInst.instanceColor) reedInst.instanceColor.needsUpdate = true;
      worldGroup.add(reedInst);
    }

    // 8C. Overhanging Japanese Red Maple (`红枫古木`), Bamboo Grove (`翠竹`),
    //     Yukimi Stone Lantern (`雪见石灯笼`), Bamboo Spout & Cedar Viewing Deck (`临水木栈台`)
    let mapleCanopyInst;
    let bambooLeafInst;
    let shishiTubeGroup;
    let lanternGlowMat;

    {
      const propsGroup = new THREE.Group();
      worldGroup.add(propsGroup);

      // 1) Overhanging Red Maple on NE bank (x = 4.1, z = -4.2) reaching over water
      const barkMat = new THREE.MeshStandardMaterial({ color: 0x3b2d28, roughness: 0.88 });
      const branchSpecs = [
        // Gnarled main trunk curving toward the pond
        [
          new THREE.Vector3(4.35, 0.15, -4.45),
          new THREE.Vector3(3.85, 1.45, -3.75),
          new THREE.Vector3(2.95, 2.55, -2.95),
          new THREE.Vector3(1.85, 3.15, -2.15)
        ],
        // Lower horizontal bough skimming out toward eastern cove
        [
          new THREE.Vector3(3.65, 1.65, -3.55),
          new THREE.Vector3(3.25, 2.05, -2.35),
          new THREE.Vector3(2.65, 2.18, -1.25)
        ],
        // Upper crown branch reaching toward center pond
        [
          new THREE.Vector3(2.85, 2.52, -2.88),
          new THREE.Vector3(1.55, 3.35, -2.65),
          new THREE.Vector3(0.45, 3.55, -2.15)
        ],
        // Rear balance bough
        [
          new THREE.Vector3(3.92, 1.55, -3.82),
          new THREE.Vector3(4.85, 2.45, -3.85),
          new THREE.Vector3(5.45, 2.85, -3.25)
        ]
      ];
      const radii = [0.22, 0.11, 0.12, 0.11];

      branchSpecs.forEach((pts, idx) => {
        const curve = new THREE.CatmullRomCurve3(pts);
        const segs = 18;
        const tube = new THREE.TubeGeometry(curve, segs, radii[idx], 8, false);
        // Taper branch radius from base to tip
        const tPos = tube.attributes.position;
        for (let i = 0; i < tPos.count; i++) {
          const ringIdx = Math.floor(i / 9);
          const u = ringIdx / segs;
          const center = curve.getPointAt(clamp(u, 0, 1));
          const taper = THREE.MathUtils.lerp(1.0, 0.32, u);
          tPos.setXYZ(
            i,
            center.x + (tPos.getX(i) - center.x) * taper,
            center.y + (tPos.getY(i) - center.y) * taper,
            center.z + (tPos.getZ(i) - center.z) * taper
          );
        }
        tube.computeVertexNormals();
        const mesh = new THREE.Mesh(tube, barkMat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        propsGroup.add(mesh);
      });

      // Layered Maple Foliage Pads (smooth merged vertices — no torn facets!)
      const foliageGeo = mergeVertices(new THREE.IcosahedronGeometry(1.0, 3), 1e-4);
      const fPos = foliageGeo.attributes.position;
      for (let i = 0; i < fPos.count; i++) {
        const vx = fPos.getX(i);
        const vy = fPos.getY(i);
        const vz = fPos.getZ(i);
        const ruffle =
          0.86 +
          0.18 * fbm2D(vx * 2.1 + vy * 1.3, vz * 2.1 - vy * 0.9, 3) +
          0.05 * Math.sin(vx * 5.0 + vz * 4.5);
        fPos.setXYZ(i, vx * ruffle, vy * 0.46 * ruffle, vz * ruffle);
      }
      foliageGeo.computeVertexNormals();

      const mapleMat = new THREE.MeshStandardMaterial({
        roughness: 0.68,
        metalness: 0.02
      });
      mapleMat.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = globalUniforms.uTime;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', `#include <common>\nuniform float uTime;`)
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
             vec3 cPos = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
             transformed.x += sin(uTime * 1.4 + cPos.x * 0.9 + position.y * 2.0) * 0.055;
             transformed.z += cos(uTime * 1.15 + cPos.z * 0.8) * 0.045;`
          );
      };

      const canopyPads = [
        { x: 1.75, y: 3.22, z: -2.12, s: 0.95 },
        { x: 0.55, y: 3.58, z: -2.15, s: 0.88 },
        { x: 1.45, y: 3.48, z: -2.75, s: 0.92 },
        { x: 2.65, y: 2.25, z: -1.22, s: 0.85 },
        { x: 3.25, y: 2.18, z: -2.28, s: 0.82 },

    // =========================================================================
    // 10. HIGH-CRAFT KOI FISH: PROCEDURAL VARIETY TEXTURES, UNIFIED GEOMETRY,
