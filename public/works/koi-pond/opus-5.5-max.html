<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>锦鲤池</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f6f1e7;
    --ink-dim: rgba(246, 241, 231, .74);
    --glass: rgba(18, 26, 22, .40);
    --glass-hover: rgba(28, 38, 32, .58);
    --glass-border: rgba(255, 255, 255, .18);
    --accent: #e8743b;
    --accent-deep: #c24e28;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1512; color: var(--ink); font-family: Inter, system-ui, -apple-system, sans-serif; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
  canvas#scene:active { cursor: grabbing; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(125% 95% at 50% 42%, transparent 58%, rgba(4, 9, 7, .55) 100%); }
  .title { position: fixed; top: 24px; left: 28px; pointer-events: none; text-shadow: 0 2px 18px rgba(0, 0, 0, .45); }
  .title h1 { font-family: 'Cormorant Garamond', Georgia, 'Songti SC', 'Noto Serif CJK SC', SimSun, serif; font-weight: 600; font-size: clamp(30px, 4vw, 46px); margin: 0; letter-spacing: .01em; line-height: 1; }
  .title p { margin: 8px 0 0; font-size: 12px; color: var(--ink-dim); letter-spacing: .16em; text-transform: uppercase; }
  .stats { position: fixed; top: 28px; right: 28px; font-size: 12px; color: var(--ink-dim); text-align: right; pointer-events: none; line-height: 1.7; text-shadow: 0 1px 8px rgba(0, 0, 0, .55); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 600; }
  .dock { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 10px; align-items: center; }
  .btn { appearance: none; border: 1px solid var(--glass-border); background: var(--glass); color: var(--ink); -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2); border-radius: 999px; padding: 12px 17px; font: 500 14px/1 Inter, system-ui, sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 9px; white-space: nowrap; transition: transform .15s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease; }
  .btn:hover { background: var(--glass-hover); border-color: rgba(255, 255, 255, .32); }
  .btn:active { transform: scale(.96); }
  .btn:focus-visible { outline: 2px solid #ffd7b5; outline-offset: 3px; }
  .btn[aria-pressed="true"] { border-color: rgba(255, 215, 181, .6); background: rgba(232, 116, 59, .22); }
  .btn.feed { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); border-color: rgba(255, 214, 180, .5); padding: 14px 26px; font-size: 15px; font-weight: 600; box-shadow: 0 10px 30px rgba(194, 78, 40, .38), inset 0 1px 0 rgba(255, 255, 255, .25); }
  .btn.feed:hover { background: linear-gradient(135deg, #f2874f, #d35a32); box-shadow: 0 12px 36px rgba(194, 78, 40, .5), inset 0 1px 0 rgba(255, 255, 255, .3); }
  .btn .ico { width: 18px; height: 18px; flex: none; }
  .hint { position: fixed; left: 28px; bottom: calc(30px + env(safe-area-inset-bottom)); font-size: 12px; color: var(--ink-dim); line-height: 1.75; pointer-events: none; text-shadow: 0 1px 8px rgba(0, 0, 0, .6); }
  .hint b { color: var(--ink); font-weight: 600; }
  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px); opacity: 0; transition: opacity .5s ease, transform .5s ease; font-family: 'Cormorant Garamond', Georgia, 'Songti SC', 'Noto Serif CJK SC', SimSun, serif; font-style: italic; font-size: 21px; text-shadow: 0 2px 14px rgba(0, 0, 0, .7); pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .loader { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #1f2e27, #0a110e); transition: opacity 1.4s ease; z-index: 10; }
  .loader.done { opacity: 0; pointer-events: none; }
  .loader .ring { width: 52px; height: 52px; margin: 0 auto; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .12); border-top-color: #f4a259; animation: spin 1s linear infinite; }
  .loader p { font-family: 'Cormorant Garamond', Georgia, 'Songti SC', 'Noto Serif CJK SC', SimSun, serif; font-size: 21px; color: var(--ink-dim); margin: 18px 16px 0; text-align: center; max-width: 520px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 720px) {
    .hint { display: none; }
    .title { left: 16px; top: 16px; }
    .stats { right: 16px; top: 18px; }
    .dock { bottom: calc(16px + env(safe-area-inset-bottom)); gap: 8px; }
    .btn { padding: 11px 13px; }
    .btn .lbl { display: none; }
    .btn.feed .lbl { display: inline; }
    .btn.feed { padding: 13px 20px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<div class="title"><h1>锦鲤池</h1><p>秋日庭园</p></div>
<div class="stats" id="stats"></div>
<div class="hint"><b>拖动</b>旋转视角 · <b>滚轮或双指捏合</b>缩放 · <b>右键拖动</b>平移<br><b>点击水面</b>即可在该处投喂</div>
<div class="toast" id="toast"></div>
<div class="dock">
  <button class="btn" id="soundBtn" aria-pressed="false" title="切换环境音">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.6L13 19V5L7.6 9.5H4z"/><path d="M16.5 9a4.2 4.2 0 0 1 0 6"/><path d="M19 6.5a7.8 7.8 0 0 1 0 11"/></svg>
    <span class="lbl">声音</span>
  </button>
  <button class="btn feed" id="feedBtn" title="把饲料撒在水面上">
    <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><circle cx="6.5" cy="14" r="2.3"/><circle cx="12.4" cy="8.6" r="2.3"/><circle cx="16.8" cy="15.4" r="2.3"/><circle cx="10.6" cy="18.6" r="1.6"/><circle cx="18.6" cy="7.6" r="1.5"/></svg>
    <span class="lbl">投喂锦鲤</span>
  </button>
  <button class="btn" id="orbitBtn" aria-pressed="false" title="缓慢环绕池塘">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4.5V9h-4.5"/></svg>
    <span class="lbl">环游</span>
  </button>
</div>
<div class="loader" id="loader"><div><div class="ring"></div><p>正在为池塘注水…</p></div></div>

<script>
  // Friendly fallback if the 3D engine cannot be fetched or something throws during start-up.
  window.__koiReady = false;
  setTimeout(function () {
    if (!window.__koiReady) { var p = document.querySelector('#loader p'); if (p) p.textContent = '仍在加载… 锦鲤池需要联网从 cdn.jsdelivr.net 加载 Three.js。'; }
  }, 15000);
  window.addEventListener('error', function () {
    if (window.__koiReady) return;
    var p = document.querySelector('#loader p'); if (p) p.textContent = '锦鲤池加载失败。';
  });
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   1. UTILITIES — seeded random, smooth noise, small math helpers
   ===================================================================== */
const TAU = Math.PI * 2;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261125);
const rand = (a = 0, b = 1) => a + (b - a) * rng();
const randInt = (a, b) => Math.floor(rand(a, b + 1 - 1e-9));
const pick = (arr) => arr[Math.floor(rng() * arr.length)];
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
function gauss() { return (rand() + rand() + rand() + rand() - 2) * 0.8660254; }

function hash3(x, y, z) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const a = lerp(lerp(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), lerp(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v);
  const b = lerp(lerp(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), lerp(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v);
  return lerp(a, b, w) * 2 - 1;
}
function fbm3(x, y, z, oct = 4) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += a * noise3(x * f, y * f, z * f); f *= 2.03; a *= 0.5; }
  return s;
}
const fbm2 = (x, z, oct = 4) => fbm3(x, 0.371, z, oct);

// GLSL helpers shared by several shaders
const GLSL_NOISE = /* glsl */`
  float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
  float vnoise(vec2 p) {
    vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x), mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x), u.y);
  }
  float fbm(vec2 p) {
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p; a *= 0.5; }
    return s;
  }
  float fbm3o(vec2 p) {
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 3; i++) { s += a * vnoise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p; a *= 0.5; }
    return s;
  }
  // Tileable, animated light caustics (iterated warp)
  float caustic(vec2 uv, float time) {
    vec2 p = mod(uv * 6.28318, 6.28318) - 250.0;
    vec2 i = p; float c = 1.0; float inten = 0.005;
    for (int n = 0; n < 4; n++) {
      float t = time * (1.0 - (3.5 / float(n + 1)));
      i = p + vec2(cos(t - i.x) + sin(t + i.y), sin(t - i.y) + cos(t + i.x));
      c += 1.0 / length(vec2(p.x / (sin(i.x + t) / inten), p.y / (cos(i.y + t) / inten)));
    }
    c /= 4.0; c = 1.17 - pow(c, 1.4);
    return clamp(pow(abs(c), 8.0), 0.0, 1.6);
  }
`;

/* =====================================================================
   2. RENDERER, SCENE, CAMERA, CONTROLS
   ===================================================================== */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;

// Layers: 0 = reflected scenery, 1 = seen through the water (refraction pass), 2 = never reflected
const L_REFLECT = 0, L_UNDER = 1, L_EXTRA = 2;

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color('#dcd8c4');
scene.fog = new THREE.Fog(FOG_COLOR, 42, 175);

const camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, 0.1, 1200);
camera.position.set(9, 24, 44);
camera.layers.enableAll();

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, -0.4, -1.5);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 80;
controls.maxPolarAngle = 1.43;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 0.9;
controls.autoRotateSpeed = 0.32;

/* =====================================================================
   3. LIGHT & SKY — warm late-afternoon sun, gradient sky with clouds
   ===================================================================== */
const SUN_DIR = new THREE.Vector3(-0.62, 0.5, -0.6).normalize();
const SUN_COLOR = new THREE.Color('#ffe0b5');
const sun = new THREE.DirectionalLight(SUN_COLOR, 3.1);
sun.position.copy(SUN_DIR).multiplyScalar(70);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 20, far: 150 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.035;
sun.layers.enableAll();
scene.add(sun, sun.target);

const hemi = new THREE.HemisphereLight('#c4d6ee', '#5b5236', 0.5);
hemi.layers.enableAll();
scene.add(hemi);

const SKY = {
  top: new THREE.Color('#4a7fc2'),
  mid: new THREE.Color('#9fbfdc'),
  horizon: new THREE.Color('#f0dcc0'),
  ground: new THREE.Color('#5f6446'),
};
const skyUniforms = {
  uTop: { value: SKY.top }, uMid: { value: SKY.mid }, uHorizon: { value: SKY.horizon }, uGround: { value: SKY.ground },
  uSunDir: { value: SUN_DIR }, uSunCol: { value: SUN_COLOR }, uTime: { value: 0 }, uSunDisc: { value: 1 },
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main() {
      vDir = position;
      vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      gl_Position = p.xyww;
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uTop, uMid, uHorizon, uGround, uSunDir, uSunCol;
    uniform float uTime, uSunDisc;
    varying vec3 vDir;
    ${GLSL_NOISE}
    void main() {
      vec3 d = normalize(vDir);
      float h = d.y;
      vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.28, h));
      col = mix(col, uTop, smoothstep(0.22, 0.95, h));
      col = mix(col, uGround, smoothstep(0.0, -0.18, h));
      float sd = max(dot(d, uSunDir), 0.0);
      col += uSunCol * (pow(sd, 6.0) * 0.32 + pow(sd, 48.0) * 0.5);
      col += uSunCol * pow(sd, 1400.0) * 40.0 * uSunDisc;
      // drifting cumulus
      if (h > 0.0) {
        vec2 cp = d.xz / (h + 0.12) * 0.9 + vec2(uTime * 0.006, uTime * 0.002);
        float c = fbm(cp * 1.4);
        c = smoothstep(0.52, 0.82, c) * smoothstep(0.02, 0.2, h);
        vec3 cloudCol = mix(vec3(1.0, 0.95, 0.88) * 1.15, uSunCol * 1.4, pow(sd, 4.0) * 0.6);
        col = mix(col, cloudCol, c * 0.75);
      }
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(600, 48, 24), skyMat);
skyMesh.frustumCulled = false;
skyMesh.renderOrder = -10;
scene.add(skyMesh);

// Image-based ambient light from the sky itself (makes metallic koi shimmer)
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 48, 24), skyMat));
  skyUniforms.uSunDisc.value = 0;
  const envRT = pmrem.fromScene(envScene, 0.035, 0.1, 200);
  skyUniforms.uSunDisc.value = 1;
  scene.environment = envRT.texture;
  pmrem.dispose();
}

// Global animated uniforms
const uTime = { value: 0 };
const uWind = { value: new THREE.Vector2(0.8, 0.35) };

/* =====================================================================
   4. POND SHAPE, WATERFALL FRAME & TERRAIN HEIGHT
   ===================================================================== */
const POND_R = 13;
const WF_THETA = -Math.PI / 2 + 0.1;                    // the waterfall sits at the back of the pond
function pondRadius(th) { return POND_R * (1 + 0.10 * Math.sin(2 * th + 0.5) + 0.07 * Math.sin(3 * th + 1.7) + 0.04 * Math.sin(5 * th + 0.3)); }
function pondE(x, z) { return Math.hypot(x, z) / pondRadius(Math.atan2(z, x)); }
function polar(th, e, extra = 0) { const r = pondRadius(th) * e + extra; return { x: Math.cos(th) * r, z: Math.sin(th) * r }; }

const WF_R = pondRadius(WF_THETA);
const WF_OUT = new THREE.Vector3(-Math.cos(WF_THETA), 0, -Math.sin(WF_THETA));    // points into the pond
const WF_SIDE = new THREE.Vector3(-WF_OUT.z, 0, WF_OUT.x);
const WF_O = new THREE.Vector3(Math.cos(WF_THETA), 0, Math.sin(WF_THETA)).multiplyScalar(WF_R * 0.99);
const WF_LIP_Y = 3.45;
const WF_LIP_OUT = 0.35;
const WF_VH = 1.7, WF_G = 9.8;
const WF_T = Math.sqrt(2 * WF_LIP_Y / WF_G);
const WF_IMPACT = WF_O.clone().addScaledVector(WF_OUT, WF_LIP_OUT + WF_VH * WF_T);
const WF_HILL = WF_O.clone().addScaledVector(WF_OUT, -4.8);
// world position in the waterfall frame: side (+ = right of the fall seen from the pond), along (+ = behind the lip), height
function wfPos(side, along, y) { return WF_O.clone().addScaledVector(WF_SIDE, side).addScaledVector(WF_OUT, -along).setY(y); }

// Hero planting spots (also used to tint the ground with fallen leaves)
const TREE_SPOTS = (() => {
  const s = [];
  const add = (type, th, e, extra, o = {}) => { const p = polar(th, e, extra); s.push({ type, th, x: p.x, z: p.z, ...o }); };
  add('maple', 2.5, 1.0, 3.2, { litter: 7.5, tint: 'red', h: 6.2 });
  add('maple', -0.42, 1.0, 3.6, { litter: 6.5, tint: 'orange', h: 5.6 });
  add('maple', -2.35, 1.0, 4.4, { litter: 6, tint: 'crimson', h: 5.0 });
  add('pine', 0.62, 1.0, 4.2, { litter: 0, h: 5.4 });
  add('pine', -1.15, 1.0, 6.0, { litter: 0, h: 4.6 });
  add('lantern', 1.32, 1.0, 1.7, { litter: 0 });
  return s;
})();

function groundHeight(x, z) {
  const r = Math.hypot(x, z), th = Math.atan2(z, x);
  const R = pondRadius(th), e = r / R;
  const wfMask = Math.exp(-Math.pow(angDiff(th, WF_THETA) / 0.3, 2));
  const shelfH = lerp(-0.55, -2.4, wfMask);
  const floorH = -3.05 + 0.4 * e * e + 0.2 * fbm2(x * 0.22, z * 0.22, 3);
  let h = floorH + (shelfH - floorH) * smoothstep(0.6, 0.84, e) + (0.38 - shelfH) * smoothstep(0.88, 1.03, e);
  const land = smoothstep(1.0, 1.3, e);
  h += land * (0.6 * fbm2(x * 0.055 + 3.1, z * 0.055 - 1.7, 4) + 0.4);
  // hill behind the waterfall
  const hx = x - WF_HILL.x, hz = z - WF_HILL.z;
  h += smoothstep(1.0, 1.12, e) * 3.2 * Math.exp(-(hx * hx + hz * hz) / (2 * 4.6 * 4.6));
  // carve the channel that feeds the fall
  const rx = x - WF_O.x, rz = z - WF_O.z;
  const along = -(rx * WF_OUT.x + rz * WF_OUT.z), lat = rx * WF_SIDE.x + rz * WF_SIDE.z;
  const chan = smoothstep(1.7, 0.9, Math.abs(lat)) * smoothstep(-0.6, 0.3, along) * smoothstep(5.8, 4.0, along);
  h = lerp(h, Math.min(h, WF_LIP_Y - 0.3), chan);
  // the garden is held in a gentle bowl of hills
  h += smoothstep(34, 110, r) * 9.0 + smoothstep(70, 150, r) * 8.0;
  return h;
}

/* =====================================================================
   5. SHARED MATERIAL PATCH — wet banks + animated caustics underwater
   ===================================================================== */
function addUnderwaterShading(mat, key = 'uw') {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime;
    sh.uniforms.uSunDirW = { value: SUN_DIR };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
      .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
        #ifdef USE_INSTANCING
          vWPos = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
        #else
          vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
        #endif`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos; uniform float uTime; uniform vec3 uSunDirW;
        ${GLSL_NOISE}`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        float wetB = smoothstep(0.34, -0.02, vWPos.y);
        diffuseColor.rgb *= mix(1.0, 0.68, wetB);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.28, wetB * smoothstep(-0.25, 0.02, vWPos.y));`)
      .replace('#include <opaque_fragment>', `
        float depthW = -vWPos.y;
        float underW = smoothstep(-0.02, 0.12, depthW);
        if (underW > 0.001) {
          vec2 cuv = (vWPos.xz + uSunDirW.xz / max(uSunDirW.y, 0.25) * depthW * 0.6) * 0.13;
          float cs = caustic(cuv, uTime * 0.5) * 0.65 + caustic(cuv * 1.63 + 0.37, uTime * 0.41 + 4.0) * 0.45;
          outgoingLight += reflectedLight.directDiffuse * cs * underW * exp(-depthW * 0.2) * 2.4;
        }
        #include <opaque_fragment>`);
  };
  mat.customProgramCacheKey = () => key;
  return mat;
}

/* =====================================================================
   6. GROUND — one polar mesh, dense around the shoreline
   ===================================================================== */
const GC = {
  silt: new THREE.Color('#5d5538'), siltDeep: new THREE.Color('#2e3322'), algae: new THREE.Color('#42552a'),
  pebble: new THREE.Color('#8a7f66'), wet: new THREE.Color('#3a3423'), moss: new THREE.Color('#4a6a26'),
  grassA: new THREE.Color('#557429'), grassB: new THREE.Color('#7b8a35'), dry: new THREE.Color('#a39a58'),
  litter: new THREE.Color('#9a3f1f'), litter2: new THREE.Color('#bb7a2b'), far: new THREE.Color('#6d7c44'),
};
function groundColor(x, z, h, out) {
  const e = pondE(x, z);
  const n1 = fbm2(x * 0.18, z * 0.18, 3), n2 = noise3(x * 1.7, 2.3, z * 1.7), n3 = fbm2(x * 0.05 + 7, z * 0.05 - 3, 3);
  if (h < -0.06) {
    out.copy(GC.silt).lerp(GC.siltDeep, smoothstep(-0.35, -2.9, h));
    out.lerp(GC.algae, smoothstep(0.0, 0.35, n1) * 0.55);
    if (n2 > 0.3) out.lerp(GC.pebble, Math.min(1, (n2 - 0.3) * 1.3));
  } else {
    out.copy(GC.grassA).lerp(GC.grassB, smoothstep(-0.3, 0.4, n1));
    out.lerp(GC.dry, smoothstep(0.12, 0.5, n3) * 0.5);
    let lit = 0;
    for (const t of TREE_SPOTS) { if (!t.litter) continue; const d = Math.hypot(x - t.x, z - t.z); lit = Math.max(lit, smoothstep(t.litter, t.litter * 0.25, d)); }
    if (lit > 0) out.lerp(n2 > 0 ? GC.litter : GC.litter2, lit * (0.4 + 0.45 * n2 * n2));
    out.lerp(GC.moss, smoothstep(1.2, 3.0, h) * smoothstep(30, 12, Math.hypot(x, z)) * 0.5);
    out.lerp(GC.wet, smoothstep(0.5, 0.08, h) * smoothstep(1.07, 0.98, e) * 0.6);
    out.lerp(GC.far, smoothstep(40, 95, Math.hypot(x, z)) * 0.55);
  }
  out.multiplyScalar(0.86 + 0.28 * (0.5 + 0.5 * noise3(x * 0.9, 5.1, z * 0.9)));
}

const ground = (() => {
  const radii = [];
  for (let r = 0.25; r < 8.5; r += 0.55) radii.push(r);
  for (let r = 8.5; r < 19.5; r += 0.13) radii.push(r);
  for (let r = 19.5; r < 32; r += 0.4) radii.push(r);
  for (let r = 32; r <= 160; r += 2.4) radii.push(r);
  const A = 300, nR = radii.length;
  const pos = new Float32Array(nR * A * 3), col = new Float32Array(nR * A * 3);
  const c = new THREE.Color();
  for (let i = 0; i < nR; i++) {
    for (let a = 0; a < A; a++) {
      const th = (a / A) * TAU, r = radii[i];
      const x = Math.cos(th) * r, z = Math.sin(th) * r, h = groundHeight(x, z);
      const k = (i * A + a) * 3;
      pos[k] = x; pos[k + 1] = h; pos[k + 2] = z;
      groundColor(x, z, h, c);
      col[k] = c.r; col[k + 1] = c.g; col[k + 2] = c.b;
    }
  }
  const idx = [];
  for (let i = 0; i < nR - 1; i++) {
    for (let a = 0; a < A; a++) {
      const a2 = (a + 1) % A;
      const v00 = i * A + a, v01 = i * A + a2, v10 = (i + 1) * A + a, v11 = (i + 1) * A + a2;
      idx.push(v00, v01, v10, v01, v11, v10);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mat = addUnderwaterShading(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.96, metalness: 0, envMapIntensity: 0.5 }), 'uw-ground');
  const m = new THREE.Mesh(g, mat);
  m.receiveShadow = true;
  m.layers.enable(L_UNDER);
  scene.add(m);
  return m;
})();

/* =====================================================================
   7. ROCKS — noise-displaced boulders with moss, wet bands & caustics
   ===================================================================== */
const ROCK_DARK = new THREE.Color('#4a4944'), ROCK_LIGHT = new THREE.Color('#8f8b80'), ROCK_WARM = new THREE.Color('#7b6c58');
const MOSS = new THREE.Color('#566f2b'), LICHEN = new THREE.Color('#a8a184');
function makeRockGeometry(seed, detail = 3, opts = {}) {
  let g = new THREE.IcosahedronGeometry(1, detail);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g);
  const pos = g.attributes.position, v = new THREE.Vector3();
  const disp = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n1 = fbm3(v.x * 1.05 + seed, v.y * 1.05 - seed * 0.5, v.z * 1.05 + seed * 0.7, 4);
    const n2 = noise3(v.x * 4.2 + seed, v.y * 4.2, v.z * 4.2 - seed);
    const r = 1 + n1 * (opts.rough ?? 0.45) + n2 * 0.045;
    disp[i] = n1;
    v.multiplyScalar(r);
    if (opts.flatTop !== undefined && v.y > opts.flatTop) v.y = opts.flatTop + (v.y - opts.flatTop) * 0.06;
    if (v.y < -0.6) v.y = -0.6 + (v.y + 0.6) * 0.3;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  const nrm = g.attributes.normal, col = new Float32Array(pos.count * 3), c = new THREE.Color();
  const warm = opts.warm ?? rand(0, 0.5), moss = opts.moss ?? 1;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i), ny = nrm.getY(i);
    const tone = 0.5 + 0.5 * fbm3(x * 2.1 + seed, y * 2.1, z * 2.1, 3);
    c.copy(ROCK_DARK).lerp(ROCK_LIGHT, clamp(tone + disp[i] * 0.6, 0, 1)).lerp(ROCK_WARM, warm * 0.6);
    const m = smoothstep(0.35, 0.85, ny + 0.4 * noise3(x * 2.6 + seed, y * 2.6, z * 2.6)) * moss;
    c.lerp(MOSS, m * 0.92);
    const sp = noise3(x * 8 + seed, y * 8, z * 8);
    if (sp > 0.5 && m < 0.5) c.lerp(LICHEN, (sp - 0.5) * 0.8);
    c.multiplyScalar(0.75 + 0.35 * smoothstep(-0.4, 0.3, disp[i]));
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}

const bigRockGeos = [], smallRockGeos = [];
for (let i = 0; i < 5; i++) bigRockGeos.push(makeRockGeometry(10 + i * 7.3, 3));
for (let i = 0; i < 7; i++) smallRockGeos.push(makeRockGeometry(60 + i * 5.1, 2));
const lipRockGeo = makeRockGeometry(3.3, 3, { flatTop: 0.5, rough: 0.32, moss: 0.6 });

const rockMat = addUnderwaterShading(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.86, metalness: 0, envMapIntensity: 0.6 }), 'uw-rock');
const rockGroup = new THREE.Group();
scene.add(rockGroup);
const rockColliders = [];   // rocks that stand in the water (fish steer around them)

function placeRock(geo, p, sx, sy, sz, rotY = rand(0, TAU), tilt = 0.12) {
  const m = new THREE.Mesh(geo, rockMat);
  m.position.copy(p);
  m.scale.set(sx, sy, sz);
  m.rotation.set(rand(-tilt, tilt), rotY, rand(-tilt, tilt));
  m.castShadow = true; m.receiveShadow = true;
  m.layers.enable(L_UNDER);
  rockGroup.add(m);
  if (pondE(p.x, p.z) < 0.98) rockColliders.push({ x: p.x, z: p.z, r: Math.max(sx, sz) * 1.1 });
  return m;
}

// Rim rocks gathered in natural clusters, leaving grassy gaps
for (let k = 0; k < 17; k++) {
  const th = (k / 17) * TAU + rand(-0.12, 0.12);
  if (Math.abs(angDiff(th, WF_THETA)) < 0.55) continue;
  if (rand() < 0.2) continue;
  const n = randInt(2, 5);
  for (let j = 0; j < n; j++) {
    const t = th + rand(-0.1, 0.1);
    const p = polar(t, rand(0.965, 1.07));
    const s = rand(0.45, 1.1) * (j === 0 ? 1.45 : 1);
    const sy = s * rand(0.55, 0.9);
    placeRock(j === 0 ? pick(bigRockGeos) : pick(smallRockGeos), new THREE.Vector3(p.x, groundHeight(p.x, p.z) - sy * 0.22, p.z), s * rand(1, 1.45), sy, s * rand(0.9, 1.3));
  }
}
// a few stones out on the shallow shelf
for (let k = 0; k < 6; k++) {
  const t = rand(0, TAU);
  if (Math.abs(angDiff(t, WF_THETA)) < 0.7) continue;
  const p = polar(t, rand(0.86, 0.92));
  const s = rand(0.45, 0.8);
  placeRock(pick(smallRockGeos), new THREE.Vector3(p.x, groundHeight(p.x, p.z) + s * 0.25, p.z), s * 1.2, s * 0.8, s * 1.1);
}

// The waterfall cliff: hand-placed in the fall's own frame [side, along, y, sx, sy, sz]
const WF_ROCKS = [
  [-2.15, 0.55, 1.9, 1.25, 2.5, 1.45], [2.3, 0.5, 1.75, 1.35, 2.35, 1.5],
  [-2.05, 1.7, 3.85, 1.15, 1.25, 1.1], [2.45, 1.85, 3.75, 1.3, 1.3, 1.25],
  [-1.85, 3.7, 3.7, 1.8, 1.7, 1.6], [1.75, 3.9, 3.75, 1.7, 1.8, 1.7], [0.1, 4.6, 4.0, 1.7, 1.35, 1.3],
  [-3.8, 1.2, 1.25, 1.45, 1.6, 1.3], [3.95, 1.0, 1.05, 1.5, 1.5, 1.4],
  [-4.7, 2.9, 2.2, 1.6, 1.5, 1.5], [4.8, 2.7, 2.0, 1.6, 1.6, 1.45],
  [-1.55, -0.95, -0.25, 0.95, 0.8, 0.9], [1.65, -1.05, -0.3, 1.0, 0.75, 0.95],
  [-3.0, -0.25, -0.05, 1.1, 0.95, 1.0], [3.1, -0.4, -0.05, 1.0, 0.85, 1.0],
  [-0.4, -1.55, -0.55, 0.6, 0.55, 0.6],
];
WF_ROCKS.forEach((r, i) => {
  placeRock(i < 11 ? bigRockGeos[i % 5] : smallRockGeos[i % 7], wfPos(r[0], r[1], r[2]), r[3], r[4], r[5], rand(0, TAU), 0.08);
});
// the lip slab — a flat-topped stone the stream runs across before it falls
const LIP_SY = 1.7;
placeRock(lipRockGeo, wfPos(0, 0.95, WF_LIP_Y - 0.07 - 0.5 * LIP_SY), 1.3, LIP_SY, 1.45, Math.atan2(WF_OUT.x, WF_OUT.z), 0);
// scattered boulders on the hill
for (let k = 0; k < 7; k++) {
  const sd = rand(-6, 6), al = rand(2, 7.5);
  if (Math.abs(sd) < 1.6 && al < 6) continue;
  const p = wfPos(sd, al, 0);
  const s = rand(0.5, 1.1);
  p.y = groundHeight(p.x, p.z) - s * 0.2;
  placeRock(pick(smallRockGeos), p, s * 1.2, s * 0.8, s * 1.1);
}

// Pebbles on the pond floor (seen only through the water)
const pebbles = (() => {
  const geo = makeRockGeometry(91, 1, { rough: 0.25, moss: 0 });
  geo.deleteAttribute('color');
  const mat = addUnderwaterShading(new THREE.MeshStandardMaterial({ roughness: 0.7, envMapIntensity: 0.5 }), 'uw-pebble');
  const N = 360, im = new THREE.InstancedMesh(geo, mat, N);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), e = new THREE.Euler(), c = new THREE.Color();
  const tones = ['#8d8576', '#6d675c', '#a39886', '#5a564e', '#b3a58c', '#7a6a55'];
  let n = 0;
  while (n < N) {
    const th = rand(0, TAU), ee = Math.sqrt(rand()) * 0.93;
    const pp = polar(th, ee);
    const h = groundHeight(pp.x, pp.z);
    if (h > -0.25) continue;
    const sz = rand(0.08, 0.28);
    p.set(pp.x, h + sz * 0.15, pp.z);
    q.setFromEuler(e.set(rand(-0.3, 0.3), rand(0, TAU), rand(-0.3, 0.3)));
    s.set(sz * rand(1, 1.6), sz * rand(0.4, 0.7), sz);
    im.setMatrixAt(n, m4.compose(p, q, s));
    im.setColorAt(n, c.set(pick(tones)));
    n++;
  }
  im.receiveShadow = true;
  im.layers.set(L_UNDER);
  scene.add(im);
  return im;
})();

/* =====================================================================
   8. VEGETATION — wind-swayed grass & reeds, lily pads, maples, pines
   ===================================================================== */
// Wind sway patch. heightFrom: 'local' = vertex height, 'instance' = height of the instance origin
function addSway(mat, { amp = 0.12, freq = 1.3, pow = 2.0, heightFrom = 'local', ao = false, flutter = 0, key = 'sway' } = {}) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime; sh.uniforms.uWind = uWind;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime; uniform vec2 uWind; varying float vH;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vec3 ipos = vec3(0.0);
        #ifdef USE_INSTANCING
          ipos = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
        #endif
        vec4 wbase = modelMatrix * vec4(ipos, 1.0);
        float hgt = ${heightFrom === 'local' ? 'max(position.y, 0.0)' : 'max(ipos.y, 0.0)'};
        vH = position.y;
        float bend = pow(hgt, ${pow.toFixed(2)}) * ${amp.toFixed(4)};
        float ph = dot(wbase.xz, vec2(0.31, 0.23)) + uTime * ${freq.toFixed(3)};
        float gust = 0.55 + 0.45 * sin(uTime * 0.33 + wbase.x * 0.045 + wbase.z * 0.03);
        transformed.x += (sin(ph) * 0.7 + sin(ph * 2.31 + 1.3) * 0.3) * bend * gust * uWind.x;
        transformed.z += cos(ph * 0.83) * 0.6 * bend * gust * uWind.y;
        ${flutter ? `transformed.y += sin(uTime * 7.0 + ipos.x * 13.0 + ipos.z * 7.0) * ${flutter.toFixed(3)} * position.x;` : ''}`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vH;')
      .replace('#include <color_fragment>', `#include <color_fragment>
        ${ao ? 'diffuseColor.rgb *= mix(0.55, 1.12, clamp(vH, 0.0, 1.0));' : ''}`);
  };
  mat.customProgramCacheKey = () => key;
  return mat;
}

function bladeGeometry(segs = 4, width = 0.07, curve = 0.22) {
  const pos = [], nrm = [], uv = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, w = width * (1 - t * 0.92) * (i === segs ? 0.1 : 1);
    const z = curve * t * t;
    pos.push(-w / 2, t, z, w / 2, t, z);
    nrm.push(-0.25, 0.9, -0.35, 0.25, 0.9, -0.35);
    uv.push(0, t, 1, t);
  }
  for (let i = 0; i < segs; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

function nearRock(x, z, pad = 0) {
  for (const m of rockGroup.children) {
    const r = Math.max(m.scale.x, m.scale.z) * 0.85 + pad;
    const dx = x - m.position.x, dz = z - m.position.z;
    if (dx * dx + dz * dz < r * r) return true;
  }
  return false;
}
function inWaterfallZone(x, z, padSide = 0) {
  const rx = x - WF_O.x, rz = z - WF_O.z;
  const along = -(rx * WF_OUT.x + rz * WF_OUT.z), lat = rx * WF_SIDE.x + rz * WF_SIDE.z;
  return Math.abs(lat) < 2.2 + padSide && along > -1 && along < 6.5;
}

// ---- Grass meadow ----
const grass = (() => {
  const N = 15000;
  const mat = addSway(new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.85, envMapIntensity: 0.6 }), { amp: 0.16, freq: 1.6, pow: 2.0, ao: true, key: 'sway-grass' });
  const im = new THREE.InstancedMesh(bladeGeometry(4, 0.075, 0.25), mat, N);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), e = new THREE.Euler(), c = new THREE.Color();
  const greens = ['#5b7d2a', '#6e8a30', '#7f9338', '#4e6e25', '#93984a', '#a59f55'].map((h) => new THREE.Color(h));
  let n = 0, guard = 0;
  while (n < N && guard++ < N * 6) {
    const th = rand(0, TAU);
    const d = 1.02 + Math.pow(rand(), 1.6) * 1.55;
    const pp = polar(th, d);
    if (Math.hypot(pp.x, pp.z) > 36) continue;
    if (inWaterfallZone(pp.x, pp.z) || nearRock(pp.x, pp.z, -0.1)) continue;
    if (TREE_SPOTS.some((t) => Math.hypot(pp.x - t.x, pp.z - t.z) < 0.8)) continue;
    const h = groundHeight(pp.x, pp.z);
    const near = smoothstep(1.35, 1.03, d);
    p.set(pp.x, h - 0.03, pp.z);
    q.setFromEuler(e.set(rand(-0.15, 0.15), rand(0, TAU), rand(-0.15, 0.15)));
    s.set(rand(0.8, 1.3), rand(0.28, 0.6) + near * rand(0.2, 0.55), 1);
    im.setMatrixAt(n, m4.compose(p, q, s));
    c.copy(pick(greens)).lerp(greens[5], smoothstep(0.1, 0.5, fbm2(pp.x * 0.05 + 7, pp.z * 0.05 - 3, 3)) * 0.6);
    im.setColorAt(n, c);
    n++;
  }
  im.count = n;
  im.receiveShadow = true;
  im.layers.set(L_EXTRA);
  scene.add(im);
  return im;
})();

// ---- Reeds, cattails & silver-grass plumes along the margins ----
const reeds = (() => {
  const spots = [2.05, 2.95, 0.15, 0.95, -0.95, -2.75, 1.7];
  const blades = [], heads = [];
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), e = new THREE.Euler();
  spots.forEach((th0, si) => {
    const plume = si % 3 === 2;
    for (let i = 0; i < 46; i++) {
      const th = th0 + gauss() * 0.06;
      const pp = polar(th, plume ? rand(1.0, 1.08) : rand(0.91, 1.0));
      if (nearRock(pp.x, pp.z, -0.2)) continue;
      const H = plume ? rand(1.2, 2.0) : rand(1.3, 2.7);
      p.set(pp.x, groundHeight(pp.x, pp.z) - 0.05, pp.z);
      q.setFromEuler(e.set(rand(-0.18, 0.18), rand(0, TAU), rand(-0.18, 0.18)));
      s.set(rand(0.8, 1.3), H, 1);
      const mat = m4.clone().compose(p, q, s);
      blades.push({ mat, col: new THREE.Color(pick(plume ? ['#8f8f4a', '#a39a5a', '#7d8a3c'] : ['#4f6e26', '#5f7d2c', '#8a8a3c', '#a5903f', '#6b7a30'])) });
      if ((plume && rand() < 0.55) || (!plume && rand() < 0.22)) heads.push({ mat, col: new THREE.Color(plume ? pick(['#e3d6b8', '#d8c8a6', '#efe4ca']) : pick(['#5a3a22', '#6b4426', '#4d321e'])), plume });
    }
  });
  const bladeMat = addSway(new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.8 }), { amp: 0.2, freq: 1.1, pow: 2.2, ao: true, key: 'sway-reed' });
  const bm = new THREE.InstancedMesh(bladeGeometry(6, 0.055, 0.35), bladeMat, blades.length);
  blades.forEach((b, i) => { bm.setMatrixAt(i, b.mat); bm.setColorAt(i, b.col); });
  // heads: modelled at the top of a unit-height stem so they sway with it
  const headGeo = new THREE.CapsuleGeometry(0.03, 0.12, 4, 8); headGeo.translate(0, 0.9, 0.3);

function makeLilyFlowerGeometry(cOuter, cMid, cInner) {
  const parts = [];

      const cc = new Float32Array(g.attributes.position.count * 3);

      for (let k = 0; k < cc.length; k += 3) { cc[k] = col.r; cc[k + 1] = col.g; cc[k + 2] = col.b; }

  const yc = new THREE.Color('#f2c230'), cc = new Float32Array(center.attributes.position.count * 3);

const LEAF_TEX = makeLeafTexture();
const MAPLE_TINTS = {
  red: ['#b8261c', '#d23d27', '#9c1e19', '#e05a2c', '#c9332a'],
  orange: ['#d96a1c', '#e8962a', '#c4501c', '#f0b23c', '#dd7a22'],

// ---- Trees ----
const UP = new THREE.Vector3(0, 1, 0);
const leafSources = [];   // canopies that drop leaves
function blobGeometry(seed, s, squash, colors, shadeBottom = 0.5) {
  let g = new THREE.IcosahedronGeometry(1, 2);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g);
  const pa = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < pa.count; i++) {
    v.fromBufferAttribute(pa, i);
    v.multiplyScalar(1 + 0.32 * fbm3(v.x * 1.7 + seed, v.y * 1.7, v.z * 1.7 - seed, 3));
    pa.setXYZ(i, v.x * s, v.y * s * squash, v.z * s);
  }
  g.computeVertexNormals();
  const nr = g.attributes.normal, cc = new Float32Array(pa.count * 3), c = new THREE.Color();
  for (let i = 0; i < pa.count; i++) {
    const n = noise3(pa.getX(i) * 1.3 + seed, pa.getY(i) * 1.3, pa.getZ(i) * 1.3);
    c.set(colors[Math.floor((n * 0.5 + 0.5) * colors.length * 0.999)]);
    c.multiplyScalar(lerp(shadeBottom, 1.08, smoothstep(-0.8, 0.9, nr.getY(i))));
    cc[i * 3] = c.r; cc[i * 3 + 1] = c.g; cc[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(cc, 3));
  return g;
}
function cylinderBetween(a, b, r0, r1) {
  const len = a.distanceTo(b);
  const g = new THREE.CylinderGeometry(r1, r0, len, 7, 1);
  g.translate(0, len / 2, 0);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(UP, b.clone().sub(a).normalize()));
  g.translate(a.x, a.y, a.z);
  return g;
}
function perturb(dir, ang) {
  const axis = new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).cross(dir).normalize();
  return dir.clone().applyAxisAngle(axis, ang);
}

function makeMaple(spot) {
  const group = new THREE.Group();
  const bark = [], blobs = [], cards = [];
  const tints = MAPLE_TINTS[spot.tint];
  const toPond = new THREE.Vector3(-spot.x, 0, -spot.z).normalize();
  const S = spot.h / 6;
  function grow(start, dir, len, rad, depth) {
    const end = start.clone().addScaledVector(dir, len);
    bark.push(cylinderBetween(start, end, rad, rad * 0.68));
    if (depth === 0 || (depth === 1 && rand() < 0.35)) {
      const s = rand(0.95, 1.45) * S;
      blobs.push({ c: end.clone().add(new THREE.Vector3(0, 0.25 * S, 0)), s });
      if (depth === 0) return;
    }
    const kids = randInt(2, 3);
    for (let k = 0; k < kids; k++) {
      const d = perturb(dir, rand(0.4, 0.85));
      d.y = d.y * 0.6 + 0.22; d.addScaledVector(toPond, 0.12).normalize();
      grow(end, d, len * rand(0.64, 0.8), rad * 0.64, depth - 1);
    }
  }
  const trunkDir = UP.clone().addScaledVector(toPond, 0.45).normalize();
  const mid = trunkDir.clone().multiplyScalar(1.7 * S);
  bark.push(cylinderBetween(new THREE.Vector3(0, -0.3, 0), mid, 0.3 * S, 0.24 * S));
  grow(mid, perturb(trunkDir, 0.25), 1.5 * S, 0.24 * S, 3);
  const barkMesh = new THREE.Mesh(mergeGeometries(bark), new THREE.MeshStandardMaterial({ color: '#4f4038', roughness: 0.95 }));
  const leafGeos = blobs.map((b, i) => blobGeometry(spot.x + i * 3.1, b.s, 0.62, tints, 0.45).translate(b.c.x, b.c.y, b.c.z));
  const foliage = new THREE.Mesh(mergeGeometries(leafGeos), addSway(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.78, envMapIntensity: 0.7 }), { amp: 0.012, freq: 0.9, pow: 1.0, key: 'sway-foliage' }));
  // leaf cards give the canopy a soft, leafy silhouette
  const N = blobs.length * 52;
  const cardMat = addSway(new THREE.MeshStandardMaterial({ map: LEAF_TEX, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.7, envMapIntensity: 0.7 }), { amp: 0.012, freq: 0.9, pow: 1.0, heightFrom: 'instance', flutter: 0.12, key: 'sway-cards' });
  const cardMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), cardMat, N);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3(), e = new THREE.Euler(), col = new THREE.Color();
  let n = 0;
  for (const b of blobs) {
    for (let k = 0; k < 52; k++) {
      const d = new THREE.Vector3(gauss(), gauss() * 0.7 + 0.25, gauss()).normalize();
      p.copy(b.c).addScaledVector(d, b.s * rand(0.85, 1.12)).setY(b.c.y + d.y * b.s * 0.62 * rand(0.9, 1.15));
      q.setFromEuler(e.set(rand(0, TAU), rand(0, TAU), rand(0, TAU)));
      const z = rand(0.26, 0.4) * S;
      cardMesh.setMatrixAt(n, m4.compose(p, q, sc.set(z, z, z)));
      cardMesh.setColorAt(n, col.set(pick(tints)).multiplyScalar(lerp(0.55, 1.1, smoothstep(-0.6, 0.8, d.y))));
      n++;
    }
  }
  barkMesh.castShadow = foliage.castShadow = true;
  barkMesh.receiveShadow = foliage.receiveShadow = cardMesh.receiveShadow = true;
  group.add(barkMesh, foliage, cardMesh);
  group.position.set(spot.x, groundHeight(spot.x, spot.z), spot.z);
  group.rotation.y = rand(-0.3, 0.3);
  scene.add(group);
  // canopy bounds for falling leaves
  const box = new THREE.Box3();
  blobs.forEach((b) => box.expandByPoint(b.c));
  group.updateMatrixWorld();
  box.applyMatrix4(group.matrixWorld);
  leafSources.push({ box, tints });
  return group;
}

function makePine(spot) {
  const group = new THREE.Group();
  const bark = [], pads = [];
  const S = spot.h / 5;
  const toPond = new THREE.Vector3(-spot.x, 0, -spot.z).normalize();
  let p = new THREE.Vector3(0, -0.3, 0), dir = UP.clone().addScaledVector(toPond, 0.5).normalize(), r = 0.28 * S;
  for (let i = 0; i < 6; i++) {
    const len = 0.85 * S;
    const np = p.clone().addScaledVector(dir, len);
    bark.push(cylinderBetween(p, np, r, r * 0.84));
    if (i >= 2) {
      const nb = i === 5 ? 1 : randInt(1, 2);
      for (let k = 0; k < nb; k++) {
        const a = rand(0, TAU);
        const bd = new THREE.Vector3(Math.cos(a), rand(0.05, 0.3), Math.sin(a)).normalize();
        const bl = rand(1.0, 1.8) * S * (1 - i * 0.08);
        const bend = np.clone().addScaledVector(bd, bl);
        bark.push(cylinderBetween(np, bend, r * 0.5, r * 0.3));
        pads.push({ c: bend.clone().add(new THREE.Vector3(0, 0.15 * S, 0)), s: rand(0.75, 1.1) * S * (1.1 - i * 0.07) });
      }
    }
    p = np; r *= 0.84;
    dir = perturb(dir, rand(0.12, 0.3)); dir.y = Math.abs(dir.y) + 0.3; dir.normalize();
  }
  pads.push({ c: p.clone().add(new THREE.Vector3(0, 0.2 * S, 0)), s: 0.85 * S });
  const greens = ['#2c4a20', '#34552a', '#3e6030', '#2a4422', '#47693a'];
  const padGeos = pads.map((b, i) => {
    const g = blobGeometry(spot.z + i * 2.7, 1, 0.42, greens, 0.4);
    g.scale(b.s * 1.45, b.s, b.s * 1.45).translate(b.c.x, b.c.y, b.c.z);
    return g;
  });
  const barkMesh = new THREE.Mesh(mergeGeometries(bark), new THREE.MeshStandardMaterial({ color: '#5b4234', roughness: 0.95 }));
  const foliage = new THREE.Mesh(mergeGeometries(padGeos), addSway(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, envMapIntensity: 0.6 }), { amp: 0.012, freq: 0.9, pow: 1.0, key: 'sway-foliage' }));
  barkMesh.castShadow = foliage.castShadow = true;
  barkMesh.receiveShadow = foliage.receiveShadow = true;
  group.add(barkMesh, foliage);
  group.position.set(spot.x, groundHeight(spot.x, spot.z), spot.z);
  scene.add(group);
  return group;
}

function makeLantern(spot) {
  const g = new THREE.Group();
  const stone = new THREE.MeshStandardMaterial({ color: '#8d897c', roughness: 0.93, envMapIntensity: 0.6 });
  const add = (geo, y, mat = stone) => { const m = new THREE.Mesh(geo, mat); m.position.y = y; m.castShadow = m.receiveShadow = true; g.add(m); return m; };
  add(new THREE.CylinderGeometry(0.55, 0.66, 0.26, 6), 0.13);
  add(new THREE.CylinderGeometry(0.19, 0.25, 1.05, 14), 0.78);
  add(new THREE.CylinderGeometry(0.5, 0.4, 0.18, 6), 1.38);
  const glowMat = new THREE.MeshStandardMaterial({ color: '#ffcf8a', emissive: '#ffb45a', emissiveIntensity: 2.4, roughness: 0.6 });
  add(new THREE.BoxGeometry(0.44, 0.4, 0.44), 1.67, glowMat);
  for (let i = 0; i < 4; i++) { const m = add(new THREE.BoxGeometry(0.11, 0.46, 0.11), 1.7); m.position.x = (i & 1 ? 1 : -1) * 0.25; m.position.z = (i & 2 ? 1 : -1) * 0.25; }
  add(new THREE.CylinderGeometry(0.06, 0.8, 0.42, 6), 2.12);
  add(new THREE.SphereGeometry(0.13, 12, 8), 2.4);
  add(new THREE.ConeGeometry(0.07, 0.16, 10), 2.56);
  const light = new THREE.PointLight('#ffb866', 3.0, 7, 2);
  light.position.y = 1.67; light.layers.enableAll();
  g.add(light);
  g.position.set(spot.x, groundHeight(spot.x, spot.z) - 0.05, spot.z);
  g.rotation.y = rand(0, TAU);
  scene.add(g);
  return { group: g, light, glowMat };
}

let lantern = null;
for (const spot of TREE_SPOTS) {
  if (spot.type === 'maple') makeMaple(spot);
  else if (spot.type === 'pine') makePine(spot);

}

const flowUniformsBase = () => THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {

{

// ---- Spray & mist particles (shared pool, also used for splashes) ----
function makeParticleMaterial(color, soft) {

  return new THREE.ShaderMaterial({
    uniforms: u, transparent: true, depthWrite: false,

/* =====================================================================
   14. FOOD — tossed pellets that float, drift and get eaten
   ===================================================================== */
const pellets = [];
const PELLET_GEO = new THREE.SphereGeometry(0.075, 10, 8);
const PELLET_MATS = ['#b8692e', '#a35826', '#c98a3c', '#8f4f22'].map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.72, envMapIntensity: 0.6 }));
let pelletsEaten = 0, retargetTimer = 0;
const _tmpV2 = new THREE.Vector3();

function dropFood(cx, cz, count) {
  const e = pondE(cx, cz);
  if (e > 0.72) { cx *= 0.72 / e; cz *= 0.72 / e; }
  if (pellets.length > 110) count = Math.min(count, 6);
  // toss from the viewer's side so the arc reads clearly
  const toCam = new THREE.Vector3(camera.position.x - cx, 0, camera.position.z - cz).normalize();
  for (let i = 0; i < count; i++) {
    const a = rand(0, TAU), r = Math.sqrt(rand()) * 2.6;
    const lx = cx + Math.cos(a) * r, lz = cz + Math.sin(a) * r;
    const T = rand(0.65, 0.95), y0 = rand(3.2, 4.4);
    const start = new THREE.Vector3(lx + toCam.x * rand(1.5, 3), y0, lz + toCam.z * rand(1.5, 3));
    const vel = new THREE.Vector3((lx - start.x) / T, (-y0 + 0.5 * 9.8 * T * T) / T, (lz - start.z) / T);
    const m = new THREE.Mesh(PELLET_GEO, pick(PELLET_MATS));
    m.layers.set(L_UNDER); m.castShadow = true;
    m.scale.setScalar(rand(0.8, 1.2));
    m.visible = false;
    scene.add(m);
    pellets.push({ mesh: m, pos: start, vel, state: 'fall', delay: rand(0, 0.5), claims: 0, age: 0, ph: rand(0, TAU), suck: 0, eater: null });
  }
}
function chooseFood(fish) {
  let best = null, bestS = Infinity;
  const h = fish.head(_tmpV2), sh = Math.sin(fish.heading), ch = Math.cos(fish.heading);
  for (const p of pellets) {
    if ((p.state !== 'float' && p.state !== 'fall') || p.delay > 0) continue;
    const dx = p.pos.x - h.x, dz = p.pos.z - h.z, d = Math.hypot(dx, dz) + 1e-3;

}

}
function feedAt(x, z, count) {

}

}
function updateFood(dt, t) {
  for (let i = pellets.length - 1; i >= 0; i--) {
    const p = pellets[i];
    if (p.delay > 0) { p.delay -= dt; continue; }
    p.mesh.visible = true;
    if (p.state === 'fall') {
      p.vel.y -= 9.8 * dt;
      p.pos.addScaledVector(p.vel, dt);
      if (p.pos.y <= 0.01) {
        p.pos.y = 0; p.state = 'float';
        addRipple(p.pos.x, p.pos.z, 0.32); splash(p.pos.x, p.pos.z, 3, 0.45); sfx.plip();
        p.vel.set(p.vel.x * 0.04, 0, p.vel.z * 0.04);
      }
    } else if (p.state === 'float') {
      p.age += dt;
      const fx = p.pos.x - WF_IMPACT.x, fz = p.pos.z - WF_IMPACT.z, fd = Math.hypot(fx, fz) + 1e-3;
      const push = 0.3 * Math.exp(-fd * 0.25);
      p.vel.x = damp(p.vel.x, (fx / fd) * push + Math.sin(t * 0.7 + p.ph) * 0.035, 1.5, dt);
      p.vel.z = damp(p.vel.z, (fz / fd) * push + Math.cos(t * 0.6 + p.ph) * 0.035, 1.5, dt);

      for (const k of koi) {
        if (k.state !== 'feed' || k.pos.y < -0.6) continue;
        const h = k.head(_tmpV2), dx = h.x - p.pos.x, dz = h.z - p.pos.z, d = Math.hypot(dx, dz);
        if (d < 0.7 && d > 1e-3) { p.vel.x += (dx / d) * 0.9 * dt; p.vel.z += (dz / d) * 0.9 * dt; }
      }
      p.pos.x += p.vel.x * dt; p.pos.z += p.vel.z * dt;
      const e = pondE(p.pos.x, p.pos.z);
      if (e > 0.9) { p.pos.x *= 0.9 / e; p.pos.z *= 0.9 / e; }
      p.pos.y = 0.01 + Math.sin(t * 2.3 + p.ph) * 0.008;
      if (p.age > 80) p.state = 'sink';
    } else if (p.state === 'eaten') {
      p.suck += dt * 7;
      p.pos.lerp(p.eater.head(_tmpV2), Math.min(1, p.suck * 0.8));
      p.mesh.scale.setScalar(Math.max(0.01, 1 - p.suck));
      if (p.suck >= 1) { removePellet(i); continue; }
    } else if (p.state === 'sink') {
      p.pos.y -= dt * 0.12;
      p.mesh.scale.multiplyScalar(1 - dt * 0.2);

    }

  for (const k of koi) {

    }

      if (k.pos.y < -0.75) continue;
      const dx = p.x - k.pos.x, dz = p.z - k.pos.z, d = Math.hypot(dx, dz);
      if (d < k.size * 0.55 + p.r && d > 1e-3) { p.vx += (dx / d) * 0.7 * dt; p.vz += (dz / d) * 0.7 * dt; }
    }
    p.vx += (p.ax - p.x) * 0.1 * dt; p.vz += (p.az - p.z) * 0.1 * dt;
    p.vx *= Math.exp(-0.9 * dt); p.vz *= Math.exp(-0.9 * dt);
    p.x += p.vx * dt; p.z += p.vz * dt;
    p.rot += p.spin * dt;
    p.mesh.position.set(p.x + Math.sin(t * 0.3 + p.ph) * 0.05, 0.034 + Math.sin(t * 1.3 + p.ph) * 0.007, p.z + Math.cos(t * 0.27 + p.ph) * 0.05);
    p.mesh.rotation.set(Math.sin(t * 0.9 + p.ph) * 0.015, p.rot, Math.cos(t * 0.8 + p.ph) * 0.015);
  }
}

/* =====================================================================
   17. FRAME LOOP — simulate, then reflection → refraction → final pass
   ===================================================================== */
const clock = new THREE.Clock();
const INTRO_FROM = camera.position.clone(), INTRO_TO = new THREE.Vector3(3.5, 10.8, 22.5);
let introT = 0, statsT = 0, firstFrame = true;
controls.addEventListener('start', () => { introT = 1; });

function simulate(dt) {
  const t = (uTime.value += dt);

  if (introT < 1) {
    introT = Math.min(1, introT + dt / 5);
    const k = 1 - Math.pow(1 - introT, 3);
    camera.position.lerpVectors(INTRO_FROM, INTRO_TO, k);
  }
  controls.update();
  constrainCamera();

  uWind.value.set(0.8 + 0.35 * Math.sin(t * 0.21), 0.35 + 0.25 * Math.sin(t * 0.17 + 1.0));
  skyUniforms.uTime.value = t;
  for (const k of koi) k.update(dt, t);
  updateFood(dt, t);
  updateWaterfall(dt);
  updateDragonflies(dt, t);
  updateLeaves(dt, t);
  updatePads(dt, t);
  if (lantern) {
    const f = 1 + Math.sin(t * 13.0) * 0.05 + Math.sin(t * 7.3 + 1.0) * 0.07;
    lantern.light.intensity = 3.0 * f;
    lantern.glowMat.emissiveIntensity = 2.4 * f;
  }
  skyMesh.position.copy(camera.position);
  sfx.tick(dt, camera.position.distanceTo(WF_O));
}

const reflectedPosition = new THREE.Vector3(), reflectedRotation = new THREE.Quaternion();
let lastReflection = -Infinity, lastShadow = -Infinity, lastStats = '';
function renderPasses(t) {
  // 1) mirrored view for reflections (above-water scenery only)
  water.visible = false;
  const moved = camera.position.distanceToSquared(reflectedPosition) > 0.015 ||
    Math.abs(camera.quaternion.dot(reflectedRotation)) < 0.99997;
  if (reflectionDirty || moved || t - lastReflection >= 1 / 12) {
    updateReflectionCamera();
    renderer.clippingPlanes = REFL_CLIP;
    renderer.setRenderTarget(reflRT);
    renderer.render(scene, reflCam);
    renderer.clippingPlanes = [];
    reflectedPosition.copy(camera.position);
    reflectedRotation.copy(camera.quaternion);
    lastReflection = t;
    reflectionDirty = false;
  }
  // 2) everything seen through the surface, with depth for absorption & refraction
  camera.layers.set(L_UNDER);
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene, camera);
  camera.layers.enableAll();
  // 3) the full scene with the water surface compositing both
  water.visible = true;
  waterUniforms.tScene.value = sceneRT.texture;
  waterUniforms.tDepth.value = sceneRT.depthTexture;
  waterUniforms.tRefl.value = reflRT.texture;
  waterUniforms.uCamPos.value.copy(camera.position);
  if (t - lastShadow >= 1 / 12) {
    renderer.shadowMap.needsUpdate = true;
    lastShadow = t;
  }
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
}

function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  simulate(dt);
  renderPasses(uTime.value);
  if ((statsT -= dt) < 0) {
    statsT = 0.3;
    const afloat = pellets.filter((p) => p.state === 'float' || p.state === 'fall').length;
    const hungry = koi.filter((k) => k.state === 'feed').length;
    const stats = `<b>${koi.length}</b> 条锦鲤${hungry ? ` · <b>${hungry}</b> 条正在进食` : ''}<br>水面饲料 <b>${afloat}</b> 粒 · 已吃掉 <b>${pelletsEaten}</b> 粒`;
    if (stats !== lastStats) statsEl.innerHTML = lastStats = stats;
  }
  if (firstFrame) {
    firstFrame = false;
    window.__koiReady = true;
    requestAnimationFrame(() => loaderEl.classList.add('done'));
  }
}
renderer.setAnimationLoop(frame);
window.koiPond = { scene, camera, controls, koi, pellets, feedAt, simulate, uTime };
</script>
