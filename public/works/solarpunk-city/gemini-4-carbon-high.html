<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>翠曦港城 · Heliosia — Solarpunk 像素未来城市</title>
  <style>
    @layer reset, base, hud, utilities;

    @layer reset {
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
    }

    @layer base {
      :root {
        --target-size: 26px;
        --hud-bg: rgba(16, 28, 34, 0.78);
        --hud-bg-elevated: rgba(12, 22, 28, 0.90);
        --hud-border: rgba(196, 228, 198, 0.26);
        --hud-accent: #f3c65f;
        --hud-accent-mint: #6be3b0;
        --hud-text: #f4f7f0;
        --hud-muted: rgba(232, 240, 228, 0.74);
        --focus-ring: #ffe074;
        --font-ui: ui-monospace, "SF Mono", "JetBrains Mono", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace;
      }

      @media (pointer: coarse) {
        :root {
          --target-size: 44px;
        }
      }

      html, body {
        inline-size: 100%;
        block-size: 100%;
        overflow: hidden;
        background-color: #10202b;
        color: var(--hud-text);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }

      #stage-main {
        position: fixed;
        inset: 0;
        inline-size: 100dvw;
        block-size: 100dvh;
        content-visibility: auto;
        contain-intrinsic-size: auto none auto 100dvh;
        background-color: #10202b;
      }

      #city-canvas {
        display: block;
        inline-size: 100%;
        block-size: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        cursor: grab;
      }

      #city-canvas:active {
        cursor: grabbing;
      }

      :where(button):focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }
    }

    @layer hud {
      .hud-shell {
        position: fixed;
        inset-inline: 0;
        inset-block-end: max(0.65rem, env(safe-area-inset-bottom, 0px));
        display: flex;
        justify-content: center;
        padding-inline: max(0.65rem, env(safe-area-inset-left, 0px));
        pointer-events: none;
        z-index: 10;
        @media (prefers-reduced-motion: no-preference) {
          transition: opacity 0.25s ease, translate 0.25s ease;
        }
      }

      .hud-shell.is-hidden {
        opacity: 0;
        translate: 0 14px;
      }

      .hud-shell.is-hidden .hud-toolbar {
        pointer-events: none;
      }

      .hud-toolbar {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        max-inline-size: min(96dvw, 980px);
        max-block-size: 10dvh;
        padding: 0.3rem 0.5rem;
        background: var(--hud-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--hud-border);
        border-radius: 999px;
        box-shadow: 0 8px 28px rgba(5, 12, 16, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.10);
        overflow-x: auto;
        scrollbar-width: none;
        scroll-snap-type: x proximity;
      }

      .hud-toolbar::-webkit-scrollbar {
        display: none;
      }

      .hud-brand {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding-inline: 0.45rem 0.25rem;
        white-space: nowrap;
        font-size: 0.74rem;
        letter-spacing: 0.03em;
        color: var(--hud-text);
        flex-shrink: 0;
      }

      .brand-dot {
        inline-size: 8px;
        block-size: 8px;
        border-radius: 2px;
        background: var(--hud-accent-mint);
        box-shadow: 0 0 8px rgba(107, 227, 176, 0.75);
        flex-shrink: 0;
      }

      .clock-readout {
        font-variant-numeric: tabular-nums;
        color: var(--hud-accent);
        font-weight: 700;
        font-size: 0.75rem;
        min-inline-size: 3.1rem;
        text-align: center;
      }

      .hud-group {
        display: flex;
        align-items: center;
        gap: 0.22rem;
        flex-shrink: 0;
      }

      [role="separator"] {
        inline-size: 0;
        block-size: 1.15rem;
        border-inline-start: 1px solid rgba(214, 236, 216, 0.24);
        margin-inline: 0.15rem;
        flex-shrink: 0;
      }

      .hud-btn {
        appearance: none;
        border: 1px solid transparent;
        background: transparent;
        color: var(--hud-muted);
        min-inline-size: var(--target-size);
        min-block-size: var(--target-size);
        padding-inline: 0.52rem;
        padding-block: 0.2rem;
        border-radius: 999px;
        font-family: inherit;
        font-size: 0.72rem;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.28rem;
        white-space: nowrap;
        cursor: pointer;
        scroll-snap-align: start;
        transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }

      @media (hover: hover) {
        .hud-btn:hover {
          color: var(--hud-text);
          background: rgba(255, 255, 255, 0.10);
        }
      }

      .hud-btn[aria-pressed="true"] {
        background: rgba(243, 198, 95, 0.22);
        color: #fff6d6;
        border-color: rgba(243, 198, 95, 0.68);
        box-shadow: inset 0 0 0 1px rgba(243, 198, 95, 0.28);
      }

      .hud-btn svg {
        inline-size: 13px;
        block-size: 13px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      .vignette-badge {
        position: fixed;
        inset-block-start: max(0.65rem, env(safe-area-inset-top, 0px));
        inset-inline-start: max(0.75rem, env(safe-area-inset-left, 0px));
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.3rem 0.68rem;
        border-radius: 999px;
        background: rgba(14, 25, 31, 0.68);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(196, 228, 198, 0.20);
        color: rgba(244, 247, 240, 0.90);
        font-size: 0.72rem;
        letter-spacing: 0.02em;
        pointer-events: none;
        z-index: 9;
        opacity: 0;
        @media (prefers-reduced-motion: no-preference) {
          transition: opacity 0.22s ease, translate 0.22s ease;
        }
      }

      .vignette-badge.is-visible {
        opacity: 1;
      }

      .hud-toggle-pill {
        position: fixed;
        inset-block-start: max(0.65rem, env(safe-area-inset-top, 0px));
        inset-inline-end: max(0.75rem, env(safe-area-inset-right, 0px));
        min-inline-size: var(--target-size);
        min-block-size: var(--target-size);
        padding: 0.28rem 0.6rem;
        border-radius: 999px;
        border: 1px solid rgba(196, 228, 198, 0.22);
        background: rgba(14, 25, 31, 0.58);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: var(--hud-muted);
        font-family: inherit;
        font-size: 0.70rem;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        cursor: pointer;
        z-index: 11;
        transition: background-color 0.15s ease, color 0.15s ease, opacity 0.2s ease;
      }

      @media (hover: hover) {
        .hud-toggle-pill:hover {
          color: var(--hud-text);
          background: rgba(18, 32, 40, 0.85);
        }
      }

      .hud-toggle-pill[aria-pressed="true"] {
        opacity: 0.52;
        border-color: rgba(243, 198, 95, 0.55);
        color: #ffeab0;
      }

      [interestfor] {
        interest-delay: 0.45s 0.1s;
      }

      [popover="hint"] {
        inset: auto;
        position-area: block-start;
        position-try-fallbacks: flip-block;
        margin-block: 0.4rem;
        padding: 0.28rem 0.55rem;
        border-radius: 6px;
        border: 1px solid var(--hud-border);
        background: var(--hud-bg-elevated);
        color: var(--hud-text);
        font-family: var(--font-ui);
        font-size: 0.68rem;
        pointer-events: none;
      }

      @media (forced-colors: active) {
        .hud-toolbar,
        .hud-toggle-pill,
        .vignette-badge {
          background: Canvas;
          color: ButtonText;
          border: 1px solid ButtonText;
        }
        .hud-btn[aria-pressed="true"] {
          outline: 2px solid Highlight;
          color: Highlight;
        }
      }
    }

    @layer utilities {
      .sr-only {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    }
  </style>

      const FORE_W = 840;
      const WATER_Y = 212;

      const endianTest = new Uint8Array(new Uint32Array([0x11223344]).buffer);
      const IS_LITTLE_ENDIAN = endianTest[0] === 0x44;

      function packRGBA(r, g, b, a = 255) {
        const rc = r < 0 ? 0 : r > 255 ? 255 : r | 0;
        const gc = g < 0 ? 0 : g > 255 ? 255 : g | 0;
        const bc = b < 0 ? 0 : b > 255 ? 255 : b | 0;
        const ac = a < 0 ? 0 : a > 255 ? 255 : a | 0;
        return IS_LITTLE_ENDIAN
          ? ((ac << 24) | (bc << 16) | (gc << 8) | rc) >>> 0
          : ((rc << 24) | (gc << 16) | (bc << 8) | ac) >>> 0;
      }

      function unpackR(c) { return IS_LITTLE_ENDIAN ? (c & 255) : ((c >>> 24) & 255); }
      function unpackG(c) { return IS_LITTLE_ENDIAN ? ((c >>> 8) & 255) : ((c >>> 16) & 255); }
      function unpackB(c) { return IS_LITTLE_ENDIAN ? ((c >>> 16) & 255) : ((c >>> 8) & 255); }

      const BAYER4 = new Uint8Array([
         0,  8,  2, 10,
        12,  4, 14,  6,
         3, 11,  1,  9,
        15,  7, 13,  5
      ]);

      function mulberry32(seed) {
        let t = seed >>> 0;
        return function () {
          t = (t + 0x6D2B79F5) >>> 0;
          let r = Math.imul(t ^ (t >>> 15), 1 | t);
          r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }

      // Material IDs (5 bits: 0..31)
      const MAT = {
        EMPTY: 0,
        LIMESTONE: 1,      // Whitewashed organic adobe & stone
        TERRACOTTA: 2,     // Warm clay roof tiles & trim

        SKIN_CLOTH: 23,    // Warm tunic/character accents

        const s = shade < 0 ? 0 : shade > 3 ? 3 : shade | 0;

      const SKY_KEYFRAMES = {
        night:  [[8, 14, 28],   [12, 24, 44],   [18, 38, 64],   [26, 56, 84],   [34, 72, 96]],
        dawn:   [[44, 58, 98],  [88, 88, 132],  [158, 118, 142],[228, 158, 136],[252, 208, 162]],

      const CLOUD_KEYFRAMES = {
        night:  [[18, 30, 52],  [28, 44, 72],   [42, 64, 96],   [62, 90, 126]],
        dawn:   [[118, 98, 132],[178, 136, 152],[234, 184, 172],[255, 228, 204]],
        noon:   [[142, 172, 198],[192, 212, 226],[236, 242, 244],[255, 254, 250]],
        sunset: [[86, 56, 98],  [158, 88, 112], [234, 142, 112],[255, 212, 148]]
      };

      const WATER_KEYFRAMES = {
        night:  { deep: [8, 22, 38],   mid: [14, 38, 58],  glint: [140, 210, 245] },
        dawn:   { deep: [38, 68, 92],  mid: [78, 116, 132],glint: [255, 216, 178] },
        noon:   { deep: [22, 88, 106], mid: [44, 138, 148],glint: [236, 252, 255] },
        sunset: { deep: [32, 42, 74],  mid: [76, 76, 106], glint: [255, 198, 122] }
      };

      const colorLUT = new Uint32Array(512);
      const rawRGBLUT = new Uint8Array(512 * 3);
      const windowLUT = new Uint32Array(128);
      const emissiveLUT = new Uint32Array(128);
      const skyStopsRGB = new Float32Array(15);
      const cloudShadesU32 = new Uint32Array(4);
      const waterTint = { deepR: 20, deepG: 80, deepB: 100, midR: 40, midG: 130, midB: 140, glintU32: 0, nightFactor: 0, sunX: 360, sunY: 60 };

      function smoothstep(edge0, edge1, x) {
        const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }

      function getKeyframeWeights(tDay) {
        // Keyframe centers: night1=0.04, dawn=0.265, noon=0.50, sunset=0.755, night2=0.96
        const t = ((tDay % 1) + 1) % 1;
        let kA = 'night', kB = 'dawn', u = 0;
        if (t < 0.16) {
          kA = 'night'; kB = 'night'; u = 0;
        } else if (t < 0.34) {
          kA = 'night'; kB = 'dawn'; u = smoothstep(0.16, 0.27, t);
          if (t > 0.27) { kA = 'dawn'; kB = 'noon'; u = smoothstep(0.27, 0.38, t); }
        } else if (t < 0.64) {
          if (t < 0.38) { kA = 'dawn'; kB = 'noon'; u = smoothstep(0.27, 0.38, t); }
          else { kA = 'noon'; kB = 'noon'; u = 0; }
        } else if (t < 0.80) {
          kA = 'noon'; kB = 'sunset'; u = smoothstep(0.64, 0.755, t);
          if (t > 0.755) { kA = 'sunset'; kB = 'night'; u = smoothstep(0.755, 0.87, t); }
        } else if (t < 0.87) {
          kA = 'sunset'; kB = 'night'; u = smoothstep(0.755, 0.87, t);
        } else {
          kA = 'night'; kB = 'night'; u = 0;
        }
        return { kA, kB, u };
      }

      function updateLightingLUTs(tDay, animTime, weatherMode) {
        const { kA, kB, u } = getKeyframeWeights(tDay);
        // Sun direction (-1 = morning east/left, +1 = sunset west/right)
        const sunDirX = Math.sin((tDay - 0.5) * Math.PI * 2.1);
        const dayFactor = smoothstep(0.19, 0.30, tDay) * (1 - smoothstep(0.74, 0.85, tDay));
        const nightFactor = 1 - smoothstep(0.18, 0.28, tDay) + smoothstep(0.74, 0.85, tDay);
        const clampedNight = Math.max(0, Math.min(1, nightFactor));
        waterTint.nightFactor = clampedNight;

        // Slight overcast softening during sunshower
        const showerSoft = weatherMode === 'sunshower' ? 0.16 : 0;

        for (let mat = 1; mat <= 24; mat++) {
          const def = BASE_RAMPS[mat];
          if (!def) continue;
          const rA = def[kA];
          const rB = def[kB];

          for (let shade = 0; shade < 4; shade++) {
            const cA = rA[shade];
            const cB = rB[shade];
            let baseR = cA[0] + (cB[0] - cA[0]) * u;
            let baseG = cA[1] + (cB[1] - cA[1]) * u;
            let baseB = cA[2] + (cB[2] - cA[2]) * u;

            if (showerSoft > 0) {
              const avg = (baseR + baseG + baseB) * 0.333;
              baseR = baseR + (avg - baseR) * showerSoft;
              baseG = baseG + (avg + 6 - baseG) * showerSoft;
              baseB = baseB + (avg + 14 - baseB) * showerSoft;
            }

            for (let nIdx = 0; nIdx < 3; nIdx++) {
              const nx = nIdx - 1; // -1, 0, +1
              // Directional sunlight shift along east/west face normals
              let shift = 0;
              if (nx !== 0 && dayFactor > 0.02) {
                // Sun moves from right-east (t=0.26 -> sunDirX < 0) to left-west (t=0.75 -> sunDirX > 0)
                const align = -nx * sunDirX;
                shift = align * 0.42 * dayFactor;
              }

              let r = baseR, g = baseG, b = baseB;
              if (shift > 0.12 && shade < 3) {
                const nextA = rA[shade + 1];
                const nextB = rB[shade + 1];
                const nr = nextA[0] + (nextB[0] - nextA[0]) * u;
                const ng = nextA[1] + (nextB[1] - nextA[1]) * u;
                const nb = nextA[2] + (nextB[2] - nextA[2]) * u;
                const k = Math.min(0.75, shift);
                r += (nr - r) * k;
                g += (ng - g) * k;
                b += (nb - b) * k;
              } else if (shift < -0.12 && shade > 0) {
                const prevA = rA[shade - 1];
                const prevB = rB[shade - 1];
                const pr = prevA[0] + (prevB[0] - prevA[0]) * u;
                const pg = prevA[1] + (prevB[1] - prevA[1]) * u;
                const pb = prevA[2] + (prevB[2] - prevA[2]) * u;
                const k = Math.min(0.65, -shift);
                r += (pr - r) * k;
                g += (pg - g) * k;
                b += (pb - b) * k;
              }

              const key = mat | (shade << 5) | (nIdx << 7);
              colorLUT[key] = packRGBA(r, g, b);
              const k3 = key * 3;
              rawRGBLUT[k3] = r | 0;
              rawRGBLUT[k3 + 1] = g | 0;
              rawRGBLUT[k3 + 2] = b | 0;
            }
          }
        }

        // Sky stops
        const sA = SKY_KEYFRAMES[kA];
        const sB = SKY_KEYFRAMES[kB];
        for (let i = 0; i < 5; i++) {
          skyStopsRGB[i * 3]     = sA[i][0] + (sB[i][0] - sA[i][0]) * u;
          skyStopsRGB[i * 3 + 1] = sA[i][1] + (sB[i][1] - sA[i][1]) * u;
          skyStopsRGB[i * 3 + 2] = sA[i][2] + (sB[i][2] - sA[i][2]) * u;
        }

        // Cloud shades
        const clA = CLOUD_KEYFRAMES[kA];
        const clB = CLOUD_KEYFRAMES[kB];
        for (let i = 0; i < 4; i++) {
          cloudShadesU32[i] = packRGBA(
            clA[i][0] + (clB[i][0] - clA[i][0]) * u,
            clA[i][1] + (clB[i][1] - clA[i][1]) * u,
            clA[i][2] + (clB[i][2] - clA[i][2]) * u
          );
        }

        // Water colors
        const wA = WATER_KEYFRAMES[kA];
        const wB = WATER_KEYFRAMES[kB];
        waterTint.deepR = wA.deep[0] + (wB.deep[0] - wA.deep[0]) * u;
        waterTint.deepG = wA.deep[1] + (wB.deep[1] - wA.deep[1]) * u;
        waterTint.deepB = wA.deep[2] + (wB.deep[2] - wA.deep[2]) * u;
        waterTint.midR  = wA.mid[0]  + (wB.mid[0]  - wA.mid[0])  * u;
        waterTint.midG  = wA.mid[1]  + (wB.mid[1]  - wA.mid[1])  * u;
        waterTint.midB  = wA.mid[2]  + (wB.mid[2]  - wA.mid[2])  * u;
        waterTint.glintU32 = packRGBA(
          wA.glint[0] + (wB.glint[0] - wA.glint[0]) * u,
          wA.glint[1] + (wB.glint[1] - wA.glint[1]) * u,
          wA.glint[2] + (wB.glint[2] - wA.glint[2]) * u
        );

        // Window room schedules (individual cozy amber & conservatory cyan windows)
        const baseGlass = colorLUT[MAT.WINDOW | (2 << 5) | (1 << 7)];
        const baseGlassDark = colorLUT[MAT.WINDOW | (0 << 5) | (1 << 7)];
        for (let i = 0; i < 128; i++) {
          const threshold = 0.18 + ((i * 37) % 60) / 100; // staggered turn-on at dusk
          // Late night: ~25% of residential rooms sleep while greenhouses & lanterns stay lit
          const lateSleep = (i % 5 === 0) && (tDay > 0.03 && tDay < 0.16);
          if (clampedNight > threshold && !lateSleep) {
            const flicker = Math.sin(animTime * 2.3 + i * 1.7) * 6;
            if (i % 9 === 0) {
              // Botanical indoor grow-lamp / bioluminescent atrium window
              windowLUT[i] = packRGBA(82 + flicker, 236, 206);
            } else if (i % 3 === 0) {
              windowLUT[i] = packRGBA(255, 186 + flicker, 86);
            } else {
              windowLUT[i] = packRGBA(255, 218 + flicker, 126);
            }
          } else {
            windowLUT[i] = (i & 1) ? baseGlass : baseGlassDark;
          }
        }

        // Emissive lanterns (0..63) & bioluminescent flora (64..127)
        for (let i = 0; i < 64; i++) {
          const pulse = Math.sin(animTime * 2.8 + i * 0.9) * 0.5 + 0.5;
          // Lanterns
          const lr = 242 + pulse * 13;
          const lg = 178 + pulse * 44;
          const lb = 88 + pulse * 52;
          const dayLantern = colorLUT[MAT.LANTERN | (2 << 5) | (1 << 7)];
          if (clampedNight > 0.15) {
            emissiveLUT[i] = packRGBA(lr, lg, lb);
          } else {
            emissiveLUT[i] = dayLantern;
          }

          // Bioluminescent flora
          const bioGlow = smoothstep(0.15, 0.55, clampedNight);
          const dayBioIdx = (MAT.BIO_FLORA | (((i & 3)) << 5) | (1 << 7)) * 3;
          const dr = rawRGBLUT[dayBioIdx];
          const dg = rawRGBLUT[dayBioIdx + 1];
          const db = rawRGBLUT[dayBioIdx + 2];
          const br = 48 + pulse * 58;
          const bg = 228 + pulse * 27;
          const bb = 198 + pulse * 48;
          emissiveLUT[64 + i] = packRGBA(
            dr + (br - dr) * bioGlow,
            dg + (bg - dg) * bioGlow,
            db + (bb - db) * bioGlow
          );
        }
      }

      // =========================================================================
      // 3. INTEGER PIXEL-ART BRUSH & ARCHITECTURAL SCULPTING ENGINE
      // =========================================================================
      function setPx(buf, w, h, x, y, val) {
        const xi = x | 0, yi = y | 0;
        if (xi >= 0 && xi < w && yi >= 0 && yi < h) {
          buf[yi * w + xi] = val;
        }
      }

      function fillRect(buf, w, h, x, y, rw, rh, val) {
        const x0 = Math.max(0, x | 0);
        const y0 = Math.max(0, y | 0);
        const x1 = Math.min(w, (x + rw) | 0);
        const y1 = Math.min(h, (y + rh) | 0);
        for (let py = y0; py < y1; py++) {
          const row = py * w;
          for (let px = x0; px < x1; px++) {
            buf[row + px] = val;
          }
        }
      }

      function plotLine(buf, w, h, x0, y0, x1, y1, val) {
        let ax = x0 | 0, ay = y0 | 0;
        const bx = x1 | 0, by = y1 | 0;
        const dx = Math.abs(bx - ax), sx = ax < bx ? 1 : -1;
        const dy = -Math.abs(by - ay), sy = ay < by ? 1 : -1;
        let err = dx + dy;
        while (true) {
          setPx(buf, w, h, ax, ay, val);
          if (ax === bx && ay === by) break;
          const e2 = 2 * err;
          if (e2 >= dy) { err += dy; ax += sx; }
          if (e2 <= dx) { err += dx; ay += sy; }
        }
      }

      function fillEllipse(buf, w, h, cx, cy, rx, ry, val) {
        const x0 = Math.max(0, Math.floor(cx - rx));
        const x1 = Math.min(w - 1, Math.ceil(cx + rx));
        const y0 = Math.max(0, Math.floor(cy - ry));
        const y1 = Math.min(h - 1, Math.ceil(cy + ry));
        const invRx2 = 1 / Math.max(0.5, rx * rx);
        const invRy2 = 1 / Math.max(0.5, ry * ry);
        for (let py = y0; py <= y1; py++) {
          const dy = py - cy;
          const dy2 = dy * dy * invRy2;
          for (let px = x0; px <= x1; px++) {
            const dx = px - cx;
            if (dx * dx * invRx2 + dy2 <= 1.0) {
              buf[py * w + px] = val;
            }
          }
        }
      }

      // Painterly Pixel-Cluster Tree Canopy (layered lobes, never noisy salt-and-pepper!)
      function drawClusterTree(buf, w, h, cx, cy, rx, ry, foliageMat, flowerMat, seed, bioTips = false) {
        const rng = mulberry32(seed);
        // Trunk & root buttresses
        const trunkW = Math.max(2, (rx * 0.22) | 0);
        const trunkH = (ry * 0.95) | 0;
        for (let ty = 0; ty < trunkH; ty++) {
          const spread = ty > trunkH * 0.65 ? ((ty - trunkH * 0.65) * 0.35) | 0 : 0;
          for (let tx = -trunkW - spread; tx <= trunkW + spread; tx++) {
            const shade = tx < 0 ? 0 : tx === 0 ? 1 : 2;
            const nx = tx < 0 ? -1 : 1;
            setPx(buf, w, h, cx + tx, cy + (ry * 0.3) + ty, packMat(MAT.TIMBER, shade, nx));
          }
        }

        // Generate 9-14 overlapping leaf clusters sorted bottom-to-top
        const lobes = [];
        const count = 10 + ((rx * 0.4) | 0);
        for (let i = 0; i < count; i++) {
          const ang = (i / count) * Math.PI * 2 + (rng() - 0.5) * 0.45;
          const dist = (0.25 + rng() * 0.58);
          const lx = cx + Math.cos(ang) * rx * dist;
          const ly = cy + Math.sin(ang) * ry * dist;
          const lrx = Math.max(3, rx * (0.34 + rng() * 0.22));
          const lry = Math.max(3, ry * (0.34 + rng() * 0.22));
          lobes.push({ lx, ly, lrx, lry });
        }
        lobes.push({ lx: cx, ly: cy - ry * 0.15, lrx: rx * 0.52, lry: ry * 0.46 });
        lobes.sort((a, b) => b.ly - a.ly); // paint bottom shadow lobes first, crown lobes last

        for (let i = 0; i < lobes.length; i++) {
          const { lx, ly, lrx, lry } = lobes[i];
          const x0 = Math.floor(lx - lrx), x1 = Math.ceil(lx + lrx);
          const y0 = Math.floor(ly - lry), y1 = Math.ceil(ly + lry);
          for (let py = y0; py <= y1; py++) {
            for (let px = x0; px <= x1; px++) {
              const dx = (px - lx) / lrx;
              const dy = (py - ly) / lry;
              if (dx * dx + dy * dy <= 1.0) {
                const relY = (py - (cy - ry)) / (ry * 2);
                const nx = px < cx - rx * 0.18 ? -1 : px > cx + rx * 0.18 ? 1 : 0;
                let shade = 1;
                if (dy > 0.38 || relY > 0.74) shade = 0;
                else if (dy < -0.25 && relY < 0.48) shade = 2;
                if (dy < -0.55 && relY < 0.32 && ((px + py) & 1) === 0) shade = 3;

                let mat = foliageMat;
                let meta = 0;
                if (bioTips && shade >= 2 && ((px * 7 + py * 13) % 11 === 0)) {
                  mat = MAT.BIO_FLORA;
                  meta = (px + py) & 63;
                }
                setPx(buf, w, h, px, py, packMat(mat, shade, nx, meta));
              }
            }
          }
          // Accent flower clusters on sunlit top-outer lobes
          if (flowerMat && rng() > 0.38) {
            const fx = (lx + (rng() - 0.5) * lrx * 0.7) | 0;
            const fy = (ly - lry * 0.35) | 0;
            setPx(buf, w, h, fx, fy, packMat(flowerMat, 2, 0));
            setPx(buf, w, h, fx + 1, fy, packMat(flowerMat, 3, 1));
            setPx(buf, w, h, fx, fy + 1, packMat(flowerMat, 1, -1));
          }
        }
      }

      // Hanging vines & flowering tendrils
      function drawHangingVines(buf, w, h, x0, y0, width, maxLen, mat, flowerMat, seed) {
        const rng = mulberry32(seed);
        for (let dx = 0; dx < width; dx += 2) {
          if (rng() < 0.25) continue;
          const len = (3 + rng() * maxLen) | 0;
          for (let vy = 0; vy < len; vy++) {
            const shade = vy === 0 ? 0 : vy > len - 3 ? 2 : 1;
            setPx(buf, w, h, x0 + dx, y0 + vy, packMat(mat, shade, 0));
            if (vy < len * 0.4 && rng() > 0.4) {
              setPx(buf, w, h, x0 + dx + 1, y0 + vy, packMat(mat, 1, 1));
            }
          }
          if (flowerMat && len > 4 && rng() > 0.42) {
            setPx(buf, w, h, x0 + dx, y0 + len - 2, packMat(flowerMat, 3, 0));
            setPx(buf, w, h, x0 + dx, y0 + len - 1, packMat(flowerMat, 2, 0));
          }
        }
      }

      // Curved Terracotta / Verdigris Roof with Eaves & Ridge Highlight
      function drawPitchedRoof(buf, w, h, x, y, rw, rh, roofMat = MAT.TERRACOTTA) {
        for (let ry = 0; ry < rh; ry++) {
          const t = ry / Math.max(1, rh - 1);
          // Slight graceful East-Asian / Art-Nouveau flared eaves curve
          const flare = Math.pow(t, 1.35);
          const halfSpan = Math.round(2 + flare * (rw * 0.5 + 2));
          const cx = x + (rw >> 1);
          for (let px = cx - halfSpan; px <= cx + halfSpan; px++) {
            const isLeft = px < cx;
            const nx = isLeft ? -1 : px > cx ? 1 : 0;
            let shade = isLeft ? 1 : 2;
            if (ry === 0 || Math.abs(px - cx) <= 1) shade = 3; // ridge tile highlight
            else if (ry === rh - 1) shade = 0; // eave shadow lip
            else if (((px + ry) % 4 === 0) && isLeft) shade = 0; // subtle tile ribbing
            else if (((px - ry) % 4 === 0) && !isLeft) shade = 3;
            setPx(buf, w, h, px, y - rh + 1 + ry, packMat(roofMat, shade, nx));
          }
        }
      }

      // Perovskite Blue-Gold Angled Solar Pergola
      function drawSolarCanopy(buf, w, h, x, y, rw, rh) {
        // Timber struts underneath
        fillRect(buf, w, h, x + 2, y + rh, 2, 4, packMat(MAT.TIMBER, 0, 0));
        fillRect(buf, w, h, x + rw - 4, y + rh, 2, 4, packMat(MAT.TIMBER, 1, 1));
        for (let py = 0; py < rh; py++) {
          const shift = ((rh - 1 - py) * 0.6) | 0;
          for (let px = 0; px < rw; px++) {
            const isFrame = py === 0 || py === rh - 1 || px === 0 || px === rw - 1 || (px % 6 === 0);
            if (isFrame) {
              setPx(buf, w, h, x + px + shift, y + py, packMat(MAT.BRASS, py === 0 ? 3 : 1, 0));
            } else {
              let shade = py < rh * 0.45 ? 2 : 1;
              if ((px + py * 2) % 9 === 0) shade = 3; // iridescent glint
              setPx(buf, w, h, x + px + shift, y + py, packMat(MAT.SOLAR_GLASS, shade, 0));
            }
          }
        }
      }

      // Arched Solarpunk Window with Timber Sill & Planter Box
      function drawArchedWindow(buf, w, h, cx, topY, halfW, winH, roomSeed, hasFlowerBox = true) {
        for (let wy = 0; wy < winH; wy++) {
          for (let wx = -halfW; wx <= halfW; wx++) {
            if (wy < halfW && (wx * wx + (wy - halfW) * (wy - halfW) > (halfW + 0.4) * (halfW + 0.4))) {
              continue;
            }
            const isFrame = Math.abs(wx) === halfW || wy === 0 || wy === winH - 1;
            if (isFrame) {
              setPx(buf, w, h, cx + wx, topY + wy, packMat(MAT.TIMBER, wy === 0 ? 0 : 1, 0));
            } else {
              const mullion = (halfW >= 3 && wx === 0) || (winH >= 7 && wy === (winH >> 1));
              if (mullion) {
                setPx(buf, w, h, cx + wx, topY + wy, packMat(MAT.TIMBER, 1, 0));
              } else {
                const shade = (wx + wy) % 3 === 0 ? 3 : 2;
                setPx(buf, w, h, cx + wx, topY + wy, packMat(MAT.WINDOW, shade, 0, roomSeed & 127));
              }
            }
          }
        }
        if (hasFlowerBox) {
          fillRect(buf, w, h, cx - halfW - 1, topY + winH, halfW * 2 + 3, 2, packMat(MAT.TERRACOTTA, 1, 0));
          for (let fx = -halfW; fx <= halfW; fx++) {
            setPx(buf, w, h, cx + fx, topY + winH - 1, packMat(MAT.FOLIAGE_LIME, 2, 0));
            if ((fx + roomSeed) % 2 === 0) {
              setPx(buf, w, h, cx + fx, topY + winH - 2, packMat((roomSeed & 1) ? MAT.BLOSSOM_CORAL : MAT.SUNFLOWER, 3, 0));
            }
          }
        }
      }

      // Compact shrub / planter bush without a hanging tree trunk (for tower balconies & garden beds)
      function drawShrubCluster(buf, w, h, cx, baseY, rx, ry, foliageMat, flowerMat, seed, bioTips = false) {
        const rng = mulberry32(seed);
        const puffs = 5 + ((rx * 0.5) | 0);
        for (let i = 0; i < puffs; i++) {
          const u = (i / Math.max(1, puffs - 1)) - 0.5;
          const pxCenter = cx + u * rx * 1.25;
          const pyCenter = baseY - ry * (0.45 + (1 - Math.abs(u)) * 0.45);
          const prx = Math.max(2, rx * (0.45 + rng() * 0.2));
          const pry = Math.max(2, ry * (0.55 + rng() * 0.2));
          for (let py = Math.floor(pyCenter - pry); py <= baseY; py++) {
            for (let px = Math.floor(pxCenter - prx); px <= Math.ceil(pxCenter + prx); px++) {
              const dx = (px - pxCenter) / prx;
              const dy = (py - pyCenter) / pry;
              if (dx * dx + dy * dy <= 1.0) {
                const nx = px < cx - 1 ? -1 : px > cx + 1 ? 1 : 0;
                let shade = py >= baseY - 1 ? 0 : dy < -0.3 ? 2 : 1;
                if (dy < -0.55 && ((px + py) & 1) === 0) shade = 3;
                let mat = foliageMat;
                let meta = 0;
                if (bioTips && shade >= 2 && ((px * 5 + py * 11) % 9 === 0)) {
                  mat = MAT.BIO_FLORA;
                  meta = (px + py) & 63;
                }
                setPx(buf, w, h, px, py, packMat(mat, shade, nx, meta));
              }
            }
          }
          if (flowerMat && rng() > 0.35) {
            setPx(buf, w, h, Math.round(pxCenter), Math.round(pyCenter - pry * 0.4), packMat(flowerMat, 3, 0));
          }
        }
      }

      // Rounded Organic Bosco Verticale Eco-Tower
      function drawBoscoTower(buf, w, h, cx, topY, bottomY, halfW, seed) {
        const rng = mulberry32(seed);
        const totalH = bottomY - topY;

        // Main curved limestone cylinder with subtle taper at crown
        for (let y = topY; y < bottomY; y++) {
          const relY = (y - topY) / totalH;
          const curHalf = relY < 0.12
            ? Math.round(halfW * (0.72 + (relY / 0.12) * 0.28))
            : halfW;
          for (let dx = -curHalf; dx <= curHalf; dx++) {
            const norm = dx / Math.max(1, curHalf);
            const nx = norm < -0.32 ? -1 : norm > 0.32 ? 1 : 0;
            let shade = norm < -0.55 ? 0 : norm < 0.15 ? 1 : norm < 0.72 ? 2 : 3;
            // Subtle horizontal floor cornice bands every 14px
            if ((y - topY) % 14 === 0) shade = Math.max(0, shade - 1);
            if ((y - topY) % 14 === 1) shade = Math.min(3, shade + 1);
            setPx(buf, w, h, cx + dx, y, packMat(MAT.LIMESTONE, shade, nx));
          }
        }

        // Crown brass cupola + solar pergola
        drawPitchedRoof(buf, w, h, cx - halfW + 2, topY, (halfW - 2) * 2, 7, MAT.TEAL_TRIM);
        drawSolarCanopy(buf, w, h, cx - halfW + 4, topY - 10, (halfW - 3) * 2, 4);

        // Arched windows & alternating cantilevered sky-garden balconies with curved stone corbels
        let floorIdx = 0;
        for (let fy = topY + 8; fy < bottomY - 14; fy += 14) {
          const roomBase = ((seed + floorIdx * 11) % 110) + 5;
          drawArchedWindow(buf, w, h, cx - Math.floor(halfW * 0.45), fy, 2, 7, roomBase, false);
          drawArchedWindow(buf, w, h, cx + Math.floor(halfW * 0.1), fy, 3, 8, roomBase + 1, false);
          drawArchedWindow(buf, w, h, cx + Math.floor(halfW * 0.58), fy, 2, 7, roomBase + 2, false);

          // Cantilevered green terrace alternating left/right, anchored by stepped corbel brackets
          const side = (floorIdx % 2 === 0) ? -1 : 1;
          const bx = side < 0 ? cx - halfW - 6 : cx + halfW - 3;
          const bw = 9;
          // Lush shrub seated cleanly on balcony planter
          drawShrubCluster(buf, w, h, bx + (bw >> 1), fy + 8, 5, 5, MAT.FOLIAGE_LIME,
            floorIdx % 3 === 0 ? MAT.BLOSSOM_CORAL : MAT.BLOSSOM_LILAC, seed + floorIdx * 31, true);
          // Terracotta planter rim & limestone slab
          fillRect(buf, w, h, bx, fy + 8, bw, 2, packMat(MAT.TERRACOTTA, side < 0 ? 1 : 2, side));
          fillRect(buf, w, h, bx, fy + 10, bw, 2, packMat(MAT.LIMESTONE, side < 0 ? 1 : 2, side));
          // Stepped structural corbel tapering back into tower masonry
          for (let cb = 0; cb < 4; cb++) {
            const cw = bw - 2 - cb * 2;
            const cxStart = side < 0 ? (bx + bw - cw) : bx;
            fillRect(buf, w, h, cxStart, fy + 12 + cb, cw, 1, packMat(MAT.TIMBER, side < 0 ? 0 : 1, side));
          }
          drawHangingVines(buf, w, h, bx + 1, fy + 11, bw - 2, 6, MAT.FOLIAGE_DEEP,
            rng() > 0.5 ? MAT.BLOSSOM_CORAL : 0, seed + floorIdx * 17);
          floorIdx++;
        }
      }

      // Grand Centerpiece: The Sun-Lotus Geodesic Botanical Conservatory
      function drawSunLotusBiodome(buf, w, h, cx, baseY, rx, ry) {
        const drumH = 20;
        const domeBaseY = baseY - drumH - 2;

        // 1. Interior Bioluminescent Mother Banyan Tree (painted first, then grounded cleanly by drum base!)
        drawClusterTree(buf, w, h, cx, domeBaseY - Math.floor(ry * 0.56), rx * 0.72, ry * 0.60,
          MAT.FOLIAGE_DEEP, MAT.BLOSSOM_CORAL, 777, true);
        // Lush interior conservatory understory shrubs along dome floor
        drawShrubCluster(buf, w, h, cx - 22, domeBaseY - 1, 12, 7, MAT.FOLIAGE_LIME, MAT.BLOSSOM_LILAC, 781, true);
        drawShrubCluster(buf, w, h, cx + 22, domeBaseY - 1, 12, 7, MAT.FOLIAGE_LIME, MAT.BLOSSOM_CORAL, 782, true);

        // 2. Stepped limestone colonnade drum base (cleanly clips any lower trunk pixels below domeBaseY!)
        for (let y = baseY - drumH; y <= baseY; y++) {
          const hw = rx + 4 + ((y - (baseY - drumH)) >> 2);
          for (let dx = -hw; dx <= hw; dx++) {
            const nx = dx < -hw * 0.35 ? -1 : dx > hw * 0.35 ? 1 : 0;
            const shade = dx < -hw * 0.5 ? 0 : dx < hw * 0.2 ? 1 : 2;
            setPx(buf, w, h, cx + dx, y, packMat(MAT.LIMESTONE, shade, nx));
          }
        }
        // Brass cornice & glowing arched conservatory gallery windows
        fillRect(buf, w, h, cx - rx - 5, domeBaseY, (rx + 5) * 2, 2, packMat(MAT.BRASS, 2, 0));
        fillRect(buf, w, h, cx - rx - 4, domeBaseY + 2, (rx + 4) * 2, 1, packMat(MAT.STONE_DARK, 0, 0));
        for (let gx = -rx + 6; gx <= rx - 6; gx += 9) {
          drawArchedWindow(buf, w, h, cx + gx, baseY - drumH + 4, 3, 12, 9 + ((gx + 80) % 9), false);
        }

        // 3. Translucent Crystal Geodesic Dome Shell + Curved Brass Ribs
        for (let dy = -ry; dy <= 0; dy++) {
          const yRatio = -dy / ry;
          const span = Math.sqrt(Math.max(0, 1 - yRatio * yRatio)) * rx;
          const hw = Math.round(span);
          // Open oculus at top for the Mother Tree crown!
          if (yRatio > 0.90) continue;
          for (let dx = -hw; dx <= hw; dx++) {
            const xNorm = dx / Math.max(1, rx);
            const onOuterRim = Math.abs(dx) >= hw - 1;
            // Geodesic longitude & latitude brass ribs
            const lonRib = Math.abs((dx / Math.max(4, span)) * 3 - Math.round((dx / Math.max(4, span)) * 3)) < 0.09;
            const latRib = (Math.abs(dy) % 9 === 0);
            if (onOuterRim || lonRib || latRib) {
              const shade = dx < 0 ? 1 : 3;
              setPx(buf, w, h, cx + dx, domeBaseY + dy, packMat(MAT.BRASS, shade, dx < 0 ? -1 : 1));
            } else {
              // Semi-transparent crystal: dithered over the interior Mother Tree!
              const existing = buf[(domeBaseY + dy) * w + (cx + dx)];
              const checker = ((cx + dx + domeBaseY + dy) & 1) === 0;
              const specular = xNorm > 0.25 && xNorm < 0.65 && yRatio > 0.35 && yRatio < 0.75;
              if (specular || !existing || checker) {
                const shade = specular ? 3 : xNorm < -0.3 ? 0 : xNorm < 0.2 ? 1 : 2;
                setPx(buf, w, h, cx + dx, domeBaseY + dy, packMat(MAT.DOME_CRYSTAL, shade, dx < 0 ? -1 : 1));
              }
            }
          }
        }

        // 4. Mother Tree Bioluminescent Crown bursting through the Golden Oculus!
        fillRect(buf, w, h, cx - 14, domeBaseY - ry + 2, 28, 2, packMat(MAT.BRASS, 3, 0));
        drawClusterTree(buf, w, h, cx, domeBaseY - ry - 6, 22, 13, MAT.FOLIAGE_LIME, MAT.BLOSSOM_CORAL, 999, true);
      }

      // Harbor Townhouse with Warm Shutters, Striped Awning & Lantern
      function drawHarborHouse(buf, w, h, x, topY, rw, bottomY, roofMat, hasAwning, seed) {
        const rng = mulberry32(seed);
        for (let y = topY; y < bottomY; y++) {
          for (let dx = 0; dx < rw; dx++) {
            const nx = dx < 3 ? -1 : dx > rw - 4 ? 1 : 0;
            let shade = dx < 3 ? 0 : dx > rw - 4 ? 2 : 1;
            if ((y - topY) < 2) shade = 0; // under-eave shadow
            setPx(buf, w, h, x + dx, y, packMat(MAT.LIMESTONE, shade, nx));
          }
        }
        // Timber corner quoins / beams
        fillRect(buf, w, h, x, topY, 2, bottomY - topY, packMat(MAT.TIMBER, 0, -1));
        fillRect(buf, w, h, x + rw - 2, topY, 2, bottomY - topY, packMat(MAT.TIMBER, 2, 1));

        drawPitchedRoof(buf, w, h, x - 2, topY, rw + 4, 8, roofMat);

        // Upper story windows
        const cols = Math.max(1, Math.floor((rw - 8) / 11));
        const spacing = Math.floor((rw - 4) / cols);
        for (let c = 0; c < cols; c++) {
          const wx = x + 3 + Math.floor(spacing * (c + 0.5));
          drawArchedWindow(buf, w, h, wx, topY + 6, 2, 7, (seed + c * 13) & 127, true);
        }

        // Ground story shopfront / striped awning & hanging lantern
        const groundY = topY + 20;
        if (groundY < bottomY - 8) {
          if (hasAwning) {
            for (let ay = 0; ay < 5; ay++) {
              for (let ax = 1; ax < rw - 1; ax++) {
                const stripe = ((ax + (ay >> 1)) % 4 < 2) ? MAT.AWNING_CORAL : MAT.AWNING_CREAM;
                setPx(buf, w, h, x + ax, groundY + ay, packMat(stripe, ay < 3 ? 2 : 1, 0));
              }
            }
          }
          // Warm shop windows & arched timber doorway
          drawArchedWindow(buf, w, h, x + (rw >> 1), groundY + 6, Math.min(5, (rw >> 2)), 9, (seed + 3) & 127, false);
          // Hanging street lantern
          setPx(buf, w, h, x + 4, groundY + 6, packMat(MAT.LANTERN, 3, 0, seed & 63));
          setPx(buf, w, h, x + 4, groundY + 7, packMat(MAT.LANTERN, 2, 0, seed & 63));
        }
      }

      // =========================================================================
      // 4. PRE-BAKE THE 4 PARALLAX STATIC WORLD LAYERS AT STARTUP
      // =========================================================================
      const layerFar  = new Uint16Array(WORLD_W * WORLD_H); // Parallax 0.32x
      const layerMid  = new Uint16Array(WORLD_W * WORLD_H); // Parallax 0.66x
      const layerMain = new Uint16Array(WORLD_W * WORLD_H); // Parallax 1.00x
      const layerFore = new Uint16Array(FORE_W  * WORLD_H); // Parallax 1.28x

      // Store coordinates for dynamic kinetic overlays (windmills, waterfalls, lanterns, etc.)
      const windmills = [];
      const helicalTurbines = [];
      const pointLights = []; // { x, y, r, type: 'warm' | 'bio', layer: 'mid' | 'main' | 'fore' }

      function buildWorldLayers() {
        // -----------------------------------------------------------------------
        // LAYER A: Far Karst Emerald Mountains, Offshore Solar Rings & Misty Bay
        // -----------------------------------------------------------------------
        for (let x = 0; x < WORLD_W; x++) {
          // Far mountain silhouette (smooth multi-harmonic karst peaks)
          const h1 = Math.sin(x * 0.011 + 0.4) * 26 + Math.sin(x * 0.029 + 1.8) * 14 + Math.cos(x * 0.053) * 6;
          const farTop = Math.round(134 - Math.max(-12, h1));
          const slope1 = Math.cos(x * 0.011 + 0.4);
          for (let y = farTop; y < WATER_Y; y++) {
            const dy = y - farTop;
            let shade = slope1 > 0.1 ? 2 : 1;
            if (dy < 3 && slope1 > 0) shade = 3;
            else if (dy > 28) shade = 0;
            setPx(layerFar, WORLD_W, WORLD_H, x, y, packMat(MAT.DISTANT_MTN, shade, slope1 > 0 ? 1 : -1));
          }

          // Mid-far forested ridges & terraced valleys (leaving a scenic sea-bay opening around x=540..660)
          const bayOpen = smoothstep(510, 560, x) * (1 - smoothstep(650, 695, x));
          const h2 = Math.sin(x * 0.017 + 2.3) * 22 + Math.cos(x * 0.041 + 0.7) * 10;
          const midTop = Math.round(156 - h2 + bayOpen * 46);
          const slope2 = Math.cos(x * 0.017 + 2.3);
          for (let y = midTop; y < WATER_Y; y++) {
            const dy = y - midTop;
            // Subtle agricultural contour terraces on mountain slopes
            const terrace = (dy > 8 && dy < 38 && (y % 5 === 0));
            let shade = terrace ? 2 : (slope2 > 0 ? 1 : 0);
            if (dy < 2 && slope2 > 0) shade = 2;
            setPx(layerFar, WORLD_W, WORLD_H, x, y, packMat(MAT.MID_MTN, shade, slope2 > 0 ? 1 : -1));
          }
        }

        // Distant Atmospheric Solar Collector Arch & Offshore Bay Rings (x=555..645)
        for (let deg = 0; deg <= 180; deg += 2) {
          const rad = (deg * Math.PI) / 180;
          const ax = Math.round(600 + Math.cos(rad) * 38);
          const ay = Math.round(198 - Math.sin(rad) * 34);
          setPx(layerFar, WORLD_W, WORLD_H, ax, ay, packMat(MAT.BRASS, 2, 0));
          setPx(layerFar, WORLD_W, WORLD_H, ax, ay + 1, packMat(MAT.DISTANT_MTN, 3, 0));
        }
        // Distant slender white eco-spires on the ridges
        [118, 134, 578, 622].forEach((sx, idx) => {
          const sy = idx < 2 ? 118 : 178;
          fillRect(layerFar, WORLD_W, WORLD_H, sx, sy, 2, 22, packMat(MAT.LIMESTONE, 2, 0));
          setPx(layerFar, WORLD_W, WORLD_H, sx, sy - 1, packMat(MAT.BRASS, 3, 0));
        });

        // -----------------------------------------------------------------------
        // LAYER B: Upper Citadel, Cliffs, Sun-Lotus Biodome, Bosco Towers & Falls
        // -----------------------------------------------------------------------
        // Organic horizontal limestone cliff strata, mossy ledges & terraced retaining walls
        const cliffRng = mulberry32(4242);
        for (let x = 130; x < 555; x++) {
          const envelope = smoothstep(130, 185, x) * (1 - smoothstep(495, 555, x));
          if (envelope <= 0.02) continue;
          const stepH = Math.round(182 - envelope * 58 - Math.sin(x * 0.035) * 6);
          for (let y = stepH; y < WATER_Y; y++) {
            const dy = y - stepH;
            const strataWave = Math.round(Math.sin(x * 0.045 + (y >> 4) * 1.7) * 2);
            const strataY = y + strataWave;
            const isMossLedge = dy < 3 || (strataY % 19 === 0 && ((x + strataY) % 13 < 9));
            const isShadowSeam = strataY % 19 === 1 || (strataY % 11 === 0 && ((x * 3) % 17 < 6));
            const isSunBlock = !isShadowSeam && ((strataY % 19 > 2 && strataY % 19 < 7) && ((x >> 3) + (y >> 3)) % 3 === 0);
            const mat = dy < 3 ? MAT.FOLIAGE_DEEP : (isMossLedge && dy < 36 ? MAT.FOLIAGE_DEEP : MAT.CLIFF_ROCK);
            const shade = isMossLedge ? 2 : isShadowSeam ? 0 : isSunBlock ? 2 : 1;
            const nx = x < 340 ? -1 : 1;
            setPx(layerMid, WORLD_W, WORLD_H, x, y, packMat(mat, shade, nx));
          }
        }
        // Cliffside mid-slope trees, terraced retaining arches & warm grotto windows behind canal bridge!
        drawClusterTree(layerMid, WORLD_W, WORLD_H, 362, 168, 17, 13, MAT.FOLIAGE_DEEP, MAT.BLOSSOM_LILAC, 451, true);
        drawClusterTree(layerMid, WORLD_W, WORLD_H, 422, 172, 16, 12, MAT.FOLIAGE_LIME, MAT.BLOSSOM_CORAL, 452, true);
        drawHarborHouse(layerMid, WORLD_W, WORLD_H, 380, 158, 28, 194, MAT.TEAL_TRIM, false, 455);
        if (cliffRng() >= 0) {
          drawHangingVines(layerMid, WORLD_W, WORLD_H, 340, 154, 100, 12, MAT.FOLIAGE_DEEP, MAT.BLOSSOM_CORAL, 459);
        }

        // Elevated Stone Aqueduct connecting left cliff cistern to central Biodome
        const aqY = 122;
        fillRect(layerMid, WORLD_W, WORLD_H, 188, aqY, 156, 4, packMat(MAT.LIMESTONE, 2, 0));
        fillRect(layerMid, WORLD_W, WORLD_H, 188, aqY + 1, 156, 1, packMat(MAT.WATER_FOAM, 3, 0));
        for (let ax = 195; ax < 335; ax += 18) {
          fillRect(layerMid, WORLD_W, WORLD_H, ax, aqY + 4, 4, 34, packMat(MAT.LIMESTONE, 1, -1));
          drawHangingVines(layerMid, WORLD_W, WORLD_H, ax - 2, aqY + 4, 8, 11, MAT.FOLIAGE_DEEP, 0, ax * 13);
        }

        // Bosco Verticale Eco-Towers flanking the central Biodome
        drawBoscoTower(layerMid, WORLD_W, WORLD_H, 282, 62, 176, 16, 101);
        drawBoscoTower(layerMid, WORLD_W, WORLD_H, 476, 56, 180, 17, 202);
        drawBoscoTower(layerMid, WORLD_W, WORLD_H, 232, 86, 178, 13, 303);

        // Register Helical VAWT Turbines atop Bosco Towers
        helicalTurbines.push({ x: 282, y: 40, h: 13, r: 4, layer: 'mid', speed: 2.4, phase: 0.2 });
        helicalTurbines.push({ x: 476, y: 34, h: 14, r: 4, layer: 'mid', speed: 2.1, phase: 1.9 });
        helicalTurbines.push({ x: 232, y: 66, h: 11, r: 3, layer: 'mid', speed: 2.8, phase: 3.4 });

        // Grand Sun-Lotus Geodesic Biodome (Focal Crown at x=386, baseY=128)
        drawSunLotusBiodome(layerMid, WORLD_W, WORLD_H, 386, 128, 44, 36);

        vx: (i < 5 ? 15 : -13) * (0.9 + (i % 3) * 0.1),
        flapPhase: i * 0.85
      }));

      const particles = Array.from({ length: 85 }, () => ({
        x: rngInit() * WORLD_W,
        y: rngInit() * WORLD_H,
        vx: (rngInit() - 0.5) * 12,
        vy: (rngInit() - 0.5) * 8,
        phase: rngInit() * Math.PI * 2,
        seed: Math.floor(rngInit() * 1000)
      }));

      const waterRipples = []; // Dynamic concentric rings from heron beak / raindrops

      // =========================================================================
      // 6. VIEWPORT FRAMEBUFFER & CAMERA SYSTEM
      // =========================================================================
      const canvas = document.getElementById('city-canvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const clockText = document.getElementById('clock-text');
      const statusRegion = document.getElementById('hud-status');
      const landmarkBadge = document.getElementById('landmark-badge');
      const landmarkText = document.getElementById('landmark-text');

      let viewW = 480;
      let viewH = 270;
      let frameImgData = null;
      let out32 = null;

      // Interactive state
      const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

      let animTime = 0;

      let isZoom2x = false;

      // Camera center in WORLD coordinates

      function resizeBuffers() {
        const cssW = Math.max(320, window.innerWidth);
        const cssH = Math.max(240, window.innerHeight);
        const aspect = cssW / cssH;
        const baseH = isZoom2x ? 135 : 270;
        viewH = baseH;
        viewW = Math.min(WORLD_W, Math.max(180, Math.round(baseH * aspect)));

        canvas.width = viewW;
        canvas.height = viewH;
        ctx.imageSmoothingEnabled = false;

        frameImgData = ctx.createImageData(viewW, viewH);
        out32 = new Uint32Array(frameImgData.data.buffer);
        clampCamera();
      }

      function clampCamera() {
        const halfW = viewW * 0.5;
        const halfH = viewH * 0.5;
        targetCamX = Math.max(halfW, Math.min(WORLD_W - halfW, targetCamX));
        targetCamY = Math.max(halfH, Math.min(WORLD_H - halfH, targetCamY));
        camX = Math.max(halfW, Math.min(WORLD_W - halfW, camX));
        camY = Math.max(halfH, Math.min(WORLD_H - halfH, camY));
      }

      window.addEventListener('resize', resizeBuffers);

      // =========================================================================
      // 7. PER-FRAME PIXEL RENDERING PIPELINE
      // =========================================================================
      function plotViewMat(wx, wy, mat, shade = 2, nx = 0, viewLeft = 0, viewTop = 0) {
        const vx = (wx - viewLeft) | 0;
        const vy = (wy - viewTop) | 0;
        if (vx >= 0 && vx < viewW && vy >= 0 && vy < viewH) {
          out32[vy * viewW + vx] = colorLUT[mat | ((shade & 3) << 5) | (((nx + 1) & 3) << 7)];
        }
      }

      function plotViewU32(wx, wy, u32, viewLeft, viewTop) {
        const vx = (wx - viewLeft) | 0;
        const vy = (wy - viewTop) | 0;
        if (vx >= 0 && vx < viewW && vy >= 0 && vy < viewH) {
          out32[vy * viewW + vx] = u32;
        }
      }

      function fillViewRectMat(wx, wy, rw, rh, mat, shade, viewLeft, viewTop) {
        const u32 = colorLUT[mat | ((shade & 3) << 5) | (1 << 7)];
        const x0 = Math.max(0, (wx - viewLeft) | 0);
        const y0 = Math.max(0, (wy - viewTop) | 0);
        const x1 = Math.min(viewW, (wx + rw - viewLeft) | 0);
        const y1 = Math.min(viewH, (wy + rh - viewTop) | 0);
        for (let py = y0; py < y1; py++) {
          const row = py * viewW;
          for (let px = x0; px < x1; px++) {
            out32[row + px] = u32;
          }
        }
      }

      function plotViewLineU32(wx0, wy0, wx1, wy1, u32, viewLeft, viewTop) {
        let ax = (wx0 - viewLeft) | 0, ay = (wy0 - viewTop) | 0;
        const bx = (wx1 - viewLeft) | 0, by = (wy1 - viewTop) | 0;
        const dx = Math.abs(bx - ax), sx = ax < bx ? 1 : -1;
        const dy = -Math.abs(by - ay), sy = ay < by ? 1 : -1;
        let err = dx + dy;
        while (true) {
          if (ax >= 0 && ax < viewW && ay >= 0 && ay < viewH) {
            out32[ay * viewW + ax] = u32;
          }
          if (ax === bx && ay === by) break;
          const e2 = 2 * err;
          if (e2 >= dy) { err += dy; ax += sx; }
          if (e2 <= dx) { err += dx; ay += sy; }
        }
      }

      // Bayer-dithered additive glow light stamp (warm lanterns, tram beams, bio-orbs)
      function stampDitheredGlow(wx, wy, radius, rAdd, gAdd, bAdd, intensity, viewLeft, viewTop) {
        if (intensity <= 0.03) return;
        const vxCenter = (wx - viewLeft) | 0;
        const vyCenter = (wy - viewTop) | 0;
        const rad = radius | 0;
        if (vxCenter + rad < 0 || vxCenter - rad >= viewW || vyCenter + rad < 0 || vyCenter - rad >= viewH) return;

        const x0 = Math.max(0, vxCenter - rad);
        const x1 = Math.min(viewW - 1, vxCenter + rad);
        const y0 = Math.max(0, vyCenter - rad);
        const y1 = Math.min(viewH - 1, vyCenter + rad);
        const invR2 = 1 / (rad * rad);

        for (let py = y0; py <= y1; py++) {
          const dy = py - vyCenter;
          const dy2 = dy * dy;
          const row = py * viewW;
          const byRow = (py & 3) << 2;
          for (let px = x0; px <= x1; px++) {
            const dx = px - vxCenter;
            const d2 = (dx * dx + dy2) * invR2;
            if (d2 >= 1.0) continue;
            const falloff = (1.0 - d2) * (1.0 - d2) * intensity;
            const bayer = BAYER4[byRow | (px & 3)] / 16.0;
            // Quantize light into 3 crisp pixel-art glow rings using Bayer dithering
            let tier = 0;
            if (falloff > 0.58 + bayer * 0.18) tier = 0.62;
            else if (falloff > 0.24 + bayer * 0.20) tier = 0.32;
            else if (falloff > 0.07 + bayer * 0.14) tier = 0.13;
            if (tier > 0) {
              const c = out32[row + px];
              const cr = unpackR(c) + rAdd * tier;
              const cg = unpackG(c) + gAdd * tier;
              const cb = unpackB(c) + bAdd * tier;
              out32[row + px] = packRGBA(cr, cg, cb);
            }
          }
        }
      }

      function blitIndexedLayer(layerBuf, layerW, parallax, viewLeft, viewTop, maxY) {
        const centerW = WORLD_W * 0.5;
        const layerCenter = layerW * 0.5;
        const shiftX = Math.round((camX - centerW) * parallax + layerCenter - viewW * 0.5);
        const yEnd = Math.min(viewH, maxY - viewTop);
        if (yEnd <= 0) return shiftX;

        for (let vy = 0; vy < yEnd; vy++) {
          const wy = vy + viewTop;
          if (wy < 0 || wy >= WORLD_H) continue;
          const srcRow = wy * layerW;
          const dstRow = vy * viewW;
          for (let vx = 0; vx < viewW; vx++) {
            const lx = vx + shiftX;
            if (lx < 0 || lx >= layerW) continue;
            const packed = layerBuf[srcRow + lx];
            if (packed === 0) continue;
            const mat = packed & 31;
            if (mat === MAT.WINDOW) {
              out32[dstRow + vx] = windowLUT[packed >>> 9];
            } else if (mat === MAT.LANTERN) {
              out32[dstRow + vx] = emissiveLUT[(packed >>> 9) & 63];
            } else if (mat === MAT.BIO_FLORA) {
              out32[dstRow + vx] = emissiveLUT[64 + ((packed >>> 9) & 63)];
            } else {
              out32[dstRow + vx] = colorLUT[packed & 511];
            }
          }
        }
        return shiftX;
      }

      function renderSkyAndCelestials(viewLeft, viewTop) {
        const skyLimit = Math.min(viewH, WATER_Y - viewTop + 2);
        // 1. Bayer-dithered quantized sky gradient
        for (let vy = 0; vy < skyLimit; vy++) {
          const wy = Math.max(0, Math.min(WATER_Y, vy + viewTop));
          const t = (wy / WATER_Y) * 4.0;
          const seg = Math.min(3, t | 0);
          const frac = t - seg;
          const s0 = seg * 3, s1 = (seg + 1) * 3;
          const r0 = skyStopsRGB[s0], g0 = skyStopsRGB[s0 + 1], b0 = skyStopsRGB[s0 + 2];
          const dr = skyStopsRGB[s1] - r0, dg = skyStopsRGB[s1 + 1] - g0, db = skyStopsRGB[s1 + 2] - b0;
          const row = vy * viewW;
          const byRow = (vy & 3) << 2;

          for (let vx = 0; vx < viewW; vx++) {
            const bayer = (BAYER4[byRow | (vx & 3)] / 16.0) - 0.5;
            // Quantize into crisp pixel bands with ordered dither transitions
            const q = Math.max(0, Math.min(1, Math.round((frac + bayer * 0.28) * 5) / 5));
            out32[row + vx] = packRGBA(r0 + dr * q, g0 + dg * q, b0 + db * q);
          }
        }

        // 2. Night Stars & Shooting Star
        const nightAlpha = waterTint.nightFactor;
        if (nightAlpha > 0.25) {
          const starShift = Math.round((camX - WORLD_W * 0.5) * 0.12 + WORLD_W * 0.5 - viewW * 0.5);
          for (let i = 0; i < stars.length; i++) {
            const st = stars[i];
            const vx = st.x - starShift;
            const vy = st.y - viewTop;
            if (vx < 0 || vx >= viewW || vy < 0 || vy >= skyLimit) continue;
            const tw = Math.sin(animTime * st.speed + st.phase) * 0.5 + 0.5;
            if (tw * nightAlpha > 0.38) {
              const lum = st.bright ? 248 : 190;
              out32[vy * viewW + vx] = packRGBA(lum - 16, lum, 255);
              if (st.bright && tw > 0.82 && nightAlpha > 0.65) {
                const soft = packRGBA(120, 175, 220);
                if (vx > 0) out32[vy * viewW + vx - 1] = soft;
                if (vx + 1 < viewW) out32[vy * viewW + vx + 1] = soft;
              }
            }
          }
          // Periodic shooting star every ~14s at night
          const meteorCycle = (animTime * 0.07) % 1;
          if (nightAlpha > 0.6 && meteorCycle < 0.06) {
            const prog = meteorCycle / 0.06;
            const mx = Math.round(520 - prog * 170);
            const my = Math.round(22 + prog * 54);
            plotViewLineU32(mx, my, mx + 12, my - 4, packRGBA(180, 245, 255), viewLeft, viewTop);
            plotViewU32(mx, my, packRGBA(255, 255, 255), viewLeft, viewTop);
          }
        }

        // 3. Sun & Crescent Moon Arc
        // Sun rises t=0.23 (east x=560) -> zenith t=0.50 (x=380, y=26) -> sets t=0.77 (west x=150, y=152)
        if (tDay > 0.19 && tDay < 0.82) {
          const sunU = (tDay - 0.21) / 0.58;
          const sunX = Math.round(585 - sunU * 440);
          const sunY = Math.round(148 - Math.sin(Math.max(0, Math.min(1, sunU)) * Math.PI) * 122);
          waterTint.sunX = sunX;
          waterTint.sunY = sunY;

          // Dithered warm sun corona
          const isLowSun = sunY > 75;
          stampDitheredGlow(sunX, sunY, isLowSun ? 46 : 34, 255, isLowSun ? 145 : 210, isLowSun ? 65 : 140, 0.72, viewLeft, viewTop);

          // Crisp pixel Sun disc (radius 10)
          const sunCore = isLowSun ? packRGBA(255, 232, 158) : packRGBA(255, 252, 226);
          const sunRim  = isLowSun ? packRGBA(255, 176, 88)  : packRGBA(255, 238, 176);
          for (let dy = -10; dy <= 10; dy++) {
            for (let dx = -10; dx <= 10; dx++) {
              const d2 = dx * dx + dy * dy;
              if (d2 <= 100) {
                plotViewU32(sunX + dx, sunY + dy, d2 > 72 ? sunRim : sunCore, viewLeft, viewTop);
              }
            }
          }
        } else {
          // Crescent Moon arc across night sky
          const nightU = tDay >= 0.82 ? (tDay - 0.82) / 0.37 : (tDay + 0.18) / 0.37;
          const moonX = Math.round(560 - nightU * 360);
          const moonY = Math.round(126 - Math.sin(Math.max(0, Math.min(1, nightU)) * Math.PI) * 92);
          waterTint.sunX = moonX;
          waterTint.sunY = moonY;

          stampDitheredGlow(moonX, moonY, 28, 95, 165, 225, 0.45, viewLeft, viewTop);
          const moonLit = packRGBA(238, 248, 255);
          const moonEarthshine = packRGBA(36, 58, 86);
          for (let dy = -8; dy <= 8; dy++) {
            for (let dx = -8; dx <= 8; dx++) {
              if (dx * dx + dy * dy <= 64) {
                const inShadow = (dx - 3) * (dx - 3) + (dy + 2) * (dy + 2) <= 46;
                plotViewU32(moonX + dx, moonY + dy, inShadow ? moonEarthshine : moonLit, viewLeft, viewTop);
              }
            }
          }
        }

        // 4. Double Pixel Rainbow during Sun-shower!
        if (weatherMode === 'sunshower' && nightAlpha < 0.55) {
          const rbColors = [
            packRGBA(244, 108, 112),
            packRGBA(250, 176, 96),
            packRGBA(246, 232, 118),
            packRGBA(118, 224, 146),
            packRGBA(104, 188, 242),
            packRGBA(168, 132, 232)
          ];
          const rcx = 410, rcy = 205;
          for (let vx = 0; vx < viewW; vx++) {
            const wx = vx + viewLeft;
            const dx = wx - rcx;
            for (let vy = 10; vy < skyLimit; vy++) {
              if (((vx + vy) & 1) !== 0) continue; // delicate 50% pixel dither!
              const wy = vy + viewTop;
              const dy = wy - rcy;
              if (dy > 0) continue;
              const dist = Math.sqrt(dx * dx + dy * dy);
              const band = Math.floor((dist - 142) * 0.5);
              if (band >= 0 && band < 6) {
                const cur = out32[vy * viewW + vx];
                const rc = rbColors[5 - band];
                out32[vy * viewW + vx] = packRGBA(
                  (unpackR(cur) * 2 + unpackR(rc)) / 3,
                  (unpackG(cur) * 2 + unpackG(rc)) / 3,
                  (unpackB(cur) * 2 + unpackB(rc)) / 3
                );
              }
            }
          }
        }

        // 5. Volumetric Pixel Cumulus Clouds (with warm sunlit tops & flat undersides)
        for (let i = 0; i < clouds.length; i++) {
          const cl = clouds[i];
          const shift = Math.round((camX - WORLD_W * 0.5) * cl.parallax + WORLD_W * 0.5 - viewW * 0.5);
          const cx = Math.round(cl.x) - shift;
          const cy = cl.y - viewTop;
          if (cx < -70 || cx > viewW + 70 || cy < -25 || cy > skyLimit + 10) continue;

          const flatBottomY = cy + 6;
          for (let p = 0; p < cl.puffs.length; p++) {
            const pf = cl.puffs[p];
            const pxCenter = cx + pf.ox;
            const pyCenter = cy + pf.oy;
            for (let dy = -pf.ry; dy <= pf.ry; dy++) {
              const py = pyCenter + dy;
              if (py < 0 || py >= skyLimit || py > flatBottomY) continue;
              for (let dx = -pf.rx; dx <= pf.rx; dx++) {
                const px = pxCenter + dx;
                if (px < 0 || px >= viewW) continue;
                if ((dx * dx) / (pf.rx * pf.rx) + (dy * dy) / (pf.ry * pf.ry) <= 1.0) {
                  let shade = 2;
                  if (py >= flatBottomY - 1 || dy > pf.ry * 0.45) shade = 0;
                  else if (dy > 0) shade = 1;
                  else if (dy < -pf.ry * 0.45 && ((px + py) & 1) === 0) shade = 3;
                  out32[py * viewW + px] = cloudShadesU32[shade];
                }
              }
            }
          }
        }

        // 6. Solar Bio-Airships gliding between clouds & mountains
        for (let i = 0; i < airships.length; i++) {
          const ship = airships[i];
          const bob = Math.round(Math.sin(animTime * 1.4 + ship.bobPhase) * 2);
          const sx = Math.round(ship.x);
          const sy = ship.y + bob;
          const rx = i === 0 ? 18 : 13;
          const ry = i === 0 ? 6 : 4;

          // Envelope hull (cream linen + golden solar spine)
          for (let dy = -ry; dy <= ry; dy++) {
            for (let dx = -rx; dx <= rx; dx++) {
              if ((dx * dx) / (rx * rx) + (dy * dy) / (ry * ry) <= 1.0) {
                const isSolarSpine = dy < -ry * 0.3 && Math.abs(dx) < rx * 0.65;
                const mat = isSolarSpine ? MAT.SOLAR_GLASS : (Math.abs(dy) === 0 ? MAT.TEAL_TRIM : MAT.AWNING_CREAM);
                const shade = dy < -1 ? 3 : dy > 2 ? 0 : 2;
                plotViewMat(sx + dx, sy + dy, mat, shade, 0, viewLeft, viewTop);
              }
            }
          }
          // Dorsal solar sail fin
          const tailDir = -ship.dir;
          for (let fy = 1; fy <= 4; fy++) {
            for (let fx = 0; fx < 6 - fy; fx++) {
              plotViewMat(sx + tailDir * (rx - 5 + fx), sy - ry - fy + 1, MAT.SAIL_AMBER, 2, 0, viewLeft, viewTop);
            }
          }
          // Timber gondola + glowing night cabin & navigation beacon
          fillViewRectMat(sx - 5, sy + ry + 2, 10, 3, MAT.TIMBER, 1, viewLeft, viewTop);
          plotViewMat(sx - 4, sy + ry + 1, MAT.STONE_DARK, 0, 0, viewLeft, viewTop);
          plotViewMat(sx + 4, sy + ry + 1, MAT.STONE_DARK, 0, 0, viewLeft, viewTop);
          if (nightAlpha > 0.3) {
            plotViewU32(sx - 2, sy + ry + 3, packRGBA(255, 218, 120), viewLeft, viewTop);
            plotViewU32(sx + 1, sy + ry + 3, packRGBA(255, 218, 120), viewLeft, viewTop);
            if (((animTime * 2) | 0) % 2 === 0) {
              plotViewU32(sx + ship.dir * rx, sy, packRGBA(90, 255, 210), viewLeft, viewTop);
            }
          }
        }
      }

      // Dynamic Windmills, Helical Turbines, Rotating Heliostat Ring & Waterfalls
      function renderCleanEnergyKinetics(targetLayer, parallax, viewLeft, viewTop) {
        const shiftX = Math.round((camX - WORLD_W * 0.5) * parallax + WORLD_W * 0.5 - viewW * 0.5);
        const toWorldViewX = (lx) => lx - shiftX + viewLeft;

        // 1. Rotating Golden Heliostat Ring above Sun-Lotus Biodome (on 'mid' layer)
        if (targetLayer === 'mid') {
          const hcx = toWorldViewX(386);
          const hcy = 72;
          for (let deg = 0; deg < 360; deg += 5) {
            const ang = (deg * Math.PI) / 180 + animTime * 0.8;
            const rx = Math.round(hcx + Math.cos(ang) * 21);
            const ry = Math.round(hcy + Math.sin(ang) * 4);
            // Back half goes behind crown only if sin < 0, front half sparkles in front
            if (Math.sin(ang) < 0 && Math.abs(Math.cos(ang)) < 0.65) continue;
            const glint = Math.sin(ang * 2 - animTime * 2) > 0.5 ? 3 : 2;
            plotViewMat(rx, ry, MAT.BRASS, glint, 0, viewLeft, viewTop);
          }
        }

        // 2. Helical Vertical-Axis Wind Turbines (Savonius/Darrieus double-helix)
        for (let i = 0; i < helicalTurbines.length; i++) {
          const ht = helicalTurbines[i];
          if (ht.layer !== targetLayer) continue;
          const tx = toWorldViewX(ht.x);
          // Central brass mast
          fillViewRectMat(tx, ht.y, 1, ht.h + 4, MAT.BRASS, 1, viewLeft, viewTop);
          for (let dy = 0; dy < ht.h; dy++) {
            const a1 = animTime * ht.speed + ht.phase + dy * 0.42;
            const x1 = Math.round(tx + Math.sin(a1) * ht.r);
            const x2 = Math.round(tx + Math.sin(a1 + Math.PI) * ht.r);
            plotViewMat(x1, ht.y + dy, MAT.TEAL_TRIM, Math.cos(a1) > 0 ? 3 : 1, 0, viewLeft, viewTop);
            plotViewMat(x2, ht.y + dy, MAT.AWNING_CREAM, Math.cos(a1 + Math.PI) > 0 ? 3 : 1, 0, viewLeft, viewTop);
          }
        }

        // 3. 3-Blade Sail Windmills
        for (let i = 0; i < windmills.length; i++) {
          const wm = windmills[i];
          if (wm.layer !== targetLayer) continue;
          const wx = toWorldViewX(wm.x);
          const wy = wm.y;
          const sparColor = colorLUT[MAT.TIMBER | (2 << 5) | (1 << 7)];
          const sailLit   = colorLUT[MAT.AWNING_CREAM | (3 << 5) | (1 << 7)];
          const sailMid   = colorLUT[MAT.AWNING_CREAM | (2 << 5) | (1 << 7)];

          for (let b = 0; b < 3; b++) {
            const ang = animTime * wm.speed + wm.phase + (b * Math.PI * 2) / 3;
            const ca = Math.cos(ang), sa = Math.sin(ang);
            const px = -sa, py = ca;
            const tipX = Math.round(wx + ca * wm.bladeLen);
            const tipY = Math.round(wy + sa * wm.bladeLen);
            plotViewLineU32(wx, wy, tipX, tipY, sparColor, viewLeft, viewTop);
            // Linen sail lattice along outer 75% of spar
            for (let r = 4; r <= wm.bladeLen - 1; r++) {
              const bx = wx + ca * r;
              const by = wy + sa * r;
              const sailW = r < wm.bladeLen - 3 ? 3 : 2;
              for (let sw = 1; sw <= sailW; sw++) {
                plotViewU32(Math.round(bx + px * sw), Math.round(by + py * sw), sw === 1 ? sailLit : sailMid, viewLeft, viewTop);
              }
            }
          }
          // Brass rotor hub
          fillViewRectMat(wx - 1, wy - 1, 3, 3, MAT.BRASS, 3, viewLeft, viewTop);
        }

        // 4. Cascading Aqueduct Waterfalls & Spinning Hydro-Wheels (on 'main' layer)
        if (targetLayer === 'main') {
          // Upper cliff cascade (x=188..198, y=148..212) + secondary cascade (x=200..205, y=172..212)
          const foam3 = colorLUT[MAT.WATER_FOAM | (3 << 5) | (1 << 7)];
