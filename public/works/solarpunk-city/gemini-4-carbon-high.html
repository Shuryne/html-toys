      // =========================================================================
      // 8. GRAND EMERALD CANAL: REAL-TIME MIRROR REFLECTION, BOATS & WETLANDS
      // =========================================================================
      function renderCanalAndWildlife(viewLeft, viewTop) {
        const waterScreenY = WATER_Y - viewTop;
        if (waterScreenY >= viewH) return;

        const startVY = Math.max(0, waterScreenY);
        const nightAlpha = waterTint.nightFactor;
        const sunScreenX = waterTint.sunX - viewLeft;

        // 1. Real-time wavy reflection of everything already rendered above WATER_Y!
        for (let vy = startVY; vy < viewH; vy++) {
          const depth = vy - waterScreenY; // 0 .. 58
          const depthNorm = Math.min(1, depth / 56);
          const wave = Math.sin(depth * 0.52 - animTime * 3.8) * (1.2 + depthNorm * 2.8);
          const srcWY = WATER_Y - 1 - Math.floor(depth * 0.92);
          const srcVY = srcWY - viewTop;

          const wtR = waterTint.midR + (waterTint.deepR - waterTint.midR) * depthNorm;
          const wtG = waterTint.midG + (waterTint.deepG - waterTint.midG) * depthNorm;
          const wtB = waterTint.midB + (waterTint.deepB - waterTint.midB) * depthNorm;
          // Reflection clarity: stronger for bright lights at night, softer deep down
          const reflMix = Math.max(0.24, 0.66 - depthNorm * 0.36);
          const row = vy * viewW;

          for (let vx = 0; vx < viewW; vx++) {
            const rippleX = Math.round(vx + wave + Math.sin(vx * 0.14 + depth * 0.3 + animTime * 2.4) * 1.1);
            const sx = Math.max(0, Math.min(viewW - 1, rippleX));

            let rr = wtR, rg = wtG, rb = wtB;
            if (srcVY >= 0 && srcVY < viewH && srcVY < waterScreenY) {
              const srcCol = out32[srcVY * viewW + sx];
              const sr = unpackR(srcCol), sg = unpackG(srcCol), sb = unpackB(srcCol);
              // Boost bright lantern/window reflections on night water!
              const lum = sr + sg + sb;
              const boost = (nightAlpha > 0.3 && lum > 380) ? Math.min(0.84, reflMix + 0.24) : reflMix;
              rr = wtR * (1 - boost) + sr * boost;
              rg = wtG * (1 - boost) + sg * boost;
              rb = wtB * (1 - boost) + sb * boost;
            }

            // Organic horizontal pixel wave shimmer bars along sun/moon reflection column (no diagonal moire!)
            const sunJitter = Math.sin(depth * 0.85 - animTime * 3.4) * (2.5 + depth * 0.14)
                            + Math.cos(depth * 2.1 + animTime * 2.1) * 2.0;
            const sunDist = Math.abs((vx - sunScreenX) - sunJitter);
            const sunBarHalfW = (1.5 + depth * 0.28) * (0.45 + 0.55 * (Math.sin(depth * 1.37 - animTime * 4.1) * 0.5 + 0.5));
            const rowHasGlint = Math.sin(depth * 1.9 - animTime * 3.6) + Math.cos(depth * 0.73 + animTime * 1.9) > 0.15;
            if (rowHasGlint && sunDist < sunBarHalfW) {
              out32[row + vx] = waterTint.glintU32;
              continue;
            }
            // Subtle teal crest line + night bioluminescent plankton sparkles!
            const crest = Math.sin(vx * 0.13 + Math.sin(depth * 0.6) * 2.2 - animTime * 2.0 + depth * 0.45);
            if (nightAlpha > 0.45 && crest > 0.965 && ((vx * 7 + vy * 13) % 11 === 0)) {
              out32[row + vx] = packRGBA(64, 242, 212);
            } else if (crest > 0.93 && depth > 2 && ((vx + depth * 3) % 7 < 3)) {
              out32[row + vx] = packRGBA(rr + 18, rg + 26, rb + 26);
            } else {
              out32[row + vx] = packRGBA(rr, rg, rb);
            }
          }
        }

        // Organic lapping water highlights along stone harbor quays
        for (let wx = 40; wx < 670; wx++) {
          if (wx > 356 && wx < 438) continue; // under bridge arch
          const lap = Math.sin(wx * 0.11 + animTime * 2.3) + Math.cos(wx * 0.27 - animTime * 3.1);
          if (lap > 0.95) {
            plotViewMat(wx, WATER_Y, MAT.WATER_FOAM, lap > 1.45 ? 3 : 2, 0, viewLeft, viewTop);
          }
        }

        // 2. Swimming Koi Fish silhouettes just beneath the translucent surface
        for (let k = 0; k < kois.length; k++) {
          const koi = kois[k];
          const kx = Math.round(koi.x);
          const ky = koi.y + Math.round(Math.sin(animTime * 3 + koi.phase));
          const tailWag = ((animTime * 7 + k) | 0) % 2 === 0 ? -1 : 1;
          const koiHead = k % 2 === 0 ? packRGBA(236, 118, 56) : packRGBA(238, 232, 218);
          const koiTail = packRGBA(218, 92, 48);
          plotViewU32(kx, ky, koiHead, viewLeft, viewTop);
          plotViewU32(kx - koi.dir, ky, koiHead, viewLeft, viewTop);
          plotViewU32(kx - koi.dir * 2, ky + (tailWag > 0 ? 0 : 1), koiTail, viewLeft, viewTop);
        }

        // 3. Concentric Pixel Water Ripples (from heron & rain)
        for (let r = 0; r < waterRipples.length; r++) {
          const rp = waterRipples[r];
          const rx = Math.round(rp.r);
          const ry = Math.max(1, Math.round(rp.r * 0.35));
          const col = packRGBA(150, 220, 228);
          for (let deg = 0; deg < 360; deg += 30) {
            const rad = (deg * Math.PI) / 180;
            plotViewU32(Math.round(rp.x + Math.cos(rad) * rx), Math.round(rp.y + Math.sin(rad) * ry), col, viewLeft, viewTop);
          }
        }

        // 4. Floating Chinampa Wetland Eco-Islands, Waterlilies & Wading White Heron
        const islands = [
          { cx: 146, cy: 232, rx: 22, ry: 4 },
          { cx: 582, cy: 236, rx: 25, ry: 4 }
        ];
        for (let idx = 0; idx < islands.length; idx++) {
          const isl = islands[idx];
          for (let dy = -isl.ry; dy <= isl.ry; dy++) {
            const span = Math.round(Math.sqrt(Math.max(0, 1 - (dy * dy) / (isl.ry * isl.ry))) * isl.rx);
            for (let dx = -span; dx <= span; dx++) {
              const mat = dy < 0 ? MAT.FOLIAGE_LIME : dy === isl.ry ? MAT.TIMBER : MAT.FOLIAGE_DEEP;
              plotViewMat(isl.cx + dx, isl.cy + dy, mat, dy < 0 ? 2 : 1, 0, viewLeft, viewTop);
            }
          }
          // Swaying cattail reeds & pink lotus blossoms
          const sway = Math.round(Math.sin(animTime * 2.1 + idx) * 1);
          for (let rx = -isl.rx + 5; rx <= isl.rx - 5; rx += 5) {
            const hReed = 5 + (Math.abs(rx) % 4);
            for (let ry = 1; ry <= hReed; ry++) {
              plotViewMat(isl.cx + rx + (ry > 3 ? sway : 0), isl.cy - ry, MAT.FOLIAGE_DEEP, 2, 0, viewLeft, viewTop);
            }
            if (rx % 10 === 0) {
              plotViewMat(isl.cx + rx + sway, isl.cy - hReed - 1, MAT.TIMBER, 1, 0, viewLeft, viewTop); // cattail head
            }
          }
          // Waterlily pads & glowing night lotus lanterns around island
          [-isl.rx - 6, -isl.rx - 2, isl.rx + 4, isl.rx + 9].forEach((ox, lIdx) => {
            const lx = isl.cx + ox;
            const ly = isl.cy + 2 + (lIdx & 1);
            fillViewRectMat(lx - 1, ly, 3, 1, MAT.FOLIAGE_LIME, 2, viewLeft, viewTop);
            if (lIdx % 2 === 0) {
              if (nightAlpha > 0.3) {
                plotViewU32(lx, ly - 1, packRGBA(255, 198, 224), viewLeft, viewTop);
                stampDitheredGlow(lx, ly - 1, 9, 255, 150, 195, nightAlpha * 0.5, viewLeft, viewTop);
              } else {
                plotViewMat(lx, ly - 1, MAT.BLOSSOM_CORAL, 3, 0, viewLeft, viewTop);
              }
            }
          });
        }

        // White Heron on Left Chinampa Island (x=156, y=231)
        const heronX = 156, heronY = 230;
        const dip = ((animTime * 0.45) % 1) < 0.14;
        plotViewMat(heronX, heronY, MAT.BRASS, 1, 0, viewLeft, viewTop); // slender leg
        plotViewMat(heronX, heronY - 1, MAT.BRASS, 1, 0, viewLeft, viewTop);
        fillViewRectMat(heronX - 2, heronY - 3, 4, 2, MAT.AWNING_CREAM, 3, viewLeft, viewTop); // white body
        if (dip) {
          plotViewMat(heronX + 2, heronY - 2, MAT.AWNING_CREAM, 3, 0, viewLeft, viewTop);
          plotViewMat(heronX + 3, heronY - 1, MAT.AWNING_CREAM, 3, 0, viewLeft, viewTop);
          plotViewMat(heronX + 4, heronY, MAT.SUNFLOWER, 3, 0, viewLeft, viewTop); // beak dipping!
        } else {
          plotViewMat(heronX + 1, heronY - 4, MAT.AWNING_CREAM, 3, 0, viewLeft, viewTop);
          plotViewMat(heronX + 1, heronY - 5, MAT.AWNING_CREAM, 3, 0, viewLeft, viewTop);
          plotViewMat(heronX + 2, heronY - 5, MAT.SUNFLOWER, 3, 0, viewLeft, viewTop); // orange beak
        }

        // Mother Duck + 3 Yellow Ducklings paddling in a line (around x=410..470, y=246)
        const duckBaseX = Math.round(445 - ((animTime * 3.2) % 90));
        const duckY = 247 + Math.round(Math.sin(animTime * 3.5) * 0.6);
        // Mother duck (facing left -1)
        fillViewRectMat(duckBaseX, duckY, 4, 2, MAT.AWNING_CREAM, 2, viewLeft, viewTop);
        plotViewMat(duckBaseX, duckY - 1, MAT.TEAL_TRIM, 2, 0, viewLeft, viewTop);
        plotViewMat(duckBaseX - 1, duckY - 1, MAT.SUNFLOWER, 3, 0, viewLeft, viewTop);
        // 3 tiny yellow ducklings trailing behind!
        for (let d = 1; d <= 3; d++) {
          const dx = duckBaseX + 3 + d * 4;
          const dy = duckY + 1 + (((animTime * 6 + d) | 0) % 2 === 0 ? 0 : -1);
          fillViewRectMat(dx, dy, 2, 1, MAT.SUNFLOWER, 3, viewLeft, viewTop);
          plotViewMat(dx, dy - 1, MAT.SUNFLOWER, 3, 0, viewLeft, viewTop);
        }

        // 5. Canal Solar-Sail Catamarans, Market Barges & Lantern Gondolas
        for (let i = 0; i < boats.length; i++) {
          const bt = boats[i];
          const bx = Math.round(bt.x);
          const by = bt.y + Math.round(Math.sin(animTime * 2.5 + i * 1.8) * 0.7);

          // V-shaped trailing water wake
          const wakeCol = colorLUT[MAT.WATER_FOAM | (2 << 5) | (1 << 7)];
          for (let w = 1; w <= 9; w += 2) {
            plotViewU32(bx - bt.dir * (10 + w), by + 1 - (w >> 3), wakeCol, viewLeft, viewTop);
            plotViewU32(bx - bt.dir * (10 + w), by + 2 + (w >> 3), wakeCol, viewLeft, viewTop);
          }

          if (bt.type === 'catamaran') {
            // Sleek timber twin-hull + curved amber translucent solar sail!
            fillViewRectMat(bx - 10, by, 20, 2, MAT.TIMBER, 2, viewLeft, viewTop);
            plotViewMat(bx + bt.dir * 10, by - 1, MAT.BRASS, 3, 0, viewLeft, viewTop);
            // Mast & curved solar sail
            fillViewRectMat(bx, by - 14, 1, 14, MAT.TIMBER, 1, viewLeft, viewTop);
            for (let sy = 1; sy <= 12; sy++) {
              const belly = Math.round(Math.sin((sy / 12) * Math.PI) * 6) + 1;
              for (let sx = 1; sx <= belly; sx++) {
                const shade = sx === belly ? 3 : (sy < 5 ? 3 : 2);
                plotViewMat(bx + bt.dir * sx - bt.dir * 2, by - 14 + sy, MAT.SAIL_AMBER, shade, 0, viewLeft, viewTop);
              }
            }
            // Sailor at helm
            fillViewRectMat(bx - bt.dir * 5, by - 3, 2, 3, MAT.TEAL_TRIM, 2, viewLeft, viewTop);
            plotViewMat(bx - bt.dir * 5, by - 4, MAT.AWNING_CREAM, 3, 0, viewLeft, viewTop);
          } else if (bt.type === 'barge') {
            // Botanical Harvest Barge carrying pumpkins, greenery & solar canopy
            fillViewRectMat(bx - 12, by, 24, 3, MAT.TIMBER, 1, viewLeft, viewTop);
            fillViewRectMat(bx - 10, by - 1, 20, 1, MAT.TIMBER, 2, viewLeft, viewTop);
            // Crates of produce (coral tomatoes, golden pumpkins, fresh greens)
            fillViewRectMat(bx - 7, by - 3, 4, 2, MAT.AWNING_CORAL, 2, viewLeft, viewTop);
            fillViewRectMat(bx - 2, by - 3, 4, 2, MAT.SUNFLOWER, 3, viewLeft, viewTop);
            fillViewRectMat(bx + 3, by - 4, 5, 3, MAT.FOLIAGE_LIME, 2, viewLeft, viewTop);
            // Small solar canopy cabin at stern
            fillViewRectMat(bx - bt.dir * 8, by - 5, 5, 1, MAT.SOLAR_GLASS, 3, viewLeft, viewTop);
            fillViewRectMat(bx - bt.dir * 6, by - 4, 2, 3, MAT.SKIN_CLOTH, 2, viewLeft, viewTop);
          } else {
            // Graceful curved gondola with warm bow lantern
            fillViewRectMat(bx - 8, by, 16, 2, MAT.TIMBER, 1, viewLeft, viewTop);
            plotViewMat(bx - 9, by - 1, MAT.BRASS, 3, 0, viewLeft, viewTop);
            plotViewMat(bx + 9, by - 1, MAT.BRASS, 3, 0, viewLeft, viewTop);
            fillViewRectMat(bx - 3, by - 3, 6, 3, MAT.AWNING_CREAM, 2, viewLeft, viewTop);
            fillViewRectMat(bx - bt.dir * 6, by - 4, 2, 4, MAT.AWNING_CORAL, 2, viewLeft, viewTop);
          }

          // Warm bow lantern + reflection on water at dusk/night!
          const bowX = bx + bt.dir * 10;
          if (nightAlpha > 0.25) {
            plotViewU32(bowX, by - 2, packRGBA(255, 232, 138), viewLeft, viewTop);
            stampDitheredGlow(bowX, by, 12, 255, 190, 88, nightAlpha * 0.65, viewLeft, viewTop);
          }
        }
      }

      // Foreground Kingfisher, Anemometer, Soaring Birds & Weather/Firefly Particles
      function renderForegroundAndAtmosphere(foreShiftX, viewLeft, viewTop) {
        const nightAlpha = waterTint.nightFactor;
        const foreToWorldX = (fx) => fx - foreShiftX + viewLeft;

        // 1. Spinning 3-Cup Brass Anemometer on Foreground Stone Balustrade (fx=52, y=231)
        const anemX = foreToWorldX(52);
        fillViewRectMat(anemX, 231, 1, 7, MAT.BRASS, 2, viewLeft, viewTop);
        const armSpan = Math.round(Math.sin(animTime * 5.4) * 4);
        plotViewLineU32(anemX - armSpan, 231, anemX + armSpan, 231, colorLUT[MAT.BRASS | (3 << 5) | (1 << 7)], viewLeft, viewTop);
        plotViewMat(anemX - armSpan, 230, MAT.BRASS, 3, 0, viewLeft, viewTop);
        plotViewMat(anemX + armSpan, 230, MAT.BRASS, 1, 0, viewLeft, viewTop);

        // 2. Turquoise-and-Orange Pixel Kingfisher perched on Foreground Rail (fx=64, y=237)
        const hop = ((animTime * 1.3) % 4 < 0.22) ? -2 : 0;
        const kfX = foreToWorldX(64);
        const kfY = 236 + hop;
        fillViewRectMat(kfX, kfY, 3, 2, MAT.AWNING_CORAL, 3, viewLeft, viewTop); // orange breast
        fillViewRectMat(kfX - 1, kfY - 1, 3, 2, MAT.TEAL_TRIM, 3, viewLeft, viewTop); // turquoise back & crest
        plotViewMat(kfX + 3, kfY - 1, MAT.STONE_DARK, 0, 0, viewLeft, viewTop); // long kingfisher bill!
        if (hop < 0) {
          plotViewMat(kfX - 2, kfY - 2, MAT.TEAL_TRIM, 3, 0, viewLeft, viewTop); // fluttered wing!
        }

        // 3. Soaring White Swallows / Gulls (day & sunset)
        if (nightAlpha < 0.72) {
          const birdCol = colorLUT[MAT.AWNING_CREAM | (3 << 5) | (1 << 7)];
          const birdTip = colorLUT[MAT.STONE_DARK | (1 << 5) | (1 << 7)];
          for (let i = 0; i < birds.length; i++) {
            const b = birds[i];
            const bx = Math.round(b.x);
            const by = Math.round(b.y + Math.sin(animTime * 2 + b.flapPhase) * 2.5);
            const flap = Math.sin(animTime * 8.5 + b.flapPhase);
            const wingY = flap > 0.2 ? -1 : flap < -0.2 ? 1 : 0;
            plotViewU32(bx, by, birdCol, viewLeft, viewTop);
            plotViewU32(bx - 1, by + wingY, birdCol, viewLeft, viewTop);
            plotViewU32(bx + 1, by + wingY, birdCol, viewLeft, viewTop);
            plotViewU32(bx - 2, by + wingY, birdTip, viewLeft, viewTop);
          }
        }

        // 4. Radial Crepuscular Sunbeams fanning out from the Sun during Dawn & Golden Hour!
        const isGoldenBeams = (tDay > 0.23 && tDay < 0.34) || (tDay > 0.65 && tDay < 0.77);
        if (isGoldenBeams && weatherMode !== 'sunshower') {
          const beamStr = tDay < 0.5
            ? Math.sin(((tDay - 0.23) / 0.11) * Math.PI)
            : Math.sin(((tDay - 0.65) / 0.12) * Math.PI);
          const sx = waterTint.sunX - viewLeft;
          const sy = waterTint.sunY - viewTop;
          const maxBeamY = Math.min(viewH - 20, WATER_Y - viewTop + 6);
          for (let vy = 0; vy < maxBeamY; vy++) {
            const dy = vy - sy;
            if (dy < -12) continue;
            const byRow = (vy & 3) << 2;
            const row = vy * viewW;
            for (let vx = 0; vx < viewW; vx++) {
              const dx = vx - sx;
              const dist2 = dx * dx + dy * dy;
              if (dist2 < 144 || dist2 > 95000) continue;
              const falloff = 1.0 - dist2 / 95000;
              const bayer = BAYER4[byRow | (vx & 3)] / 16.0;
              if (bayer > beamStr * falloff * 0.48) continue;
              const ang = Math.atan2(dy, dx);
              const ray = Math.sin(ang * 15.0 + 0.6) * Math.cos(ang * 7.0 - 0.4);
              if (ray > 0.46) {
                const c = out32[row + vx];
                out32[row + vx] = packRGBA(unpackR(c) + 22, unpackG(c) + 15, unpackB(c) + 5);
              }
            }
          }
        }

        // 5. Atmospheric Point Lights (Night Lanterns & Bioluminescent Canopy Halos)
        if (nightAlpha > 0.18) {
          const midShift  = Math.round((camX - WORLD_W * 0.5) * 0.66 + WORLD_W * 0.5 - viewW * 0.5);
          for (let i = 0; i < pointLights.length; i++) {
            const pl = pointLights[i];
            let wx = pl.x;
            if (pl.layer === 'mid') wx = pl.x - midShift + viewLeft;
            else if (pl.layer === 'fore') wx = pl.x - foreShiftX + viewLeft;

            if (pl.type === 'warm') {
              stampDitheredGlow(wx, pl.y, pl.r, 255, 175, 72, nightAlpha * 0.58, viewLeft, viewTop);
            } else {
              stampDitheredGlow(wx, pl.y, pl.r, 42, 238, 198, nightAlpha * 0.52, viewLeft, viewTop);
            }
          }
        }

        // 6. Weather & Ecological Particles (Blossoms, Dandelions, Sun-shower Rain, or Night Fireflies!)
        const activeCount = weatherMode === 'breeze' ? 42 : 85;
        for (let i = 0; i < activeCount; i++) {
          const p = particles[i];
          const px = Math.round(p.x);
          const py = Math.round(p.y);

          if (weatherMode === 'sunshower') {
            // Crisp diagonal pixel rain streak
            const rainCol = nightAlpha > 0.4 ? packRGBA(120, 185, 230) : packRGBA(205, 240, 255);
            plotViewLineU32(px, py, px - 2, py + 5, rainCol, viewLeft, viewTop);
          } else if (nightAlpha > 0.35) {
            // Bioluminescent Emerald & Golden Fireflies / Floating Forest Spores!
            const blink = Math.sin(animTime * 3.2 + p.phase) * 0.5 + 0.5;
            if (blink > 0.25) {
              const isGold = (i % 3 === 0);
              const core = isGold ? packRGBA(255, 238, 128) : packRGBA(110, 255, 218);
              plotViewU32(px, py, core, viewLeft, viewTop);
              if (blink > 0.78 && weatherMode === 'bloom') {
                stampDitheredGlow(px, py, 6, isGold ? 255 : 55, isGold ? 210 : 245, isGold ? 90 : 195, 0.45, viewLeft, viewTop);
              }
            }
          } else {
            // Daytime drifting Sakura/Jacaranda petals & white dandelion seeds
            if (weatherMode === 'bloom' || i % 3 === 0) {
              const petalCol = (i & 1) ? packRGBA(255, 182, 198) : packRGBA(242, 204, 252);
              plotViewU32(px, py, petalCol, viewLeft, viewTop);
              if (((animTime * 5 + i) | 0) & 1) {
                plotViewU32(px + 1, py, packRGBA(255, 224, 232), viewLeft, viewTop);
              }
            } else {
              // Delicate floating pollen / dandelion seed mote
              plotViewU32(px, py, packRGBA(255, 252, 230), viewLeft, viewTop);
            }
          }
        }
      }

      // =========================================================================
      // 9. SIMULATION UPDATE STEP
      // =========================================================================
      function updateSimulation(dt) {
        animTime += dt;

        // 1. Advance 24-hour Solarpunk clock (~96 seconds per full day in 'auto' mode)
        if (timeMode === 'auto') {
          tDay = (tDay + dt / 96.0) % 1.0;
        }

        // Format HH:MM clock readout
        const totalMinutes = Math.floor(tDay * 24 * 60) % 1440;
        const hh = String(Math.floor(totalMinutes / 60)).padStart(2, '0');
        const mm = String(totalMinutes % 60).padStart(2, '0');
        const nextClock = `${hh}:${mm}`;
        if (clockText.textContent !== nextClock) {
          clockText.textContent = nextClock;
        }

        // 2. Smooth camera easing + subtle pointer/breathing drift when not dragging
        if (!isDragging && !isZoom2x) {
          const gentleDrift = Math.sin(animTime * 0.14) * 26 + (pointerNormX - 0.5) * 70;
          targetCamX = 386 + gentleDrift;
          targetCamY = 135;
        }
        clampCamera();
        const ease = 1 - Math.exp(-dt * 5.5);
        camX += (targetCamX - camX) * ease;
        camY += (targetCamY - camY) * ease;

        // 3. Clouds & Airships
        for (let i = 0; i < clouds.length; i++) {
          const cl = clouds[i];
          cl.x += cl.speed * dt;
          if (cl.x > WORLD_W + 80) cl.x = -80;
        }
        for (let i = 0; i < airships.length; i++) {
          const s = airships[i];
          s.x += s.dir * s.speed * dt;
          if (s.dir > 0 && s.x > WORLD_W + 50) s.x = -50;
          if (s.dir < 0 && s.x < -50) s.x = WORLD_W + 50;
        }

        // 4. Suspended Sky-Tram with smooth station stop at Central Sky-Station (x=392)
        if (tram.stopTimer > 0) {
          tram.stopTimer -= dt;
          tram.vel = 0;
        } else {
          const distToStation = 392 - tram.x;
          if (!tram.hasStoppedThisLap && distToStation > 0 && distToStation < 42) {
            tram.vel = Math.max(4, (distToStation / 42) * tram.maxSpeed);
            if (distToStation < 1.5) {
              tram.x = 392;
              tram.stopTimer = 3.2; // Pause for passengers at Central Sky-Station!
              tram.hasStoppedThisLap = true;
            }
          } else {
            tram.vel = Math.min(tram.maxSpeed, tram.vel + dt * 16);
          }
          tram.x += tram.vel * dt;
          if (tram.x > WORLD_W + 90) {
            tram.x = -30;
            tram.hasStoppedThisLap = false;
          }
        }

        // 5. Cyclists, Boats, Koi & Birds
        for (let i = 0; i < cyclists.length; i++) {
          const c = cyclists[i];
          c.x += c.dir * c.speed * dt;
          if (c.dir > 0 && c.x > WORLD_W + 20) c.x = -20;
          if (c.dir < 0 && c.x < -20) c.x = WORLD_W + 20;
        }
        for (let i = 0; i < boats.length; i++) {
          const b = boats[i];
          b.x += b.dir * b.speed * dt;
          if (b.dir > 0 && b.x > 665) b.dir = -1;
          if (b.dir < 0 && b.x < 75) b.dir = 1;
        }
        for (let i = 0; i < kois.length; i++) {
          const k = kois[i];
          k.x += k.dir * k.speed * dt;
          if (k.x > 550) k.dir = -1;
          if (k.x < 190) k.dir = 1;
        }
        for (let i = 0; i < birds.length; i++) {
          const b = birds[i];
          b.x += b.vx * dt;
          if (b.vx > 0 && b.x > WORLD_W + 20) b.x = -20;
          if (b.vx < 0 && b.x < -20) b.x = WORLD_W + 20;
        }

        // 6. Water Ripples (Heron dip & Sun-shower raindrops)
        if (((animTime * 0.45) % 1) < 0.04 && waterRipples.length < 12) {
          waterRipples.push({ x: 160, y: 231, r: 1, maxR: 11 });
        }
        if (weatherMode === 'sunshower' && Math.random() < 0.45 && waterRipples.length < 22) {
          waterRipples.push({
            x: 80 + Math.random() * 560,
            y: WATER_Y + 3 + Math.random() * 48,
            r: 0.5,
            maxR: 6 + Math.random() * 5
          });
        }
        for (let i = waterRipples.length - 1; i >= 0; i--) {
          waterRipples[i].r += dt * 7.5;
          if (waterRipples[i].r >= waterRipples[i].maxR) {
            waterRipples.splice(i, 1);
          }
        }

        // 7. Particles (Rain / Fireflies / Blossoms)
        const nightAlpha = waterTint.nightFactor;
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          if (weatherMode === 'sunshower') {
            p.x -= 48 * dt;
            p.y += 145 * dt;
            if (p.y > WATER_Y + 35) { p.y = -10; p.x = Math.random() * (WORLD_W + 100); }
            if (p.x < 0) p.x += WORLD_W;
          } else if (nightAlpha > 0.35) {
            // Fireflies drift gently upward & meander over gardens & water
            p.x += Math.sin(animTime * 1.3 + p.phase) * 9 * dt;
            p.y -= (3.5 + (i % 3) * 1.8) * dt;
            if (p.y < 55) { p.y = 250; p.x = 60 + Math.random() * 600; }
          } else {
            // Blossoms & dandelion seeds ride the warm afternoon breeze
            p.x += (10 + Math.sin(animTime * 1.6 + p.phase) * 5) * dt;
            p.y += (5 + Math.cos(animTime * 2.1 + p.phase) * 3) * dt;
            if (p.y > WORLD_H) { p.y = -4; p.x = Math.random() * WORLD_W; }
            if (p.x > WORLD_W) p.x = 0;
          }
        }
      }

      function renderFrame() {
        updateLightingLUTs(tDay, animTime, weatherMode);

        const viewLeft = Math.round(camX - viewW * 0.5);
        const viewTop  = Math.round(camY - viewH * 0.5);

        // 1. Sky, Stars, Sun/Moon, Rainbow, Clouds & Airships
        renderSkyAndCelestials(viewLeft, viewTop);

        // 2. Far Mountain & Bay Horizon Layer (parallax 0.32x)
        blitIndexedLayer(layerFar, WORLD_W, 0.32, viewLeft, viewTop, WATER_Y);

        // 3. Upper Citadel, Sun-Lotus Biodome & Bosco Towers (parallax 0.66x)
        blitIndexedLayer(layerMid, WORLD_W, 0.66, viewLeft, viewTop, WATER_Y);
        renderCleanEnergyKinetics('mid', 0.66, viewLeft, viewTop);

        // 4. Main Harbor Quarter, Viaduct, Townhouses & Arch Bridge (parallax 1.00x)
        blitIndexedLayer(layerMain, WORLD_W, 1.00, viewLeft, viewTop, WATER_Y);
        renderCleanEnergyKinetics('main', 1.00, viewLeft, viewTop);
        renderTransitAndCitizens(viewLeft, viewTop);

        // 5. Grand Emerald Canal: Real-Time Wavy Mirror Reflection, Boats & Wildlife
        renderCanalAndWildlife(viewLeft, viewTop);

        // 6. Foreground Botanical Overlook Frame, Kingfisher, Sunbeams & Fireflies
        const foreShiftX = blitIndexedLayer(layerFore, FORE_W, 1.28, viewLeft, viewTop, WORLD_H);
        renderForegroundAndAtmosphere(foreShiftX, viewLeft, viewTop);

        ctx.putImageData(frameImgData, 0, 0);
      }

      // =========================================================================
      // 10. ANIMATION LOOP & EFFICIENT BACKGROUND PAUSING
      // =========================================================================
      let rafId = 0;
      let lastTs = 0;

      function tick(ts) {
        if (isPaused || isVisibilityPaused) {
          rafId = 0;
          return;
        }
        const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
        lastTs = ts;
        updateSimulation(dt);
        renderFrame();
        rafId = requestAnimationFrame(tick);
      }

      function ensureLoopState() {
        if (isPaused || isVisibilityPaused) {
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = 0;
          }
          setAudioSuspended(true);
        } else if (!rafId) {
          lastTs = 0;
          setAudioSuspended(false);
          rafId = requestAnimationFrame(tick);
        }
      }

      // Efficient background pausing via contentvisibilityautostatechange + IntersectionObserver fallback
      const stageMain = document.getElementById('stage-main');
      stageMain.addEventListener('contentvisibilityautostatechange', (event) => {
        isVisibilityPaused = Boolean(event.skipped) || document.hidden;
        ensureLoopState();
      });

      if (!('contentVisibility' in document.documentElement.style) && 'IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
          for (const entry of entries) {
            isVisibilityPaused = !entry.isIntersecting || document.hidden;
            ensureLoopState();
          }
        }, { rootMargin: '150px' });
        io.observe(stageMain);
      }

      document.addEventListener('visibilitychange', () => {
        isVisibilityPaused = document.hidden;
        ensureLoopState();
      });

      // =========================================================================
      // 11. PROCEDURAL SOLARPUNK WEB AUDIO SOUNDSCAPE (BREEZE, BROOK & CHIMES)
      // =========================================================================
      let audioCtx = null;
      let masterGain = null;
      let chimeTimer = 0;
      let isSoundOn = false;

      // Lydian Solarpunk scale (F Lydian: C4, D4, E4, F4, G4, A4, C5, D5, E5, G5)
      const CHIME_FREQS = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99];

      function initAudio() {
        if (audioCtx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        audioCtx = new AudioCtx();
        window.ToyEmbed?.trackAudio(audioCtx);
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.22;
        masterGain.connect(audioCtx.destination);

        // Gentle filtered pink-noise breeze & distant waterfall murmur
        const bufSize = audioCtx.sampleRate * 3;
        const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const out = noiseBuf.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.997 * b0 + white * 0.029;
          b1 = 0.985 * b1 + white * 0.032;
          b2 = 0.950 * b2 + white * 0.048;
          out[i] = (b0 + b1 + b2) * 0.16;
        }
        const noiseSrc = audioCtx.createBufferSource();
        noiseSrc.buffer = noiseBuf;
        noiseSrc.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 480;

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0.26;
        noiseSrc.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(masterGain);
        noiseSrc.start();

        scheduleNextChime();
      }

      function scheduleNextChime() {
        if (!isSoundOn || !audioCtx) return;
        if (audioCtx.state === 'running' && !isPaused && !isVisibilityPaused) {
          const now = audioCtx.currentTime;
          const freq = CHIME_FREQS[Math.floor(Math.random() * CHIME_FREQS.length)];
          const osc = audioCtx.createOscillator();
          const oscHarm = audioCtx.createOscillator();
          const env = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          oscHarm.type = 'triangle';
          oscHarm.frequency.setValueAtTime(freq * 2, now);

          const harmGain = audioCtx.createGain();
          harmGain.gain.value = 0.12;

          env.gain.setValueAtTime(0.0001, now);
          env.gain.exponentialRampToValueAtTime(0.14, now + 0.04);
          env.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

          osc.connect(env);
          oscHarm.connect(harmGain);
          harmGain.connect(env);
          env.connect(masterGain);

          osc.start(now);
          oscHarm.start(now);
          osc.stop(now + 2.9);
          oscHarm.stop(now + 2.9);
        }
        chimeTimer = window.setTimeout(scheduleNextChime, 1100 + Math.random() * 2100);
      }

      function setAudioSuspended(suspend) {
        if (!audioCtx || !isSoundOn) return;
        if (suspend && audioCtx.state === 'running') {
          audioCtx.suspend();
        } else if (!suspend && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      // =========================================================================
      // 12. HUD TOOLBAR, ACCESSIBILITY, CAMERA INTERACTION & SNAPSHOT EXPORT
      // =========================================================================
      const toolbar = document.getElementById('city-toolbar');
      const hudShell = document.getElementById('hud-shell');
      const btnPause = document.getElementById('btn-pause');
      const btnZoom = document.getElementById('btn-zoom');
      const btnSound = document.getElementById('btn-sound');
      const btnSnap = document.getElementById('btn-snap');
      const btnPureView = document.getElementById('btn-pure-view');
      const timeButtons = Array.from(document.querySelectorAll('.time-preset'));
      const weatherButtons = Array.from(document.querySelectorAll('.weather-btn'));

      // Roving tabindex fallback only when native focusgroup is unsupported
      if (!('focusGroup' in HTMLElement.prototype)) {
        const items = Array.from(toolbar.querySelectorAll('button'));
        items.forEach((b, i) => { b.tabIndex = i === 0 ? 0 : -1; });
        toolbar.addEventListener('focusin', ({ target }) => {
          if (items.includes(target)) {
            items.forEach((b) => { b.tabIndex = b === target ? 0 : -1; });
          }
        });
        toolbar.addEventListener('keydown', (e) => {
          const idx = items.indexOf(document.activeElement);
          if (idx < 0) return;
          const rtl = getComputedStyle(toolbar).direction === 'rtl';
          let next = -1;
          if (e.key === 'ArrowRight') next = (idx + (rtl ? -1 : 1) + items.length) % items.length;
          else if (e.key === 'ArrowLeft') next = (idx + (rtl ? 1 : -1) + items.length) % items.length;
          else if (e.key === 'Home') next = 0;
          else if (e.key === 'End') next = items.length - 1;
          if (next >= 0) {
            e.preventDefault();
            items[next].focus();
          }
        });
      }

      // Progressive interest-invoker hint upgrade where supported
      if ('interestForElement' in HTMLButtonElement.prototype && CSS.supports('position-area', 'block-start')) {
        toolbar.querySelectorAll('button[title]').forEach((b, i) => {
          const tip = document.createElement('div');
          tip.id = `hud-tip-${i}`;
          tip.textContent = b.title;
          tip.setAttribute('popover', 'hint');
          tip.setAttribute('role', 'tooltip');
          b.setAttribute('interestfor', tip.id);
          b.setAttribute('aria-describedby', tip.id);
          b.removeAttribute('title');
          b.addEventListener('click', () => {
            if (tip.matches(':popover-open')) tip.hidePopover?.();
          });
          document.body.append(tip);
        });
      }

      function syncPauseUI() {
        btnPause.setAttribute('aria-pressed', String(isPaused));
      }
      syncPauseUI();

      btnPause.addEventListener('click', () => {
        isPaused = !isPaused;
        syncPauseUI();
        ensureLoopState();
        if (isPaused) renderFrame();
      });

      timeButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          timeButtons.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
          const val = btn.dataset.time;
          if (val === 'auto') {
            timeMode = 'auto';
          } else {
            timeMode = 'fixed';
            tDay = parseFloat(val);
            const totalMinutes = Math.floor(tDay * 24 * 60) % 1440;
            clockText.textContent = `${String(Math.floor(totalMinutes / 60)).padStart(2, '0')}:${String(totalMinutes % 60).padStart(2, '0')}`;
          }
          renderFrame();
        });
      });

      weatherButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          weatherButtons.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
          weatherMode = btn.dataset.weather;
          renderFrame();
        });
      });

      function toggleZoom() {
        isZoom2x = !isZoom2x;
        btnZoom.setAttribute('aria-pressed', String(isZoom2x));
        resizeBuffers();
        renderFrame();
      }
      btnZoom.addEventListener('click', toggleZoom);

      function toggleSound() {
        isSoundOn = !isSoundOn;
        btnSound.setAttribute('aria-pressed', String(isSoundOn));
        if (isSoundOn) {
          initAudio();
          if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
          window.clearTimeout(chimeTimer);
          scheduleNextChime();
        } else {
          window.clearTimeout(chimeTimer);
          if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
        }
      }
      btnSound.addEventListener('click', toggleSound);

      function togglePureView() {
        isPureView = !isPureView;
        btnPureView.setAttribute('aria-pressed', String(isPureView));
        hudShell.classList.toggle('is-hidden', isPureView);
        if (isPureView) landmarkBadge.classList.remove('is-visible');
      }
      btnPureView.addEventListener('click', togglePureView);

      btnSnap.addEventListener('click', () => {
        renderFrame();
        const scale = 3;
        const outCanvas = document.createElement('canvas');
        outCanvas.width = viewW * scale;
        outCanvas.height = viewH * scale;
        const octx = outCanvas.getContext('2d');
        octx.imageSmoothingEnabled = false;
        octx.drawImage(canvas, 0, 0, outCanvas.width, outCanvas.height);
        const link = document.createElement('a');
        link.download = `heliosia-solarpunk-${clockText.textContent.replace(':', '')}.png`;
        link.href = outCanvas.toDataURL('image/png');
        link.click();
        statusRegion.textContent = '已导出高清像素画快照 PNG';
      });

      // Pointer drag-pan & Landmark hover whisper badge
      canvas.addEventListener('pointerdown', (e) => {
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        dragCamX = targetCamX;
        dragCamY = targetCamY;
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener('pointermove', (e) => {
        pointerNormX = e.clientX / Math.max(1, window.innerWidth);
        const pxRatioX = viewW / Math.max(1, window.innerWidth);
        const pxRatioY = viewH / Math.max(1, window.innerHeight);

        if (isDragging) {
          targetCamX = dragCamX - (e.clientX - dragStartX) * pxRatioX;
          targetCamY = dragCamY - (e.clientY - dragStartY) * pxRatioY;
          clampCamera();
          if (isPaused) {
            camX = targetCamX;
            camY = targetCamY;
            renderFrame();
          }
          return;
        }

        if (!isPureView) {
          const worldX = (camX - viewW * 0.5) + e.clientX * pxRatioX;
          const worldY = (camY - viewH * 0.5) + e.clientY * pxRatioY;
          let found = null;
          for (let i = 0; i < LANDMARKS.length; i++) {
            const lm = LANDMARKS[i];
            const dx = worldX - lm.x, dy = worldY - lm.y;
            if (dx * dx + dy * dy <= lm.r * lm.r) {
              found = lm;
              break;
            }
          }
          if (found) {
            landmarkText.textContent = found.label;
            landmarkBadge.classList.add('is-visible');
          } else {
            landmarkBadge.classList.remove('is-visible');
          }
        }
      });

      const endDrag = () => { isDragging = false; };
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointercancel', endDrag);
      canvas.addEventListener('pointerleave', () => {
        landmarkBadge.classList.remove('is-visible');
      });

      // Wheel zoom convenience
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        if ((e.deltaY < -12 && !isZoom2x) || (e.deltaY > 12 && isZoom2x)) {
          toggleZoom();
        }
      }, { passive: false });

      // Keyboard shortcuts (Space: Pause, Z: 2x Zoom, M: Sound, H: Pure View)
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (e.code === 'Space' && document.activeElement?.tagName !== 'BUTTON') {
          e.preventDefault();
          btnPause.click();
        } else if (e.key === 'z' || e.key === 'Z') {
          toggleZoom();
        } else if (e.key === 'm' || e.key === 'M') {
          toggleSound();
        } else if (e.key === 'h' || e.key === 'H') {
          togglePureView();
        }
      });

      // Boot scene immediately!
      resizeBuffers();
      renderFrame();
      window.ToyEmbed?.ready();
      ensureLoopState();
    })();
  </script>
</body>
</html>
