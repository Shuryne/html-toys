<script>
(async () => {
'use strict';
const W=1200,H=750,kinds={CARBON:0,GROUND:1,BRUSH:2,GLAZE:3,LINER:4,KNIFE:5},trackStride=15;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
function makeStrokePainter(tips,{GROUND,BRUSH,GLAZE,KNIFE}){
  const mix=(a,b,t)=>a+(b-a)*t;
  return function strokePaint(g,m,part=1,resolution=1,study=false){
    if(part<=.002)return;
    const {x,y,ux,uy,len,w,bend,kind}=m,tip=tips[m.tip],upper=tip.top,lower=tip.bottom;
    g.setTransform(resolution*ux,resolution*uy,-resolution*uy,resolution*ux,resolution*x,resolution*y);
    const center=t=>4*bend*t*(1-t);
    const at=(arr,t)=>{const f=t*8,j=Math.min(7,Math.floor(f));return mix(arr[j],arr[j+1],f-j)};
    const last=Math.ceil(part*8);
    const soft=kind===GROUND||kind===BRUSH||kind===GLAZE;
    g.globalAlpha=m.a*(soft?.91:1);g.fillStyle=m.base;g.beginPath();
    g.moveTo(0,-w*upper[0]);
    for(let j=1;j<=last;j++){
      const t=Math.min(part,j/8),v=center(t)-w*at(upper,t);
      if(soft&&j<last){const b=Math.min(part,(j+1)/8);g.quadraticCurveTo(t*len,v,(t+b)*.5*len,(v+center(b)-w*at(upper,b))*.5)}else g.lineTo(t*len,v);
    }
    for(let j=last;j>=0;j--){
      const t=Math.min(part,j/8),v=center(t)+w*at(lower,t);
      if(soft&&j>0&&j<last){const b=(j-1)/8;g.quadraticCurveTo(t*len,v,(t+b)*.5*len,(v+center(b)+w*at(lower,b))*.5)}else g.lineTo(t*len,v);
    }
    g.closePath();g.fill();
    if(study)return;
    if(soft&&w>3){g.lineJoin='round';g.strokeStyle=m.base;g.lineWidth=w*.12;g.globalAlpha=m.a*.23;g.stroke()}
    const count=kind===GLAZE?3:kind===KNIFE?7:w>20?16:w>8?9:w>2.4?5:2;
    for(let j=0;j<count;j++){
      const v=tip.fibres[(j*5+m.tip)%17],start=v[0],end=Math.min(part,v[1]);
      if(start>=end)continue;
      const off=v[2]*w,mid=(start+end)/2,lean=v[4]*w;
      const ya=center(start)+off+lean,yb=center(end)+off-lean;
      const yc=2*(center(mid)+off)-(ya+yb)/2;
      g.beginPath();g.moveTo(start*len,ya);g.quadraticCurveTo(mid*len,yc,end*len,yb);
      g.strokeStyle=j%2?m.shade:m.light;
      g.globalAlpha=m.a*(kind===KNIFE?.67:kind===GLAZE?.25:.52);
      g.lineWidth=Math.max(kind===KNIFE?.26:.21,w*v[3]*(kind===KNIFE?1.7:1));g.stroke();
    }
    if(kind===KNIFE&&w>1.1){
      const end=Math.min(part,.78+tip.jitter*.14);
      if(end>.12){
        const a=.12,b=end,mid=(a+b)/2,side=ux>=0?-.28:.28,ya=center(a)+side*w,yb=center(b)+side*w;
        const lip=(ux>=0?1:-1)*(.42*w+.15),midline=center(mid);
        g.beginPath();g.moveTo(a*len,center(a)+lip*.69);g.quadraticCurveTo(mid*len,2*(midline+lip)-(center(a)+center(b))*.5-lip*.67,b*len,center(b)+lip*.65);
        g.strokeStyle=m.shade;g.lineWidth=Math.max(.29,.15*w);g.globalAlpha=m.a*.69;g.stroke();
        g.beginPath();g.moveTo(a*len,ya);g.quadraticCurveTo(mid*len,2*(center(mid)+(side-.055)*w)-(ya+yb)/2,b*len,yb);
        g.strokeStyle=m.light;g.lineWidth=Math.max(.38,.12*w);g.globalAlpha=m.a*.92;g.stroke();
      }
    }
    g.globalAlpha=1;
  }
}

function preparePainting(createCanvas,width,height,makeStrokePainter,{W,H,kinds,trackStride}){
// Coordinates are in canvas-space units. The small pigment field holds numerical
// studies for the brushes: colour, material and the local direction of the form.
const horizon=387, focal=675, eye=5.15, TX=910, lampY=184;
const FW=1080, FH=675, fs=FW/W, TAU=2*Math.PI, pi=Math.PI;
const AIR=0, DISTANT=1, WATER=2, FROTH=3, STONE=4, TOWER=5, METAL=6, SAIL=7, MIST=8;
const mix=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,n)=>{const t=clamp((n-a)/(b-a));return t*t*(3-2*t)};
const sq=x=>x*x, bell=x=>Math.exp(-x*x), fract=x=>x-Math.floor(x);
function generator(seed) {
  return () => {seed=(seed+0x6d2b79f5)|0;let z=Math.imul(seed^(seed>>>15),1|seed);z^=z+Math.imul(z^(z>>>7),61|z);return ((z^(z>>>14))>>>0)/4294967296};
}
const dice=generator(614072), range=(a,b)=>mix(a,b,dice());
const table=new Float32Array(65536);
{ const r=generator(39120);for(let i=0;i<table.length;i++) table[i]=r(); }
function noise(x,y) {
  const ix=Math.floor(x),iy=Math.floor(y);
  let u=x-ix,v=y-iy;u=u*u*(3-2*u);v=v*v*(3-2*v);
  const row=(iy&255)<<8,next=((iy+1)&255)<<8,a=ix&255,b=(ix+1)&255;
  return mix(mix(table[row+a],table[row+b],u),mix(table[next+a],table[next+b],u),v);
}
function fb(x,y) {
  return .52*noise(x,y)+.27*noise(x*1.83+y*.77+15,y*1.83-x*.77+31)+.14*noise(x*3.94-y*.91+63,y*3.94+x*.91+2)+.07*noise(x*8.2+.51*y+9,y*8.2-x*.51+73);
}
function cell(x,y,out) {
  const ix=Math.floor(x),iy=Math.floor(y);let a=8,b=8,id=0,du=0,dv=0;
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++) {
    const k=(((iy+j)&255)<<8)+((ix+i)&255),s=table[k],t=table[(k+11071)&65535];
    const dx=ix+i+.11+.78*s-x,dy=iy+j+.11+.78*t-y,d=dx*dx+dy*dy;
    if(d<a){b=a;a=d;id=s;du=dx;dv=dy}else if(d<b)b=d;
  }
  out[0]=(b-a)/(Math.sqrt(b)+Math.sqrt(a)+.0001);out[1]=id;out[2]=du;out[3]=dv;
}
const pigment=new Uint8ClampedArray(FW*FH*3), medium=new Uint8Array(FW*FH), flow=new Float32Array(FW*FH),visibleDepth=new Float32Array(FW*FH);
function put(i,r,g,b,m,angle){
  const k=i*3;pigment[k]=r;pigment[k+1]=g;pigment[k+2]=b;medium[i]=m;flow[i]=angle;
}
function over(i,r,g,b,alpha,m,angle) {
  const k=i*3;pigment[k]+=(r-pigment[k])*alpha;pigment[k+1]+=(g-pigment[k+1])*alpha;pigment[k+2]+=(b-pigment[k+2])*alpha;
  if(alpha>.32){medium[i]=m;flow[i]=angle}
}
const indexAt=(x,y)=>clamp(Math.round(y*fs-.5),0,FH-1)*FW+clamp(Math.round(x*fs-.5),0,FW-1);
function colourAt(x,y){const i=indexAt(x,y)*3;return [pigment[i],pigment[i+1],pigment[i+2]]}
function luma(i){let k=i*3;return .24*pigment[k]+.59*pigment[k+1]+.17*pigment[k+2]}
function interpolate(points,x) {
  if(x<=points[0][0])return points[0][1];
  for(let n=1;n<points.length;n++)if(x<=points[n][0])return mix(points[n-1][1],points[n][1],(x-points[n-1][0])/(points[n][0]-points[n-1][0]));
  return points[points.length-1][1];
}

// Integrate the optical depth of a hand-composed bank of cumuli. Direct
// sunset light comes through the back of the cloud, cool skylight through
// its upper surface. The two paths give the same lobe two different edges.
function noise3(x,y,z){
  const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z);
  let a=x-ix,b=y-iy,c=z-iz;a*=a*(3-2*a);b*=b*(3-2*b);c*=c*(3-2*c);
  const k=ix+iy*257+iz*7733,q=k+7733;
  return mix(mix(mix(table[k&65535],table[(k+1)&65535],a),mix(table[(k+257)&65535],table[(k+258)&65535],a),b),
             mix(mix(table[q&65535],table[(q+1)&65535],a),mix(table[(q+257)&65535],table[(q+258)&65535],a),b),c);
}
function cloudVolume(){
  const step=4,nx=320,ny=114,nz=43,plane=nx*ny,xoff=36,yoff=28,dz=6.4;
  const den=new Float32Array(plane*nz),sun=new Float32Array(den.length),cool=new Float32Array(den.length);
  const projected=new Float32Array(plane*4);
  function fromPlane(buf,k,x,y){
    if(x<0||y<0||x>=nx-1||y>=ny-1)return 0;
    const i=Math.floor(x),j=Math.floor(y),idx=k*plane+j*nx+i;
    return mix(mix(buf[idx],buf[idx+1],x-i),mix(buf[idx+nx],buf[idx+nx+1],x-i),y-j);
  }
  for(let k=0;k<nz;k++)for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
    const x=i*step-xoff,y=j*step-yoff,z=(k-21)*dz;
    const wall=79*smooth(402,961,x),edge=167+wall+18*Math.sin(.0098*x+.012*z)+22*Math.sin(.0053*x-.015*z+1);
    const a=noise3(.0038*x+12,.007*y-3,.006*z+10),b=noise3(.008*x+31,.013*y+27,.011*z+4);
    const u=(x+68*(a-.5)+22*(b-.5))*.009,v=(y+62*(a-.5)-.159*x+17*Math.sin(.008*x))*.012,w=z*.014;
    const n=.48*noise3(u+29,v+16,w-3)+.27*noise3(2.03*u+.32*v,1.96*v-.22*w,1.98*w+.23*u+21)+.15*noise3(4.06*u,4.06*v+31,3.91*w)+.07*noise3(8.19*u-23,8.15*v,8.1*w)+.03*noise3(16.3*u,16.1*v,16.4*w);
    const zc=11+18*Math.sin(x*.0053)+22*(a-.5),thick=101+19*b;
    const topBank=1-sq((z-zc)/thick)-Math.pow(Math.max(0,(y+43)/(edge+43)),2.22);
    const shelfY=235+29*Math.sin(x*.0048-1)+26*Math.sin(x*.009+.3)+39*smooth(490,900,x);
    const shelf=.69-sq((y-shelfY)/(25+14*a))-sq((z-48)/(57+17*b))-.94*bell((x-335)/144);
    const m=Math.max(topBank,shelf)+(n-.52)*2.76+(a-.49)*.83;
    den[k*plane+j*nx+i]=smooth(-.038,.51,m)*(.29+.79*n);
  }
  for(let k=nz-1;k>=0;k--)for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
    const id=k*plane+j*nx+i;
    sun[id]=den[id]*.35+(k===nz-1?0:fromPlane(sun,k+1,i-1.95,j+1.06));
  }
  for(let k=0;k<nz;k++)for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
    const id=k*plane+j*nx+i;
    cool[id]=den[id]*.26+(k===0?0:fromPlane(cool,k-1,i-.69,j-2.12));
  }
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
    const x=i*step-xoff,y=j*step-yoff,amber=.26+.74*bell((x-265)/485),base=j*nx+i;
    let tr=1,r=0,g=0,b=0;
    for(let k=0;k<nz&&tr>.004;k++){
      const idx=k*plane+base,d=den[idx];if(d<.001)continue;
      const alpha=1-Math.exp(-.47*d),weight=alpha*tr;
      const direct=Math.exp(-sun[idx]*1.23),dome=Math.exp(-cool[idx]*.91);
      const sky=.61+.39*smooth(290,0,y),shade=1-.13*smooth(395,965,x);
      r+=weight*(19+55*dome*sky+direct*(134+53*amber))*shade;
      g+=weight*(26+64*dome*sky+direct*(127+15*amber))*shade;
      b+=weight*(43+74*dome*sky+direct*(116-37*amber))*shade;
      tr*=1-alpha;
    }
    const n=base*4;projected[n]=r;projected[n+1]=g;projected[n+2]=b;projected[n+3]=tr;
  }
  return {nx,step,xoff,yoff,projected};
}
function skyStudy(){
  const vol=cloudVolume(),s=vol.projected,nx=vol.nx,rows=Math.min(FH,Math.ceil((horizon+25)*fs));
  const leftCoast=[[0,363],[30,360],[57,364],[77,360],[112,369],[147,373],[181,381],[225,384],[266,388]];
  const farCape=[[568,389],[625,382],[689,377],[722,368],[771,365],[802,354],[849,358],[897,343],[955,340],[1001,334],[1060,328],[1127,335],[1200,318]];
  for(let j=0;j<rows;j++)for(let i=0;i<FW;i++){
    const x=(i+.5)/fs,y=(j+.5)/fs,t=clamp(y/horizon),idx=j*FW+i;
    const w=bell((x-272)/374),nearSun=bell((x-272)/138)*bell((y-350)/57);
    const haze=fb(x*.013-y*.008+29,y*.023+17),slant=x-y*.58;
    const rain=fb(slant*.010+54,y*.0020+31),veil=smooth(420,1050,x)*smooth(.31,.71,rain);
    const dusk=smooth(.27,1,t)*w;
    let r=mix(75,151,t)+dusk*83+nearSun*32,g=mix(99,149,t)+dusk*21+nearSun*41,b=mix(125,150,t)-dusk*38+nearSun*33;
    const fil=fb((x+y*.80)*.009+61,y*.052+22),lo=fb(x*.0047+9,y*.036+26);
    const solar=bell((x-269)/77)*bell((y-349)/30),sliver=bell((x-266)/13)*bell((y-351)/6.8);
    r+=solar*23+sliver*30;g+=solar*21+sliver*36;b+=solar*13+sliver*44;
    const bank=smooth(.42,.68,.65*fil+.35*lo)*smooth(187,276,y)*(.67+.32*w);
    r=mix(r,99+54*w+23*lo,bank);g=mix(g,103+15*w+20*lo,bank);b=mix(b,120-16*w+11*lo,bank);
    const vx=(x+vol.xoff)/vol.step,vy=(y+vol.yoff)/vol.step,ix=Math.floor(vx),iy=Math.floor(vy),fx=vx-ix,fy=vy-iy;
    const a=(iy*nx+ix)*4,bx=a+4,ay=a+nx*4,by=ay+4;
    const get=k=>mix(mix(s[a+k],s[bx+k],fx),mix(s[ay+k],s[by+k],fx),fy);
    const tr=get(3),cEdge=4*tr*(1-tr);
    const cloudGrain=fb(x*.0154+.54*haze+4,(y-.21*x)*.026+61);
    const scallop=fb(x*.0161+.71*haze+4.32,(y-.21*x)*.026+61.23);
    const relief=(cloudGrain-scallop)*(50+61*cEdge)+(cloudGrain-.5)*23;
    const mod=((haze-.5)*12+relief)*(1-tr);
    const ember=cEdge*(.27+.73*w)*smooth(92,296,y);
    r=r*tr+get(0)+mod+33*ember;g=g*tr+get(1)+mod+17*ember;b=b*tr+get(2)+mod*.91+3*ember;
    const curtain=(.08+.53*veil)*smooth(133,363,y)*(.27+.73*rain);
    r=mix(r,124+36*w,curtain);g=mix(g,138+18*w,curtain);b=mix(b,148,curtain);
    let mat=AIR,ang=-.13+.91*(fb(x*.0068+1,y*.0093+54)-.5)+.12*Math.sin(y*.019+x*.006);
    const mountain=x<267?interpolate(leftCoast,x):x>568?interpolate(farCape,x):999;
    const ridge=mountain+6.1*(fb(x*.042,21)-.5);
    if(y>ridge){
      const land=smooth(0,2.3,y-ridge)*(x<268?.32:.39);
      r=mix(r,84+35*w,land);g=mix(g,91+14*w,land);b=mix(b,108+4*w,land);mat=DISTANT;ang=-.09;
    }
    const dx=TX-x;
    if(dx>0){
      const axis=lampY+dx*.126,spread=2.1+dx*.062,off=(y-axis)/spread;

function finalLights(){

    let x=range(0,W),y=range(horizon-53,H),idx=indexAt(x,y),m=medium[idx];
    if(m!==FROTH&&m!==MIST&&m!==WATER&&m!==STONE)continue;
    const c=colourAt(x,y),v=luma(idx),[mag,edge]=structure(x,y,1.85);
    const stone=m===STONE,water=m===WATER,foam=m===FROTH;
    const needed=stone?105:water?130:foam?151:161;
    if(v<needed||mag<range(4,22)||(stone&&dice()>.47)||(water&&dice()>.55))continue;
    const sunlit=bell((x-370)/460),gain=range(9,26)*(m===MIST?1.05:1);
    c[0]+=gain*(1.04+.14*sunlit);c[1]+=gain;c[2]+=gain*(.74+.13*(1-sunlit));
    const angle=lean(flow[idx]+range(-.19,.19),edge,.89),len=range(2.1,9.2)*(water?1.5:1);
    const fit=fitLength(x,y,m,angle,len,c,45);
    x+=fit[0]*Math.cos(angle);y+=fit[0]*Math.sin(angle);
    const width=range(.72,2.6)*(m===MIST?1.2:1);
    dab(6,x,y,fit[1],width,angle,c,range(.68,.98),KNIFE,range(-.62,.62),workOrder(x,y,m,6));
  }
  const r=generator(89362);
  for(let n=0;n<3600;n++){
    const crash=n%2===0,x=crash?657+r()*164:286+r()*219,y=crash?333+r()*142:397+r()*89;
    const idx=indexAt(x,y),m=medium[idx],v=luma(idx);
    if((m!==MIST&&m!==FROTH)||v<177)continue;
    const [mag,a]=structure(x,y,1.9);if(mag<8||luma(indexAt(x-1,y-1.8))>v+3)continue;
    const c=colourAt(x,y),gain=14+17*r(),angle=lean(flow[idx],a,.78);
    const len=2+r()*5.7,fit=fitLength(x,y,m,angle,len,c,25);
    dab(6,x,y,fit[1],1.35+2.08*r(),angle,[c[0]+gain*1.13,c[1]+gain,c[2]+gain*.8],.78+.20*r(),KNIFE,(r()-.5)*.93,1.82+.15*visit(x,y,6));
  }
}
function assemble(){
  makeTips();sketch();broadPass(1,67,42);modelMasses(1);broadPass(2,26,18);modelMasses(2);broadPass(3,10.4,9.6);glaze();
  for(let j=0;j<H/4.9;j++)for(let i=0;i<W/5.25;i++)refine((i+dice())*5.25,(j+dice())*4.9,4.9);
  for(let y=148;y<378;y+=1.65)for(let x=TX-29;x<TX+81;x+=1.8){
    const xx=x+range(-.5,.5),yy=y+range(-.49,.49),m=medium[indexAt(xx,yy)];if(m===TOWER||m===METAL)refine(xx,yy,1.66,true);
  }
  for(let y=boatY-37;y<boatY+3;y+=1.45)for(let x=boatX-20;x<boatX+20;x+=1.51)if(medium[indexAt(x,y)]===SAIL)refine(x,y,1.51,true);
  findEdges();seaBrushwork();rockBrushwork();atmosphere();finalLights();
  for(let i=0;i<fineLines.length;i++){
    const v=fineLines[i];mark(5,v.x1,v.y1,v.x2,v.y2,v.w,v.c,v.bend,v.a,LINER,4+i/fineLines.length);
  }
  for(let i=0;i<knifeLines.length;i++){
    const v=knifeLines[i],beacon=Math.abs(v.x1-TX)<7&&Math.abs(v.y1-lampY)<3;
    mark(6,v.x1,v.y1,v.x2,v.y2,v.w,v.c,v.bend,v.a,KNIFE,beacon?8+i*.00001:2+i/knifeLines.length);
  }
  for(let i=0;i<batches.length;i++){
    const pass=batches[i],items=buckets[i];items.sort((a,b)=>a.order-b.order);
    const weight=m=>.44+Math.sqrt(m.len)*.21+(m.order>=8?25:0);
    let count=0,total=0;for(const m of items)total+=weight(m);
    const span=[.098,.151,.112,.086,.128,.054,.091][i],run=total-weight(items[items.length-1]);
    for(let j=0;j<items.length;j++){
      const m=items[j];m.start=mix(pass.start,pass.end-span,clamp(count/run));m.end=j===items.length-1?pass.end:m.start+span;
      count+=weight(m);tracks.push(m);
    }
    pass.last=tracks.length;
  }
}
  makeStudy();
  assemble();
  const packed=new Float64Array(tracks.length*trackStride);
  const rgb=hex=>parseInt(hex.slice(1),16);
  for(let i=0;i<tracks.length;i++){
    const m=tracks[i];
    packed.set([m.x,m.y,m.ux,m.uy,m.len,m.w,m.bend,m.a,m.kind,m.tip,m.start,m.end,rgb(m.base),rgb(m.light),rgb(m.shade)],i*trackStride);
  }
  return {packed,batches,tips,...makePrimer()};
}

async function loadPainting(width,height){
  const settings={W,H,kinds,trackStride};
  if(typeof Worker==='function'&&typeof OffscreenCanvas==='function'){
    const source=`
      const clamp=${clamp},makeStrokePainter=${makeStrokePainter},preparePainting=${preparePainting};
      onmessage=({data:[width,height]})=>{
        const art=preparePainting((w,h)=>new OffscreenCanvas(w,h),width,height,makeStrokePainter,${JSON.stringify(settings)});
        postMessage(art,[art.packed.buffer,art.primer.buffer,art.tooth.buffer]);
      };
    `;
    const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
    let worker;
    try{
      worker=new Worker(url);
      return await new Promise((resolve,reject)=>{
        worker.onmessage=event=>resolve(event.data);
        worker.onerror=reject;
        worker.onmessageerror=reject;
        worker.postMessage([width,height]);
      });
    }catch{
      // Allow the single-file work to run where blob workers are unavailable.
    }finally{
      worker?.terminate();URL.revokeObjectURL(url);
    }
  }
  await new Promise(resolve=>requestAnimationFrame(resolve));
  const createCanvas=(w,h)=>{
    const node=document.createElement('canvas');node.width=w;node.height=h;return node;
  };
  return preparePainting(createCanvas,width,height,makeStrokePainter,settings);
}

const canvas=document.querySelector('#painting'),wet=document.querySelector('#wet');
if(window.ToyEmbed){
  const width=Math.min(canvas.width,Math.max(320,Math.round(canvas.clientWidth*window.ToyEmbed.pixelRatio)));
  canvas.width=wet.width=width;
  canvas.height=wet.height=Math.round(width*H/W);
}else if(innerWidth<650){
  canvas.width=wet.width=W;canvas.height=wet.height=H;
}
const ctx=canvas.getContext('2d',{alpha:false,willReadFrequently:true}),tipCtx=wet.getContext('2d',{willReadFrequently:true}),scale=canvas.width/W;
ctx.lineJoin=tipCtx.lineJoin='round';
let tracks,trackCount,batches,paintStroke;
function track(index){
  const i=index*trackStride;
  const color=n=>'#'+n.toString(16).padStart(6,'0');
  return {x:tracks[i],y:tracks[i+1],ux:tracks[i+2],uy:tracks[i+3],len:tracks[i+4],w:tracks[i+5],bend:tracks[i+6],a:tracks[i+7],kind:tracks[i+8],tip:tracks[i+9],start:tracks[i+10],end:tracks[i+11],base:color(tracks[i+12]),light:color(tracks[i+13]),shade:color(tracks[i+14])};
}
function installPrimer(primer,tooth){
  const data=new ImageData(primer,canvas.width,canvas.height);
  const texture=document.createElement('canvas');texture.width=canvas.width;texture.height=canvas.height;
  texture.setAttribute('aria-hidden','true');texture.style.cssText='mix-blend-mode:soft-light;opacity:.24;pointer-events:none';wet.after(texture);
  snapshots.set(0,data);ctx.putImageData(data,0,0);
  texture.getContext('2d').putImageData(new ImageData(tooth,texture.width,texture.height),0,0);
}
const stageOut=document.querySelector('#stage'),timeOut=document.querySelector('#time'),slider=document.querySelector('#timeline');
const playButton=document.querySelector('#play'),screenButton=document.querySelector('#screen'),gallery=document.querySelector('#gallery');
let next=0,position=0,playing=true,ready=false,origin=0,frame=0,dirty=null,lastLabel='',lastSecond=-1;
const snapshots=new Map(),cacheAfter=new Set();
function wipeTip(){
  if(!dirty)return;
  tipCtx.setTransform(scale,0,0,scale,0,0);
  tipCtx.clearRect(dirty[0],dirty[1],dirty[2]-dirty[0],dirty[3]-dirty[1]);dirty=null;
}
function cache(index){
  if(snapshots.has(index))return;
  snapshots.set(index,ctx.getImageData(0,0,canvas.width,canvas.height));
}
function updateReadout(t){
  const label=t>=25?'已完成':batches.find(b=>t>=b.start&&t<b.end)?.name||'打底画布';
  if(label!==lastLabel){stageOut.textContent=label;lastLabel=label}
  const sec=Math.floor(t+1e-7);
  if(sec!==lastSecond){timeOut.textContent='0:'+String(sec).padStart(2,'0')+' / 0:25';lastSecond=sec}
  slider.value=t>=25?25:Math.min(24.99,t);slider.style.setProperty('--progress',(t*4)+'%');
  slider.setAttribute('aria-valuetext',t.toFixed(1)+' 秒，'+label);
}
function drawAt(t){
  position=clamp(t,0,25);wipeTip();
  let lo=0,hi=trackCount;
  while(lo<hi){const k=(lo+hi)>>>1;if(tracks[k*trackStride+11]<=position)lo=k+1;else hi=k}
  let best=next<=lo?next:-1;
  for(const idx of snapshots.keys())if(idx<=lo&&idx>best)best=idx;
  if(best!==next){ctx.putImageData(snapshots.get(best),0,0);next=best}
  while(next<lo){
    paintStroke(ctx,track(next++),1,scale);if(cacheAfter.has(next))cache(next);
  }
  if(next<trackCount&&tracks[next*trackStride+10]<position){
    dirty=[W,H,0,0];
    for(let i=next;i<trackCount&&tracks[i*trackStride+10]<position;i++){
      const m=track(i),p=clamp((position-m.start)/(m.end-m.start)),pad=m.w+Math.abs(m.bend)+4;
      paintStroke(tipCtx,m,p,scale,m.kind===kinds.BRUSH&&m.w<13);
      const x1=m.x+m.len*m.ux,y1=m.y+m.len*m.uy;
      dirty[0]=Math.min(dirty[0],m.x-pad,x1-pad);dirty[1]=Math.min(dirty[1],m.y-pad,y1-pad);
      dirty[2]=Math.max(dirty[2],m.x+pad,x1+pad);dirty[3]=Math.max(dirty[3],m.y+pad,y1+pad);
    }
  }
  updateReadout(position);
}
function showButton(){
  const finished=position>=25,label=finished?'重新作画':playing?'暂停作画':'继续作画';
  playButton.setAttribute('aria-label',label);playButton.title=label+'（空格）';
  playButton.firstElementChild.className='icon '+(finished?'replay':playing?'pause':'play');
}
function tick(now){
  if(!playing||!ready)return;
  drawAt((now-origin)/1000);
  if(position>=25){playing=false;showButton();return}
  frame=requestAnimationFrame(tick);
}
function toggle(){
  if(!ready)return;
  if(playing){drawAt((performance.now()-origin)/1000);playing=false;cancelAnimationFrame(frame)}
  else{if(position>=25)drawAt(0);playing=true;origin=performance.now()-position*1000;frame=requestAnimationFrame(tick)}
  showButton();
}
function seek(t){
  if(!ready)return;
  cancelAnimationFrame(frame);playing=false;drawAt(t);showButton();
}
playButton.addEventListener('click',toggle);
slider.addEventListener('input',()=>seek(Number(slider.value)));
async function fullScreen(){
  if(document.fullscreenElement){await document.exitFullscreen();return}
  if(gallery.classList.contains('expanded')){gallery.classList.remove('expanded');syncScreen();return}
  if(gallery.requestFullscreen){try{await gallery.requestFullscreen();return}catch{}}
  gallery.classList.add('expanded');syncScreen();
}
function syncScreen(){const expanded=!!document.fullscreenElement||gallery.classList.contains('expanded'),label=expanded?'退出全屏':'全屏欣赏';screenButton.setAttribute('aria-label',label);screenButton.title=label+'（F）'}
screenButton.addEventListener('click',fullScreen);document.addEventListener('fullscreenchange',syncScreen);
document.addEventListener('keydown',event=>{
  if(event.altKey||event.ctrlKey||event.metaKey)return;
  if(event.code==='Space'&&event.target.tagName!=='BUTTON'){event.preventDefault();toggle()}
  if(event.key.toLowerCase()==='f'){event.preventDefault();fullScreen()}
  if(event.key==='Escape'&&gallery.classList.contains('expanded')){gallery.classList.remove('expanded');syncScreen()}
  if(event.target!==slider&&['Home','End','ArrowLeft','ArrowRight'].includes(event.key)){
    event.preventDefault();seek(event.key==='Home'?0:event.key==='End'?25:position+(event.key==='ArrowLeft'?-1:1));
  }
});
const art=await loadPainting(canvas.width,canvas.height);
tracks=art.packed;batches=art.batches;trackCount=tracks.length/trackStride;
paintStroke=makeStrokePainter(art.tips,kinds);
installPrimer(art.primer,art.tooth);
for(const n of [1,3,5])cacheAfter.add(batches[n].last);
ready=true;drawAt(0);origin=performance.now();frame=requestAnimationFrame(tick);
})();
</script>
