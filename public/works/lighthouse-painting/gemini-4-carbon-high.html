      for (let i = 0; i < 210; i++) {
        const ts = mix(23.82, 24.24, i / 210);
        const ang = 0.50 + rand() * 1.35;
        const r = 0.03 + Math.pow(rand(), 0.75) * 0.25;
        const u = 0.518 + Math.cos(ang) * r * 0.64 + Math.max(0, r - 0.07) * 0.20;
        const v = 0.215 + Math.sin(ang) * r * 1.12;
        if (u > 0.645 && v > 0.42) continue;
        const warmLit = smoothstep(0.24, 0.48, v);
        const cDrop = [1.0, mix(0.96, 0.89, warmLit), mix(0.90, 0.72, warmLit)];
        addLineStroke(u, v, u + Math.cos(ang) * 0.018 + 0.007, v + Math.sin(ang) * 0.020, -0.005,
          13 + rand() * 13, 9 + rand() * 8, cDrop, [0.66, 0.77, 0.83], 6,
          { opacity: clamp(0.68 * (1.0 - r * 1.65), 0.12, 0.70), impasto: 0.76, gloss: 0.62, wetPickup: 0.06, bristleFreq: 11.0, toothSens: 0.38 },
          ts, 0.05);
      }

      // 3. Perspective-Scaled Molten Dusk Shimmer on Distant Swells & Blazing Lantern Core (24.15s - 24.55s)
      for (let i = 0; i < 85; i++) {
        const frac = i / 85;
        const ts = mix(24.12, 24.45, frac);
        const v = 0.275 + Math.pow(rand(), 0.7) * 0.086;
        const depthT = clamp((v - 0.275) / 0.088, 0, 1);
        const spreadU = mix(0.11, 0.055, depthT);
        const u = 0.232 + (rand() - 0.5) * 2.0 * spreadU;
        if (Math.abs(u - 0.252) < 0.035 && Math.abs(v - 0.357) < 0.014) continue;

        const halfSpan = mix(0.014, 0.0045, depthT) * (0.7 + 0.6 * rand());
        const wGlint = mix(6.5, 2.6, depthT);
        const gCol = depthT > 0.6 ? [1.0, 0.87, 0.54] : [0.95, 0.66, 0.28];
        addLineStroke(u - halfSpan, v, u + halfSpan, v + 0.001, 0.001, wGlint, wGlint * 0.8,
          gCol, [0.85, 0.46, 0.18], 2,
          { opacity: 0.76, impasto: 0.52, gloss: 0.72, wetPickup: 0.12, bristleFreq: 6.0, toothSens: 0.30 }, ts, 0.045);
      }

      let tl = 24.32;
      const lanternDabs = [
        [0.695, 0.776, 0.715, 0.776, 20.5, [1.0, 0.88, 0.48], 0.80],
        [0.698, 0.778, 0.712, 0.778, 15.5, [1.0, 0.96, 0.78], 0.94],
        [0.701, 0.778, 0.709, 0.779, 11.0, [1.0, 1.00, 0.95], 1.00],
        [0.677, 0.742, 0.714, 0.742, 6.8,  [0.99, 0.80, 0.42], 0.70],
        [0.680, 0.753, 0.715, 0.753, 4.2,  [1.00, 0.87, 0.54], 0.64],
        [0.686, 0.800, 0.712, 0.800, 4.6,  [0.98, 0.77, 0.38], 0.60]
      ];
      lanternDabs.forEach(([x0, y0, x1, y1, w, col, imp]) => {
        addLineStroke(x0, y0, x1, y1, 0.001, w, w * 0.9, col, col, 4,
          { opacity: 0.98, impasto: imp, gloss: 0.80, wetPickup: 0.02, bristleFreq: 6.0, toothSens: 0.1 }, tl, 0.055);
        tl += 0.032;
      });

      // 4. Seven Graceful Wheeling Seagulls Banking into the Gale (24.50s - 24.90s)
      const gulls = [
        { x: 0.455, y: 0.715, s: 0.032, tilt:  0.24 },
        { x: 0.528, y: 0.662, s: 0.027, tilt: -0.18 },
        { x: 0.375, y: 0.648, s: 0.029, tilt:  0.30 },
        { x: 0.578, y: 0.792, s: 0.023, tilt:  0.14 },
        { x: 0.302, y: 0.712, s: 0.022, tilt: -0.22 },
        { x: 0.612, y: 0.618, s: 0.024, tilt:  0.26 },
        { x: 0.215, y: 0.575, s: 0.019, tilt:  0.16 }
      ];

      let tg = 24.50;
      gulls.forEach((g) => {
        const ct = Math.cos(g.tilt), st = Math.sin(g.tilt);
        const gp = (lx, ly) => [g.x + (lx * ct - ly * st) * g.s, g.y + (lx * st + ly * ct) * g.s * 1.48];

        const body = gp(0.0, 0.0);
        const lElb = gp(-0.46, 0.28);
        const lTip = gp(-1.06, 0.04);
        const rElb = gp(0.45, 0.34);
        const rTip = gp(0.98, 0.54);
        const head = gp(-0.20, -0.05);
        const tail = gp(0.24, -0.09);

        const wingShadow  = [0.22, 0.27, 0.34];
        const wingWarmLit = [1.00, 0.94, 0.78];
        const wingTipDark = [0.09, 0.11, 0.15];
        const pxW = g.s * 340.0;

        addLineStroke(body[0], body[1], lElb[0], lElb[1], 0.0025, pxW, pxW * 0.82, wingShadow, wingWarmLit, 7,
          { opacity: 0.96, impasto: 0.44, gloss: 0.48, wetPickup: 0.03, bristleFreq: 5.0, toothSens: 0.1 }, tg, 0.035);
        addLineStroke(lElb[0], lElb[1], lTip[0], lTip[1], 0.0025, pxW * 0.78, pxW * 0.26, wingWarmLit, wingTipDark, 7,
          { opacity: 0.96, impasto: 0.40, gloss: 0.48, wetPickup: 0.03, bristleFreq: 5.0, toothSens: 0.1 }, tg + 0.008, 0.035);

        addLineStroke(body[0], body[1], rElb[0], rElb[1], 0.0025, pxW, pxW * 0.82, wingShadow, wingWarmLit, 7,
          { opacity: 0.96, impasto: 0.44, gloss: 0.48, wetPickup: 0.03, bristleFreq: 5.0, toothSens: 0.1 }, tg + 0.015, 0.035);
        addLineStroke(rElb[0], rElb[1], rTip[0], rTip[1], -0.0025, pxW * 0.78, pxW * 0.26, wingWarmLit, wingTipDark, 7,
          { opacity: 0.96, impasto: 0.40, gloss: 0.48, wetPickup: 0.03, bristleFreq: 5.0, toothSens: 0.1 }, tg + 0.022, 0.035);

        addLineStroke(lElb[0], lElb[1] + 0.0022, body[0], body[1] + 0.0018, 0.002, pxW * 0.58, pxW * 0.52, wingWarmLit, [1.0, 0.98, 0.90], 7,
          { opacity: 0.97, impasto: 0.62, gloss: 0.58, wetPickup: 0.02, bristleFreq: 4.0, toothSens: 0.1 }, tg + 0.028, 0.032);
        addLineStroke(body[0], body[1] + 0.0018, rElb[0], rElb[1] + 0.0022, 0.002, pxW * 0.58, pxW * 0.52, wingWarmLit, [1.0, 0.98, 0.90], 7,
          { opacity: 0.97, impasto: 0.62, gloss: 0.58, wetPickup: 0.02, bristleFreq: 4.0, toothSens: 0.1 }, tg + 0.032, 0.032);
        addLineStroke(head[0], head[1], tail[0], tail[1], 0.0, pxW * 0.88, pxW * 0.50, wingWarmLit, wingShadow, 7,
          { opacity: 0.97, impasto: 0.48, gloss: 0.50, wetPickup: 0.02, bristleFreq: 4.0, toothSens: 0.1 }, tg + 0.036, 0.032);

        tg += 0.052;
      });

      // 5. Burnt-sienna rigger monogram completing precisely at 25.00s!
      const sigCol = [0.52, 0.25, 0.15];
      const sigProps = { opacity: 0.72, impasto: 0.15, gloss: 0.48, wetPickup: 0.02, bristleFreq: 3.0, toothSens: 0.2 };
      addLineStroke(0.918, 0.038, 0.925, 0.056, 0.0, 2.5, 2.0, sigCol, sigCol, 7, sigProps, 24.88, 0.05);
      addLineStroke(0.925, 0.056, 0.932, 0.038, 0.0, 2.5, 2.0, sigCol, sigCol, 7, sigProps, 24.91, 0.05);
      addLineStroke(0.920, 0.044, 0.931, 0.044, 0.0, 2.1, 1.8, sigCol, sigCol, 7, sigProps, 24.94, 0.04);
      addLineStroke(0.936, 0.039, 0.952, 0.040, -0.001, 2.2, 1.5, sigCol, sigCol, 7, sigProps, 24.95, 0.05);
    })();

    rawStrokes.sort((a, b) => a.tEnd - b.tEnd || a.tStart - b.tStart);

    // =========================================================================
    // PACK INSTANCE BUFFER & CREATE VAO FOR GPU BRUSH RENDERING
    // =========================================================================
    const totalStrokes = rawStrokes.length;
    const instanceData = new Float32Array(totalStrokes * FLOATS_PER_STROKE);

    for (let i = 0; i < totalStrokes; i++) {
      const s = rawStrokes[i];
      const o = i * FLOATS_PER_STROKE;
      instanceData[o + 0]  = s.p0[0];
      instanceData[o + 1]  = s.p0[1];
      instanceData[o + 2]  = s.p1[0];
      instanceData[o + 3]  = s.p1[1];

      instanceData[o + 4]  = s.p2[0];
      instanceData[o + 5]  = s.p2[1];
      instanceData[o + 6]  = s.w0;
      instanceData[o + 7]  = s.w1;

      instanceData[o + 8]  = s.colA[0];
      instanceData[o + 9]  = s.colA[1];
      instanceData[o + 10] = s.colA[2];
      instanceData[o + 11] = s.type;

      instanceData[o + 12] = s.colB[0];
      instanceData[o + 13] = s.colB[1];
      instanceData[o + 14] = s.colB[2];
      instanceData[o + 15] = s.opacity;

      instanceData[o + 16] = s.impasto;
      instanceData[o + 17] = s.gloss;
      instanceData[o + 18] = s.wetPickup;
      instanceData[o + 19] = s.seed;

      instanceData[o + 20] = s.tStart;
      instanceData[o + 21] = s.tEnd;
      instanceData[o + 22] = s.bristleFreq;
      instanceData[o + 23] = s.toothSens;
    }

    const brushVAO = gl.createVertexArray();
    const instanceVBO = gl.createBuffer();
    gl.bindVertexArray(brushVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, instanceVBO);
    gl.bufferData(gl.ARRAY_BUFFER, instanceData, gl.STATIC_DRAW);

    const strideBytes = FLOATS_PER_STROKE * 4;
    for (let attr = 0; attr < 6; attr++) {
      gl.enableVertexAttribArray(attr);
      gl.vertexAttribPointer(attr, 4, gl.FLOAT, false, strideBytes, attr * 16);
      gl.vertexAttribDivisor(attr, 1);
    }
    gl.bindVertexArray(null);

    const uBrushCanvasSize  = gl.getUniformLocation(progBrush, 'uCanvasSize');
    const uBrushCurrentTime = gl.getUniformLocation(progBrush, 'uCurrentTime');
    const uBrushPrevPig     = gl.getUniformLocation(progBrush, 'uPrevPigment');
    const uBrushPrevMat     = gl.getUniformLocation(progBrush, 'uPrevMaterial');

    const uDispPig          = gl.getUniformLocation(progDisp, 'uPigmentTex');
    const uDispMat          = gl.getUniformLocation(progDisp, 'uMaterialTex');
    const uDispTexel        = gl.getUniformLocation(progDisp, 'uTexelSize');
    const uDispLoupeCenter  = gl.getUniformLocation(progDisp, 'uLoupeCenter');
    const uDispLoupeActive  = gl.getUniformLocation(progDisp, 'uLoupeActive');

    const dynamicVAO = gl.createVertexArray();
    const dynamicVBO = gl.createBuffer();
    const dynamicBuf = new Float32Array(256 * FLOATS_PER_STROKE);
    gl.bindVertexArray(dynamicVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, dynamicVBO);
    gl.bufferData(gl.ARRAY_BUFFER, dynamicBuf.byteLength, gl.DYNAMIC_DRAW);
    for (let attr = 0; attr < 6; attr++) {
      gl.enableVertexAttribArray(attr);
      gl.vertexAttribPointer(attr, 4, gl.FLOAT, false, strideBytes, attr * 16);
      gl.vertexAttribDivisor(attr, 1);
    }
    gl.bindVertexArray(null);

    // =========================================================================
    // LOCKSTEP DISJOINT-BATCH PING-PONG RENDERER
    // =========================================================================
    let bakedCount = 0;

    function boxesOverlap(a, b) {
      return a.bx0 < b.bx1 && a.bx1 > b.bx0 && a.by0 < b.by1 && a.by1 > b.by0;
    }

    function bakeStrokeRange(startIdx, endIdx, simTime) {
      if (startIdx >= endIdx) return;

      gl.viewport(0, 0, CANVAS_W, CANVAS_H);
      gl.disable(gl.BLEND);
      gl.enable(gl.SCISSOR_TEST);
      gl.useProgram(progBrush);
      gl.uniform2f(uBrushCanvasSize, CANVAS_W, CANVAS_H);
      gl.uniform1f(uBrushCurrentTime, simTime);
      gl.uniform1i(uBrushPrevPig, 0);
      gl.uniform1i(uBrushPrevMat, 1);

      let idx = startIdx;
      const batchBoxes = [];

      while (idx < endIdx) {
        batchBoxes.length = 0;
        const batchStart = idx;
        let ux0 = CANVAS_W, uy0 = CANVAS_H, ux1 = 0, uy1 = 0;

        while (idx < endIdx && batchBoxes.length < 48) {
          const cand = rawStrokes[idx];
          let conflict = false;
          for (let j = 0; j < batchBoxes.length; j++) {
            if (boxesOverlap(cand, batchBoxes[j])) {
              conflict = true;
              break;
            }
          }
          if (conflict) break;
          batchBoxes.push(cand);
          if (cand.bx0 < ux0) ux0 = cand.bx0;
          if (cand.by0 < uy0) uy0 = cand.by0;
          if (cand.bx1 > ux1) ux1 = cand.bx1;
          if (cand.by1 > uy1) uy1 = cand.by1;
          idx++;
        }

        const batchLen = idx - batchStart;
        const sw = Math.max(1, ux1 - ux0);
        const sh = Math.max(1, uy1 - uy0);

        gl.bindVertexArray(brushVAO);
        gl.bindBuffer(gl.ARRAY_BUFFER, instanceVBO);
        const baseByteOffset = batchStart * strideBytes;
        for (let attr = 0; attr < 6; attr++) {
          gl.vertexAttribPointer(attr, 4, gl.FLOAT, false, strideBytes, baseByteOffset + attr * 16);
        }

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, canvasFBO.tex0);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, canvasFBO.tex1);

        gl.bindFramebuffer(gl.FRAMEBUFFER, scratchFBO.fbo);
        gl.scissor(ux0, uy0, sw, sh);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, VERTS_PER_STROKE, batchLen);

        gl.disable(gl.SCISSOR_TEST);
        for (let j = 0; j < batchBoxes.length; j++) {
          const b = batchBoxes[j];
          blitDualRect(scratchFBO, canvasFBO, b.bx0, b.by0, b.bx1, b.by1);
        }
        gl.enable(gl.SCISSOR_TEST);
      }

      gl.disable(gl.SCISSOR_TEST);
      gl.bindVertexArray(null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }

    // =========================================================================
    // TIMELINE PLAYBACK, ACTIVE IN-FLIGHT SWEEP & UI CONTROLS
    // =========================================================================
    let currentTime = 0.0;
    let isPlaying = true;
    let lastRAF = performance.now();
    let loupeEnabled = false;
    let loupeUV = [0.52, 0.30];

    const btnPlayPause  = document.getElementById('btn-play-pause');
    const btnReplay     = document.getElementById('btn-replay');
    const btnLoupe      = document.getElementById('btn-loupe');
    const loupeHint     = document.getElementById('loupe-hint');
    const slider        = document.getElementById('timeline-slider');
    const stageBadge    = document.getElementById('stage-badge');
    const timeReadout   = document.getElementById('time-readout');
    const strokeReadout = document.getElementById('stroke-readout');

    function syncSliderCSSVars() {
      slider.style.setProperty('--attr-min', slider.min || '0');
      slider.style.setProperty('--attr-max', slider.max || '25');
      slider.style.setProperty('--control-value', slider.value);
    }

    function getStageForTime(t) {
      for (let i = STAGES.length - 1; i >= 0; i--) {
        if (t >= STAGES[i].start) return STAGES[i].label;
      }
      return STAGES[0].label;
    }

    function seekToTime(targetT) {
      currentTime = clamp(targetT, 0, TOTAL_DURATION);
      let targetBaked = 0;
      while (targetBaked < totalStrokes && rawStrokes[targetBaked].tEnd <= currentTime) {
        targetBaked++;
      }

      if (targetBaked < bakedCount) {
        initCanvasToPrimedLinen();
        bakedCount = 0;
      }
      if (targetBaked > bakedCount) {
        bakeStrokeRange(bakedCount, targetBaked, currentTime + 0.001);
        bakedCount = targetBaked;
      }
      updateHUD();
    }

    function updateHUD() {
      const stLabel = getStageForTime(currentTime);
      slider.value = currentTime.toFixed(2);
      syncSliderCSSVars();
      slider.setAttribute('aria-valuetext', `${currentTime.toFixed(1)} 秒，${stLabel}`);
      stageBadge.textContent = currentTime >= TOTAL_DURATION ? '完成 · 暮色狂澜与孤塔油画终稿' : stLabel;
      timeReadout.textContent = `${currentTime.toFixed(2).padStart(5, '0')} / 25.00s`;

      let visCount = bakedCount;
      for (let i = bakedCount; i < totalStrokes; i++) {
        const s = rawStrokes[i];
        if (s.tStart < currentTime) visCount++;
        if (s.tStart > currentTime + 0.25) break;
      }
      strokeReadout.textContent = `${visCount.toLocaleString('zh-CN')} 笔`;
    }

    function renderFrame(now) {
      const dt = Math.min((now - lastRAF) / 1000, 0.1);
      lastRAF = now;

      if (isPlaying) {
        currentTime = Math.min(currentTime + dt, TOTAL_DURATION);
        if (currentTime >= TOTAL_DURATION) {
          currentTime = TOTAL_DURATION;
          isPlaying = false;
          btnPlayPause.textContent = '重播';
        }
      }

      let newBaked = bakedCount;
      while (newBaked < totalStrokes && rawStrokes[newBaked].tEnd <= currentTime) {
        newBaked++;
      }
      if (newBaked > bakedCount) {
        bakeStrokeRange(bakedCount, newBaked, currentTime);
        bakedCount = newBaked;
      }

      let activeCount = 0;
      const scanLimit = Math.min(totalStrokes, bakedCount + 260);
      for (let i = bakedCount; i < scanLimit && activeCount < 64; i++) {
        const s = rawStrokes[i];
        if (s.tStart < currentTime && s.tEnd > currentTime) {
          const srcOff = i * FLOATS_PER_STROKE;
          const dstOff = activeCount * FLOATS_PER_STROKE;
          for (let k = 0; k < FLOATS_PER_STROKE; k++) {
            dynamicBuf[dstOff + k] = instanceData[srcOff + k];
          }
          activeCount++;
        }
      }

      let displaySource = canvasFBO;
      if (activeCount > 0) {
        gl.disable(gl.SCISSOR_TEST);
        blitDualRect(canvasFBO, liveFBO, 0, 0, CANVAS_W, CANVAS_H);

        gl.viewport(0, 0, CANVAS_W, CANVAS_H);
        gl.useProgram(progBrush);
        gl.uniform2f(uBrushCanvasSize, CANVAS_W, CANVAS_H);
        gl.uniform1f(uBrushCurrentTime, currentTime);
        gl.uniform1i(uBrushPrevPig, 0);
        gl.uniform1i(uBrushPrevMat, 1);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, canvasFBO.tex0);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, canvasFBO.tex1);

        gl.bindVertexArray(dynamicVAO);
        gl.bindBuffer(gl.ARRAY_BUFFER, dynamicVBO);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, dynamicBuf.subarray(0, activeCount * FLOATS_PER_STROKE));

        gl.bindFramebuffer(gl.FRAMEBUFFER, liveFBO.fbo);
        gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, VERTS_PER_STROKE, activeCount);
        gl.bindVertexArray(null);
        displaySource = liveFBO;
      }

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.disable(gl.SCISSOR_TEST);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(progDisp);

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, displaySource.tex0);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, displaySource.tex1);

      gl.uniform1i(uDispPig, 0);
      gl.uniform1i(uDispMat, 1);
      gl.uniform2f(uDispTexel, 1.0 / CANVAS_W, 1.0 / CANVAS_H);
      gl.uniform2f(uDispLoupeCenter, loupeUV[0], loupeUV[1]);
      gl.uniform1f(uDispLoupeActive, loupeEnabled ? 1.0 : 0.0);

      gl.bindVertexArray(emptyVAO);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      updateHUD();
      requestAnimationFrame(renderFrame);
    }

    btnPlayPause.addEventListener('click', () => {
      if (currentTime >= TOTAL_DURATION) {
        seekToTime(0);
        isPlaying = true;
        btnPlayPause.textContent = '暂停';
      } else {
        isPlaying = !isPlaying;
        btnPlayPause.textContent = isPlaying ? '暂停' : '继续';
      }
      lastRAF = performance.now();
    });

    btnReplay.addEventListener('click', () => {
      seekToTime(0);
      isPlaying = true;
      btnPlayPause.textContent = '暂停';
      lastRAF = performance.now();
    });

    btnLoupe.addEventListener('click', () => {
      loupeEnabled = !loupeEnabled;
      btnLoupe.setAttribute('aria-pressed', String(loupeEnabled));
      loupeHint.classList.toggle('visible', loupeEnabled);
    });

    slider.addEventListener('input', () => {
      const val = parseFloat(slider.value);
      isPlaying = false;
      btnPlayPause.textContent = val >= TOTAL_DURATION ? '重播' : '继续';
      seekToTime(val);
    });

    function updatePointerUV(e) {
      const rect = canvas.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      const u = clamp((e.clientX - rect.left) / rect.width, 0, 1);
      const v = clamp(1.0 - (e.clientY - rect.top) / rect.height, 0, 1);
      loupeUV = [u, v];
    }

    canvas.addEventListener('pointermove', updatePointerUV);
    canvas.addEventListener('pointerdown', (e) => {
      updatePointerUV(e);
      if (e.button === 0 && !loupeEnabled && e.detail === 2) {
        loupeEnabled = true;
        btnLoupe.setAttribute('aria-pressed', 'true');
        loupeHint.classList.add('visible');
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        btnPlayPause.click();
      } else if (e.key === 'l' || e.key === 'L') {
        btnLoupe.click();
      } else if (e.key === 'r' || e.key === 'R') {
        btnReplay.click();
      } else if (e.key === 'h' || e.key === 'H') {
        document.body.classList.toggle('ui-hidden');
      }
    });

    initCanvasToPrimedLinen();
    syncSliderCSSVars();
    lastRAF = performance.now();
    requestAnimationFrame(now => {
      renderFrame(now);
      window.ToyEmbed?.ready();
    });
  })();
  </script>
</body>
</html>
