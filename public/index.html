<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>同题印样 · HTML Toys</title>
<meta name="description" content="同一段提示词交给不同的模型，各写成一个单文件网页，按题目和模型排成一张印样，可以逐题并排对比。">
<meta name="theme-color" content="#eef3f6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="同题印样 · HTML Toys">
<meta property="og:description" content="同一段提示词，交给不同的模型，各写成一个单文件网页。">
<meta property="og:image" content="og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
:root {
  --light: #eef3f6;
  --light-hot: #fbfdff;
  --film: #1d1915;
  --film-in: #2a2520;
  --edge: #e9b45c;
  --pencil: #c8202a;
  --ink: #1f2328;
  --lead: #5f6973;
  --rule: #1f232814;
  --sans: "Archivo", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --gutter: clamp(16px, 4vw, 64px);
  /* sprocket holes along the top and bottom of a strip of film */
  --holes: linear-gradient(90deg, transparent 0 5px, var(--light-hot) 5px 13px, transparent 13px 20px);
}
* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body {
  margin: 0; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased;
  background: radial-gradient(120% 80% at 50% 30%, var(--light-hot), var(--light) 70%) fixed, var(--light);
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--pencil); outline-offset: 3px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.top { display: flex; justify-content: space-between; align-items: center; padding: 20px var(--gutter) 0; font-size: 13px; color: var(--lead); }
.pill, .lang { font: 600 13px/1 var(--sans); border: 1.5px solid var(--ink); background: none; color: var(--ink); padding: 8px 13px; border-radius: 99px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.pill:hover, .lang:hover { background: var(--ink); color: var(--light); }
.pill:disabled { opacity: .35; cursor: default; background: none; color: var(--ink); }

.intro { padding: clamp(36px, 7vh, 88px) var(--gutter) clamp(28px, 5vh, 56px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 28rem); gap: 24px 6vw; align-items: end; }
.intro h1 { margin: 0; font-weight: 800; font-stretch: 62%; font-size: clamp(60px, 11vw, 176px); line-height: .84; letter-spacing: -.02em; }
html[lang="zh-CN"] .intro h1 { font-weight: 700; letter-spacing: .02em; line-height: 1; }
.intro p { margin: 0; font-size: 16px; line-height: 1.65; color: var(--lead); }
.intro p + p { margin-top: 10px; font-size: 14px; }

/* the proof sheet: rows are prompts, columns are models.
   .heads, .row and .reel are transparent on wide screens so every cell sits on one grid. */
.sheet { padding: 0 var(--gutter) 96px; }
.matrix { display: grid; grid-template-columns: minmax(140px, 13rem) repeat(var(--n), minmax(0, 1fr)); }
.heads, .row, .reel { display: contents; }
.colhead { position: sticky; top: 0; z-index: 3; padding: 14px 14px 12px; background: linear-gradient(var(--light) 80%, #eef3f600); }
.colhead.corner { padding-left: 0; font-size: 12.5px; color: var(--lead); display: flex; align-items: flex-end; }
.solo { all: unset; cursor: pointer; display: grid; gap: 3px; position: relative; padding-bottom: 6px; min-width: 0; }
.solo:focus-visible { outline: 2px solid var(--pencil); outline-offset: 4px; border-radius: 2px; }
.solo b { font-size: 15px; font-weight: 700; font-stretch: 80%; display: flex; align-items: center; gap: 8px; }
.solo b i { width: 10px; height: 10px; border-radius: 50%; background: var(--mc); flex: none; }
.solo .abbr { display: none; }
.solo > span { font-size: 12.5px; color: var(--lead); }
.solo svg { position: absolute; left: -8px; bottom: -4px; width: calc(100% + 16px); height: 12px; opacity: 0; }
.solo[aria-pressed="true"] svg { opacity: 1; }
.solo:hover b { text-decoration: underline; text-underline-offset: 3px; }

.rowhead { padding: 22px 18px 22px 0; display: grid; align-content: center; gap: 8px; border-top: 1px solid var(--rule); }
.rowhead h2 { margin: 0; font-size: 18px; line-height: 1.2; font-weight: 700; font-stretch: 85%; }
.rowhead .tally { font-size: 12px; color: var(--lead); }
.rowhead button { all: unset; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--pencil); text-decoration: underline; text-underline-offset: 3px; width: fit-content; }
.rowhead button:focus-visible { outline: 2px solid var(--pencil); outline-offset: 3px; }

/* each row is one strip of film; each cell is a frame on it */
.cell { position: relative; padding: 26px 8px; border-top: 1px solid var(--rule); transition: opacity .3s, filter .3s;
  background: var(--holes) 0 8px / 20px 9px repeat-x, var(--holes) 0 calc(100% - 8px) / 20px 9px repeat-x, var(--film); }
.cell .no { position: absolute; right: 12px; top: 10px; z-index: 1; font-size: 10px; font-weight: 700; font-stretch: 62%; color: var(--edge); letter-spacing: .1em; background: var(--film); padding: 0 4px; }
.frame { display: block; position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 3px; background: var(--film-in); text-decoration: none; }
.frame:focus-visible { outline-color: var(--edge); }
.frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.frame .live { position: absolute; inset: 0; }
.live iframe { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; border: 0; transform-origin: 0 0; opacity: 0; transition: opacity .5s; pointer-events: none; }
.live iframe.is-loaded { opacity: 1; }
.frame .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 7px; font-size: 12.5px; font-weight: 600; color: #fff; background: linear-gradient(#0000, #000b); opacity: 0; transition: opacity .25s; }
.frame:hover .cap, .frame:focus-visible .cap { opacity: 1; }
.unexposed { aspect-ratio: 16 / 10; border-radius: 3px; display: grid; place-content: center; text-align: center; gap: 2px;
  background: repeating-linear-gradient(135deg, #2b2621 0 6px, #27221d 6px 12px); color: #a39888; font-size: 12.5px; }
.unexposed b { font-weight: 700; color: #c2b6a4; }
/* grease-pencil circle round the frame that is playing */
.mark { position: absolute; inset: 12px 0; width: 100%; height: calc(100% - 24px); pointer-events: none; opacity: 0; z-index: 2; overflow: visible; }
.mark path { fill: none; stroke: #d7262e; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1400; stroke-dashoffset: 1400; transition: stroke-dashoffset .5s ease; }
.cell.is-live .mark { opacity: .92; }
.cell.is-live .mark path { stroke-dashoffset: 0; }

.matrix.soloing .cell:not(.on) { opacity: .22; filter: grayscale(1); }
.matrix.soloing .colhead:not(.on):not(.corner) { opacity: .45; }

footer { padding: 0 var(--gutter) 48px; font-size: 13.5px; line-height: 1.6; color: var(--lead); }

/* compare: the loupe, one prompt's frames enlarged on a single strip */
.loupe { position: fixed; inset: 0; z-index: 20; overflow: auto; overscroll-behavior: contain; background: radial-gradient(120% 80% at 50% 20%, var(--light-hot), var(--light) 70%); visibility: hidden; opacity: 0; transition: opacity .3s, visibility .3s; }
.loupe.open { visibility: visible; opacity: 1; transition: opacity .3s; }
.loupe .bar { position: sticky; top: 0; z-index: 3; display: flex; gap: 8px; align-items: center; padding: 14px var(--gutter); background: var(--light); border-bottom: 1.5px solid var(--ink); }
.loupe .bar h2 { margin: 0 auto 0 0; font-size: clamp(20px, 2.4vw, 30px); font-weight: 800; font-stretch: 70%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loupe .bar .count { font-size: 12.5px; color: var(--lead); margin-right: 4px; white-space: nowrap; }
.spread { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); margin: 28px var(--gutter) 0; padding: 0 6px; }
.spread::before { content: ""; grid-area: 1 / 1 / 2 / -1; margin: 0 -6px; }
.spread::before, .film { background: var(--holes) 0 10px / 20px 9px repeat-x, var(--holes) 0 calc(100% - 10px) / 20px 9px repeat-x, var(--film); }
.shot { grid-area: 1 / var(--c); padding: 30px 8px; min-width: 0; position: relative; }
.shot .stage { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 3px; background: var(--film-in); }
.shot .stage iframe { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; }
.shot .stage iframe:focus-visible { outline: 2px solid var(--edge); outline-offset: -2px; }
.shot .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.note { grid-area: 2 / var(--c); padding: 16px 14px 0; font-size: 14px; line-height: 1.6; color: var(--lead); min-width: 0; }
.note h3 { margin: 0 0 6px; font-size: 15px; color: var(--ink); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note h3 i { width: 10px; height: 10px; border-radius: 50%; background: var(--mc); }
.note h3 a { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--pencil); }
.note p { margin: 0; max-width: 40em; }
.promptbox { margin: 44px var(--gutter) 96px; display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 46rem); gap: 20px clamp(24px, 4vw, 64px); }
.promptbox h3 { margin: 0 0 12px; font-size: 22px; font-weight: 800; font-stretch: 70%; }
.promptbox .tools { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 99px; overflow: hidden; }
.seg button { font: 600 12.5px/1 var(--sans); border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--light); }
.seg button:focus-visible { outline-offset: -4px; }
.prompt { background: #fff; padding: 22px 28px 8px; font-size: 15.5px; line-height: 1.8; box-shadow: 0 1px 3px #1f232822, 0 14px 30px -20px #1f232855; overflow-wrap: anywhere; }
.prompt h3, .prompt h4, .prompt h5 { font-size: 15.5px; margin: 18px 0 6px; font-weight: 700; }
.prompt > :first-child { margin-top: 0; }
.prompt p, .prompt ul, .prompt ol, .prompt pre { margin: 0 0 14px; }
.prompt ul, .prompt ol { padding-left: 1.25em; }
.prompt code { background: #1f232810; padding: 0 4px; border-radius: 3px; font-size: .92em; }
.prompt pre { overflow-x: auto; background: #1f232808; padding: 10px 12px; }
.prompt pre code { background: none; padding: 0; }
.err { color: var(--pencil); }

/* narrow screens: model chips on top, each prompt its own film strip that scrolls sideways */
@media (max-width: 760px) {
  html { scroll-padding-top: 64px; }
  .intro { grid-template-columns: 1fr; }
  .matrix { display: block; }
  .heads { display: flex; gap: 6px 18px; flex-wrap: wrap; position: sticky; top: 0; z-index: 3; padding: 12px 0 10px; margin: 0 calc(-1 * var(--gutter)); padding-inline: var(--gutter); background: var(--light); border-bottom: 1px solid var(--rule); }
  .colhead { position: static; padding: 0; background: none; }
  .colhead.corner { display: none; }
  .solo b { font-size: 14px; }
  .solo .full { display: none; }
  .solo .abbr { display: inline; }
  .row { display: block; }
  .rowhead { padding: 24px 0 10px; border-top: 0; grid-template-columns: 1fr auto; align-items: baseline; }
  .rowhead h2 { grid-column: 1 / -1; }
  .rowhead button { justify-self: end; }
  .reel { display: grid; grid-auto-flow: column; grid-auto-columns: calc(100% / min(var(--n), 2.3)); overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 calc(-1 * var(--gutter)); padding: 0 calc(var(--gutter) - 8px); scroll-padding-inline: calc(var(--gutter) - 8px);
    background: var(--holes) 0 8px / 20px 9px repeat-x, var(--holes) 0 calc(100% - 8px) / 20px 9px repeat-x, var(--film); scrollbar-width: none; }
  .reel::-webkit-scrollbar { display: none; }
  .cell { background: none; border-top: 0; scroll-snap-align: start; padding: 26px 5px; }
  .loupe .bar { flex-wrap: wrap; padding-block: 10px; }
  .loupe .bar h2 { flex: 1 0 100%; font-size: 22px; }
  .loupe .bar .count { margin-right: auto; }
  .spread { grid-template-columns: 1fr; padding: 0; margin-top: 18px; }
  .spread::before { display: none; }
  .shot, .note { grid-area: auto; }
  .shot { padding: 26px 12px; }
  .note { padding: 12px 0 26px; }
  .promptbox { grid-template-columns: 1fr; margin-top: 16px; }
  .prompt { padding: 18px 18px 4px; font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  .mark path, .cell, .loupe, .live iframe, .frame .cap { transition: none; }
}
</style>
</head>
<body>
<div id="page">
  <div class="top"><span>HTML Toys</span><button class="lang" id="lang" type="button" data-t="langBtn" data-t-attr="aria-label:langLabel">EN</button></div>

  <header class="intro">
    <h1 data-t="title">同题印样</h1>
    <div><p data-t="lede"></p><p data-t="hint"></p></div>
  </header>

  <main class="sheet"><div class="matrix" id="matrix"></div></main>
  <footer><span data-t="foot"></span> <span id="stats"></span></footer>
</div>

<section class="loupe" id="loupe" role="dialog" aria-modal="true" aria-labelledby="lt" hidden>
  <div class="bar">
    <h2 id="lt"></h2>
    <span class="count" id="lcount"></span>
    <button class="pill" id="lprev" type="button" data-t="prev">上一题</button>
    <button class="pill" id="lnext" type="button" data-t="next">下一题</button>
    <button class="pill" id="lclose" type="button" data-t="close">回到印样</button>
  </div>
  <div class="spread" id="spread"></div>
  <div class="promptbox">
    <div>
      <h3 data-t="promptHead">提示词</h3>
      <div class="tools">
        <div class="seg" role="group" data-t-attr="aria-label:promptLang"><button type="button" data-pl="zh">中文</button><button type="button" data-pl="en">English</button></div>
        <button class="pill" id="copy" type="button" data-t="copy">复制</button>
        <span class="vh" id="copied" role="status"></span>
      </div>
    </div>
    <div class="prompt" id="prompt"></div>
  </div>
</section>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><path id="scribble" d="M6 7 C 60 3, 140 9, 200 5 S 300 8, 330 4"/></defs>
</svg>

<script src="assets/toys.js"></script>
<script src="assets/home.js"></script>
<script>
Home.strings({
  docTitle: { zh: '同题印样 · HTML Toys', en: 'Proof Sheet · HTML Toys' },
  title: { zh: '同题印样', en: 'Proof Sheet' },
  lede: {
    zh: '同一段提示词交给不同的模型，各写成一个单文件网页。每一行是一道题，每一列是一个模型，像一张冲洗出来的印样。',
    en: 'One prompt, handed to different models, each answering with a single HTML file. Each row is a prompt, each column a model, laid out like a developed proof sheet.',
  },
  hint: {
    zh: '鼠标停在一帧上，它会在胶片里动起来。点列头只看一个模型，点「放大对比」把同一道题并排放大。',
    en: 'Rest the pointer on a frame and it plays on the film. Pick a column head to see one model alone, or “Compare” to see one prompt’s frames enlarged side by side.',
  },
  foot: { zh: '每件作品都是一个独立的 HTML 文件。空帧表示这个模型还没交这道题。', en: 'Every piece is one self-contained HTML file. A blank frame means that model hasn’t answered yet.' },
  langBtn: { zh: 'EN', en: '中文' },
  langLabel: { zh: 'Switch to English', en: '切换到中文' },
  corner: { zh: '题目 ↓  模型 →', en: 'Prompts ↓  Models →' },
  compare: { zh: '放大对比', en: 'Compare' },
  unexposed: { zh: '未曝光', en: 'Unexposed' },
  notYet: { zh: '还没交卷。', en: 'Not answered yet.' },
  prev: { zh: '上一题', en: 'Previous' },
  next: { zh: '下一题', en: 'Next' },
  close: { zh: '回到印样', en: 'Back to the sheet' },
  open: { zh: '新标签页打开', en: 'Open in new tab' },
  promptHead: { zh: '提示词', en: 'The prompt' },
  promptLang: { zh: '提示词语言', en: 'Prompt language' },
  copy: { zh: '复制', en: 'Copy' },
  copied: { zh: '已复制', en: 'Copied' },
  loadFail: { zh: '提示词没能加载。请通过本地服务器或线上地址打开本页。', en: 'The prompt didn’t load. Open this page through a web server.' },
});
const L = o => o[Home.lang];
const zh = () => Home.lang === 'zh';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const qt = s => zh() ? `《${s}》` : `“${s}”`;
const pad = n => String(n).padStart(2, '0');
const workName = (r, m) => zh() ? `${qt(L(r.title))}，${m.name}` : `${qt(L(r.title))} by ${m.name}`;
// a loose hand-drawn ellipse, different for every frame
function circlePath(seed) {
  let r = seed * 9301 + 49297; const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
  const pts = [], turns = 1.12, n = 40;
  for (let i = 0; i <= n; i++) {
    const a = -2.2 + i / n * Math.PI * 2 * turns, w = 1 + (rnd() - .5) * .05;
    pts.push([50 + 50.5 * w * Math.cos(a), 50 + 51 * w * Math.sin(a)]);
  }
  return 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join('L');
}

/* ---- the sheet ---- */
let solo = null;
const matrix = document.getElementById('matrix');
function render() {
  const models = Home.models(), prompts = Home.prompts();
  matrix.style.setProperty('--n', models.length);
  matrix.classList.toggle('soloing', !!solo);
  let html = `<div class="heads"><div class="colhead corner" aria-hidden="true">${Home.t('corner')}</div>` + models.map(m => {
    const have = prompts.filter(p => p.runs[m.id]).length;
    return `<div class="colhead ${solo === m.id ? 'on' : ''}"><button class="solo" type="button" data-solo="${m.id}" aria-pressed="${solo === m.id}" style="--mc:${m.color}">
      <b><i></i><span class="full">${esc(m.name)}</span><span class="abbr" aria-hidden="true">${esc(m.short || m.name)}</span></b>
      <span>${m.vendor ? esc(m.vendor) + (zh() ? '，' : ', ') : ''}${have} / ${prompts.length}</span>
      <svg viewBox="0 0 336 12" preserveAspectRatio="none" aria-hidden="true"><use href="#scribble" fill="none" stroke="#d7262e" stroke-width="3" stroke-linecap="round"/></svg>
    </button></div>`;
  }).join('') + `</div>`;
  let frameNo = 0;
  prompts.forEach((p, ri) => {
    const runs = Home.runs(p.id), have = runs.filter(x => x.run).length;
    html += `<section class="row" id="${p.id}" aria-labelledby="h-${p.id}"><div class="rowhead"><h2 id="h-${p.id}">${esc(L(p.brief))}</h2>
      <span class="tally">${zh() ? `${have} 个模型交卷` : `${have} of ${models.length} answered`}</span>
      <button type="button" data-open="${p.id}" aria-describedby="h-${p.id}">${Home.t('compare')}</button></div><div class="reel">`;
    runs.forEach(({ model: m, run: r }, ci) => {
      frameNo++;
      const on = !solo || solo === m.id;
      html += `<div class="cell ${on ? 'on' : ''}" data-id="${p.id}" data-model="${m.id}"><span class="no" aria-hidden="true">${pad(ri + 1)}${String.fromCharCode(65 + ci)}</span>`;
      if (r) html += `<a class="frame" href="${Home.href(p.id, m.id)}" aria-label="${esc(workName(r, m))}">
          <img src="${Home.cover(p.id, m.id)}" alt="" loading="${ri < 3 ? 'eager' : 'lazy'}" decoding="async" width="1200" height="750"><div class="live"></div>
          <span class="cap" aria-hidden="true">${esc(qt(L(r.title)))}</span></a>
          <svg class="mark" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="${circlePath(frameNo)}" vector-effect="non-scaling-stroke" pathLength="1400"/></svg>`;
      else html += `<div class="unexposed"><b>${Home.t('unexposed')}</b><span>${esc(m.short || m.name)}</span></div>`;
      html += `</div>`;
    });
    html += `</div></section>`;
  });
  matrix.innerHTML = html;
  const works = prompts.reduce((n, p) => n + Object.keys(p.runs).filter(id => Home.model(id)).length, 0);
  document.getElementById('stats').textContent = zh()
    ? `现在有 ${prompts.length} 道题、${models.length} 个模型、${works} 件作品。`
    : `${prompts.length} prompts, ${models.length} models, ${works} pieces so far.`;
}
matrix.addEventListener('click', e => {
  const s = e.target.closest('[data-solo]');
  if (s) {
    solo = solo === s.dataset.solo ? null : s.dataset.solo; stop(); render();
    matrix.querySelector(`[data-solo="${CSS.escape(s.dataset.solo)}"]`).focus();
    return;
  }
  const o = e.target.closest('[data-open]');
  if (o) openLoupe(o.dataset.open, true);
});

/* a frame plays on the film while the pointer rests on it, or while it has keyboard focus */
const canHover = matchMedia('(hover: hover) and (pointer: fine)').matches;
let timer = 0, current = null;
function play(cell) {
  if (Home.reducedMotion || cell === current) return;
  clearTimeout(timer);
  timer = setTimeout(() => {
    stop(); current = cell;
    const frame = cell.querySelector('.frame');
    const live = Home.mountLive(cell.querySelector('.live'), Home.href(cell.dataset.id, cell.dataset.model), { title: frame.getAttribute('aria-label') });
    live.frame.style.transform = `scale(${frame.clientWidth / 1600})`;
    live.frame.setAttribute('aria-hidden', 'true');
    cell.classList.add('is-live');
  }, 380);
}
function stop() {
  clearTimeout(timer);
  if (current) { Home.unmountLive(current.querySelector('.live')); current.classList.remove('is-live'); current = null; }
}
const playable = t => { const c = t.closest && t.closest('.cell'); return c && c.querySelector('.frame') ? c : null; };
matrix.addEventListener('pointerover', e => { const c = playable(e.target); if (canHover && c) play(c); });
matrix.addEventListener('pointerout', e => {
  const c = e.target.closest('.cell'); if (!c || (e.relatedTarget && c.contains(e.relatedTarget))) return;
  clearTimeout(timer); if (current === c) stop();
});
matrix.addEventListener('focusin', e => { if (e.target.matches('.frame')) play(e.target.closest('.cell')); });
matrix.addEventListener('focusout', e => { if (e.target.matches('.frame')) { clearTimeout(timer); if (current === e.target.closest('.cell')) stop(); } });

/* ---- the loupe ---- */
const page = document.getElementById('page'), loupe = document.getElementById('loupe'), spread = document.getElementById('spread'), promptEl = document.getElementById('prompt');
let openId = null, pushed = false, promptLang = Home.lang, lastFocus = null;
const fitStage = st => { const f = st.querySelector('iframe'); if (f) f.style.transform = `scale(${st.clientWidth / 1440})`; };
const io = new IntersectionObserver(es => es.forEach(en => {
  const st = en.target;
  if (en.isIntersecting && openId) { Home.mountLive(st, st.dataset.src, { exclusive: false, title: st.dataset.title }).frame.tabIndex = 0; fitStage(st); }
  else if (!en.isIntersecting) Home.unmountLive(st);
}), { threshold: .15 });
const ro = new ResizeObserver(es => es.forEach(en => fitStage(en.target)));
const stages = () => spread.querySelectorAll('.stage');
function unwatch() { stages().forEach(s => { io.unobserve(s); ro.unobserve(s); Home.unmountLive(s); }); }

function fillLoupe() {
  const p = Home.find(openId), runs = Home.runs(openId), all = Home.prompts(), i = all.indexOf(p);
  unwatch();
  document.getElementById('lt').textContent = L(p.brief);
  document.getElementById('lcount').textContent = `${i + 1} / ${all.length}`;
  document.getElementById('lprev').disabled = i === 0;
  document.getElementById('lnext').disabled = i === all.length - 1;
  spread.style.setProperty('--n', runs.length);
  spread.innerHTML = runs.map(({ model: m, run: r }, c) => `
    <div class="shot film" style="--c:${c + 1}">${r
      ? `<div class="stage" data-src="${Home.href(p.id, m.id)}" data-title="${esc(workName(r, m))}"><img src="${Home.cover(p.id, m.id)}" alt="" width="1200" height="750"></div>`
      : `<div class="unexposed"><b>${Home.t('unexposed')}</b><span>${esc(m.name)}</span></div>`}</div>
    <div class="note" style="--c:${c + 1};--mc:${m.color}">
      <h3><i></i>${esc(m.name)}${r ? `<a href="${Home.href(p.id, m.id)}" target="_blank" rel="noopener" aria-label="${esc(Home.t('open') + (zh() ? '：' : ': ') + workName(r, m))}">${Home.t('open')}</a>` : ''}</h3>
      <p>${r ? `${esc(qt(L(r.title)))} ${esc(L(r.medium))}${zh() ? '。' : '. '}${esc(L(r.blurb))}` : Home.t('notYet')}</p></div>`).join('');
  // observe once layout has settled, so frames already in view mount straight away
  requestAnimationFrame(() => requestAnimationFrame(() => stages().forEach(s => { io.observe(s); ro.observe(s); })));
}
async function showPrompt() {
  const id = openId, l = promptLang;
  loupe.querySelectorAll('[data-pl]').forEach(b => b.setAttribute('aria-pressed', b.dataset.pl === l));
  promptEl.lang = l === 'zh' ? 'zh-CN' : 'en';
  try { const { html } = await Home.prompt(id, l); if (id === openId && l === promptLang) promptEl.innerHTML = html; }
  catch { if (id === openId) promptEl.innerHTML = `<p class="err">${Home.t('loadFail')}</p>`; }
}
function show(id) {
  if (!openId) {
    lastFocus = document.activeElement; stop();
    loupe.hidden = false; void loupe.offsetWidth; loupe.classList.add('open');
    page.inert = true; document.body.style.overflow = 'hidden';
    document.getElementById('lclose').focus({ preventScroll: true });
  }
  openId = id; promptLang = Home.lang; loupe.scrollTop = 0;
  fillLoupe(); showPrompt();
}
function hide() {
  if (!openId) return;
  unwatch(); openId = null; pushed = false;
  loupe.classList.remove('open'); page.inert = false; document.body.style.overflow = '';
  setTimeout(() => { if (!openId) loupe.hidden = true; }, 300);
  lastFocus && lastFocus.focus();
}
const url = id => location.pathname + location.search + (id ? '#' + id : '');
function openLoupe(id, push) {
  if (!Home.find(id)) return;
  if (push && !openId) { history.pushState({ loupe: true }, '', url(id)); pushed = true; }
  else history.replaceState(history.state, '', url(id));
  show(id);
}
function closeLoupe() {
  if (pushed) history.back(); // popstate does the rest
  else { history.replaceState(null, '', url()); hide(); }
}
function step(d) {
  const all = Home.prompts(), i = all.findIndex(p => p.id === openId), n = all[i + d];
  if (n) openLoupe(n.id, false);
}
addEventListener('popstate', () => {
  const id = decodeURIComponent(location.hash.slice(1));
  if (Home.find(id)) show(id); else hide();
});
document.getElementById('lclose').onclick = closeLoupe;
document.getElementById('lprev').onclick = () => step(-1);
document.getElementById('lnext').onclick = () => step(1);
addEventListener('keydown', e => {
  if (!openId || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'Escape') closeLoupe();
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
});
loupe.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => { promptLang = b.dataset.pl; showPrompt(); });
document.getElementById('copy').onclick = async e => {
  const btn = e.currentTarget, note = document.getElementById('copied');
  try {
    if (await Home.copy((await Home.prompt(openId, promptLang)).text)) {
      btn.textContent = note.textContent = Home.t('copied');
      setTimeout(() => { btn.textContent = Home.t('copy'); note.textContent = ''; }, 1600);
    }
  } catch { promptEl.innerHTML = `<p class="err">${Home.t('loadFail')}</p>`; }
};

document.getElementById('lang').onclick = () => Home.toggle();
document.addEventListener('langchange', () => { stop(); render(); if (openId) { fillLoupe(); promptLang = Home.lang; showPrompt(); } });
render();
const first = decodeURIComponent(location.hash.slice(1));
if (Home.find(first)) openLoupe(first, false);
</script>
</body>
</html>
