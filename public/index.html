<style>
:root {
  --paper: #f8f9f7;
  --ink: #18231e;
  --muted: #506059;
  --accent: #275c4a;
  --rule: #d9e1da;
  --matte: #ecf0eb;
  --sans: "Archivo", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --content-width: min(92%, 1440px);
  --cover-gap: 20px;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 100px; }
body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
::selection { color: var(--ink); background: #d7e8dc; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

#page, .bar-inner, .spread, .promptbox { width: var(--content-width); margin-inline: auto; }
.top { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; font-size: 15px; font-weight: 700; }
.pill, .lang { min-height: 36px; font: 600 13px/1.3 var(--sans); border: 1px solid var(--rule); background: none; color: var(--ink); padding: 7px 12px; border-radius: 99px; cursor: pointer; white-space: nowrap; }
.pill:not(:disabled):hover, .lang:hover { background: var(--matte); }
.pill:disabled { opacity: .45; cursor: default; }
.text-button { padding: 0; border: 0; background: none; font: 600 14px/1.3 var(--sans); cursor: pointer; white-space: nowrap; }
.text-button, .work-controls a { color: var(--accent); text-decoration: underline; text-underline-offset: .22em; text-decoration-thickness: 1px; }
.text-button:hover, .work-controls a:hover { text-decoration-thickness: 2px; }

.intro { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr); gap: 20px 4vw; align-items: end; margin-block: clamp(24px, 3vw, 44px) clamp(22px, 3vw, 40px); }
.intro h1 { margin: 0; font-weight: 750; font-stretch: 82%; font-size: clamp(48px, 6.6vw, 92px); line-height: 1; letter-spacing: -.035em; }
html[lang="zh-CN"] .intro h1 { font-weight: 700; letter-spacing: -.02em; line-height: 1.08; }
.intro p { justify-self: end; width: min(100%, 29rem); margin: 0 0 3px; font-size: clamp(15px, 1.36vw, 18px); line-height: 1.65; color: var(--muted); text-wrap: pretty; }

.model-focus { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 4px 6px; padding-block: 7px; border-top: 1px solid var(--rule); background: var(--paper); }
.model-choice { display: flex; gap: 7px; align-items: center; padding: 5px 10px; min-height: 36px; border: 0; border-radius: 4px; background: none; font: 600 13px/1.3 var(--sans); color: var(--muted); cursor: pointer; }
.model-choice[aria-pressed="true"], .model-choice:hover { background: var(--matte); color: var(--ink); }
.model-dot { width: 7px; height: 7px; background: var(--model-color); border-radius: 50%; flex: none; }

.gallery-groups { display: grid; gap: clamp(32px, 4.6vw, 68px); padding-block: 12px 72px; }
.group-heading { display: flex; justify-content: space-between; align-items: center; gap: 8px 20px; margin-bottom: 10px; }
.group-heading h2 { margin: 0; font-size: clamp(19px, 2.2vw, 28px); line-height: 1.25; font-weight: 700; }
.group-actions { display: flex; align-items: center; gap: 16px; }
.group-actions button { min-height: 36px; }
.preview-hint { display: none; color: var(--muted); font-size: 13px; white-space: nowrap; }
@media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
  .preview-hint { display: inline; }
}

.work-grid, .spread { display: grid; grid-template-columns: repeat(var(--columns), minmax(0, 1fr)); gap: 24px var(--cover-gap); }
.work-link { display: block; text-decoration: none; }
.work-media { position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 3px; background: var(--matte); }
.work-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.work-media img:not([src]) { visibility: hidden; }
.work-link:hover .work-title { text-decoration: underline; text-underline-offset: .18em; }
.work-caption { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 3px 12px; padding-top: 9px; }
.work-title { margin: 0; font-size: clamp(15px, 1.55vw, 21px); line-height: 1.3; font-weight: 650; overflow-wrap: anywhere; }
.credit { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
.empty { display: grid; place-items: center; padding: 12px; text-align: center; font-size: 14px; color: var(--muted); }
.gallery-groups.has-focus .work-card:not(.highlighted, :hover, :focus-within) .work-media { opacity: .32; }
.work-media:has(.hover-preview:not(.is-ready)) > img { z-index: 1; }
.hover-preview { pointer-events: none; }

.loupe { position: fixed; inset: 0; z-index: 20; overflow: auto; overscroll-behavior: contain; background: var(--paper); scroll-padding-top: 80px; }
.bar { position: sticky; top: 0; z-index: 3; padding-block: 12px; border-bottom: 1px solid var(--rule); background: var(--paper); }
.bar-inner { display: flex; gap: 9px; align-items: center; }
.bar h2 { margin: 0 auto 0 0; font-size: clamp(20px, 2.5vw, 30px); line-height: 1.25; font-weight: 700; min-width: 0; }
.spread { margin-top: 24px; }
.work-media iframe { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; }
.stage iframe:focus-visible { outline-offset: -3px; }
.note { padding-top: 12px; }
.note-heading { display: flex; justify-content: space-between; gap: 8px 18px; align-items: flex-start; flex-wrap: wrap; }
.note .credit { margin-top: 3px; }
.work-controls { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; font-size: 13px; font-weight: 600; }
.work-controls a { display: inline-flex; min-height: 36px; align-items: center; }
.description { margin: 8px 0 0; max-width: 65ch; font-size: 14px; line-height: 1.65; color: var(--muted); }
.promptbox { margin-block: 44px 72px; display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 46rem); gap: 16px clamp(24px, 4vw, 64px); border-top: 1px solid var(--rule); padding-top: 24px; }
.promptbox h3 { margin: 0; font-size: 21px; font-weight: 700; }
.prompt-origin { margin: 8px 0 12px; font-size: 14px; line-height: 1.6; color: var(--muted); }
.promptbox .tools { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 99px; overflow: hidden; }
.seg button { font: 600 13px/1.3 var(--sans); border: 0; background: none; color: var(--ink); padding: 7px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--matte); }
.seg button:focus-visible { outline-offset: -4px; }
.prompt { background: #fff; padding: 22px 28px 8px; border: 1px solid var(--rule); border-radius: 4px; font-size: 15px; line-height: 1.75; overflow-wrap: anywhere; }
.prompt h3, .prompt h4, .prompt h5 { font-size: 15.5px; font-weight: 700; }
.prompt > :first-child { margin-top: 0; }
.prompt p, .prompt ul, .prompt ol, .prompt pre { margin: 0 0 14px; }
.prompt ul, .prompt ol { padding-inline-start: 1.25em; }
.prompt code { background: var(--matte); padding: 0 4px; border-radius: 2px; }
.prompt pre { overflow-x: auto; padding: 10px 12px; background: var(--matte); }
.prompt pre code { background: none; padding: 0; }
.err { color: #9e372b; }

@media (max-width: 760px) {
  :root { --content-width: calc(100% - 32px); --cover-gap: 12px; }
  .intro { grid-template-columns: 1fr; gap: 10px; }
  .intro p { justify-self: start; }
  .work-grid { grid-template-columns: repeat(var(--mobile-columns), minmax(0, 1fr)); }
  .work-caption { flex-direction: column; align-items: flex-start; padding-top: 7px; }
  .credit { font-size: 12px; }
  .loupe { scroll-padding-top: 110px; }
  .bar { padding-block: 10px; }
  .bar-inner { flex-wrap: wrap; }
  .bar h2 { flex: 1 0 100%; }
  .spread { grid-template-columns: minmax(0, 1fr); margin-top: 16px; gap: 30px; }
  .promptbox { grid-template-columns: minmax(0, 1fr); margin-top: 30px; }
  .prompt { padding: 16px 16px 4px; }
}
</style>
</head>
<body>
<div id="page">
  <div class="top"><span>HTML Toys</span><button class="lang" id="lang" type="button" data-t="langBtn" data-t-attr="aria-label:langLabel">EN</button></div>

  <header class="intro">
    <h1 data-t="title">网页小品</h1>
    <p data-t="lede">看灯塔一笔笔成形，去池边喂几尾锦鲤。这里收藏着 Claude、GPT 等模型创作的互动网页。</p>
  </header>

  <main id="gallery">
    <div class="model-focus" id="model-focus" role="group" aria-label="按模型聚焦作品" data-t-attr="aria-label:modelFocus"></div>
    <div class="gallery-groups" id="gallery-groups"></div>
  </main>
</div>

<section class="loupe" id="loupe" role="dialog" aria-modal="true" aria-labelledby="lt" hidden>
  <div class="bar">
    <div class="bar-inner">
      <h2 id="lt"></h2>
      <button class="pill" id="lprev" type="button" data-t="prev">上一组</button>
      <button class="pill" id="lnext" type="button" data-t="next">下一组</button>
      <button class="pill" id="lclose" type="button" data-t="close">返回</button>
    </div>
  </div>
  <div class="spread" id="spread"></div>
  <div class="promptbox">
    <div>
      <h3 data-t="promptHead">原始提示词</h3>
      <p class="prompt-origin" data-t="promptOrigin">这些作品从同一份提示词出发。</p>
      <div class="tools">
        <div class="seg" role="group" data-t-attr="aria-label:promptLang"><button type="button" data-pl="zh">中文</button><button type="button" data-pl="en">English</button></div>
        <button class="pill" id="copy" type="button" data-t="copy">复制</button>
        <span class="vh" id="copied" role="status"></span>
      </div>
    </div>
    <div class="prompt" id="prompt"></div>
  </div>
</section>

</body>
</html>
